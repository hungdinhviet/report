<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="favicon_2.png">

<title>SIMCARD - DINHVIETHUNG</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    color: #222;
    display: flex;
    flex-direction: column;
}

/* THANH TIÊU ĐỀ */

.top {
    height: 54px;
    min-height: 54px;
    background: #111;
    color: #d4af37;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #8e7628;
    gap: 12px;
}

.brand {
    font: 700 21px "Times New Roman", serif;
    letter-spacing: .1em;
}

.page-title {
    color: #ddd;
    font-size: 14px;
    margin-left: 12px;
}

.actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
}

.btn {
    background: transparent;
    color: #d4af37;
    border: 1px solid #8e7628;
    padding: 7px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
}

.btn:hover {
    background: #2b2614;
}

/* KHU VỰC TÀI LIỆU */

.document-area {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #e8e8e8;
}

.document-frame {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
    background: #fff;
}

.loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #f5f5f5;
    color: #555;
    text-align: center;
    padding: 24px;
    pointer-events: none;
}

.loading-title {
    font-family: "Times New Roman", serif;
    font-size: 24px;
    font-weight: bold;
    color: #8e7628;
}

.loading-note {
    font-size: 13px;
    line-height: 1.7;
    max-width: 520px;
}

.footer {
    min-height: 28px;
    background: #111;
    color: #888;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    font-size: 11px;
}

/* ĐIỆN THOẠI */

@media (max-width: 600px) {
    .top {
        padding: 0 10px;
        gap: 6px;
    }

    .brand {
        font-size: 16px;
    }

    .page-title {
        font-size: 12px;
        margin-left: 2px;
    }

    .btn {
        padding: 7px 8px;
        font-size: 12px;
    }

    .actions {
        gap: 5px;
    }
}
</style>
</head>

<body>

<header class="top">

    <div class="brand">DINHVIETHUNG</div>

    <div class="page-title">SIMCARD</div>

    <div class="actions">

        <button
            class="btn"
            id="reloadBtn"
            type="button">
            ↻ Tải lại
        </button>

        <button
            class="btn"
            id="backBtn"
            type="button">
            ← Dashboard
        </button>

    </div>

</header>

<main class="document-area">

    <iframe
        class="document-frame"
        id="documentFrame"
        title="Tài liệu SIMCARD"
        src="https://docs.google.com/document/d/1R2k1RFY4VbpilXF0qgYz1_qgiJapBBfo/preview"
        loading="eager"
        allowfullscreen>
    </iframe>

    <div class="loading" id="loadingMessage">

        <div class="loading-title">
            SIMCARD
        </div>

        <div class="loading-note">
            Đang mở tài liệu.<br>
            Nếu tài liệu không hiển thị, liên hệ DINHVIETHUNG.
        </div>

    </div>

</main>

<footer class="footer">
    DINHVIETHUNG · SIMCARD
</footer>

<script>
"use strict";

/* QUAY LẠI DASHBOARD */

document
.getElementById("backBtn")
.addEventListener("click", function () {

    location.href = "dashboard.html";

});

/* TẢI LẠI TÀI LIỆU */

document
.getElementById("reloadBtn")
.addEventListener("click", function () {

    const frame = document.getElementById("documentFrame");

    frame.src =
        "https://docs.google.com/document/d/1R2k1RFY4VbpilXF0qgYz1_qgiJapBBfo/preview";

});

/*
  LƯU Ý:
  Trình duyệt không cho trang web đọc trực tiếp nội dung
  bên trong iframe Google Docs từ sự kiện load.

  Vì vậy, thông báo bên dưới iframe được giữ lại để hướng dẫn
  người dùng nếu tài liệu không mở được.
*/

document
.getElementById("documentFrame")
.addEventListener("load", function () {

    document.getElementById("loadingMessage").style.display = "none";

});
</script>

</body>
</html>
