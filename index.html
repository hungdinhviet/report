<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DINH VIET HUNG</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #111111;
}

body {
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    height: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid #d9d9d9;
    background: #ffffff;
    z-index: 1000;
}

.toolbar button,
.toolbar select,
.toolbar input {
    height: 32px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    background: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.toolbar button {
    padding: 0 12px;
    cursor: pointer;
}

.toolbar button:hover {
    background: #f3f3f3;
}

.toolbar input {
    padding: 0 9px;
    width: 220px;
}

.toolbar select {
    padding: 0 8px;
}

.status {
    margin-left: auto;
    font-size: 12px;
    color: #666;
    white-space: nowrap;
}

/* =========================================================
   TABLE AREA
========================================================= */

.table-container {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: auto;
    position: relative;
}

table {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    width: max-content;
    min-width: 100%;
}

th,
td {
    border-right: 1px solid #d9d9d9;
    border-bottom: 1px solid #d9d9d9;
    padding: 7px 8px;
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
}

th {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #f3f3f3;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    white-space: normal;
}

td {
    font-family: Arial, sans-serif;
    font-size: 14px;
    background: #ffffff;
    white-space: normal;
}

tbody tr:hover td {
    background: #f7f7f7;
}

/* =========================================================
   HEADER
========================================================= */

.header-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.header-top {
    min-height: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
}

.header-title {
    flex: 1;
    min-width: 0;
    word-break: break-word;
}

.header-buttons {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
}

.header-btn {
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 2px 3px;
    font-size: 12px;
}

.header-btn:hover {
    background: #ddd;
    border-radius: 3px;
}

.header-search {
    width: 100%;
    height: 25px;
    border: 1px solid #c9c9c9;
    border-radius: 3px;
    padding: 2px 6px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    outline: none;
}

.header-search:focus {
    border-color: #888;
}

/* =========================================================
   RESIZE
========================================================= */

.resize-handle {
    position: absolute;
    top: 0;
    right: -3px;
    width: 7px;
    height: 100%;
    cursor: col-resize;
    z-index: 100;
}

.resize-handle:hover {
    background: rgba(0, 0, 0, 0.12);
}

/* =========================================================
   FILTER MENU
========================================================= */

.filter-menu {
    position: fixed;
    min-width: 260px;
    max-width: 360px;
    max-height: 480px;
    background: #ffffff;
    border: 1px solid #cfcfcf;
    box-shadow: 0 5px 18px rgba(0,0,0,.18);
    border-radius: 5px;
    z-index: 5000;
    display: none;
    overflow: hidden;
}

.filter-menu-header {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    background: #f7f7f7;
}

.filter-menu-search {
    width: 100%;
    height: 30px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
}

.filter-actions {
    display: flex;
    gap: 5px;
    padding: 7px 8px;
    border-bottom: 1px solid #ddd;
}

.filter-actions button {
    flex: 1;
    height: 29px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
}

.filter-actions button:hover {
    background: #f1f1f1;
}

.filter-values {
    max-height: 320px;
    overflow: auto;
    padding: 5px 8px;
}

.filter-value {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 2px;
    font-size: 13px;
    cursor: pointer;
}

.filter-value:hover {
    background: #f4f4f4;
}

.filter-footer {
    display: flex;
    gap: 7px;
    padding: 8px;
    border-top: 1px solid #ddd;
}

.filter-footer button {
    flex: 1;
    height: 31px;
    border-radius: 4px;
    border: 1px solid #ccc;
    cursor: pointer;
}

.filter-apply {
    background: #eeeeee;
}

.filter-clear {
    background: #ffffff;
}

/* =========================================================
   FIXED COLUMNS
========================================================= */

.fixed-cell {
    position: sticky;
    z-index: 20;
}

.fixed-header {
    z-index: 100 !important;
}

.fixed-cell-shadow {
    box-shadow: 2px 0 4px rgba(0,0,0,.08);
}

/* =========================================================
   FORMAT PANEL
========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.25);
    z-index: 8000;
    display: none;
    align-items: center;
    justify-content: center;
}

.modal {
    width: 420px;
    max-width: calc(100vw - 30px);
    max-height: calc(100vh - 30px);
    overflow: auto;
    background: #ffffff;
    border-radius: 7px;
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
    padding: 18px;
}

.modal h3 {
    margin: 0 0 15px 0;
    font-size: 17px;
}

.form-row {
    margin-bottom: 12px;
}

.form-row label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 5px;
}

.form-row input,
.form-row select {
    width: 100%;
    height: 34px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 8px;
}

.modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.modal-buttons button {
    flex: 1;
    height: 35px;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.7);
    z-index: 10000;
}

.loading-box {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 18px 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

/* =========================================================
   EMPTY
========================================================= */

.empty {
    padding: 30px;
    text-align: center;
    color: #777;
}
</style>
</head>

<body>

<div id="app">

    <div class="toolbar">

        <button id="refreshBtn">
            ↻ Làm mới
        </button>

        <button id="resetBtn">
            ⟳ Đặt lại
        </button>

        <button id="formatBtn">
            ⚙ Định dạng
        </button>

        <label style="font-size:12px;color:#555;">
            Cố định:
        </label>

        <select id="freezeSelect">
            <option value="0">0 cột</option>
            <option value="1">1 cột</option>
            <option value="2">2 cột</option>
            <option value="3">3 cột</option>
            <option value="4">4 cột</option>
            <option value="5">5 cột</option>
            <option value="6" selected>6 cột</option>
            <option value="7">7 cột</option>
            <option value="8">8 cột</option>
            <option value="9">9 cột</option>
            <option value="10">10 cột</option>
        </select>

        <input
            id="globalSearch"
            type="text"
            placeholder="Tìm kiếm toàn bộ bảng..."
        >

        <div class="status" id="status">
            Đang tải...
        </div>

    </div>

    <div class="table-container" id="tableContainer">
        <div class="empty">Đang tải dữ liệu...</div>
    </div>

</div>

<div class="filter-menu" id="filterMenu"></div>

<div class="modal-backdrop" id="formatModal">
    <div class="modal">

        <h3>Định dạng cột</h3>

        <div class="form-row">
            <label>Cột</label>
            <select id="formatColumn"></select>
        </div>

        <div class="form-row">
            <label>Căn chỉnh</label>
            <select id="formatAlign">
                <option value="left">Trái</option>
                <option value="center">Giữa</option>
                <option value="right">Phải</option>
            </select>
        </div>

        <div class="form-row">
            <label>Font</label>
            <select id="formatFont">
                <option value="Arial">Arial</option>
                <option value="Calibri">Calibri</option>
                <option value="Tahoma">Tahoma</option>
                <option value="Verdana">Verdana</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>
        </div>

        <div class="form-row">
            <label>Kích thước chữ</label>
            <input
                id="formatSize"
                type="number"
                min="8"
                max="40"
            >
        </div>

        <div class="form-row">
            <label>
                <input type="checkbox" id="formatBold">
                In đậm
            </label>
        </div>

        <div class="form-row">
            <label>
                <input type="checkbox" id="formatItalic">
                In nghiêng
            </label>
        </div>

        <div class="form-row">
            <label>
                <input type="checkbox" id="formatWrap">
                Wrap Text
            </label>
        </div>

        <div class="modal-buttons">
            <button id="formatCancel">Hủy</button>
            <button id="formatSave">Lưu</button>
        </div>

    </div>
</div>

<div class="loading" id="loading">
    <div class="loading-box">
        Đang tải dữ liệu...
    </div>
</div>

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
    "https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v12";

const OLD_KEYS = [
    "report_google_sheet_table_v11",
    "report_google_sheet_table_v10",
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];

const AUTO_WIDTH_MIGRATION_VERSION = 3;


/* =========================================================
   DEFAULT SETTINGS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


const SORT_BY_MAP = {
    "DATA": "Sort_DATA",
    "Thoại nội mạng": "Sort_NM",
    "Thoại ngoại mạng": "Sort_NgM"
};


const DEFAULT_FREEZE_COUNT = 6;


/* =========================================================
   RENAME
========================================================= */

const DEFAULT_COLUMN_RENAMES = {

    "Package":
        "Gói cước",

    "TOTAL PRICE":
        "Giá gói",

    "Total Price":
        "Giá gói",

    "REVENUE":
        "Chu kỳ",

    "Cách tính chu kỳ":
        "1 chu kỳ",

    "Packageprice":
        "Giá/kỳ",

    "Ngày update":
        "Update"
};


/* =========================================================
   ALIGNMENT
========================================================= */

const DEFAULT_CENTER_COLUMNS = new Set([

    "REVENUE",

    "Cách tính chu kỳ",

    "Kỳ",

    "Pre/Post",

    "KHDN/KHCN",

    "Cam kết MNP",

    "Ngày update"
]);


const DEFAULT_RIGHT_COLUMNS = new Set([

    "TOTAL PRICE",

    "Total Price",

    "Packageprice"
]);


/* =========================================================
   SPECIAL WIDTH
========================================================= */

/*
   Những cột này PHẢI tự động vừa theo HEADER.
*/

const DEFAULT_HEADER_WIDTH_COLUMNS = new Set([

    "REVENUE",

    "Cách tính chu kỳ",

    "Kỳ",

    "Thoại nội mạng",

    "Thoại ngoại mạng",

    "Hạ băng thông",

    "Loại gói cước",

    "Tự động gia hạn",

    "Dừng đăng kí mới",

    "KHDN/KHCN"
]);


/*
   Những cột này tự động vừa theo nội dung.
*/

const DEFAULT_CONTENT_WIDTH_COLUMNS = new Set([

    "TOTAL PRICE",

    "Total Price",

    "Packageprice",

    "Facebook",

    "Youtube",

    "Tiktok",

    "Pre/Post"
]);


/*
   Một số cột cần rộng hơn bình thường.
*/

const DEFAULT_WIDTH_MULTIPLIERS = {

    "Đối tượng áp dụng": 4,

    "Phạm vi cung cấp": 2,

    "Free truy cập": 2,

    "Khác": 2
};


const DEFAULT_WIDTH_BASE = 150;

const MAX_CONTENT_WIDTH = 500;


/* =========================================================
   STATE
========================================================= */

let headers = [];

let rows = [];

let filters = {};

let searches = {};

let sorts = {};

let columnWidths = {};

let columnFormats = {};

let renamedHeaders = {};

let freezeCount = DEFAULT_FREEZE_COUNT;

let autoRefreshMinutes = 0;

let defaultFiltersInitialized = false;

let openFilterIndex = null;

let filterMenuElement = null;

let filterValueSearch = "";

let resizeState = null;

let autoRefreshTimer = null;

let manuallyResizedColumns = {};

let autoWidthMigrationVersion = 0;


/* =========================================================
   DOM
========================================================= */

const tableContainer =
    document.getElementById("tableContainer");

const statusElement =
    document.getElementById("status");

const globalSearch =
    document.getElementById("globalSearch");

const freezeSelect =
    document.getElementById("freezeSelect");

const filterMenu =
    document.getElementById("filterMenu");

const loading =
    document.getElementById("loading");


/* =========================================================
   STORAGE
========================================================= */

function loadState() {

    let saved = null;

    try {

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if (raw) {
            saved = JSON.parse(raw);
        }

    } catch (error) {

        console.error(
            "Không đọc được localStorage:",
            error
        );

    }


    /*
       Nếu chưa có state mới,
       thử lấy state cũ.
    */

    if (!saved) {

        for (const key of OLD_KEYS) {

            try {

                const raw =
                    localStorage.getItem(key);

                if (raw) {

                    saved =
                        JSON.parse(raw);

                    break;
                }

            } catch (error) {}

        }

    }


    if (!saved) {

        freezeCount =
            DEFAULT_FREEZE_COUNT;

        return;
    }


    filters =
        saved.filters || {};

    searches =
        saved.searches || {};

    sorts =
        saved.sorts || {};

    columnWidths =
        saved.columnWidths || {};

    columnFormats =
        saved.columnFormats || {};

    renamedHeaders =
        saved.renamedHeaders || {};

    freezeCount =
        Number.isFinite(
            Number(saved.freezeCount)
        )
            ? Number(saved.freezeCount)
            : DEFAULT_FREEZE_COUNT;

    autoRefreshMinutes =
        Number(saved.autoRefreshMinutes) || 0;

    manuallyResizedColumns =
        saved.manuallyResizedColumns || {};

    autoWidthMigrationVersion =
        Number(
            saved.autoWidthMigrationVersion
        ) || 0;


    freezeSelect.value =
        String(freezeCount);

}


/* =========================================================
   SAVE STATE
========================================================= */

function saveState() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                filters,

                searches,

                sorts,

                columnWidths,

                columnFormats,

                renamedHeaders,

                freezeCount,

                autoRefreshMinutes,

                manuallyResizedColumns,

                autoWidthMigrationVersion

            })

        );

    } catch (error) {

        console.error(
            "Không lưu được state:",
            error
        );

    }

}


/* =========================================================
   DISPLAY HEADER
========================================================= */

function getDisplayHeader(originalHeader) {

    if (
        Object.prototype.hasOwnProperty.call(
            renamedHeaders,
            originalHeader
        )
    ) {

        return renamedHeaders[
            originalHeader
        ];

    }


    if (
        Object.prototype.hasOwnProperty.call(
            DEFAULT_COLUMN_RENAMES,
            originalHeader
        )
    ) {

        return DEFAULT_COLUMN_RENAMES[
            originalHeader
        ];

    }


    return originalHeader;
}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function getDisplayValue(value, originalHeader) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value);

}


/* =========================================================
   TEXT MEASURE
========================================================= */

function measureTextWidth(
    text,
    font = "14px Arial"
) {

    const canvas =
        measureTextWidth.canvas ||
        (
            measureTextWidth.canvas =
            document.createElement("canvas")
        );

    const ctx =
        canvas.getContext("2d");

    ctx.font = font;

    return ctx.measureText(
        String(text || "")
    ).width;

}


/* =========================================================
   DEFAULT ALIGNMENT
========================================================= */

function getDefaultColumnAlignment(
    originalHeader
) {

    if (
        DEFAULT_RIGHT_COLUMNS.has(
            originalHeader
        )
    ) {

        return "right";

    }


    if (
        DEFAULT_CENTER_COLUMNS.has(
            originalHeader
        )
    ) {

        return "center";

    }


    return "left";

}


/* =========================================================
   DEFAULT HEADER WIDTH
========================================================= */

function getDefaultHeaderWidth(
    originalHeader
) {

    const displayHeader =
        getDisplayHeader(
            originalHeader
        );


    /*
       Header được đo bằng:
       bold + Arial + 14px
    */

    const width =
        measureTextWidth(
            displayHeader,
            "bold 14px Arial"
        ) + 40;


    return Math.max(
        80,
        Math.ceil(width)
    );

}


/* =========================================================
   DEFAULT CONTENT WIDTH
========================================================= */

function getDefaultContentWidth(index) {

    const originalHeader =
        headers[index];

    const displayHeader =
        getDisplayHeader(
            originalHeader
        );


    let maxWidth =
        measureTextWidth(
            displayHeader,
            "bold 14px Arial"
        );


    rows.forEach(row => {

        const value =
            getDisplayValue(
                row[index],
                originalHeader
            );


        const width =
            measureTextWidth(
                value,
                "14px Arial"
            );


        maxWidth =
            Math.max(
                maxWidth,
                Math.min(
                    width,
                    MAX_CONTENT_WIDTH
                )
            );

    });


    maxWidth += 30;


    return Math.max(
        100,
        Math.ceil(maxWidth)
    );

}


/* =========================================================
   DEFAULT COLUMN WIDTH
========================================================= */

function getDefaultColumnWidth(index) {

    const originalHeader =
        headers[index];


    /*
       QUAN TRỌNG:

       Các cột trong nhóm này
       luôn lấy width theo HEADER.
    */

    if (
        DEFAULT_HEADER_WIDTH_COLUMNS.has(
            originalHeader
        )
    ) {

        return getDefaultHeaderWidth(
            originalHeader
        );

    }


    /*
       Các cột đặc biệt cần rộng.
    */

    if (
        DEFAULT_WIDTH_MULTIPLIERS[
            originalHeader
        ]
    ) {

        return (
            DEFAULT_WIDTH_BASE *
            DEFAULT_WIDTH_MULTIPLIERS[
                originalHeader
            ]
        );

    }


    /*
       Các cột tự động theo nội dung.
    */

    if (
        DEFAULT_CONTENT_WIDTH_COLUMNS.has(
            originalHeader
        )
    ) {

        return getDefaultContentWidth(
            index
        );

    }


    return DEFAULT_WIDTH_BASE;

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(index) {

    /*
       Chỉ sử dụng width đã lưu
       nếu người dùng THỰC SỰ kéo cột.
    */

    if (
        manuallyResizedColumns[index]
    ) {

        const savedWidth =
            Number(
                columnWidths[index]
            );


        if (
            Number.isFinite(savedWidth) &&
            savedWidth > 0
        ) {

            return savedWidth;

        }

    }


    /*
       Nếu không kéo tay:
       luôn tính lại auto-width.
    */

    return getDefaultColumnWidth(
        index
    );

}


/* =========================================================
   COLUMN FORMAT
========================================================= */

function getColumnFormat(index) {

    const originalHeader =
        headers[index];


    return {

        align:
            getDefaultColumnAlignment(
                originalHeader
            ),

        fontFamily:
            "Arial",

        fontSize:
            14,

        bold:
            false,

        italic:
            false,

        wrap:
            true,

        color:
            "#111111",

        background:
            "#ffffff",

        ...(columnFormats[index] || {})

    };

}


/* =========================================================
   AUTO WIDTH MIGRATION
========================================================= */

function migrateAutoWidthColumns() {

    if (
        autoWidthMigrationVersion >=
        AUTO_WIDTH_MIGRATION_VERSION
    ) {

        return;

    }


    /*
       Những cột này phải được
       reset width cũ.
    */

    const resetHeaders =
        new Set([

            "REVENUE",

            "Cách tính chu kỳ",

            "Kỳ",

            "Thoại nội mạng",

            "Thoại ngoại mạng",

            "Hạ băng thông",

            "Loại gói cước",

            "Tự động gia hạn",

            "Dừng đăng kí mới",

            "KHDN/KHCN",

            "TOTAL PRICE",

            "Total Price",

            "Packageprice"

        ]);


    headers.forEach(
        (header, index) => {

            if (
                resetHeaders.has(header)
            ) {

                /*
                   Không xóa trạng thái
                   kéo tay nếu đã có
                   từ phiên bản mới.

                   Nhưng nếu đây là
                   migration cũ thì
                   width cũ không còn
                   được dùng.
                */

                if (
                    !Object.prototype.hasOwnProperty.call(
                        manuallyResizedColumns,
                        index
                    )
                ) {

                    delete columnWidths[index];

                }

            }

        }
    );


    autoWidthMigrationVersion =
        AUTO_WIDTH_MIGRATION_VERSION;


    saveState();

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const result = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            result.push(row);

            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length
    ) {

        row.push(value);

        result.push(row);

    }


    return result;

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    loading.style.display =
        "flex";


    try {

        const response =
            await fetch(
                CSV_URL +
                "&_=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const parsed =
            parseCSV(text);


        if (
            !parsed.length
        ) {

            throw new Error(
                "Không có dữ liệu"
            );

        }


        let rawHeaders =
            parsed[0]
                .map(
                    x => String(x || "").trim()
                );


        const visibleIndexes = [];


        rawHeaders.forEach(
            (header, index) => {

                if (
                    !HIDDEN_COLUMNS.has(
                        header
                    )
                ) {

                    visibleIndexes.push(
                        index
                    );

                }

            }
        );


        headers =
            visibleIndexes.map(
                index =>
                    rawHeaders[index]
            );


        rows =
            parsed
                .slice(1)
                .filter(
                    row =>
                        row.some(
                            value =>
                                String(
                                    value || ""
                                ).trim() !== ""
                        )
                )
                .map(
                    row =>
                        visibleIndexes.map(
                            index =>
                                row[index] ?? ""
                        )
                );


        migrateAutoWidthColumns();

        renderTable();

        updateStatus();


    } catch (error) {

        console.error(error);

        tableContainer.innerHTML = `
            <div class="empty">
                Không tải được dữ liệu.<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        statusElement.textContent =
            "Lỗi tải dữ liệu";


    } finally {

        loading.style.display =
            "none";

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   FILTER / SEARCH
========================================================= */

function rowMatchesSearch(
    row
) {

    const search =
        globalSearch.value
            .trim()
            .toLowerCase();


    if (!search) {

        return true;

    }


    return row.some(
        value =>
            String(
                value ?? ""
            )
                .toLowerCase()
                .includes(search)
    );

}


function rowMatchesColumnSearch(
    row,
    index
) {

    const search =
        String(
            searches[index] || ""
        )
            .trim()
            .toLowerCase();


    if (!search) {

        return true;

    }


    return String(
        row[index] ?? ""
    )
        .toLowerCase()
        .includes(search);

}


function rowMatchesFilter(
    row,
    index
) {

    const selected =
        filters[index];


    if (
        !Array.isArray(selected) ||
        selected.length === 0
    ) {

        return true;

    }


    const value =
        String(
            row[index] ?? ""
        );


    return selected.includes(
        value
    );

}


function getFilteredRows() {

    let result =
        rows.filter(
            row => {

                if (
                    !rowMatchesSearch(row)
                ) {

                    return false;

                }


                for (
                    let i = 0;
                    i < headers.length;
                    i++
                ) {

                    if (
                        !rowMatchesColumnSearch(
                            row,
                            i
                        )
                    ) {

                        return false;

                    }


                    if (
                        !rowMatchesFilter(
                            row,
                            i
                        )
                    ) {

                        return false;

                    }

                }


                return true;

            }
        );


    result =
        applySorting(result);


    return result;

}


/* =========================================================
   SORT
========================================================= */

function applySorting(data) {

    const activeSorts =
        Object.keys(sorts)
            .map(Number)
            .filter(
                index =>
                    sorts[index] ===
                    "asc" ||
                    sorts[index] ===
                    "desc"
            );


    if (
        !activeSorts.length
    ) {

        return data;

    }


    return [...data].sort(
        (a, b) => {

            for (
                const index of activeSorts
            ) {

                const direction =
                    sorts[index];


                const av =
                    String(
                        a[index] ?? ""
                    );


                const bv =
                    String(
                        b[index] ?? ""
                    );


                const cmp =
                    av.localeCompare(
                        bv,
                        "vi",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );


                if (cmp !== 0) {

                    return direction ===
                        "asc"
                        ? cmp
                        : -cmp;

                }

            }


            return 0;

        }
    );

}


/* =========================================================
   SORT BUTTON
========================================================= */

function toggleSort(index) {

    const current =
        sorts[index];


    if (!current) {

        sorts[index] = "asc";

    } else if (
        current === "asc"
    ) {

        sorts[index] = "desc";

    } else {

        delete sorts[index];

    }


    saveState();

    renderTable();

}


/* =========================================================
   FILTER MENU
========================================================= */

function openFilter(
    index,
    button
) {

    closeFilter();


    openFilterIndex =
        index;


    filterValueSearch =
        "";


    const rect =
        button.getBoundingClientRect();


    filterMenu.style.left =
        Math.min(
            rect.left,
            window.innerWidth - 370
        ) + "px";


    filterMenu.style.top =
        (rect.bottom + 3) + "px";


    renderFilterMenu();


    filterMenu.style.display =
        "block";

}


function renderFilterMenu() {

    if (
        openFilterIndex === null
    ) {

        return;

    }


    const index =
        openFilterIndex;


    const values =
        [...new Set(
            rows.map(
                row =>
                    String(
                        row[index] ?? ""
                    )
            )
        )]
            .sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        "vi",
                        {
                            numeric: true
                        }
                    )
            );


    const selected =
        Array.isArray(
            filters[index]
        )
            ? new Set(
                filters[index]
            )
            : new Set(values);


    const search =
        filterValueSearch
            .toLowerCase();


    const visibleValues =
        values.filter(
            value =>
                value
                    .toLowerCase()
                    .includes(search)
        );


    filterMenu.innerHTML = `

        <div class="filter-menu-header">

            <input
                class="filter-menu-search"
                id="filterValueSearch"
                placeholder="Tìm giá trị..."
                value="${escapeHtml(filterValueSearch)}"
            >

        </div>

        <div class="filter-actions">

            <button
                id="filterSelectAll"
            >
                Chọn tất cả
            </button>

            <button
                id="filterClearAll"
            >
                Bỏ chọn
            </button>

        </div>

        <div
            class="filter-values"
            id="filterValues"
        >

            ${visibleValues.map(
                value => `

                <label class="filter-value">

                    <input
                        type="checkbox"
                        value="${escapeHtml(value)}"
                        ${selected.has(value)
                            ? "checked"
                            : ""}
                    >

                    <span>
                        ${escapeHtml(value || "(Trống)")}
                    </span>

                </label>

                `
            ).join("")}

        </div>

        <div class="filter-footer">

            <button
                class="filter-clear"
                id="filterRemove"
            >
                Xóa lọc
            </button>

            <button
                class="filter-apply"
                id="filterApply"
            >
                Áp dụng
            </button>

        </div>
    `;


    const searchInput =
        document.getElementById(
            "filterValueSearch"
        );


    searchInput.addEventListener(
        "input",
        event => {

            filterValueSearch =
                event.target.value;

            renderFilterMenu();

        }
    );


    document
        .getElementById(
            "filterSelectAll"
        )
        .onclick = () => {

            filters[index] =
                values;

            renderFilterMenu();

        };


    document
        .getElementById(
            "filterClearAll"
        )
        .onclick = () => {

            filters[index] =
                [];

            renderFilterMenu();

        };


    document
        .getElementById(
            "filterRemove"
        )
        .onclick = () => {

            delete filters[index];

            saveState();

            closeFilter();

            renderTable();

        };


    document
        .getElementById(
            "filterApply"
        )
        .onclick = () => {

            const checked =
                [...filterMenu.querySelectorAll(
                    "#filterValues input:checked"
                )]
                    .map(
                        input =>
                            input.value
                    );


            filters[index] =
                checked;


            /*
               Nếu chọn tất cả thì
               không cần lưu filter.
            */

            if (
                checked.length ===
                values.length
            ) {

                delete filters[index];

            }


            saveState();

            closeFilter();

            renderTable();

        };

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter() {

    filterMenu.style.display =
        "none";

    openFilterIndex =
        null;

}


document.addEventListener(
    "click",
    event => {

        if (
            !filterMenu.contains(
                event.target
            ) &&
            !event.target.closest(
                ".filter-btn"
            )
        ) {

            closeFilter();

        }

    }
);


/* =========================================================
   FREEZE POSITION
========================================================= */

function calculateLeftPositions() {

    const positions = [];

    let left = 0;


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        positions[i] =
            left;

        left +=
            getColumnWidth(i);

    }


    return positions;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    if (
        !headers.length
    ) {

        tableContainer.innerHTML = `
            <div class="empty">
                Không có dữ liệu
            </div>
        `;

        return;

    }


    const visibleRows =
        getFilteredRows();


    const leftPositions =
        calculateLeftPositions();


    let html = `

        <table>

            <thead>

                <tr>
    `;


    headers.forEach(
        (header, index) => {

            const width =
                getColumnWidth(index);


            const format =
                getColumnFormat(index);


            const fixed =
                index < freezeCount;


            const left =
                leftPositions[index];


            const sort =
                sorts[index];


            let sortIcon = "↕";


            if (
                sort === "asc"
            ) {

                sortIcon = "▲";

            } else if (
                sort === "desc"
            ) {

                sortIcon = "▼";

            }


            html += `

                <th
                    class="${fixed
                        ? "fixed-cell fixed-header fixed-cell-shadow"
                        : ""}"
                    style="
                        width:${width}px;
                        min-width:${width}px;
                        max-width:${width}px;
                        text-align:${format.align};
                        font-family:${escapeHtml(format.fontFamily)};
                        font-size:${format.fontSize}px;
                        font-weight:bold;
                        font-style:${format.italic
                            ? "italic"
                            : "normal"};
                        background:${format.background};
                        color:${format.color};
                        left:${fixed
                            ? left + "px"
                            : "auto"};
                        white-space:${format.wrap
                            ? "normal"
                            : "nowrap"};
                    "
                >

                    <div class="header-inner">

                        <div class="header-top">

                            <div class="header-title">
                                ${escapeHtml(
                                    getDisplayHeader(header)
                                )}
                            </div>

                            <div class="header-buttons">

                                <button
                                    class="header-btn filter-btn"
                                    title="Lọc"
                                    data-filter-index="${index}"
                                >
                                    ▼
                                </button>

                                <button
                                    class="header-btn sort-btn"
                                    title="Sắp xếp"
                                    data-sort-index="${index}"
                                >
                                    ${sortIcon}
                                </button>

                                <button
                                    class="header-btn format-column-btn"
                                    title="Định dạng"
                                    data-format-index="${index}"
                                >
                                    ⚙
                                </button>

                            </div>

                        </div>

                        <input
                            class="header-search"
                            data-search-index="${index}"
                            value="${escapeHtml(
                                searches[index] || ""
                            )}"
                            placeholder="Tìm..."
                        >

                    </div>

                    <div
                        class="resize-handle"
                        data-resize-index="${index}"
                    ></div>

                </th>

            `;

        }
    );


    html += `

                </tr>

            </thead>

            <tbody>
    `;


    if (
        !visibleRows.length
    ) {

        html += `

            <tr>

                <td
                    colspan="${headers.length}"
                    class="empty"
                >
                    Không tìm thấy dữ liệu
                </td>

            </tr>

        `;

    } else {

        visibleRows.forEach(
            row => {

                html += "<tr>";


                headers.forEach(
                    (header, index) => {

                        const width =
                            getColumnWidth(
                                index
                            );


                        const format =
                            getColumnFormat(
                                index
                            );


                        const fixed =
                            index < freezeCount;


                        const left =
                            leftPositions[
                                index
                            ];


                        const value =
                            getDisplayValue(
                                row[index],
                                header
                            );


                        html += `

                            <td
                                class="${fixed
                                    ? "fixed-cell fixed-cell-shadow"
                                    : ""}"
                                style="
                                    width:${width}px;
                                    min-width:${width}px;
                                    max-width:${width}px;
                                    text-align:${format.align};
                                    font-family:${escapeHtml(format.fontFamily)};
                                    font-size:${format.fontSize}px;
                                    font-weight:${format.bold
                                        ? "bold"
                                        : "normal"};
                                    font-style:${format.italic
                                        ? "italic"
                                        : "normal"};
                                    color:${format.color};
                                    background:${format.background};
                                    left:${fixed
                                        ? left + "px"
                                        : "auto"};
                                    white-space:${format.wrap
                                        ? "normal"
                                        : "nowrap"};
                                    overflow-wrap:anywhere;
                                "
                            >
                                ${escapeHtml(value)}
                            </td>

                        `;

                    }
                );


                html += "</tr>";

            }
        );

    }


    html += `

            </tbody>

        </table>

    `;


    tableContainer.innerHTML =
        html;


    bindTableEvents();

}


/* =========================================================
   BIND EVENTS
========================================================= */

function bindTableEvents() {

    /*
       Header search
    */

    document
        .querySelectorAll(
            ".header-search"
        )
        .forEach(
            input => {

                input.addEventListener(
                    "input",
                    event => {

                        const index =
                            Number(
                                event.target
                                    .dataset
                                    .searchIndex
                            );


                        searches[index] =
                            event.target.value;


                        saveState();

                        renderTable();

                        /*
                           Đặt cursor cuối input.
                        */

                        setTimeout(
                            () => {

                                const el =
                                    document.querySelector(
                                        `.header-search[data-search-index="${index}"]`
                                    );

                                if (el) {

                                    el.focus();

                                    el.setSelectionRange(
                                        el.value.length,
                                        el.value.length
                                    );

                                }

                            },
                            0
                        );

                    }
                );

            }
        );


    /*
       Filter
    */

    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const index =
                            Number(
                                button.dataset
                                    .filterIndex
                            );


                        openFilter(
                            index,
                            button
                        );

                    }
                );

            }
        );


    /*
       Sort
    */

    document
        .querySelectorAll(
            ".sort-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const index =
                            Number(
                                button.dataset
                                    .sortIndex
                            );


                        toggleSort(index);

                    }
                );

            }
        );


    /*
       Format từng cột
    */

    document
        .querySelectorAll(
            ".format-column-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const index =
                            Number(
                                button.dataset
                                    .formatIndex
                            );


                        openFormatModal(
                            index
                        );

                    }
                );

            }
        );


    /*
       Resize
    */

    document
        .querySelectorAll(
            ".resize-handle"
        )
        .forEach(
            handle => {

                handle.addEventListener(
                    "mousedown",
                    event => {

                        event.preventDefault();

                        const index =
                            Number(
                                handle.dataset
                                    .resizeIndex
                            );


                        resizeState = {

                            index,

                            startX:
                                event.clientX,

                            startWidth:
                                getColumnWidth(
                                    index
                                )

                        };

                    }
                );

            }
        );

}


/* =========================================================
   RESIZE MOVE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (!resizeState) {

            return;

        }


        const delta =
            event.clientX -
            resizeState.startX;


        const newWidth =
            Math.max(
                60,
                resizeState.startWidth +
                delta
            );


        columnWidths[
            resizeState.index
        ] =
            newWidth;


        manuallyResizedColumns[
            resizeState.index
        ] =
            true;


        renderTable();

    }
);


document.addEventListener(
    "mouseup",
    () => {

        if (!resizeState) {

            return;

        }


        saveState();

        resizeState =
            null;

    }
);

   FORMAT MODAL

/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus() {

    const visibleRows =
        getFilteredRows();


    statusElement.textContent =
        `${visibleRows.length.toLocaleString("vi-VN")} / ${rows.length.toLocaleString("vi-VN")} dòng`;

}


/* =========================================================
   KEEP STATUS UPDATED
========================================================= */

const originalRenderTable =
    renderTable;


/*
   Không override renderTable.
   Status được cập nhật ở đây.
*/

function renderTableWithStatus() {

    renderTable();

    updateStatus();

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function setupAutoRefresh() {

    if (autoRefreshTimer) {

        clearInterval(
            autoRefreshTimer
        );

        autoRefreshTimer =
            null;

    }


    if (
        !autoRefreshMinutes ||
        autoRefreshMinutes <= 0
    ) {

        return;

    }


    autoRefreshTimer =
        setInterval(
            () => {

                loadData();

            },
            autoRefreshMinutes *
            60 *
            1000
        );

}


/* =========================================================
   WINDOW EVENTS
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            filterMenu.style.display ===
            "block"
        ) {

            closeFilter();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadState();

setupAutoRefresh();

loadData();

</script>

</body>
</html>
