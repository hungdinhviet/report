<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Danh sách gói cước</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

body {
    overflow: hidden;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 54px;
    background: #ffffff;
    border-bottom: 1px solid #dcdfe4;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    flex-shrink: 0;
}

.topbar-title {
    font-size: 18px;
    font-weight: 700;
    margin-right: auto;
}

button {
    border: 1px solid #cfd4da;
    background: #fff;
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #f1f3f5;
}

button.primary {
    background: #1976d2;
    color: white;
    border-color: #1976d2;
}

button.primary:hover {
    background: #1565c0;
}

button.danger {
    color: #c62828;
}

.refresh-info {
    font-size: 11px;
    color: #777;
    margin-left: 5px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    width: 100%;
    height: calc(100vh - 54px);
    overflow: hidden;
    position: relative;
}

.table-wrapper {
    position: absolute;
    inset: 0;
    overflow: auto;
    background: white;
}

/* =========================================================
   TABLE
========================================================= */

table {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    width: max-content;
    min-width: 100%;
}

thead {
    position: sticky;
    top: 0;
    z-index: 50;
}

thead tr.header-row th {
    top: 0;
}

thead tr.search-row th {
    top: 38px;
}

th,
td {
    border-right: 1px solid #d9dde2;
    border-bottom: 1px solid #d9dde2;
    padding: 6px 8px;
    font-size: 14px;
    vertical-align: middle;
    background: #fff;
}

th {
    background: #f1f3f5;
    font-weight: 700;
    position: relative;
    white-space: nowrap;
}

.header-cell {
    height: 38px;
    min-height: 38px;
}

.header-content {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    gap: 5px;
}

.header-name {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    cursor: pointer;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 2px;
}

.header-sort {
    font-size: 12px;
    color: #555;
}

.header-filter-btn {
    border: none;
    background: transparent;
    padding: 2px 4px;
    font-size: 13px;
    cursor: pointer;
}

.header-filter-btn:hover {
    background: #ddd;
}

th.filtered {
    background: #c8f7c5 !important;
}

th.sorted {
    background: #d8ebff !important;
}

th.filtered.sorted {
    background: #bdecc4 !important;
}

.search-cell {
    padding: 4px;
    background: #fafafa;
}

.search-input {
    width: 100%;
    height: 28px;
    border: 1px solid #cfd4da;
    border-radius: 4px;
    padding: 4px 7px;
    font-size: 12px;
    outline: none;
}

.search-input:focus {
    border-color: #1976d2;
    box-shadow: 0 0 0 2px rgba(25,118,210,.12);
}

td {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   RESIZE
========================================================= */

.resize-handle {
    position: absolute;
    top: 0;
    right: -3px;
    width: 7px;
    height: 100%;
    cursor: col-resize;
    z-index: 100;
}

.resize-handle:hover {
    background: rgba(25,118,210,.3);
}

/* =========================================================
   FILTER MENU
========================================================= */

.filter-menu {
    position: fixed;
    z-index: 10000;
    width: 330px;
    max-height: 560px;
    background: white;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    display: none;
    overflow: hidden;
}

.filter-menu.open {
    display: block;
}

.filter-title {
    font-weight: 700;
    padding: 10px 12px;
    border-bottom: 1px solid #e2e5e9;
    background: #f8f9fa;
}

.filter-search {
    padding: 8px;
    border-bottom: 1px solid #e2e5e9;
}

.filter-search input {
    width: 100%;
    height: 30px;
    border: 1px solid #cfd4da;
    border-radius: 4px;
    padding: 5px 8px;
}

.filter-buttons {
    display: flex;
    gap: 5px;
    padding: 8px;
    border-bottom: 1px solid #e2e5e9;
}

.filter-buttons button {
    flex: 1;
    padding: 6px 5px;
    font-size: 12px;
}

.filter-values {
    max-height: 280px;
    overflow-y: auto;
    padding: 5px 8px;
}

.filter-value {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 3px;
    font-size: 13px;
}

.filter-value:hover {
    background: #f1f3f5;
}

.filter-value span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.filter-sort-section {
    border-top: 1px solid #e2e5e9;
    padding: 8px;
    background: #fafafa;
}

.filter-sort-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
}

.sort-buttons {
    display: flex;
    gap: 5px;
}

.sort-buttons button {
    flex: 1;
    font-size: 12px;
    padding: 6px;
}

.priority-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
}

.priority-row label {
    font-size: 12px;
}

.priority-input {
    width: 70px;
    height: 28px;
    border: 1px solid #cfd4da;
    border-radius: 4px;
    padding: 3px 6px;
}

.filter-footer {
    display: flex;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #e2e5e9;
}

.filter-footer button {
    flex: 1;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.25);
    z-index: 9000;
    display: none;
}

.settings-overlay.open {
    display: block;
}

.settings-panel {
    position: fixed;
    top: 60px;
    right: 15px;
    width: 440px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    background: white;
    border: 1px solid #d0d4d8;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
    z-index: 9100;
    display: none;
}

.settings-panel.open {
    display: block;
}

.settings-header {
    padding: 12px 15px;
    font-size: 17px;
    font-weight: 700;
    border-bottom: 1px solid #e2e5e9;
    display: flex;
    align-items: center;
}

.settings-header button {
    margin-left: auto;
}

.settings-section {
    padding: 13px 15px;
    border-bottom: 1px solid #e2e5e9;
}

.settings-section h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
}

.settings-help {
    font-size: 11px;
    color: #777;
    margin-bottom: 8px;
}

.column-selector {
    border: 1px solid #cfd4da;
    border-radius: 5px;
    max-height: 180px;
    overflow-y: auto;
}

.column-option {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    font-size: 13px;
}

.column-option:hover {
    background: #f1f3f5;
}

.setting-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
}

.setting-row label {
    min-width: 105px;
    font-size: 13px;
}

.setting-row input[type="number"],
.setting-row input[type="text"],
.setting-row select {
    flex: 1;
    height: 30px;
    border: 1px solid #cfd4da;
    border-radius: 4px;
    padding: 4px 7px;
}

.checkbox-line {
    display: flex;
    gap: 7px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 8px;
}

.color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.color-row input[type="color"] {
    width: 45px;
    height: 30px;
    border: none;
    padding: 0;
}

.settings-buttons {
    display: flex;
    gap: 7px;
}

.settings-buttons button {
    flex: 1;
}

/* =========================================================
   RENAME CONTEXT MENU
========================================================= */

.context-menu {
    position: fixed;
    z-index: 12000;
    background: white;
    border: 1px solid #cfd4da;
    border-radius: 5px;
    box-shadow: 0 5px 20px rgba(0,0,0,.18);
    display: none;
    min-width: 180px;
}

.context-menu button {
    width: 100%;
    border: none;
    border-radius: 0;
    text-align: left;
}

.context-menu.open {
    display: block;
}

/* =========================================================
   STATUS
========================================================= */

.loading {
    position: fixed;
    inset: 54px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.85);
    z-index: 5000;
    font-size: 16px;
}

.error-box {
    margin: 20px;
    padding: 15px;
    border: 1px solid #ef9a9a;
    background: #ffebee;
    color: #b71c1c;
    border-radius: 6px;
}

/* =========================================================
   FREEZE COLUMNS
========================================================= */

.frozen-column {
    position: sticky !important;
    z-index: 30;
}

thead .frozen-column {
    z-index: 80;
}

tbody .frozen-column {
    background: white;
}

thead .frozen-column {
    background: #f1f3f5;
}

thead th.filtered.frozen-column {
    background: #c8f7c5 !important;
}

thead th.sorted.frozen-column {
    background: #d8ebff !important;
}

thead th.filtered.sorted.frozen-column {
    background: #bdecc4 !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {
    .topbar-title {
        font-size: 14px;
    }

    .refresh-info {
        display: none;
    }

    .settings-panel {
        left: 5px;
        right: 5px;
        width: auto;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<div class="topbar">

    <div class="topbar-title">
        📊 Danh sách gói cước
    </div>

    <button onclick="resetUserFilters()">
        ↻ Tổng / Reset
    </button>

    <button onclick="refreshData()">
        🔄 Cập nhật
    </button>

    <button onclick="openSettings()">
        ⚙ Cài đặt
    </button>

    <span class="refresh-info" id="refreshInfo">
        Chưa tải dữ liệu
    </span>

</div>


<!-- =======================================================
     MAIN TABLE
======================================================= -->

<div class="main">

    <div class="table-wrapper" id="tableWrapper">

        <table id="dataTable">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>


<!-- =======================================================
     LOADING
======================================================= -->

<div class="loading" id="loading">
    Đang tải dữ liệu Google Sheet...
</div>


<!-- =======================================================
     FILTER MENU
======================================================= -->

<div class="filter-menu" id="filterMenu">

    <div class="filter-title" id="filterTitle">
        Bộ lọc
    </div>

    <div class="filter-search">
        <input
            type="text"
            id="filterValueSearch"
            placeholder="Tìm giá trị..."
            oninput="renderFilterValues()"
        >
    </div>

    <div class="filter-buttons">

        <button onclick="selectAllFilterValues()">
            Chọn tất cả
        </button>

        <button onclick="clearFilterValues()">
            Bỏ chọn
        </button>

    </div>

    <div class="filter-values" id="filterValues"></div>


    <div class="filter-sort-section">

        <div class="filter-sort-title">
            Sắp xếp
        </div>

        <div class="sort-buttons">

            <button onclick="setCurrentSort('asc')">
                ▲ Tăng dần
            </button>

            <button onclick="setCurrentSort('desc')">
                ▼ Giảm dần
            </button>

            <button onclick="removeCurrentSort()">
                ✕ Bỏ sort
            </button>

        </div>

        <div class="priority-row">

            <label>
                Ưu tiên sort:
            </label>

            <input
                class="priority-input"
                type="number"
                id="sortPriorityInput"
                min="1"
                step="1"
                placeholder="VD: 1"
            >

            <button onclick="applyCurrentPriority()">
                Áp dụng
            </button>

        </div>

    </div>


    <div class="filter-footer">

        <button onclick="cancelFilter()">
            Hủy
        </button>

        <button
            class="primary"
            onclick="applyFilter()"
        >
            Áp dụng lọc
        </button>

    </div>

</div>


<!-- =======================================================
     SETTINGS OVERLAY
======================================================= -->

<div
    class="settings-overlay"
    id="settingsOverlay"
    onclick="closeSettings(event)"
></div>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div class="settings-panel" id="settingsPanel">

    <div class="settings-header">

        ⚙ Cài đặt bảng

        <button onclick="closeSettings()">
            ✕
        </button>

    </div>


    <!-- COLUMN SELECT -->

    <div class="settings-section">

        <h3>
            1. Chọn cột
        </h3>

        <div class="settings-help">
            Có thể chọn nhiều cột để áp dụng cùng một định dạng.
        </div>

        <div
            class="column-selector"
            id="columnSelector"
        ></div>

    </div>


    <!-- FORMAT -->

    <div class="settings-section">

        <h3>
            2. Định dạng
        </h3>


        <div class="setting-row">

            <label>
                Font size
            </label>

            <input
                type="number"
                id="formatFontSize"
                min="8"
                max="40"
                value="14"
            >

        </div>


        <div class="setting-row">

            <label>
                Căn lề
            </label>

            <select id="formatAlign">

                <option value="left">
                    Trái
                </option>

                <option value="center">
                    Giữa
                </option>

                <option value="right">
                    Phải
                </option>

            </select>

        </div>


        <div class="checkbox-line">

            <input
                type="checkbox"
                id="formatBold"
            >

            <label for="formatBold">
                In đậm
            </label>

        </div>


        <div class="checkbox-line">

            <input
                type="checkbox"
                id="formatItalic"
            >

            <label for="formatItalic">
                In nghiêng
            </label>

        </div>


        <div class="checkbox-line">

            <input
                type="checkbox"
                id="formatWrap"
            >

            <label for="formatWrap">
                Xuống dòng
            </label>

        </div>


        <div class="color-row">

            <input
                type="checkbox"
                id="enableTextColor"
            >

            <label for="enableTextColor">
                Màu chữ
            </label>

            <input
                type="color"
                id="formatTextColor"
                value="#222222"
            >

        </div>


        <div class="color-row">

            <input
                type="checkbox"
                id="enableBgColor"
            >

            <label for="enableBgColor">
                Màu nền
            </label>

            <input
                type="color"
                id="formatBgColor"
                value="#ffffff"
            >

        </div>


        <div class="settings-buttons">

            <button
                class="primary"
                onclick="applyFormatting()"
            >
                Áp dụng định dạng
            </button>

        </div>

    </div>


    <!-- RENAME -->

    <div class="settings-section">

        <h3>
            3. Đổi tên cột
        </h3>

        <div class="settings-help">
            Tên mới được lưu trên trình duyệt này.
        </div>

        <div class="setting-row">

            <label>
                Cột
            </label>

            <select id="renameColumnSelect"></select>

        </div>

        <div class="setting-row">

            <label>
                Tên mới
            </label>

            <input
                type="text"
                id="renameColumnInput"
                placeholder="Nhập tên mới..."
            >

        </div>

        <div class="settings-buttons">

            <button
                class="primary"
                onclick="renameSelectedColumn()"
            >
                Lưu tên cột
            </button>

            <button
                onclick="resetSelectedColumnName()"
            >
                Tên gốc
            </button>

        </div>

    </div>


    <!-- FREEZE -->

    <div class="settings-section">

        <h3>
            4. Cố định cột
        </h3>

        <div class="setting-row">

            <label>
                Số cột cố định
            </label>

            <input
                type="number"
                id="freezeCount"
                min="0"
                value="0"
                onchange="changeFreezeCount()"
            >

        </div>

    </div>


    <!-- SAVE -->

    <div class="settings-section">

        <div class="settings-buttons">

            <button onclick="resetAllSettings()">
                Khôi phục cài đặt
            </button>

            <button
                class="primary"
                onclick="closeSettings()"
            >
                Đóng
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     CONTEXT MENU
======================================================= -->

<div class="context-menu" id="contextMenu">

    <button onclick="renameFromContextMenu()">
        ✏ Đổi tên cột
    </button>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v7";


/* =========================================================
   HIDDEN HELPER COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SORT BY MAP
========================================================= */

const SORT_BY_MAP = {

    "DATA": "Sort_DATA",

    "Thoại nội mạng": "Sort_NM",

    "Thoại ngoại mạng": "Sort_NgM"

};


/* =========================================================
   SPECIAL COLUMNS
========================================================= */

const DATE_COLUMNS = new Set([
    "Ngày update"
]);


/* =========================================================
   STATE
========================================================= */

let headers = [];
let rows = [];

let columnNames = {};

let selectedFilters = {};

let defaultFilters = {};

let searchValues = {};

let sortOrders = {};

let columnWidths = {};

let columnFormats = {};

let freezeCount = 0;

let currentFilterColumn = null;

let temporaryFilterValues = [];

let contextColumn = null;


/* =========================================================
   DEFAULT FORMAT
========================================================= */

const DEFAULT_FORMAT = {

    fontSize: 14,

    align: "left",

    bold: false,

    italic: false,

    wrap: false,

    textColor: "",

    bgColor: ""

};


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        loadStorage();

        await refreshData();

        setInterval(
            refreshData,
            5 * 60 * 1000
        );

        document.addEventListener(
            "click",
            function(event) {

                const menu =
                    document.getElementById(
                        "filterMenu"
                    );

                if (
                    menu.classList.contains("open") &&
                    !menu.contains(event.target)
                ) {

                    const filterButton =
                        event.target.closest(
                            ".header-filter-btn"
                        );

                    if (!filterButton) {
                        menu.classList.remove("open");
                    }
                }

            }
        );

        document.addEventListener(
            "contextmenu",
            function(event) {

                const th =
                    event.target.closest("th[data-column]");

                if (!th) return;

                event.preventDefault();

                contextColumn =
                    Number(th.dataset.column);

                const menu =
                    document.getElementById(
                        "contextMenu"
                    );

                menu.style.left =
                    event.clientX + "px";

                menu.style.top =
                    event.clientY + "px";

                menu.classList.add("open");
            }
        );

        document.addEventListener(
            "click",
            function(event) {

                const menu =
                    document.getElementById(
                        "contextMenu"
                    );

                if (
                    !menu.contains(event.target)
                ) {
                    menu.classList.remove("open");
                }

            }
        );

    }
);


/* =========================================================
   STORAGE
========================================================= */

function loadStorage() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw) return;

        const data =
            JSON.parse(raw);

        columnNames =
            data.columnNames || {};

        selectedFilters =
            data.selectedFilters || {};

        searchValues =
            data.searchValues || {};

        sortOrders =
            data.sortOrders || {};

        columnWidths =
            data.columnWidths || {};

        columnFormats =
            data.columnFormats || {};

        freezeCount =
            Number(data.freezeCount || 0);

    }
    catch(error) {

        console.error(
            "Không đọc được localStorage:",
            error
        );

    }

}


function saveStorage() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({

                columnNames,

                selectedFilters,

                searchValues,

                sortOrders,

                columnWidths,

                columnFormats,

                freezeCount

            })
        );

    }
    catch(error) {

        console.error(
            "Không lưu được localStorage:",
            error
        );

    }

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const result = [];

    let row = [];

    let value = "";

    let insideQuotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (char === '"') {

            if (
                insideQuotes &&
                next === '"'
            ) {

                value += '"';

                i++;

            }
            else {

                insideQuotes =
                    !insideQuotes;

            }

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {
                i++;
            }

            row.push(value);

            result.push(row);

            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);

        result.push(row);

    }


    return result;

}


/* =========================================================
   REFRESH DATA
========================================================= */

async function refreshData() {

    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.display =
        "flex";

    try {

        const url =
            SHEET_CSV_URL +
            "&_=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const csv =
            parseCSV(text);


        if (
            !csv ||
            csv.length === 0
        ) {

            throw new Error(
                "Google Sheet không có dữ liệu."
            );

        }


        headers =
            csv[0].map(
                h => cleanHeader(h)
            );


        rows =
            csv
                .slice(1)
                .filter(
                    row =>
                        row.some(
                            value =>
                                String(value || "")
                                    .trim() !== ""
                        )
                )
                .map(
                    row => {

                        const obj = {};

                        headers.forEach(
                            (header, index) => {

                                obj[header] =
                                    row[index] ?? "";

                            }
                        );

                        return obj;

                    }
                );


        initializeColumnNames();

        initializeDefaults();

        cleanStateAfterDataChange();

        renderTable();

        updateRefreshInfo();

        saveStorage();

    }
    catch(error) {

        console.error(error);

        showError(
            "Không thể tải dữ liệu Google Sheet.<br><br>" +
            error.message
        );

    }
    finally {

        loading.style.display =
            "none";

    }

}


/* =========================================================
   CLEAN HEADER
========================================================= */

function cleanHeader(value) {

    return String(value || "")
        .replace(/^\uFEFF/, "")
        .replace(/\u00A0/g, " ")
        .trim();

}


/* =========================================================
   COLUMN NAMES
========================================================= */

function initializeColumnNames() {

    headers.forEach(
        (header, index) => {

            if (
                columnNames[index] === undefined
            ) {

                columnNames[index] =
                    header;

            }

        }
    );

}


/* =========================================================
   DEFAULT FILTERS
========================================================= */

function initializeDefaults() {

    defaultFilters = {};


    const dateIndex =
        getColumnIndexByName(
            "Ngày update"
        );


    if (dateIndex !== -1) {

        const values =
            getUniqueRawValues(
                dateIndex
            );

        defaultFilters[dateIndex] =
            values.filter(
                value =>
                    String(value).trim() !== ""
            );

    }


    const stopIndex =
        getColumnIndexByName(
            "Dừng gói"
        );


    if (stopIndex !== -1) {

        const values =
            getUniqueRawValues(
                stopIndex
            );


        const blankValue =
            values.find(
                value =>
                    String(value).trim() === ""
            );


        if (blankValue !== undefined) {

            defaultFilters[stopIndex] =
                [blankValue];

        }
        else {

            defaultFilters[stopIndex] =
                [];

        }

    }


    Object.keys(defaultFilters)
        .forEach(
            index => {

                if (
                    !Object.prototype.hasOwnProperty.call(
                        selectedFilters,
                        index
                    )
                ) {

                    selectedFilters[index] =
                        [...defaultFilters[index]];

                }

            }
        );

}

/* =========================================================
   FORMAT DATE
========================================================= */

function parseVietnameseDate(value) {

    const text =
        String(value || "").trim();


    if (!text) {
        return null;
    }


    let match =
        text.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if (match) {

        const day =
            Number(match[1]);

        const month =
            Number(match[2]);

        const year =
            Number(match[3]);


        const date =
            new Date(
                year,
                month - 1,
                day
            );


        if (
            date.getFullYear() === year &&
            date.getMonth() === month - 1 &&
            date.getDate() === day
        ) {

            return date;

        }

    }


    match =
        text.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

    }


    return null;

}


/* =========================================================
   DISPLAY DATE
========================================================= */

function formatDateValue(value) {

    const date =
        parseVietnameseDate(value);


    if (!date) {

        return String(value || "");

    }


    const now =
        new Date();


    const months =
        (
            now.getFullYear() -
            date.getFullYear()
        ) * 12 +
        (
            now.getMonth() -
            date.getMonth()
        );


    if (months >= 0) {

        return String(months)
            .padStart(2, "0") +
            " tháng";

    }


    const day =
        String(date.getDate())
            .padStart(2, "0");

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const year =
        date.getFullYear();


    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}


/* =========================================================
   VIETNAMESE NUMBER
========================================================= */

function parseVietnameseNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    let text =
        String(value)
            .trim();


    if (!text) {

        return null;

    }


    /*
       Ví dụ:

       100.000.000,1
       ↓
       100000000.1

       100.000
       ↓
       100000

       1,5
       ↓
       1.5
    */


    text =
        text
            .replace(/\s/g, "")
            .replace(/[₫đĐ]/g, "");


    /*
       Nếu có cả . và ,
       thì theo format Việt Nam:

       . = hàng nghìn
       , = thập phân
    */

    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(/\./g, "")
                .replace(",", ".");

    }

    else if (
        text.includes(",")
    ) {

        /*
           Chỉ có dấu ,
           xem là dấu thập phân
        */

        text =
            text.replace(",", ".");

    }

    else {

        /*
           Chỉ có dấu .
           Có thể là:

           100.000
           hoặc
           100.5

           Nếu phần sau có đúng 3 số
           thì coi là dấu ngăn cách hàng nghìn.
        */

        const parts =
            text.split(".");

        if (
            parts.length > 2
        ) {

            text =
                parts.join("");

        }
        else if (
            parts.length === 2 &&
            parts[1].length === 3 &&
            /^\d+$/.test(parts[0]) &&
            /^\d+$/.test(parts[1])
        ) {

            text =
                parts.join("");

        }

    }


    text =
        text.replace(
            /[^0-9eE+\-\.]/g,
            ""
        );


    const number =
        Number(text);


    if (
        Number.isFinite(number)
    ) {

        return number;

    }


    return null;

}


/* =========================================================
   DETECT NUMBER
========================================================= */

function isNumericColumn(index) {

    const header =
        headers[index];


    if (
        DATE_COLUMNS.has(header)
    ) {

        return false;

    }


    const values =
        rows
            .map(
                row =>
                    String(
                        row[header] ?? ""
                    ).trim()
            )
            .filter(
                value => value !== ""
            )
            .slice(0, 100);


    if (
        values.length === 0
    ) {

        return false;

    }


    let numericCount = 0;


    values.forEach(
        value => {

            if (
                parseVietnameseNumber(value) !== null
            ) {

                numericCount++;

            }

        }
    );


    return (
        numericCount / values.length >= 0.8
    );

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function displayValue(
    value,
    columnIndex
) {

    const header =
        headers[columnIndex];


    if (
        DATE_COLUMNS.has(header)
    ) {

        return formatDateValue(value);

    }


    return String(value ?? "");

}


/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(
    row,
    columnIndex
) {

    const originalHeader =
        headers[columnIndex];


    let sortHeader =
        SORT_BY_MAP[originalHeader] ||
        originalHeader;


    if (
        sortHeader &&
        row[sortHeader] !== undefined
    ) {

        const sortRaw =
            row[sortHeader];


        const numeric =
            parseVietnameseNumber(
                sortRaw
            );


        if (numeric !== null) {

            return {
                type: "number",
                value: numeric
            };

        }


        const date =
            parseVietnameseDate(
                sortRaw
            );


        if (date) {

            return {
                type: "date",
                value: date.getTime()
            };

        }


        return {
            type: "text",
            value: String(sortRaw).toLowerCase()
        };

    }


    const raw =
        row[originalHeader] ?? "";


    if (
        DATE_COLUMNS.has(originalHeader)
    ) {

        const date =
            parseVietnameseDate(raw);


        if (date) {

            return {
                type: "date",
                value: date.getTime()
            };

        }

    }


    if (
        isNumericColumn(columnIndex)
    ) {

        const number =
            parseVietnameseNumber(raw);


        if (number !== null) {

            return {
                type: "number",
                value: number
            };

        }

    }


    return {
        type: "text",
        value: String(raw).toLowerCase()
    };

}


/* =========================================================
   SORT ROWS
========================================================= */

function sortRows(data) {

    const orders =
        Object.entries(sortOrders)
            .map(
                ([index, config]) => ({

                    index: Number(index),

                    direction:
                        config.direction || "asc",

                    priority:
                        Number(config.priority)

                })
            )
            .filter(
                item =>
                    Number.isFinite(item.priority)
            )
            .sort(
                (a, b) => {

                    if (
                        a.priority !==
                        b.priority
                    ) {

                        return (
                            a.priority -
                            b.priority
                        );

                    }

                    /*
                       Nếu 2 cột cùng priority,
                       giữ thứ tự theo index.
                    */

                    return a.index - b.index;

                }
            );


    if (
        orders.length === 0
    ) {

        return data;

    }


    return [...data].sort(
        (a, b) => {

            for (
                const order of orders
            ) {

                const av =
                    getSortValue(
                        a,
                        order.index
                    );

                const bv =
                    getSortValue(
                        b,
                        order.index
                    );


                let result = 0;


                if (
                    av.type === "number" &&
                    bv.type === "number"
                ) {

                    result =
                        av.value -
                        bv.value;

                }
                else if (
                    av.type === "date" &&
                    bv.type === "date"
                ) {

                    result =
                        av.value -
                        bv.value;

                }
                else {

                    result =
                        String(av.value)
                            .localeCompare(
                                String(bv.value),
                                "vi",
                                {
                                    numeric: true,
                                    sensitivity: "base"
                                }
                            );

                }


                if (
                    result !== 0
                ) {

                    return order.direction === "asc"
                        ? result
                        : -result;

                }

            }


            return 0;

        }
    );

}


/* =========================================================
   FILTER ROWS
========================================================= */

function filterRows(data) {

    return data.filter(
        row => {

            /*
               Bộ lọc giá trị
            */

            for (
                const [indexString, selected]
                of Object.entries(selectedFilters)
            ) {

                const index =
                    Number(indexString);


                if (
                    !headers[index]
                ) {

                    continue;

                }


                const raw =
                    row[headers[index]] ?? "";


                const selectedStrings =
                    selected.map(
                        value =>
                            String(value)
                    );


                if (
                    !selectedStrings.includes(
                        String(raw)
                    )
                ) {

                    return false;

                }

            }


            /*
               Search từng cột
            */

            for (
                const [indexString, search]
                of Object.entries(searchValues)
            ) {

                const text =
                    String(search || "")
                        .trim()
                        .toLowerCase();


                if (!text) {

                    continue;

                }


                const index =
                    Number(indexString);


                if (
                    !headers[index]
                ) {

                    continue;

                }


                const raw =
                    displayValue(
                        row[headers[index]] ?? "",
                        index
                    )
                    .toLowerCase();


                if (
                    !raw.includes(text)
                ) {

                    return false;

                }

            }


            return true;

        }
    );

}


/* =========================================================
   CHECK FILTER ACTIVE
========================================================= */

function isColumnFiltered(index) {

    const allValues =
        getUniqueRawValues(index);


    const selected =
        selectedFilters[index];


    if (
        !selected
    ) {

        return false;

    }


    /*
       Nếu chọn toàn bộ thì không coi
       là filter active.
    */

    if (
        selected.length ===
        allValues.length
    ) {

        const a =
            selected
                .map(String)
                .sort()
                .join("|");

        const b =
            allValues
                .map(String)
                .sort()
                .join("|");

        if (a === b) {

            return false;

        }

    }


    /*
       Default filter
    */

    if (
        defaultFilters[index]
    ) {

        const a =
            selected
                .map(String)
                .sort()
                .join("|");

        const b =
            defaultFilters[index]
                .map(String)
                .sort()
                .join("|");

        if (a === b) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   SEARCH ACTIVE
========================================================= */

function isColumnSearchActive(index) {

    return Boolean(
        String(
            searchValues[index] || ""
        ).trim()
    );

}

function renderTable() {

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHead() {

    const thead =
        document.getElementById(
            "tableHead"
        );


    thead.innerHTML = "";


    const headerRow =
        document.createElement("tr");

    headerRow.className =
        "header-row";


    const searchRow =

    searchRow.className =
        "search-row";


    headers.forEach(
        (header, index) => {

            if (
                HIDDEN_COLUMNS.has(header)
            ) {

                return;

            }


            const th =
                document.createElement("th");

            th.dataset.column =
                index;

            th.className =
                "header-cell";


            const content =
                document.createElement("div");

            content.className =
                "header-content";


            const name =
                document.createElement("span");

            name.className =
                "header-name";

            name.textContent =
                getDisplayColumnName(index);


            name.title =
                "Double click để đổi tên cột";


            name.ondblclick =
                function() {

                    renameColumnDirect(index);

                };


            const actions =
                document.createElement("div");

            actions.className =
                "header-actions";


            const sortInfo =
                document.createElement("span");

            sortInfo.className =
                "header-sort";


            if (
                sortOrders[index]
            ) {

                sortInfo.textContent =
                    "S" +
                    sortOrders[index].priority +
                    (
                        sortOrders[index].direction === "asc"
                            ? " ▲"
                            : " ▼"
                    );

            }


            const filterButton =
                document.createElement("button");

            filterButton.className =
                "header-filter-btn";

            filterButton.innerHTML =
                "▼";


            filterButton.onclick =
                function(event) {

                    event.stopPropagation();

                    openFilterMenu(
                        index,
                        filterButton
                    );

                };


            actions.appendChild(
                sortInfo
            );

            actions.appendChild(
                filterButton
            );


            content.appendChild(name);

            content.appendChild(actions);


            th.appendChild(content);


            const resize =
                document.createElement("div");

            resize.className =
                "resize-handle";


            resize.addEventListener(
                "mousedown",
                function(event) {

                    startResize(
                        event,
                        index,
                        th
                    );

                }
            );


            th.appendChild(resize);


            if (
                isColumnFiltered(index) ||
                isColumnSearchActive(index)
            ) {

                th.classList.add(
                    "filtered"
                );

            }


            if (
                sortOrders[index]
            ) {

                th.classList.add(
                    "sorted"
                );

            }


            headerRow.appendChild(th);


            const searchTh =
                document.createElement("th");

            searchTh.dataset.column =
                index;

            searchTh.className =
                "search-cell";


            const input =
                document.createElement("input");

            input.className =
                "search-input";

            input.placeholder =
                "Tìm kiếm...";

            input.value =
                searchValues[index] || "";


            let searchTimer = null;


            input.addEventListener(
                "input",
                function() {

                    clearTimeout(
                        searchTimer
                    );


                    searchTimer =
                        setTimeout(
                            function() {

                                searchValues[index] =
                                    input.value;

                                saveStorage();

                                renderBody();

                                updateHeaderClasses();

                            },
                            180
                        );

                }
            );


            searchTh.appendChild(input);

            searchRow.appendChild(
                searchTh
            );

        }
    );


    thead.appendChild(
        headerRow
    );

    thead.appendChild(
        searchRow
    );

}


/* =========================================================
   RENDER BODY
========================================================= */

function renderBody() {

    const tbody =
        document.getElementById(
            "tableBody"
        );


    tbody.innerHTML = "";


    let data =
        filterRows(rows);


    data =
        sortRows(data);


    const fragment =
        document.createDocumentFragment();


    data.forEach(
        row => {

            const tr =
                document.createElement("tr");


            headers.forEach(
                (header, index) => {

                    if (
                        HIDDEN_COLUMNS.has(header)
                    ) {

                        return;

                    }


                    const td =
                        document.createElement("td");


                    td.dataset.column =
                        index;


                    td.textContent =
                        displayValue(
                            row[header] ?? "",
                            index
                        );


                    applyCellFormat(
                        td,
                        index
                    );


                    tr.appendChild(td);

                }
            );


            fragment.appendChild(tr);

        }
    );


    tbody.appendChild(
        fragment
    );


    applyFreezeColumns();

}


/* =========================================================
   APPLY FORMAT
========================================================= */

function getColumnFormat(index) {

    return {
        ...DEFAULT_FORMAT,
        ...(columnFormats[index] || {})
    };

}


function applyCellFormat(
    cell,
    index
) {

    const format =
        getColumnFormat(index);


    cell.style.fontSize =
        format.fontSize + "px";


    cell.style.textAlign =
        format.align;


    cell.style.fontWeight =
        format.bold
            ? "700"
            : "400";


    cell.style.fontStyle =
        format.italic
            ? "italic"
            : "normal";


    cell.style.whiteSpace =
        format.wrap
            ? "normal"
            : "nowrap";


    if (
        format.textColor
    ) {

        cell.style.color =
            format.textColor;

    }


    if (
        format.bgColor
    ) {

        cell.style.backgroundColor =
            format.bgColor;

    }

}


/* =========================================================
   HEADER CLASSES
========================================================= */

function updateHeaderClasses() {

    headers.forEach(
        (header, index) => {

            const th =
                document.querySelector(
                    `th.header-cell[data-column="${index}"]`
                );


            if (!th) return;


            th.classList.remove(
                "filtered",
                "sorted"
            );


            if (
                isColumnFiltered(index) ||
                isColumnSearchActive(index)
            ) {

                th.classList.add(
                    "filtered"
                );

            }


            if (
                sortOrders[index]
            ) {

                th.classList.add(
                    "sorted"
                );

            }

        }
    );

}


/* =========================================================
   FILTER MENU
========================================================= */

function openFilterMenu(
    index,
    button
) {

    currentFilterColumn =
        index;


    const values =
        getUniqueRawValues(index);


    temporaryFilterValues =
        selectedFilters[index]
            ? [...selectedFilters[index]]
            : [...values];


    const menu =
        document.getElementById(
            "filterMenu"
        );


    document.getElementById(
        "filterTitle"
    ).textContent =
        getDisplayColumnName(index);


    document.getElementById(
        "filterValueSearch"
    ).value = "";


    const priority =
        sortOrders[index]?.priority ?? "";


    document.getElementById(
        "sortPriorityInput"
    ).value =
        priority;


    renderFilterValues();


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if (
        left + 330 >
        window.innerWidth
    ) {

        left =
            window.innerWidth - 340;

    }


    if (
        top + 560 >
        window.innerHeight
    ) {

        top =
            window.innerHeight - 570;

    }


    menu.style.left =
        Math.max(5, left) + "px";

    menu.style.top =
        Math.max(5, top) + "px";


    menu.classList.add("open");

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues() {

    const container =
        document.getElementById(
            "filterValues"
        );


    container.innerHTML = "";


    if (
        currentFilterColumn === null
    ) {

        return;

    }


    const index =
        currentFilterColumn;


    const allValues =
        getUniqueRawValues(index);


    const search =
        document.getElementById(
            "filterValueSearch"
        ).value
            .toLowerCase()
            .trim();


    allValues
        .filter(
            value => {

                const text =
                    displayValue(
                        value,
                        index
                    );


                return (
                    !search ||
                    text
                        .toLowerCase()
                        .includes(search)
                );

            }
        )
        .forEach(
            value => {

                const label =
                    document.createElement("label");

                label.className =
                    "filter-value";


                const checkbox =
                    document.createElement("input");

                checkbox.type =
                    "checkbox";


                checkbox.checked =
                    temporaryFilterValues.some(
                        selected =>
                            String(selected) ===
                            String(value)
                    );


                checkbox.addEventListener(
                    "change",
                    function() {

                        if (
                            checkbox.checked
                        ) {

                            if (
                                !temporaryFilterValues.some(
                                    selected =>
                                        String(selected) ===
                                        String(value)
                                )
                            ) {

                                temporaryFilterValues.push(
                                    value
                                );

                            }

                        }
                        else {

                            temporaryFilterValues =
                                temporaryFilterValues.filter(
                                    selected =>
                                        String(selected) !==
                                        String(value)
                                );

                        }

                    }
                );


                const span =
                    document.createElement("span");


                let display =
                    displayValue(
                        value,
                        index
                    );


                if (
                    display === ""
                ) {

                    display =
                        "(trống)";

                }


                span.textContent =
                    display;


                label.appendChild(
                    checkbox
                );

                label.appendChild(
                    span
                );


                container.appendChild(
                    label
                );

            }
        );

}


/* =========================================================
   SELECT ALL
========================================================= */

function selectAllFilterValues() {

    if (
        currentFilterColumn === null
    ) {

        return;

    }


    temporaryFilterValues =
        getUniqueRawValues(
            currentFilterColumn
        );


    renderFilterValues();

}


/* =========================================================
   CLEAR FILTER
========================================================= */

function clearFilterValues() {

    temporaryFilterValues = [];

    renderFilterValues();

}


/* =========================================================
   APPLY FILTER
========================================================= */

function applyFilter() {

    if (
        currentFilterColumn === null
    ) {

        return;

    }


    selectedFilters[
        currentFilterColumn
    ] =
        [...temporaryFilterValues];


    saveStorage();

    document.getElementById(
        "filterMenu"
    ).classList.remove("open");


    renderBody();

    updateHeaderClasses();

}


/* =========================================================
   CANCEL FILTER
========================================================= */

function cancelFilter() {

    document.getElementById(
        "filterMenu"
    ).classList.remove("open");

}


/* =========================================================
   SORT
========================================================= */

function setCurrentSort(direction) {

    if (
        currentFilterColumn === null
    ) {

        return;

    }


    let priority =
        Number(
            document.getElementById(
                "sortPriorityInput"
            ).value
        );


    if (
        !Number.isFinite(priority) ||
        priority < 1
    ) {

        /*
           Nếu chưa nhập priority,
           tự lấy số tiếp theo.
        */

        const priorities =
            Object.values(sortOrders)
                .map(
                    item =>
                        Number(item.priority)
                )
                .filter(
                    value =>
                        Number.isFinite(value)
                );


        priority =
            priorities.length
                ? Math.max(...priorities) + 1
                : 1;

    }


    sortOrders[
        currentFilterColumn
    ] = {

        direction,

        priority

    };


    document.getElementById(
        "sortPriorityInput"
    ).value =
        priority;


    saveStorage();

    renderBody();

    renderHead();

}


/* =========================================================
   REMOVE SORT
========================================================= */

function removeCurrentSort() {

    if (
        currentFilterColumn === null
    ) {

        return;

    }


    delete sortOrders[
        currentFilterColumn
    ];


    saveStorage();

    document.getElementById(
        "sortPriorityInput"
    ).value = "";


    renderBody();

    renderHead();

}


/* =========================================================
   APPLY PRIORITY
========================================================= */

function applyCurrentPriority() {

    if (
        currentFilterColumn === null
    ) {

        return;

    }


    const input =
        document.getElementById(
            "sortPriorityInput"
        );


    const priority =
        Number(input.value);


    if (
        !Number.isInteger(priority) ||
        priority < 1
    ) {

        alert(
            "Ưu tiên sort phải là số nguyên từ 1 trở lên."
        );

        return;

    }


    if (
        !sortOrders[currentFilterColumn]
    ) {

        sortOrders[currentFilterColumn] = {

            direction: "asc",

            priority

        };

    }
    else {

        /*
           QUAN TRỌNG:
           giữ nguyên số priority mà người dùng nhập.
        */

        sortOrders[
            currentFilterColumn
        ].priority =
            priority;

    }


    saveStorage();

    renderBody();

    renderHead();

}


/* =========================================================
   RESET USER FILTERS
========================================================= */

function resetUserFilters() {

    /*
       Xóa search
    */

    searchValues = {};


    /*
       Xóa sort
    */

    sortOrders = {};


    /*
       Trả filter về DEFAULT
    */

    selectedFilters = {};


    Object.keys(defaultFilters)
        .forEach(
            index => {

                selectedFilters[index] =
                    [...defaultFilters[index]];

            }
        );


    saveStorage();

    renderTable();

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function applyColumnWidths() {

    const visibleHeaders =
        headers.filter(
            header =>
                !HIDDEN_COLUMNS.has(header)
        );


    visibleHeaders.forEach(
        (header, visibleIndex) => {

            const originalIndex =
                headers.indexOf(header);


            let width =
                columnWidths[originalIndex];


            if (
                !width
            ) {

                width = 150;

            }


            const cells =
                document.querySelectorAll(
                    `[data-column="${originalIndex}"]`
                );


            cells.forEach(
                cell => {

                    cell.style.width =
                        width + "px";

                    cell.style.minWidth =
                        width + "px";

                    cell.style.maxWidth =
                        width + "px";

                }
            );

        }
    );

}


/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    index,
    th
) {

    event.preventDefault();

    const startX =
        event.clientX;


    const startWidth =
        th.getBoundingClientRect()
            .width;


    function move(e) {

        let newWidth =
            startWidth +
            (
                e.clientX -
                startX
            );


        newWidth =
            Math.max(
                70,
                Math.min(
                    700,
                    newWidth
                )
            );


        columnWidths[index] =
            Math.round(newWidth);


        applyColumnWidths();

    }


    function stop() {

        document.removeEventListener(
            "mousemove",
            move
        );

        document.removeEventListener(
            "mouseup",
            stop
        );


        saveStorage();

    }


    document.addEventListener(
        "mousemove",
        move
    );

    document.addEventListener(
        "mouseup",
        stop
    );

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

        "settingsOverlay"

    document.getElementById(

        event.target.id !==

    ) {

        return;

    }


    document.getElementById(
        "settingsOverlay"
    ).classList.remove("open");

    document.getElementById(
        "settingsPanel"

}


/* =========================================================
   COLUMN SETTINGS
========================================================= */

function renderColumnSettings() {

    const selector =
        document.getElementById(
            "columnSelector"
        );


    selector.innerHTML = "";


    headers.forEach(
        (header, index) => {

            if (
                HIDDEN_COLUMNS.has(header)
            ) {

                return;

            }


            const label =
                document.createElement("label");

            label.className =
                "column-option";


            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.value =
                index;


            const span =
                document.createElement("span");

            span.textContent =
                getDisplayColumnName(index);


            label.appendChild(
                checkbox
            );

            label.appendChild(
                span
            );


            selector.appendChild(
                label
            );

        }
    );


    const renameSelect =
        document.getElementById(
            "renameColumnSelect"
        );


    renameSelect.innerHTML = "";


    headers.forEach(
        (header, index) => {

            if (
                HIDDEN_COLUMNS.has(header)
            ) {

                return;

            }


            const option =
                document.createElement("option");


            option.value =
                index;

            option.textContent =
                getDisplayColumnName(index);


            renameSelect.appendChild(
                option
            );

        }
    );


    loadFormatFromFirstSelected();

}


/* =========================================================
   GET SELECTED FORMAT COLUMNS
========================================================= */

function getSelectedFormatColumns() {

    return Array.from(
        document.querySelectorAll(
            "#columnSelector input[type=checkbox]:checked"
        )
    )
        .map(
            checkbox =>
                Number(checkbox.value)
        );

}


/* =========================================================
   LOAD FORMAT
========================================================= */

function loadFormatFromFirstSelected() {

    const selected =
        getSelectedFormatColumns();


    let index =
        selected[0];


    if (
        index === undefined
    ) {

        const firstVisible =
            headers.findIndex(
                header =>
                    !HIDDEN_COLUMNS.has(header)
            );


        index =
            firstVisible;

    }


    if (
        index === -1 ||
        index === undefined
    ) {

        return;

    }


    const format =
        getColumnFormat(index);


    document.getElementById(
        "formatFontSize"
    ).value =
        format.fontSize;


    document.getElementById(
        "formatAlign"
    ).value =
        format.align;


    document.getElementById(
        "formatBold"
    ).checked =
        format.bold;


    document.getElementById(
        "formatItalic"
    ).checked =
        format.italic;


    document.getElementById(
        "formatWrap"
    ).checked =
        format.wrap;


    if (
        format.textColor
    ) {

        document.getElementById(
            "enableTextColor"
        ).checked = true;

        document.getElementById(
            "formatTextColor"
        ).value =
            format.textColor;

    }


    if (
        format.bgColor
    ) {

        document.getElementById(
            "enableBgColor"
        ).checked = true;

        document.getElementById(
            "formatBgColor"
        ).value =
            format.bgColor;

    }

}


/* =========================================================
   APPLY FORMATTING
========================================================= */

function applyFormatting() {

    const selected =
        getSelectedFormatColumns();


    if (
        selected.length === 0
    ) {

        alert(
            "Bạn chưa chọn cột."
        );

        return;

    }


    const fontSize =
        Number(
            document.getElementById(
                "formatFontSize"
            ).value
        );


    const align =
        document.getElementById(
            "formatAlign"
        ).value;


    const bold =
        document.getElementById(
            "formatBold"
        ).checked;


    const italic =
        document.getElementById(
            "formatItalic"
        ).checked;


    const wrap =
        document.getElementById(
            "formatWrap"
        ).checked;


    const enableTextColor =
        document.getElementById(
            "enableTextColor"
        ).checked;


    const enableBgColor =
        document.getElementById(
            "enableBgColor"
        ).checked;


    const textColor =
        document.getElementById(
            "formatTextColor"
        ).value;


    const bgColor =
        document.getElementById(
            "formatBgColor"
        ).value;


    selected.forEach(
        index => {

            columnFormats[index] = {

                fontSize,

                align,

                bold,

                italic,

                wrap,

                textColor:
                    enableTextColor
                        ? textColor
                        : "",

                bgColor:
                    enableBgColor
                        ? bgColor
                        : ""

            };

        }
    );


    saveStorage();

    renderBody();

    alert(
        "Đã áp dụng định dạng cho " +
        selected.length +
        " cột."
    );

}


/* =========================================================
   RENAME
========================================================= */

function renameSelectedColumn() {

    const select =
        document.getElementById(
            "renameColumnSelect"
        );


    const index =
        Number(select.value);


    const input =
        document.getElementById(
            "renameColumnInput"
        );


    const newName =
        input.value.trim();


    if (!newName) {

        alert(
            "Vui lòng nhập tên mới."
        );

        return;

    }


    columnNames[index] =
        newName;


    saveStorage();

    renderTable();

    renderColumnSettings();


    document.getElementById(
        "renameColumnSelect"
    ).value =
        index;


    alert(
        "Đã đổi tên cột."
    );

}


/* =========================================================
   DIRECT RENAME
========================================================= */

function renameColumnDirect(index) {

    const current =
        getDisplayColumnName(index);


    const newName =
        prompt(
            "Nhập tên mới cho cột:",
            current
        );


    if (
        newName === null
    ) {

        return;

    }


    const trimmed =
        newName.trim();


    if (!trimmed) {

        return;

    }


    columnNames[index] =
        trimmed;


    saveStorage();

    renderTable();

}


/* =========================================================
   RENAME CONTEXT
========================================================= */

function renameFromContextMenu() {

    document.getElementById(
        "contextMenu"
    ).classList.remove("open");


    if (
        contextColumn === null
    ) {

        return;

    }


    renameColumnDirect(
        contextColumn
    );

}


/* =========================================================
   RESET COLUMN NAME
========================================================= */

function resetSelectedColumnName() {

    const index =
        Number(
            document.getElementById(
                "renameColumnSelect"

        );


    columnNames[index] =
        headers[index];

/* =========================================================
   FREEZE COLUMNS
========================================================= */

function changeFreezeCount() {

    const input =
        document.getElementById(
            "freezeCount"
        );


    let count =
        Number(input.value);


    if (
        !Number.isInteger(count) ||
        count < 0
    ) {

        count = 0;

    }


    const visibleHeaders =
        headers.filter(
            header =>
                !HIDDEN_COLUMNS.has(header)
        );


    count =
        Math.min(
            count,
            visibleHeaders.length
        );


    freezeCount =
        count;


    input.value =
        count;


    saveStorage();

    applyFreezeColumns();

}


/* =========================================================
   APPLY FREEZE
========================================================= */

function applyFreezeColumns() {

    const visibleHeaders =
        headers.filter(
            header =>
                !HIDDEN_COLUMNS.has(header)
        );


    const frozenIndices =
        visibleHeaders
            .slice(
                0,
                freezeCount
            )
            .map(
                header =>
                    headers.indexOf(header)
            );


    let left =
        0;


    frozenIndices.forEach(
        index => {

            const width =
                columnWidths[index] ||
                150;


            const cells =
                document.querySelectorAll(
                    `[data-column="${index}"]`
                );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );

                    cell.style.left =
                        left + "px";

                }
            );


            left += width;

        }
    );


    /*
       Xóa sticky khỏi những cột
       không còn nằm trong freeze.
    */

    headers.forEach(
        header => {

            const index =
                headers.indexOf(header);


            if (
                frozenIndices.includes(index)
            ) {

                return;

            }


            const cells =
                document.querySelectorAll(
                    `[data-column="${index}"]`
                );


            cells.forEach(
                cell => {

                    cell.classList.remove(
                        "frozen-column"
                    );

                    cell.style.left =
                        "";

                }
            );

        }
    );

}


/* =========================================================
   RESET ALL SETTINGS
========================================================= */

function resetAllSettings() {

    if (
        !confirm(
            "Khôi phục toàn bộ cài đặt trên trình duyệt này?"
        )
    ) {

        return;

    }


    columnNames = {};

    searchValues = {};

    sortOrders = {};

    columnWidths = {};

    columnFormats = {};

    freezeCount = 0;


    selectedFilters = {};


    Object.keys(defaultFilters)
        .forEach(
            index => {

                selectedFilters[index] =
                    [...defaultFilters[index]];

            }
        );


    saveStorage();

    initializeColumnNames();

    renderTable();

    renderColumnSettings();


    document.getElementById(
        "freezeCount"
    ).value = 0;

}
