<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>DINHVIETHUNG</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
    background:#000;
    color:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    font-family:"Times New Roman",serif;
}
#title{
    font-size:clamp(42px,8vw,110px);
    letter-spacing:.18em;
    text-align:center;
    text-shadow:0 0 8px rgba(212,175,55,.22);
    animation:fade 1.8s ease-in-out infinite alternate;
}
#hint{
    position:fixed;
    bottom:32px;
    left:0;
    right:0;
    text-align:center;
    color:#8d7626;
    font:14px Arial,sans-serif;
    letter-spacing:.08em;
}
@keyframes fade{
    from{opacity:.72}
    to{opacity:1}
}
</style>
</head>
<body id="intro">
<div id="title">DINHVIETHUNG</div>
<div id="hint">BẤM PHÍM BẤT KỲ HOẶC CLICK CHUỘT</div>
<script>
"use strict";
const go = () => window.location.href = "login.html";
document.addEventListener("keydown", go, {once:true});
document.addEventListener("click", go, {once:true});
</script>
</body>
</html>
