<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
    overflow: hidden;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: relative;
    z-index: 5000;

    height: 48px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 0 12px;

    background: #fff;

    border-bottom: 1px solid #d9dde3;
}

.title {
    flex: 1;

    font-size: 17px;
    font-weight: 700;

    white-space: nowrap;
}

.top-button {
    height: 32px;

    padding: 0 12px;

    border: 1px solid #cfd4da;
    border-radius: 5px;

    background: #fff;

    cursor: pointer;

    font-size: 13px;
}

.top-button:hover {
    background: #f0f2f5;
}

.status {
    font-size: 12px;
    color: #666;

    white-space: nowrap;
}


/* =========================================================
   TABLE WRAPPER
========================================================= */

.table-wrapper {
    position: absolute;

    left: 0;
    right: 0;
    top: 48px;
    bottom: 0;

    overflow: auto;

    background: #fff;

    isolation: isolate;
}


/* =========================================================
   TABLE
========================================================= */

table {
    border-collapse: separate;
    border-spacing: 0;

    table-layout: fixed;

    width: max-content;
    min-width: 100%;
}

th,
td {
    border-right: 1px solid #dfe3e8;
    border-bottom: 1px solid #dfe3e8;

    padding: 0 8px;

    vertical-align: middle;
}


/* =========================================================
   HEADER
========================================================= */

/*
   KHÔNG dùng sticky cho cả THEAD.
   Sticky trực tiếp từng TH sẽ ổn định hơn khi
   vừa freeze cột vừa freeze header.
*/

thead {
    position: relative;
    z-index: 1000;
}


/* =========================================================
   HEADER ROW
========================================================= */

.header-row {
    height: 40px;
}

.header-cell {
    height: 40px;
    min-height: 40px;
    max-height: 40px;

    position: sticky;

    top: 0;

    z-index: 2000;

    background: #f1f3f5;

    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;
}

.header-inner {
    position: relative;

    height: 100%;

    display: flex;
    align-items: center;

    gap: 4px;
}

.header-title {
    flex: 1;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    cursor: pointer;
}


/* =========================================================
   FILTER BUTTON
========================================================= */

.filter-button {
    width: 24px;
    height: 24px;

    flex: 0 0 24px;

    border: 0;

    background: transparent;

    cursor: pointer;

    border-radius: 4px;

    font-size: 13px;
}

.filter-button:hover {
    background: #dfe4ea;
}


/* =========================================================
   SEARCH ROW
========================================================= */

.search-row {
    height: 38px;
}

.search-cell {
    height: 38px;
    min-height: 38px;
    max-height: 38px;

    position: sticky;

    top: 40px;

    z-index: 1900;

    background: #fafafa;

    padding: 4px;
}

.search-input {
    display: block;

    width: 100%;
    height: 29px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    padding: 0 7px;

    outline: none;

    font-size: 12px;

    background: #fff;
}

.search-input:focus {
    border-color: #2684ff;

    box-shadow:
        0 0 0 1px #2684ff;
}


/* =========================================================
   BODY
========================================================= */

.body-cell {
    position: relative;

    min-height: 34px;

    height: auto;

    background: #fff;

    font-size: 14px;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    word-break: break-word;
}

tbody tr:hover td {
    background: #f8fafc;
}


/* =========================================================
   HEADER COLORS
========================================================= */

.header-cell.filtered {
    background: #c8f7c5;
}

.header-cell.sorted {
    background: #d8ebff;
}

.header-cell.filtered.sorted {
    background: #bdecc4;
}


/* =========================================================
   FREEZE COLUMNS
========================================================= */

/*
   BODY FROZEN
*/

tbody td.frozen-column {
    position: sticky !important;

    z-index: 100 !important;

    background: #fff;
}


/*
   HEADER FROZEN

   QUAN TRỌNG:
   z-index cao hơn body rất nhiều.
*/

thead th.header-cell.frozen-column {
    position: sticky !important;

    top: 0 !important;

    z-index: 2000 !important;
}


/*
   SEARCH FROZEN
*/

thead th.search-cell.frozen-column {
    position: sticky !important;

    top: 40px !important;

    z-index: 1900 !important;
}


/*
   Frozen header màu active
*/

thead th.header-cell.frozen-column.filtered {
    background: #c8f7c5 !important;
}

thead th.header-cell.frozen-column.sorted {
    background: #d8ebff !important;
}

thead th.header-cell.frozen-column.filtered.sorted {
    background: #bdecc4 !important;
}


/*
   Frozen last column shadow
*/

.frozen-last {
    box-shadow:
        5px 0 8px rgba(0,0,0,.12);
}


/* =========================================================
   RESIZE
========================================================= */

.resize-handle {
    position: absolute;

    top: 0;
    right: -3px;

    width: 7px;
    height: 100%;

    cursor: col-resize;

    z-index: 3000;
}

.resize-handle:hover {
    background: rgba(38,132,255,.25);
}


/* =========================================================
   FILTER MENU
========================================================= */

.filter-menu {
    position: fixed;

    width: 330px;

    max-height: 720px;

    display: flex;
    flex-direction: column;

    background: #fff;

    border: 1px solid #cfd4da;
    border-radius: 7px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);

    z-index: 10000;

    overflow: hidden;
}

.filter-header {
    padding: 9px 10px;

    background: #f6f7f9;

    border-bottom: 1px solid #e0e3e7;

    font-size: 13px;
    font-weight: 700;
}

.filter-search {
    padding: 8px;

    border-bottom: 1px solid #e0e3e7;
}

.filter-search input {
    width: 100%;
    height: 30px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    padding: 0 8px;

    outline: none;

    font-size: 12px;
}

.filter-actions {
    display: flex;

    gap: 5px;

    padding: 7px 8px;

    border-bottom: 1px solid #e0e3e7;
}

.filter-actions button,
.sort-actions button,
.format-actions button {
    height: 28px;

    padding: 0 8px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    background: #fff;

    cursor: pointer;

    font-size: 12px;
}

.filter-actions button:hover,
.sort-actions button:hover,
.format-actions button:hover {
    background: #f1f3f5;
}


/* =========================================================
   VALUE LIST
========================================================= */

.value-list {
    max-height: 260px;

    min-height: 80px;

    overflow-y: auto;

    padding: 4px 0;

    border-bottom: 1px solid #e0e3e7;
}

.value-item {
    min-height: 30px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 3px 9px;

    cursor: pointer;

    font-size: 12px;
}

.value-item:hover {
    background: #f3f5f7;
}

.value-item input {
    flex: 0 0 auto;
}

.value-text {
    flex: 1;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}


/* =========================================================
   SORT
========================================================= */

.sort-section {
    padding: 8px;

    border-bottom: 1px solid #e0e3e7;
}

.sort-title {
    margin-bottom: 6px;

    font-size: 12px;
    font-weight: 700;
}

.sort-row {
    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 6px;
}

.sort-row button {
    height: 28px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    background: #fff;

    cursor: pointer;

    font-size: 12px;
}

.priority-input {
    width: 70px;
    height: 28px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    padding: 0 6px;
}

.sort-actions {
    display: flex;

    gap: 5px;
}


/* =========================================================
   FORMAT
========================================================= */

.format-section {
    border-bottom: 1px solid #e0e3e7;
}

.format-summary {
    padding: 8px;

    cursor: pointer;

    background: #f8f9fa;

    font-size: 12px;
    font-weight: 700;
}

.format-panel {
    padding: 8px;
}

.format-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;
}

.format-field {
    display: flex;
    flex-direction: column;

    gap: 3px;

    font-size: 11px;
}

.format-field select,
.format-field input[type="number"] {
    width: 100%;
    height: 28px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    background: #fff;

    padding: 0 5px;

    font-size: 12px;
}

.color-row {
    display: flex;
    align-items: center;

    gap: 6px;
}

.color-row input[type="color"] {
    width: 42px;
    height: 28px;

    padding: 1px;

    border: 1px solid #cfd4da;
}

.check-row {
    display: flex;

    gap: 12px;

    align-items: center;

    margin-top: 7px;

    font-size: 12px;
}

.format-actions {
    display: flex;

    gap: 5px;

    margin-top: 8px;
}

.format-apply {
    background: #e8f3ff !important;

    border-color: #9fc8f5 !important;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-row {
    padding: 30px;

    text-align: center;

    color: #777;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-overlay {
    position: fixed;

    inset: 0;

    display: none;

    background: rgba(0,0,0,.25);

    z-index: 20000;
}

.settings-panel {
    position: absolute;

    top: 55px;
    right: 15px;

    width: 390px;

    max-height: calc(100vh - 75px);

    overflow-y: auto;

    padding: 12px;

    background: #fff;

    border: 1px solid #cfd4da;
    border-radius: 8px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}

.settings-title {
    margin-bottom: 12px;

    font-weight: 700;
}

.close-settings {
    float: right;

    border: 0;

    background: transparent;

    cursor: pointer;

    font-size: 18px;
}

.setting-group {
    margin-bottom: 15px;

    padding-bottom: 12px;

    border-bottom: 1px solid #e4e6e9;
}

.setting-label {
    display: block;

    margin-bottom: 6px;

    font-size: 12px;
    font-weight: 700;
}

.setting-input,
.freeze-input {
    width: 100%;
    height: 32px;

    border: 1px solid #cfd4da;
    border-radius: 4px;

    padding: 0 7px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    position: fixed;

    inset: 48px 0 0 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,.72);

    z-index: 15000;

    font-size: 14px;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-thumb {
    background: #c6cbd1;

    border-radius: 8px;
}

::-webkit-scrollbar-track {
    background: #f2f3f5;
}

</style>
</head>


<body>

            >

<script>


/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
"report_google_sheet_table_v11";


const OLD_STORAGE_KEYS = [
    "report_google_sheet_table_v10",
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS =
new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SORT MAP
========================================================= */

const SORT_BY_MAP = {

    "DATA":
        "Sort_DATA",

    "Thoại nội mạng":
        "Sort_NM",

    "Thoại ngoại mạng":
        "Sort_NgM"

};


/* =========================================================
   STATE
========================================================= */

let headers = [];

let rows = [];

let filters = {};

let searches = {};

let sortPriorities = {};

let sortDirections = {};

let columnWidths = {};

let columnFormats = {};

let renamedHeaders = {};

let freezeCount = 0;


/* =========================================================
   FILTER MENU
========================================================= */

let openFilterIndex = null;

let filterMenuElement = null;


/* =========================================================
   RESIZE
========================================================= */

let resizing = null;


/* =========================================================
   SEARCH TIMERS
========================================================= */

const searchTimers = {};


/* =========================================================
   DEFAULT FORMAT
========================================================= */

const DEFAULT_FORMAT = {

    align: "left",

    fontFamily: "Arial",

    fontSize: 14,

    bold: false,

    italic: false,

    wrap: true,

    color: "#222222",

    background: "#ffffff"

};


/* =========================================================
   DOM
========================================================= */

const tableHead =
document.getElementById(
    "tableHead"
);

const tableBody =
document.getElementById(
    "tableBody"
);

const statusEl =
document.getElementById(
    "status"
);

const loadingEl =
document.getElementById(
    "loading"
);

const settingsOverlay =
document.getElementById(
    "settingsOverlay"
);


/* =========================================================
   LOAD STATE
========================================================= */

function loadState() {

    let raw =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (!raw) {

        for (
            const key
            of OLD_STORAGE_KEYS
        ) {

            raw =
                localStorage.getItem(
                    key
                );

            if (raw) break;

        }

    }

    if (!raw) return;


    try {

        const state =
            JSON.parse(raw);

        filters =
            state.filters || {};

        searches =
            state.searches || {};

        sortPriorities =
            state.sortPriorities || {};

        sortDirections =
            state.sortDirections || {};

        columnWidths =
            state.columnWidths || {};

        columnFormats =
            state.columnFormats || {};

        renamedHeaders =
            state.renamedHeaders || {};

        freezeCount =
            Number(
                state.freezeCount || 0
            );

    }
    catch (error) {

        console.error(
            "Storage error:",
            error
        );

    }

}


/* =========================================================
   SAVE STATE
========================================================= */

function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({

            filters,

            searches,

            sortPriorities,

            sortDirections,

            columnWidths,

            columnFormats,

            renamedHeaders,

            freezeCount

        })
    );

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const result = [];

    let row = [];

    let cell = "";

    let inQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const c =
            text[i];

        const next =
            text[i + 1];


        if (c === '"') {

            if (
                inQuotes &&
                next === '"'
            ) {

                cell += '"';

                i++;

            }
            else {

                inQuotes =
                    !inQuotes;

            }

        }

        else if (
            c === "," &&
            !inQuotes
        ) {

            row.push(cell);

            cell = "";

        }

        else if (
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !inQuotes
        ) {

            if (
                c === "\r" &&
                next === "\n"
            ) {

                i++;

            }

            row.push(cell);

            cell = "";

            if (
                row.length > 1 ||
                row[0] !== ""
            ) {

                result.push(row);

            }

            row = [];

        }

        else {

            cell += c;

        }

    }


    if (
        cell.length > 0 ||
        row.length > 0
    ) {

        row.push(cell);

        result.push(row);

    }


    return result;

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value);

}


/* =========================================================
   DATE
========================================================= */

function parseVietnameseDate(value) {

    const s =
        normalizeValue(value)
            .trim();

    const m =
        s.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (!m) return null;


    const d =
        new Date(
            Number(m[3]),
            Number(m[2]) - 1,
            Number(m[1])
        );


    if (
        d.getFullYear() !==
        Number(m[3])
    ) {

        return null;

    }


    return d;

}


function displayRelativeMonth(value) {

    const d =
        parseVietnameseDate(
            value
        );

    if (!d) {

        return normalizeValue(
            value
        );

    }


    const now =
        new Date();


    const months =
        (
            now.getFullYear() -
            d.getFullYear()
        ) * 12
        +
        (
            now.getMonth() -
            d.getMonth()
        );


    const n =
        Math.max(
            0,
            months
        );


    if (n === 0) {

        return "0 tháng";

    }


    return (
        String(n)
            .padStart(2, "0")
        +
        " tháng"
    );

}


/* =========================================================
   NUMBER
========================================================= */

function parseVNNumber(value) {

    const s =
        normalizeValue(value)
            .trim();

    if (!s) return null;


    if (
        /^-?\d{1,3}(\.\d{3})+(,\d+)?$/
            .test(s)
    ) {

        return Number(
            s
                .replace(/\./g, "")
                .replace(",", ".")
        );

    }


    if (
        /^-?\d+(,\d+)?$/
            .test(s)
    ) {

        return Number(
            s.replace(",", ".")
        );

    }


    if (
        /^-?\d+(\.\d+)?$/
            .test(s)
    ) {

        return Number(s);

    }


    return null;

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function getDisplayValue(
    value,
    header
) {

    if (
        header === "Ngày update"
    ) {

        return displayRelativeMonth(
            value
        );

    }

    return normalizeValue(
        value
    );

}


/* =========================================================
   VISIBLE COLUMNS
========================================================= */

function getVisibleHeaderIndices() {

    return headers
        .map(
            (header, index) =>
                HIDDEN_COLUMNS.has(
                    header
                )
                    ? null
                    : index
        )
        .filter(
            index =>
                index !== null
        );

}


/* =========================================================
   HEADER NAME
========================================================= */

function getHeaderName(index) {

    return (
        renamedHeaders[index] ||
        headers[index] ||
        ""
    );

}


/* =========================================================
   FORMAT
========================================================= */

function getColumnFormat(index) {

    return {

        ...DEFAULT_FORMAT,

        ...(columnFormats[index] || {})

    };

}


function applyFormatToCell(
    cell,
    index
) {

    const f =
        getColumnFormat(
            index
        );


    cell.style.textAlign =
        f.align;

    cell.style.fontFamily =
        f.fontFamily;

    cell.style.fontSize =
        `${f.fontSize}px`;

    cell.style.fontWeight =
        f.bold
            ? "700"
            : "400";

    cell.style.fontStyle =
        f.italic
            ? "italic"
            : "normal";

    cell.style.color =
        f.color;

    cell.style.backgroundColor =
        f.background;


    if (f.wrap) {

        cell.style.whiteSpace =
            "pre-wrap";

        cell.style.overflowWrap =
            "anywhere";

        cell.style.wordBreak =
            "break-word";

    }
    else {

        cell.style.whiteSpace =
            "nowrap";

        cell.style.overflowWrap =
            "normal";

        cell.style.wordBreak =
            "normal";

    }

}


/* =========================================================
   SORT INDEX
========================================================= */

function getSortIndex(index) {

    const header =
        headers[index];

    const mapped =
        SORT_BY_MAP[header];


    if (
        mapped &&
        headers.includes(mapped)
    ) {

        return headers.indexOf(
            mapped
        );

    }


    return index;

}


/* =========================================================
   FILTER / SEARCH MATCH
========================================================= */

/*
   ignoreIndex:

   Khi xây dựng filter của cột X,
   bỏ qua filter + search của chính X.
*/

function rowMatchesConditions(
    row,
    ignoreIndex = null
) {


    /* FILTER */

    for (
        const key of Object.keys(
            filters
        )
    ) {

        const index =
            Number(key);


        if (
            index === ignoreIndex
        ) {

            continue;

        }


        const selected =
            filters[index];


        if (
            !Array.isArray(
                selected
            )
        ) {

            continue;

        }


        if (
            selected.length === 0
        ) {

            /*
               Không có giá trị nào được chọn
               = không hiển thị dòng nào.
            */

            return false;

        }


        const value =
            normalizeValue(
                row[index]
            );


        if (
            !selected.includes(
                value
            )
        ) {

            return false;

        }

    }


    /* SEARCH */

    for (
        const key of Object.keys(
            searches
        )
    ) {

        const index =
            Number(key);


        if (
            index === ignoreIndex
        ) {

            continue;

        }


        const search =
            normalizeValue(
                searches[index]
            )
            .trim()
            .toLowerCase();


        if (!search) {

            continue;

        }


        const value =
            normalizeValue(
                row[index]
            )
            .toLowerCase();


        if (
            !value.includes(
                search
            )
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   FILTERED ROWS
========================================================= */

function getFilteredRows() {

    return rows.filter(
        row =>
            rowMatchesConditions(
                row,
                null
            )
    );

}


/* =========================================================
   AVAILABLE FILTER VALUES
========================================================= */

function getAvailableValues(
    index
) {

    const values =
        new Set();


    for (
        const row of rows
    ) {

        if (
            !rowMatchesConditions(
                row,
                index
            )
        ) {

            continue;

        }


        values.add(
            normalizeValue(
                row[index]
            )
        );

    }


    return Array.from(
        values
    );

}


/* =========================================================
   SORT FILTER VALUES
========================================================= */

function sortFilterValues(
    values
) {

    return values.sort(
        (a, b) => {

            const aa =
                normalizeValue(a)
                    .trim();

            const bb =
                normalizeValue(b)
                    .trim();


            if (
                aa === "" &&
                bb !== ""
            ) {

                return -1;

            }


            if (
                aa !== "" &&
                bb === ""
            ) {

                return 1;

            }


            const na =
                parseVNNumber(aa);

            const nb =
                parseVNNumber(bb);


            if (
                na !== null &&
                nb !== null
            ) {

                return na - nb;

            }


            return aa.localeCompare(
                bb,
                "vi",
                {
                    numeric: true,
                    sensitivity:
                        "base"
                }
            );

        }
    );

}


/* =========================================================
   ACTIVE STATES
========================================================= */

function hasActiveFilter(index) {

    const selected =
        filters[index];


    if (
        !Array.isArray(
            selected
        )
    ) {

        return false;

    }


    if (
        selected.length === 0
    ) {

        return true;

    }


    const available =
        getAvailableValues(
            index
        );


    if (
        selected.length !==
        available.length
    ) {

        return true;

    }


    const set =
        new Set(
            selected
        );


    return available.some(
        value =>
            !set.has(value)
    );

}


function hasActiveSearch(index) {

    return Boolean(
        normalizeValue(
            searches[index]
        )
        .trim()
    );

}


function hasActiveSort(index) {

    return (
        sortPriorities[index] !==
        undefined
    );

}


/* =========================================================
   UPDATE HEADER STATES
========================================================= */

/*
   QUAN TRỌNG:

   Hàm này chỉ thay class.

   KHÔNG dựng lại header.

   Vì vậy search input không mất focus.
*/

function updateHeaderStates() {

    document
        .querySelectorAll(
            "thead .header-cell"
        )
        .forEach(
            th => {

                const index =
                    Number(
                        th.dataset.column
                    );


                th.classList.toggle(
                    "filtered",
                    hasActiveFilter(index) ||
                    hasActiveSearch(index)
                );


                th.classList.toggle(
                    "sorted",
                    hasActiveSort(index)
                );

            }
        );

}


/* =========================================================
   DEFAULT FILTERS
========================================================= */

function initializeDefaultFilters() {

    const dateIndex =
        headers.indexOf(
            "Ngày update"
        );


    if (
        dateIndex >= 0 &&
        filters[dateIndex] ===
            undefined
    ) {

        filters[dateIndex] =
            Array.from(
                new Set(
                    rows
                        .map(
                            row =>
                                normalizeValue(
                                    row[
                                        dateIndex
                                    ]
                                )
                        )
                        .filter(
                            value =>
                                value !== ""
                        )
                )
            );

    }


    const stopIndex =
        headers.indexOf(
            "Dừng gói"
        );


    if (
        stopIndex >= 0 &&
        filters[stopIndex] ===
            undefined
    ) {

        filters[stopIndex] = [
            ""
        ];

    }

}


/* =========================================================
   SORT ROWS
========================================================= */

function applySort(sourceRows) {

    const priorities =
        Object.entries(
            sortPriorities
        )
        .map(
            ([index, priority]) => ({

                index:
                    Number(index),

                priority:
                    Number(priority),

                direction:
                    sortDirections[index] ||
                    "asc"

            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.priority
                )
        );


    if (
        priorities.length === 0
    ) {

        return sourceRows;

    }


    priorities.sort(
        (a, b) => {

            if (
                a.priority !==
                b.priority
            ) {

                return (
                    a.priority -
                    b.priority
                );

            }


            return (
                a.index -
                b.index
            );

        }
    );


    return [
        ...sourceRows
    ].sort(
        (a, b) => {

            for (
                const item
                of priorities
            ) {

                const actualIndex =
                    getSortIndex(
                        item.index
                    );


                const va =
                    normalizeValue(
                        a[
                            actualIndex
                        ]
                    );


                const vb =
                    normalizeValue(
                        b[
                            actualIndex
                        ]
                    );


                const na =
                    parseVNNumber(
                        va
                    );

                const nb =
                    parseVNNumber(
                        vb
                    );


                let compare;


                if (
                    na !== null &&
                    nb !== null
                ) {

                    compare =
                        na - nb;

                }
                else {

                    compare =
                        va.localeCompare(
                            vb,
                            "vi",
                            {
                                numeric: true,
                                sensitivity:
                                    "base"
                            }
                        );

                }


                if (
                    item.direction ===
                    "desc"
                ) {

                    compare =
                        -compare;

                }


                if (
                    compare !== 0
                ) {

                    return compare;

                }

            }


            return 0;

        }
    );

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader() {

            }

                );

            }


            const inner =
                document.createElement(
                    "div"
                );

            inner.className =
                "header-inner";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "header-title";

            title.textContent =
                getHeaderName(
                    index
                );


            title.addEventListener(
                "dblclick",
                () => {

                    renameColumn(
                        index
                    );

                }
            );


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "filter-button";

            button.type =
                "button";

            button.textContent =
                "▼";


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openFilterMenu(
                        index,
                        button
                    );

                }
            );


            const resize =
                document.createElement(
                    "div"
                );

            resize.className =

            resize.addEventListener(

                event => {

                    startResize(

                    );

                }
            );


            inner.appendChild(

            );

            inner.appendChild(
                button
            );

            inner.appendChild(

            );


            th.appendChild(
                inner
            );


            applyFormatToCell(
                th,
                index
            );


            headerRow.appendChild(
                th
            );

        }
    );


    /* SEARCH */

    const searchRow =
        document.createElement(
            "tr"
        );

    searchRow.className =
        "search-row";


    visible.forEach(
        index => {

            const th =
                document.createElement(
                    "th"
                );

            th.className =
                "search-cell";

            th.dataset.column =
                index;


            const input =
                document.createElement(
                    "input"
                );

            input.className =
                "search-input";

            input.type =
                "text";

            input.placeholder =
                "Tìm kiếm...";

            input.value =
                searches[index] ||
                "";


            /*
               QUAN TRỌNG:

               Không gọi renderTable()
               ở đây.

               Chỉ render BODY.
            */

            input.addEventListener(
                "input",
                event => {

                    searches[index] =
                        event.target.value;


                    clearTimeout(
                        searchTimers[index]
                    );


                    searchTimers[index] =
                        setTimeout(
                            () => {

                                saveState();

                                /*
                                   Chỉ body.
                                   Không rebuild input.
                                */

                                renderBody();

                                updateHeaderStates();

                                applyFreezeColumns();

                                /*
                                   Cập nhật filter menu
                                   của các cột khác.
                                */

                                refreshOpenFilterMenu();

                            },
                            120
                        );

                }
            );


            /*
               Không cho click input
               truyền ra ngoài.
            */

            input.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                }
            );


            input.addEventListener(
                "mousedown",
                event => {

                    event.stopPropagation();

                }
            );


            th.appendChild(
                input
            );


            applyFormatToCell(
                th,
                index
            );


            searchRow.appendChild(
                th
            );

        }
    );


    tableHead.appendChild(
        headerRow
    );

    tableHead.appendChild(
        searchRow
    );

}


/* =========================================================
   RENDER BODY
========================================================= */

function renderBody() {

    tableBody.innerHTML = "";


    const visible =
        getVisibleHeaderIndices();


    let data =
        getFilteredRows();


    data =
        applySort(
            data
        );


    if (
        data.length === 0
    ) {

        const tr =
            document.createElement(
                "tr"
            );


        const td =
            document.createElement(
                "td"
            );


        td.className =
            "empty-row";


        td.colSpan =
            visible.length;


        td.textContent =
            "Không có dữ liệu phù hợp";


        tr.appendChild(
            td
        );


        tableBody.appendChild(
            tr
        );


        return;

    }


    data.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            visible.forEach(
                index => {

                    const td =
                        document.createElement(
                            "td"
                        );


                    td.className =
                        "body-cell";


                    td.dataset.column =
                        index;


                    const width =
                        Number(
                            columnWidths[index] ||
                            150
                        );


                    td.style.width =
                        `${width}px`;

                    td.style.minWidth =
                        `${width}px`;

                    td.style.maxWidth =
                        `${width}px`;


                    td.textContent =
                        getDisplayValue(
                            row[index],
                            headers[index]
                        );


                    applyFormatToCell(
                        td,
                        index
                    );


                    tr.appendChild(
                        td
                    );

                }
            );


            tableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    renderHeader();

    renderBody();

    requestAnimationFrame(
        () => {

            applyFreezeColumns();

        }
    );

}


/* =========================================================
   APPLY FREEZE
========================================================= */

function applyFreezeColumns() {

    /*
       Xóa cũ
    */

    document
        .querySelectorAll(
            ".frozen-column"
        )
        .forEach(
            cell => {

                cell.classList.remove(
                    "frozen-column"
                );

                cell.classList.remove(
                    "frozen-last"
                );

                cell.style.left = "";

            }
        );


    const visible =
        getVisibleHeaderIndices();


    const count =
        Math.min(
            Math.max(
                0,
                Number(freezeCount)
            ),
            visible.length
        );


    const frozen =
        visible.slice(
            0,
            count
        );


    let left = 0;


    frozen.forEach(
        (index, position) => {

            const width =
                Number(
                    columnWidths[index] ||
                    150
                );


            const cells =
                document.querySelectorAll(
                    `[data-column="${index}"]`
                );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );


                    cell.style.left =
                        `${left}px`;


                    /*
                       Body thấp
                    */

                    if (
                        cell.classList.contains(
                            "body-cell"
                        )
                    ) {

                        cell.style.zIndex =
                            "100";

                    }


                    /*
                       Header cao nhất
                    */

                    if (
                        cell.classList.contains(
                            "header-cell"
                        )
                    ) {

                        cell.style.zIndex =
                            "2000";

                        cell.style.top =
                            "0px";

                    }


                    /*
                       Search cao
                    */

                    if (
                        cell.classList.contains(
                            "search-cell"
                        )
                    ) {

                        cell.style.zIndex =
                            "1900";

                        cell.style.top =
                            "40px";

                    }

                }
            );


            if (
                position ===
                frozen.length - 1
            ) {

                cells.forEach(
                    cell => {

                        cell.classList.add(
                            "frozen-last"
                        );

                    }
                );

            }


            left += width;

        }
    );

}


/* =========================================================
   REFRESH OPEN FILTER MENU
========================================================= */

function refreshOpenFilterMenu() {

    if (
        openFilterIndex === null
    ) {

        return;

    }


    const index =
        openFilterIndex;


    const button =
        document.querySelector(
            `[data-column="${index}"] .filter-button`
        );


    if (!button) {

        return;

    }


    /*
       Không refresh nếu người dùng
       đang thao tác trong menu.

       Menu sẽ được cập nhật khi
       thay đổi filter bằng checkbox.
    */

}


/* =========================================================
   OPEN FILTER MENU
========================================================= */

function openFilterMenu(
    index,
    button
) {

    closeFilterMenu();


    openFilterIndex =
        index;


    const menu =
        document.createElement(
            "div"
        );


    menu.className =
        "filter-menu";


    filterMenuElement =
        menu;


    /* HEADER */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "filter-header";

    header.textContent =
        getHeaderName(
            index
        );


    menu.appendChild(
        header
    );


    /* SEARCH VALUES */

    const searchBox =
        document.createElement(
            "div"
        );

    searchBox.className =
        "filter-search";


    const valueSearch =
        document.createElement(
            "input"
        );

    valueSearch.type =
        "text";

    valueSearch.placeholder =
        "Tìm trong danh sách giá trị...";


    valueSearch.addEventListener(
        "click",
        e => e.stopPropagation()
    );


    searchBox.appendChild(
        valueSearch
    );

    menu.appendChild(
        searchBox
    );


    /* ACTIONS */

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "filter-actions";


    const selectAll =
        document.createElement(
            "button"
        );

    selectAll.textContent =
        "Chọn tất cả";


    const clearAll =
        document.createElement(
            "button"
        );

    clearAll.textContent =
        "Bỏ chọn";


    actions.appendChild(
        selectAll
    );

    actions.appendChild(
        clearAll
    );


    menu.appendChild(
        actions
    );


    /* VALUES */

    const valueList =
        document.createElement(
            "div"
        );

    valueList.className =
        "value-list";


    const allAvailable =
        sortFilterValues(
            getAvailableValues(
                index
            )
        );


    let selected =
        Array.isArray(
            filters[index]
        )
            ? new Set(
                filters[index]
            )
            : new Set(
                allAvailable
            );


    function renderValues(
        keyword = ""
    ) {

        valueList.innerHTML = "";


        const key =
            normalizeValue(
                keyword
            )
            .toLowerCase();


        const values =
            allAvailable.filter(
                value => {

                    if (!key) {

                        return true;

                    }


                    return normalizeValue(
                        value
                    )
                    .toLowerCase()
                    .includes(key);

                }
            );


        values.forEach(
            value => {

                const label =
                    document.createElement(
                        "label"
                    );


                label.className =
                    "value-item";


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.checked =
                    selected.has(
                        value
                    );


                checkbox.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                    }
                );


                checkbox.addEventListener(
                    "change",
                    event => {

                        event.stopPropagation();


                        if (
                            checkbox.checked
                        ) {

                            selected.add(
                                value
                            );

                        }
                        else {

                            selected.delete(
                                value
                            );

                        }


                        /*
                           FILTER NGAY LẬP TỨC
                        */

                        filters[index] =
                            Array.from(
                                selected
                            );


                        saveState();


                        /*
                           Chỉ render body,
                           KHÔNG render header.

                           Vì vậy menu không biến mất.
                        */

                        renderBody();

                        updateHeaderStates();

                        applyFreezeColumns();


                        /*
                           Các filter khác phải
                           thay đổi danh sách giá trị
                           theo filter mới.

                           Menu hiện tại vẫn giữ.
                        */

                    }
                );


                const span =
                    document.createElement(
                        "span"
                    );


                span.className =
                    "value-text";


                span.textContent =
                    value === ""
                        ? "(Trống)"
                        : value;


                label.appendChild(
                    checkbox
                );

                label.appendChild(
                    span
                );


                valueList.appendChild(
                    label
                );

            }
        );


        if (
            values.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.style.padding =
                "15px";

            empty.style.fontSize =
                "12px";

            empty.style.color =
                "#777";

            empty.textContent =
                "Không có giá trị";


            valueList.appendChild(
                empty
            );

        }

    }


    renderValues();


    selectAll.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            selected =
                new Set(
                    allAvailable
                );


            filters[index] =
                Array.from(
                    selected
                );


            saveState();


            renderBody();

            updateHeaderStates();

            applyFreezeColumns();


            renderValues(
                valueSearch.value
            );

        }
    );


    clearAll.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            selected =
                new Set();


            filters[index] =
                [];


            saveState();


            renderBody();

            updateHeaderStates();

            applyFreezeColumns();


            renderValues(
                valueSearch.value
            );

        }
    );


    valueSearch.addEventListener(
        "input",
        event => {

            event.stopPropagation();


            renderValues(
                event.target.value
            );

        }
    );


    menu.appendChild(
        valueList
    );


    /* =====================================================
       SORT
    ===================================================== */

    const sortSection =
        document.createElement(
            "div"
        );

    sortSection.className =
        "sort-section";


    const sortTitle =
        document.createElement(
            "div"
        );

    sortTitle.className =
        "sort-title";

    sortTitle.textContent =
        "Sắp xếp";


    const sortRow =
        document.createElement(
            "div"
        );

    sortRow.className =
        "sort-row";


    const asc =
        document.createElement(
            "button"
        );

    asc.textContent =
        "A → Z";


    const desc =
        document.createElement(
            "button"
        );

    desc.textContent =
        "Z → A";


    const priority =
        document.createElement(
            "input"
        );

    priority.className =
        "priority-input";

    priority.type =
        "number";

    priority.step =
        "1";

    priority.placeholder =
        "Ưu tiên";

    priority.value =
        sortPriorities[index] ??
        "";


    sortRow.appendChild(
        asc
    );

    sortRow.appendChild(
        desc
    );

    sortRow.appendChild(
        priority
    );


    asc.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            sortPriorities[index] =
                Number(
                    priority.value ||
                    1
                );


            sortDirections[index] =
                "asc";


            saveState();


            renderBody();

            updateHeaderStates();

            applyFreezeColumns();

        }
    );


    desc.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            sortPriorities[index] =
                Number(
                    priority.value ||
                    1
                );


            sortDirections[index] =
                "desc";


            saveState();


            renderBody();

            updateHeaderStates();

            applyFreezeColumns();

        }
    );


    const clearSort =
        document.createElement(
            "button"
        );

    clearSort.textContent =
        "Xóa sort";


    clearSort.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            delete sortPriorities[
                index
            ];

/* =========================================================
   FILTER MENU POSITION
========================================================= */

function positionFilterMenu(
    menu,
    button
) {

    const rect =
        button.getBoundingClientRect();


    const width =
        330;


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if (
        left + width >
        window.innerWidth - 10
    ) {

        left =
            window.innerWidth -
            width -
            10;

    }


    if (
        left < 10
    ) {

        left = 10;

    }


    const height =
        Math.min(
            menu.scrollHeight,
            720
        );


    if (
        top + height >
        window.innerHeight - 10
    ) {

        top =
            rect.top -
            height -
            5;

    }


    if (
        top < 55
    ) {

        top = 55;

    }


    menu.style.left =
        `${left}px`;

    menu.style.top =
        `${top}px`;

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterMenu() {

    if (
        filterMenuElement
    ) {

        filterMenuElement.remove();

    }


    filterMenuElement =
        null;

    openFilterIndex =
        null;


    document.removeEventListener(
        "mousedown",
        outsideFilterHandler
    );

}


/* =========================================================
   OUTSIDE CLICK
========================================================= */

function outsideFilterHandler(
    event
) {

    if (
        filterMenuElement &&
        !filterMenuElement.contains(
            event.target
        )
    ) {

        closeFilterMenu();

    }

}


/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    index
) {

    event.preventDefault();

    event.stopPropagation();


    resizing = {

        index,

        startX:
            event.clientX,

        startWidth:
            Number(
                columnWidths[index] ||
                150
            )

    };


    document.body.style.cursor =
        "col-resize";


    document.addEventListener(
        "mousemove",
        resizeMove
    );


    document.addEventListener(
        "mouseup",
        resizeEnd
    );

}


function resizeMove(event) {

    if (!resizing) return;


    const delta =
        event.clientX -
        resizing.startX;


    let width =
        resizing.startWidth +
        delta;


    width =
        Math.max(
            30,
            width
        );


    columnWidths[
        resizing.index
    ] =
        Math.round(width);


    document
        .querySelectorAll(
            `[data-column="${resizing.index}"]`
        )
        .forEach(
            cell => {

                cell.style.width =
                    `${width}px`;

                cell.style.minWidth =
                    `${width}px`;

                cell.style.maxWidth =
                    `${width}px`;

            }
        );


    applyFreezeColumns();

}


function resizeEnd() {

    if (!resizing) return;


    resizing = null;


    document.body.style.cursor =
        "";


    document.removeEventListener(
        "mousemove",
        resizeMove
    );


    document.removeEventListener(
        "mouseup",
        resizeEnd
    );


    saveState();


    applyFreezeColumns();

}


/* =========================================================
   RENAME
========================================================= */

function renameColumn(index) {

    const current =
        getHeaderName(
            index
        );


    const value =
        prompt(
            "Tên mới của cột:",
            current
        );


    if (
        value === null
    ) {

        return;

    }


    const name =
        value.trim();


    if (
        !name ||
        name === headers[index]
    ) {

        delete renamedHeaders[
            index
        ];

    }
    else {

        renamedHeaders[index] =
            name;

    }


    saveState();


    renderHeader();

    renderBody();

    applyFreezeColumns();

    buildRenameSettings();

}


/* =========================================================
   RENAME SETTINGS
========================================================= */

function buildRenameSettings() {

    const container =
        document.getElementById(
            "renameContainer"
        );


    container.innerHTML = "";


    getVisibleHeaderIndices()
        .forEach(
            index => {

                const input =
                    document.createElement(
                        "input"
                    );


                input.className =
                    "setting-input";


                input.style.marginBottom =
                    "5px";


                input.value =
                    getHeaderName(
                        index
                    );


                input.addEventListener(
                    "change",
                    () => {

                        const value =
                            input.value.trim();


                        if (
                            !value ||
                            value ===
                                headers[index]
                        ) {

                            delete renamedHeaders[
                                index
                            ];

                        }
                        else {

                            renamedHeaders[
                                index
                            ] =
                                value;

                        }


                        saveState();


                        renderHeader();

                        renderBody();

                        applyFreezeColumns();

                    }
                );


                container.appendChild(
                    input
                );

            }
        );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    loadingEl.style.display =
        "flex";


    statusEl.textContent =
        "Đang tải dữ liệu...";


    try {

        const response =
            await fetch(
                SHEET_URL +
                "&_=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const parsed =
            parseCSV(
                text
            );


        if (
            parsed.length === 0
        ) {

            throw new Error(
                "Google Sheet không có dữ liệu"
            );

        }


        headers =
            parsed[0].map(
                value =>
                    normalizeValue(
                        value
                    ).trim()
            );


        rows =
            parsed
                .slice(1)
                .map(
                    row => {

                        const result =
                            new Array(
                                headers.length
                            )
                            .fill("");


                        for (
                            let i = 0;
                            i < headers.length;
                            i++
                        ) {

                            result[i] =
                                normalizeValue(
                                    row[i]
                                );

                        }


                        return result;

                    }
                )
                .filter(
                    row =>
                        row.some(
                            value =>
                                value !== ""
                        )
                );


        initializeDefaultFilters();


        saveState();


        renderTable();


        buildRenameSettings();


        statusEl.textContent =
            `${rows.length.toLocaleString("vi-VN")} dòng • cập nhật ${new Date().toLocaleTimeString("vi-VN")}`;

    }
    catch (error) {

        console.error(
            error
        );


        statusEl.textContent =
            "Lỗi tải dữ liệu";


        tableBody.innerHTML = "";


        const tr =
            document.createElement(
                "tr"
            );


        const td =
            document.createElement(
                "td"
            );


        td.className =
            "empty-row";


        td.colSpan =
            Math.max(
                1,
                getVisibleHeaderIndices()
                    .length
            );


        td.textContent =
            "Không thể tải dữ liệu Google Sheet: " +
            error.message;


        tr.appendChild(
            td
        );


        tableBody.appendChild(
            tr
        );

    }
    finally {

        loadingEl.style.display =
            "none";

    }

}


/* =========================================================
   FORMAT HELPERS
========================================================= */

function createSelectField(
    labelText,
    options,
    value
) {

    const wrapper =
        document.createElement(
            "label"
        );

    wrapper.className =
        "format-field";


    const label =
        document.createElement(
            "span"
        );

    label.textContent =
        labelText;


    const select =
        document.createElement(
            "select"
        );


    options.forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                item[0];

            option.textContent =
                item[1];


            if (
                String(item[0]) ===
                String(value)
            ) {

                option.selected =
                    true;

            }


            select.appendChild(
                option
            );

        }
    );


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        select
    );


    return {

        wrapper,

        select

    };

}


function createNumberField(
    labelText,
    value,
    min,
    max
) {

    const wrapper =
        document.createElement(
            "label"
        );

    wrapper.className =
        "format-field";


    const label =
        document.createElement(
            "span"
        );

    label.textContent =
        labelText;


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "number";

    input.min =
        min;

    input.max =
        max;

    input.value =
        value;


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        input
    );


    return {

        wrapper,

        input

    };

}


function createColorField(
    labelText,
    value
) {

    const wrapper =
        document.createElement(
            "label"
        );

    wrapper.className =
        "format-field";


    const label =
        document.createElement(
            "span"
        );

    label.textContent =
        labelText;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "color-row";


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "color";


    input.value =
        /^#[0-9a-fA-F]{6}$/
            .test(value)
            ? value
            : "#ffffff";


    row.appendChild(
        input
    );


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        row
    );


    return {

        wrapper,

        input

    };

}

    }

/* =========================================================
   FREEZE INPUT
========================================================= */

document
    .getElementById(
        "freezeInput"
    )
    .addEventListener(
        "change",
        event => {

            let value =
                Number(
                    event.target.value
                );


            if (
                !Number.isFinite(
                    value
                )
            ) {

                value = 0;

            }


            value =
                Math.max(
                    0,
                    Math.floor(
                        value
                    )
                );


            value =
                Math.min(
                    value,
                    getVisibleHeaderIndices()
                        .length
                );


            freezeCount =
                value;


            event.target.value =
                value;


            saveState();


            renderTable();

        }
    );

            columnWidths = {};
