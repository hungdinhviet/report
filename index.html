<title>Report</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#222;
}

body{
    overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:52px;
    background:#ffffff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    position:relative;
    z-index:1000;
}

.title{
    font-size:18px;
    font-weight:700;
    margin-right:10px;
}

button{
    border:1px solid #ccc;
    background:#fff;
    border-radius:5px;
    padding:7px 12px;
    cursor:pointer;
    font-size:13px;
}

button:hover{
    background:#f1f3f5;
}

button.primary{
    background:#1677ff;
    color:#fff;
    border-color:#1677ff;
}

button.primary:hover{
    background:#0d65df;
}

.status{
    margin-left:auto;
    font-size:12px;
    color:#666;
}

/* =========================
   TABLE AREA
========================= */

.table-container{
    position:absolute;
    top:52px;
    left:0;
    right:0;
    bottom:0;
    overflow:auto;
    background:#fff;
}

/* =========================
   TABLE
========================= */

table{
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
    width:max-content;
    min-width:100%;
}

thead{
    position:sticky;
    top:0;
    z-index:500;
}

thead th{

    background:#f8f9fa;

}

.header-main{

    display:flex;

    gap:4px;
    padding:0 7px;

    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
}

.header-title{
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
}

.header-arrow{
    font-size:11px;
    color:#777;
    flex-shrink:0;
}

.header-sort{

    color:#1677ff;
    font-weight:bold;
    flex-shrink:0;
}

.header-sort.asc{
    color:#1677ff;
}

.header-sort.desc{
    color:#e67e22;
}

/* cột đang filter/search */

th.active-filter .header-main{
    background:#dff5df;
    color:#087f23;
}

/* cột đang sort */

th.active-sort .header-main{
    background:#e7f0ff;
}

/* cột vừa filter vừa sort */

th.active-filter.active-sort .header-main{
    background:#d8f2df;
    color:#087f23;
}

/* =========================
   SEARCH
========================= */

.search-row{
    height:36px;
    background:#fff;
}

.search-cell{
    padding:4px;
    border-top:1px solid #ddd;
    border-right:1px solid #ddd;
    background:#fff;
}

.search-input{
    width:100%;
    height:27px;
    border:1px solid #ccc;
    border-radius:4px;
    padding:4px 7px;
    outline:none;
    font-size:12px;
}

.search-input:focus{
    border-color:#1677ff;
    box-shadow:0 0 0 2px rgba(22,119,255,.1);
}

/* =========================
   BODY
========================= */

tbody td{
    border-right:1px solid #e1e1e1;
    border-bottom:1px solid #e1e1e1;
    padding:7px 8px;
    font-size:14px;
    vertical-align:middle;
    background:#fff;
    overflow-wrap:anywhere;
    word-break:break-word;
}

/* zebra */

tbody tr:nth-child(even) td{
    background:#fafafa;
}

tbody tr:hover td{
    background:#f1f7ff;
}

/* wrap */

tbody td.wrap-text{
    white-space:normal;
}

/* nowrap */

tbody td.no-wrap{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   STICKY COLUMNS
========================= */

.sticky-col{
    position:sticky !important;
    z-index:300;
    background:#fff !important;
}

thead .sticky-col{
    z-index:700;
    background:#f8f9fa !important;
}

thead th.active-filter.sticky-col .header-main{

}

thead th.active-sort.sticky-col .header-main{
    background:#e7f0ff !important;
}

thead th.active-filter.active-sort.sticky-col .header-main{
    background:#d8f2df !important;
}

tbody tr:nth-child(even) td.sticky-col{
    background:#fafafa !important;
}

tbody tr:hover td.sticky-col{
    background:#f1f7ff !important;
}

/* =========================
   RESIZE HANDLE
========================= */

.resize-handle{

    top:0;

    height:100%;

}

.resize-handle:hover{

/* =========================

.menu{

.menu-header{

.menu-search{

/* =========================

.context-menu{

.dialog-overlay{

.dialog-overlay.show{

.dialog{

.dialog-buttons{

/* =========================

.resize-info{

.toast{

/* =========================

/* =========================

@media(max-width:700px){

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_ID =
    "19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS";

const SHEET_GID =
    "616860962";

const CSV_URL =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;


/* =========================================================
   SETTINGS STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v4";


/* =========================================================
   DATA
========================================================= */

let originalHeaders = [];

let originalData = [];

let displayData = [];

let columnNames = [];

let columnWidths = [];

let columnSettings = {};

let searchValues = {};

let selectedFilters = {};

let sortOrders = [];

let freezeCount = 0;

let globalWrap = true;

let currentColumn = -1;

let currentFilterColumn = -1;

let currentContextColumn = -1;

let resizing = false;

let resizeColumn = -1;

let resizeStartX = 0;

let resizeStartWidth = 0;


/* =========================================================
   DEFAULT FILTERS
========================================================= */

let defaultFilters = {};


/* =========================================================
   DOM
========================================================= */

const tableHead =
    document.getElementById("tableHead");

const tableBody =
    document.getElementById("tableBody");

const tableContainer =
    document.getElementById("tableContainer");

const status =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const filterMenu =
    document.getElementById("filterMenu");

const valueList =
    document.getElementById("valueList");

const filterValueSearch =
    document.getElementById("filterValueSearch");

const contextMenu =
    document.getElementById("contextMenu");

const settingsPanel =
    document.getElementById("settingsPanel");

const renameDialog =
    document.getElementById("renameDialog");

const renameInput =
    document.getElementById("renameInput");

const resizeInfo =
    document.getElementById("resizeInfo");

const toast =
    document.getElementById("toast");


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 1800);
}


/* =========================================================
   SAVE / LOAD SETTINGS
========================================================= */

function saveSettings(){

    const settings = {

        columnNames,

        columnWidths,

        columnSettings,

        searchValues,

        selectedFilters,

        sortOrders,

        freezeCount,

        globalWrap

    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(settings)
    );
}


function loadSettings(){

    try{

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if(!raw){
            return;
        }

        const settings =
            JSON.parse(raw);

        if(
            Array.isArray(settings.columnNames)
        ){
            columnNames =
                settings.columnNames;
        }

        if(
            Array.isArray(settings.columnWidths)
        ){
            columnWidths =
                settings.columnWidths;
        }

        if(settings.columnSettings){
            columnSettings =
                settings.columnSettings;
        }

        if(settings.searchValues){
            searchValues =
                settings.searchValues;
        }

        if(settings.selectedFilters){
            selectedFilters =
                settings.selectedFilters;
        }

        if(Array.isArray(settings.sortOrders)){
            sortOrders =
                settings.sortOrders;
        }

        if(
            Number.isInteger(settings.freezeCount)
        ){
            freezeCount =
                settings.freezeCount;
        }

        if(
            typeof settings.globalWrap === "boolean"
        ){
            globalWrap =
                settings.globalWrap;
        }

    }catch(error){

        console.error(
            "Không thể đọc settings",
            error
        );

    }

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;

    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const char = text[i];

        const next = text[i + 1];

        if(char === '"' && insideQuotes && next === '"'){

            cell += '"';

            i++;

            continue;
        }

        if(char === '"'){

            insideQuotes =
                !insideQuotes;

            continue;
        }

        if(
            char === "," &&
            !insideQuotes
        ){

            row.push(cell);

            cell = "";

            continue;
        }

        if(
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ){

            if(
                char === "\r" &&
                next === "\n"
            ){

                i++;

            }

            row.push(cell);

            rows.push(row);

            row = [];

            cell = "";

            continue;
        }

        cell += char;

    }

    if(
        cell.length > 0 ||
        row.length > 0
    ){

        row.push(cell);

        rows.push(row);

    }

    return rows;

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .trim()
        .toLowerCase();

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(...names){

    for(
        let i = 0;
        i < originalHeaders.length;
        i++
    ){

        const h =
            normalize(originalHeaders[i]);

        for(
            const name of names
        ){

            if(
                h === normalize(name)
            ){

                return i;

            }

        }

    }

    return -1;

}


/* =========================================================
   SPECIAL SORT COLUMN
========================================================= */

function getSortColumn(index){

    const name =
        normalize(originalHeaders[index]);

    if(name === "data"){

        return findColumn(
            "Sort_DATA",
            "Sort DATA"
        );

    }

    if(
        name === "thoại nội mạng" ||
        name === "thoai noi mang"
    ){

        return findColumn(
            "Sort_NM",
            "Sort NM"
        );

    }

    if(
        name === "thoại ngoại mạng" ||
        name === "thoai ngoai mang"
    ){

        return findColumn(
            "Sort_NgM",
            "Sort NgM"
        );

    }

    return index;

}


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

function isHiddenColumn(index){

        normalize(originalHeaders[index]);

    return [
        "sort_data",

        "sort_nm",

/* =========================================================
   DATE UPDATE DISPLAY
========================================================= */

function findDateUpdateColumn(){

    return findColumn(
        "Ngày update",
        "Ngay update",
        "Ngày cập nhật",
        "Ngay cap nhat"
    );

}


function formatUpdateDate(value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "";

    }

    const text =
        String(value).trim();

    let date = null;

    /* yyyy-mm-dd */

    let match =
        text.match(
            /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
        );

    if(match){

        date =
            new Date(
                Number(match[1]),
                Number(match[2]) - 1,
                Number(match[3])
            );

    }

    /* dd/mm/yyyy */

    if(!date){

        match =
            text.match(
                /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
            );

        if(match){

            date =
                new Date(
                    Number(match[3]),
                    Number(match[2]) - 1,
                    Number(match[1])
                );

        }

    }

    if(!date){

        return text;

    }

    const now =
        new Date();

    let months =
        (
            now.getFullYear() -
            date.getFullYear()
        ) * 12 +
        (
            now.getMonth() -
            date.getMonth()
        );

    if(months < 0){

        months = 0;

    }

    return String(months).padStart(2, "0")
        + " tháng";

}


/* =========================================================
   DEFAULT FILTER
========================================================= */

function buildDefaultFilters(){

    defaultFilters = {};

    const dateColumn =
        findDateUpdateColumn();

    if(dateColumn >= 0){

        defaultFilters[dateColumn] = {
            type:"not-empty"
        };

    }

    const stopColumn =
        findColumn(
            "Dừng gói",
            "Dung goi"
        );

    if(stopColumn >= 0){

        defaultFilters[stopColumn] = {
            type:"empty"
        };

    }

}


/* =========================================================
   CHECK DEFAULT FILTER
========================================================= */

function passesDefaultFilter(
    row,
    column
){

    const rule =
        defaultFilters[column];

    if(!rule){

        return true;

    }

    const value =
        row[column] ?? "";

    const empty =
        String(value).trim() === "";

    if(rule.type === "empty"){

        return empty;

    }

    if(rule.type === "not-empty"){

        return !empty;

    }

    return true;

}


/* =========================================================
   INITIALIZE COLUMNS
========================================================= */

function initializeColumns(){

    if(
        !Array.isArray(columnNames) ||
        columnNames.length !== originalHeaders.length
    ){

        columnNames =
            [...originalHeaders];

    }else{

        for(
            let i = 0;
            i < originalHeaders.length;
            i++
        ){

            if(
                !columnNames[i] ||
                columnNames[i].trim() === ""
            ){

                columnNames[i] =
                    originalHeaders[i];

            }

        }

    }


    if(
        !Array.isArray(columnWidths) ||
        columnWidths.length !== originalHeaders.length
    ){

        const old =
            Array.isArray(columnWidths)
                ? columnWidths
                : [];

        columnWidths =
            originalHeaders.map(
                (_, i) =>
                    old[i] || 160
            );

    }


    for(
        let i = 0;
        i < originalHeaders.length;
        i++
    ){

        if(
            !columnSettings[i]
        ){

            columnSettings[i] = {

                align:"left",

                fontSize:14,

                bold:false,

                italic:false,

                textColor:"#222222",

                bgColor:"#ffffff",

                wrap:true

            };

        }

    }


    if(freezeCount > originalHeaders.length){

        freezeCount =
            originalHeaders.length;

    }

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function getDisplayValue(
    value,
    column
){

    const dateColumn =
        findDateUpdateColumn();

    if(
        column === dateColumn
    ){

        return formatUpdateDate(value);

    }

    return value ?? "";

}


/* =========================================================
   FILTER VALUES
========================================================= */

function getColumnValues(column){

    const values = new Set();

    for(
        const row of originalData
    ){

        const value =
            getDisplayValue(
                row[column],
                column
            );

        values.add(
            String(value)
        );

    }

    return Array.from(values)
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    "vi",
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
        );

}


/* =========================================================
   ACTIVE FILTER
========================================================= */

function hasUserFilter(column){

    const filter =
        selectedFilters[column];

    return (
        Array.isArray(filter) &&
        filter.length > 0
    );

}


function hasSearch(column){

    return (
        searchValues[column] &&
        searchValues[column].trim() !== ""
    );

}


function isActiveFilter(column){

    return (
        hasUserFilter(column) ||
        hasSearch(column) ||
        defaultFilters[column]
    );

}


/* =========================================================
   FILTER + SORT
========================================================= */

function recalculateData(){

    const result = [];

    for(
        let rowIndex = 0;
        rowIndex < originalData.length;
        rowIndex++
    ){

        const row =
            originalData[rowIndex];

        let valid = true;


        /* default filter */

        for(
            const key of Object.keys(
                defaultFilters
            )
        ){

            const column =
                Number(key);

            if(
                !passesDefaultFilter(
                    row,
                    column
                )
            ){

                valid = false;

                break;

            }

        }

        if(!valid){

            continue;

        }


        /* user filter */

        for(
            const key of Object.keys(
                selectedFilters
            )
        ){

            const column =
                Number(key);

            const values =
                selectedFilters[column];

            if(
                !Array.isArray(values) ||
                values.length === 0
            ){

                continue;

            }

            const value =
                String(
                    getDisplayValue(
                        row[column],
                        column
                    )
                );

            if(
                !values.includes(value)
            ){

                valid = false;

                break;

            }

        }

        if(!valid){

            continue;

        }


        /* search */

        for(
            const key of Object.keys(
                searchValues
            )
        ){

            const column =
                Number(key);

            const search =
                normalize(
                    searchValues[column]
                );

            if(!search){

                continue;

            }

            const value =
                normalize(
                    getDisplayValue(
                        row[column],
                        column
                    )
                );

            if(
                !value.includes(search)
            ){

                valid = false;

                break;

            }

        }

        if(valid){

            result.push({
                row,
                originalIndex:rowIndex
            });

        }

    }


    /* =====================================================
       MULTI SORT
    ===================================================== */

    if(sortOrders.length > 0){

        result.sort(
            (a,b) => {

                for(
                    const sort of sortOrders
                ){

                    const displayColumn =
                        sort.column;

                    const actualSortColumn =
                        getSortColumn(
                            displayColumn
                        );

                    const av =
                        a.row[actualSortColumn];

                    const bv =
                        b.row[actualSortColumn];

                    const cmp =
                        compareValues(
                            av,
                            bv
                        );

                    if(cmp !== 0){

                        return (
                            sort.direction === "asc"
                                ? cmp
                                : -cmp
                        );

                    }

                }

                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

    }


    displayData =
        result.map(
            item => item.row
        );


    renderTableBody();

    updateStatus();

}


/* =========================================================
   COMPARE
========================================================= */

function compareValues(a,b){

    const aa =
        String(a ?? "").trim();

    const bb =
        String(b ?? "").trim();

    if(aa === bb){

        return 0;

    }

    if(aa === ""){

        return -1;

    }

    if(bb === ""){

        return 1;

    }

    const na =
        Number(
            aa.replace(
                /[^\d.-]/g,
                ""
            )
        );

    const nb =
        Number(
            bb.replace(
                /[^\d.-]/g,
                ""
            )
        );

    if(
        !Number.isNaN(na) &&
        !Number.isNaN(nb) &&
        aa.match(/\d/) &&
        bb.match(/\d/)
    ){

        return na - nb;

    }

    return aa.localeCompare(
        bb,
        "vi",
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}

        );

    /* SEARCH ROW */

    for(
        let column = 0;
        column < originalHeaders.length;

    ){

        const td =

        td.className =

        td.style.width =

        td.style.minWidth =
            columnWidths[column] + "px";


        const input =
            document.createElement("input");

        input.className =

        input.placeholder =
            "🔎 Tìm...";

        input.value =

        input.addEventListener(
            "input",
            () => {

                clearTimeout(timer);

                timer =
                    setTimeout(

                            searchValues[column] =

                            saveSettings();

                            recalculateData();

                            renderHeader();

                            applyStickyColumns();

                    );

            }

        input.addEventListener(
            "click",
            event => {

                event.stopPropagation();

            }
        );


        td.appendChild(
            input
        );

        searchRow.appendChild(
            td
        );

    }


    tableHead.appendChild(
        row
    );

    tableHead.appendChild(
        searchRow
    );


    applyStickyColumns();

}


/* =========================================================
   RENDER BODY
========================================================= */

function renderTableBody(){

    tableBody.innerHTML = "";

    const fragment =
        document.createDocumentFragment();

    for(
        let rowIndex = 0;
        rowIndex < displayData.length;
        rowIndex++
    ){

        const row =
            displayData[rowIndex];

        const tr =
            document.createElement("tr");


        for(
            let column = 0;
            column < originalHeaders.length;
            column++
        ){

            if(
                isHiddenColumn(column)
            ){

                continue;

            }

            const td =
                document.createElement("td");

            const setting =
                columnSettings[column] || {};


            td.textContent =
                getDisplayValue(
                    row[column],
                    column
                );


            td.style.textAlign =
                setting.align || "left";

            td.style.fontSize =
                (setting.fontSize || 14) + "px";

            td.style.fontWeight =
                setting.bold
                    ? "700"
                    : "400";

            td.style.fontStyle =
                setting.italic
                    ? "italic"
                    : "normal";

            td.style.color =
                setting.textColor ||
                "#222222";

            td.style.backgroundColor =
                setting.bgColor ||
                "#ffffff";


            const wrap =
                setting.wrap !== undefined
                    ? setting.wrap
                    : globalWrap;


            if(wrap){

                td.classList.add(
                    "wrap-text"
                );

            }else{

                td.classList.add(
                    "no-wrap"
                );

            }


            td.style.width =
                columnWidths[column] + "px";

            td.style.minWidth =
                columnWidths[column] + "px";

            td.style.maxWidth =
                columnWidths[column] + "px";


            tr.appendChild(td);

        }


        fragment.appendChild(
            tr
        );

    }


    tableBody.appendChild(
        fragment
    );


    applyStickyColumns();

}


/* =========================================================
   STICKY
========================================================= */

function applyStickyColumns(){

    const visibleColumns = [];

    for(
        let i = 0;
        i < originalHeaders.length;
        i++
    ){

        if(
            !isHiddenColumn(i)
        ){

            visibleColumns.push(i);

        }

    }


    let left = 0;


    for(
        let visibleIndex = 0;
        visibleIndex < visibleColumns.length;
        visibleIndex++
    ){

        const column =
            visibleColumns[visibleIndex];

        const elements =
            document.querySelectorAll(
                `[data-column="${column}"]`
            );


        if(
            visibleIndex < freezeCount
        ){

            elements.forEach(
                element => {

                    element.classList.add(
                        "sticky-col"
                    );

                    element.style.left =
                        left + "px";

                }
            );

            left +=
                columnWidths[column];

        }else{

            elements.forEach(
                element => {

                    element.classList.remove(
                        "sticky-col"
                    );

                    element.style.left =
                        "";

                }
            );

        }

    }


    /* tbody cells */

    const bodyRows =
        tableBody.querySelectorAll("tr");

    bodyRows.forEach(
        row => {

            let visibleIndex = 0;

            const cells =
                Array.from(
                    row.children
                );

            cells.forEach(
                cell => {

                    while(
                        visibleIndex <
                        visibleColumns.length &&
                        isHiddenColumn(
                            visibleColumns[visibleIndex]
                        )
                    ){

                        visibleIndex++;

                    }

                    if(
                        visibleIndex <
                        freezeCount
                    ){

                        const column =
                            visibleColumns[
                                visibleIndex
                            ];

                        cell.classList.add(
                            "sticky-col"
                        );

                        let offset = 0;

                        for(
                            let x = 0;
                            x < visibleIndex;
                            x++
                        ){

                            offset +=
                                columnWidths[
                                    visibleColumns[x]
                                ];

                        }

                        cell.style.left =
                            offset + "px";

                    }

                    visibleIndex++;

                }
            );

        }
    );

}

/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues(){

    valueList.innerHTML = "";

    if(currentFilterColumn < 0){

        return;

    }

    const column =
        currentFilterColumn;

    let values =
        getColumnValues(column);


    const search =
        normalize(
            filterValueSearch.value
        );


    if(search){

        values =
            values.filter(
                value =>
                    normalize(
                        value
                    ).includes(search)
            );

    }


    let selected =
        selectedFilters[column];


    if(!Array.isArray(selected)){

        selected =
            [...values];

    }


    for(
        const value of values
    ){

        const label =
            document.createElement(
                "label"
            );

        label.className =
            "value-item";


        const checkbox =
            document.createElement(
                "input"
            );

        checkbox.type =
            "checkbox";

        checkbox.value =
            value;

        checkbox.checked =
            selected.includes(
                value
            );


        label.appendChild(
            checkbox
        );


        const text =
            document.createElement(
                "span"
            );

        text.textContent =
            value === ""
                ? "(Trống)"
                : value;


        label.appendChild(
            text
        );


        valueList.appendChild(
            label
        );

    }

}

/* =========================================================
   SORT
========================================================= */

function setSort(
    column,
    direction
){

    const existing =
        sortOrders.find(
            s =>
                s.column === column
        );


    if(existing){

        existing.direction =
            direction;

    }else{

        sortOrders.push({

            column,

            direction

        });

    }


    saveSettings();

    closeContextMenu();

    recalculateData();

    renderHeader();

    showToast(
        `Sort ưu tiên ${sortOrders.findIndex(
            s => s.column === column
        ) + 1}`
    );

}


function removeSort(column){

    sortOrders =
        sortOrders.filter(
            s =>
                s.column !== column
        );

    saveSettings();

    closeContextMenu();

    recalculateData();

    renderHeader();

}

document.getElementById(

/* =========================================================
   COLUMN SETTINGS
========================================================= */

function openColumnSettings(
    column
){

    currentColumn =
        column;

    const setting =
        columnSettings[column];


    document.getElementById(
        "columnAlign"
    ).value =
        setting.align || "left";


    document.getElementById(
        "columnFontSize"
    ).value =
        setting.fontSize || 14;


    document.getElementById(
        "columnBold"
    ).checked =
        !!setting.bold;


    document.getElementById(
        "columnItalic"
    ).checked =
        !!setting.italic;


    document.getElementById(
        "columnTextColor"
    ).value =
        setting.textColor || "#222222";


    document.getElementById(
        "columnBgColor"
    ).value =
        setting.bgColor || "#ffffff";


    document.getElementById(
        "columnWrap"
    ).checked =
        setting.wrap !== false;


    settingsPanel.classList.add(
        "show"
    );

}


document.getElementById(
    "columnSettingsButton"
).addEventListener(
    "click",
    () => {

        const column =
            currentContextColumn;

        closeContextMenu();

        openColumnSettings(
            column
        );

    }
);


/* =========================================================
   LIVE COLUMN SETTINGS
========================================================= */

function updateCurrentColumnSetting(){

    if(currentColumn < 0){

        return;

    }

    const setting =
        columnSettings[currentColumn];


    setting.align =
        document.getElementById(
            "columnAlign"
        ).value;


    setting.fontSize =
        Number(
            document.getElementById(
                "columnFontSize"
            ).value
        ) || 14;


    setting.bold =
        document.getElementById(
            "columnBold"
        ).checked;


    setting.italic =
        document.getElementById(
            "columnItalic"
        ).checked;


    setting.textColor =
        document.getElementById(
            "columnTextColor"
        ).value;


    setting.bgColor =
        document.getElementById(
            "columnBgColor"
        ).value;


    setting.wrap =
        document.getElementById(
            "columnWrap"
        ).checked;


    saveSettings();

    renderTableBody();

}


[
    "columnAlign",
    "columnFontSize",
    "columnBold",
    "columnItalic",
    "columnTextColor",
    "columnBgColor",
    "columnWrap"
].forEach(
    id => {

        document.getElementById(
            id
        ).addEventListener(
            "input",
            updateCurrentColumnSetting
        );

        document.getElementById(
            id
        ).addEventListener(
            "change",
            updateCurrentColumnSetting
        );

    }
);


/* =========================================================
   RESET COLUMN SETTINGS
========================================================= */

document.getElementById(
    "resetColumnSettings"
).addEventListener(
    "click",
    () => {

        if(currentColumn < 0){

            return;

        }

        columnSettings[
            currentColumn
        ] = {

            fontSize:14,

            textColor:"#222222",

        };

        openColumnSettings(
            currentColumn

        showToast(

/* =========================================================
   SETTINGS PANEL
========================================================= */

document.getElementById(
    "settingsButton"
).addEventListener(
    "click",
    () => {

        settingsPanel.classList.toggle(
            "show"
        );

            "globalWrap"
        ).checked =

    "closeSettings"
).addEventListener(

        );

    }

/* =========================================================
   GLOBAL WRAP
========================================================= */

document.getElementById(
    "globalWrap"
).addEventListener(

        globalWrap =

        renderTableBody();

    }

/* =========================================================
   FREEZE
========================================================= */

document.getElementById(
    "freezeCount"
).addEventListener(
    "change",
    event => {

        freezeCount =
            Math.max(
                0,
                Number(
                    event.target.value
                ) || 0
            );

        if(
            freezeCount >
            originalHeaders.length
        ){

            freezeCount =
                originalHeaders.length;

        }

        saveSettings();

        applyStickyColumns();

    }
);


document.getElementById(
    "freezeButton"
).addEventListener(
    "click",
    () => {

        settingsPanel.classList.add(
            "show"
        );

        document.getElementById(
            "freezeCount"
        ).focus();

    }
);

   RESET FILTERS
========================================================= */

document.getElementById(

).addEventListener(
    "click",
    () => {

        selectedFilters = {};

        searchValues = {};

        sortOrders = [];

        recalculateData();

        );

/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    column
){

    resizing = true;

    resizeColumn =
        column;

    resizeStartX =
        event.clientX;

    resizeStartWidth =
        columnWidths[column];


    resizeInfo.style.display =
        "block";

    resizeInfo.textContent =
        `${resizeStartWidth}px`;


    document.body.style.cursor =
        "col-resize";

}


document.addEventListener(
    "mousemove",
    event => {

        if(!resizing){

            return;

        }

        const delta =
            event.clientX -
            resizeStartX;

        const newWidth =
            Math.max(
                40,
                resizeStartWidth +
                delta
            );

        columnWidths[
            resizeColumn
        ] = newWidth;


        resizeInfo.textContent =
            `${Math.round(newWidth)} px`;

        resizeInfo.style.left =
            (event.clientX + 12) + "px";

        resizeInfo.style.top =
            (event.clientY + 12) + "px";


        updateColumnWidthVisual(
            resizeColumn,
            newWidth
        );

        applyStickyColumns();

    }
);


document.addEventListener(
    "mouseup",
    () => {

        if(!resizing){

            return;

        }

        resizing = false;

        resizeInfo.style.display =
            "none";

        document.body.style.cursor =
            "";

        saveSettings();

    }
);


/* =========================================================
   UPDATE WIDTH
========================================================= */

function updateColumnWidthVisual(
    column,
    width
){

    document
        .querySelectorAll(
            `[data-column="${column}"]`
        )
        .forEach(
            element => {

                element.style.width =
                    width + "px";

                element.style.minWidth =
                    width + "px";

                element.style.maxWidth =
                    width + "px";

            }
        );


    const visibleColumns = [];

    for(
        let i = 0;
        i < originalHeaders.length;
        i++
    ){

        if(!isHiddenColumn(i)){

            visibleColumns.push(i);

        }

    }


    let left = 0;

    for(
        let i = 0;
        i < Math.min(
            freezeCount,
            visibleColumns.length
        );
        i++
    ){

        const c =
            visibleColumns[i];

        document
            .querySelectorAll(
                `[data-column="${c}"]`
            )
            .forEach(
                element => {

                    element.style.left =
                        left + "px";

                }
            );

        left +=
            columnWidths[c];

    }

}


/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadData(){

    loading.classList.add(
        "show"
    );

    status.textContent =
        "Đang tải dữ liệu...";


    try{

        const response =
            await fetch(
                CSV_URL +
                "&_=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        const rows =
            parseCSV(text);


        if(
            rows.length < 1
        ){

            throw new Error(
                "Google Sheet không có dữ liệu"
            );

        }


        originalHeaders =
            rows[0].map(
                h =>
                    String(h || "").trim()
            );


        originalData =
            rows
                .slice(1)
                .filter(
                    row =>
                        row.some(
                            value =>
                                String(
                                    value ?? ""
                                ).trim() !== ""
                        )
                );


        loadSettings();

        initializeColumns();

        buildDefaultFilters();

        renderHeader();

        recalculateData();

        updateStatus();

        saveSettings();


        showToast(
            "Đã cập nhật dữ liệu"
        );


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Lỗi tải dữ liệu";

        showToast(
            "Không thể tải Google Sheet"
        );

    }finally{

        loading.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    status.textContent =
        `${displayData.length.toLocaleString("vi-VN")} dòng`;

}
