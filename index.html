<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REPORT</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

body {
    overflow: hidden;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    height: 58px;
    background: #fff;
    border-bottom: 1px solid #d8d8d8;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 0 14px;

    position: relative;
    z-index: 1000;
}

.title {
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    margin-right: 8px;
}

.top-button {
    height: 34px;
    padding: 0 13px;

    border: 1px solid #ccc;
    border-radius: 5px;

    background: #fff;

    cursor: pointer;

    font-size: 14px;
}

.top-button:hover {
    background: #f2f2f2;
}

.top-button.primary {
    background: #1976d2;
    border-color: #1976d2;
    color: #fff;
}

.top-button.primary:hover {
    background: #1565c0;
}

.freeze-control {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 7px;

    white-space: nowrap;

    font-size: 14px;
}

.freeze-control select {
    height: 34px;

    border: 1px solid #ccc;
    border-radius: 5px;

    padding: 0 8px;

    background: #fff;
}

.status {
    font-size: 12px;
    color: #666;

    white-space: nowrap;
}
