<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Danh sách gói cước</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    font-family: Arial, Helvetica, sans-serif;

    background: #f5f6f8;
    color: #222;
}

body {
    overflow: hidden;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    height: 54px;

    background: #fff;

    border-bottom: 1px solid #dcdfe4;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 12px;

    flex-shrink: 0;
}

.topbar-title {

    font-size: 18px;

    font-weight: 700;

    margin-right: auto;
}

button {

    border: 1px solid #cfd4da;

    background: #fff;

    border-radius: 5px;

    padding: 7px 12px;

    cursor: pointer;

    font-size: 13px;
}

button:hover {

    background: #f1f3f5;
}

button.primary {

    background: #1976d2;

    color: #fff;

    border-color: #1976d2;
}

button.primary:hover {

    background: #1565c0;
}

.refresh-info {

    font-size: 11px;

    color: #777;

    margin-left: 5px;
}


/* =========================================================
   MAIN
========================================================= */

.main {

    width: 100%;

    height: calc(100vh - 54px);

    overflow: hidden;

    position: relative;
}

.table-wrapper {

    position: absolute;

    inset: 0;

    overflow: auto;

    background: #fff;
}


/* =========================================================
   TABLE
========================================================= */

table {

    border-collapse: separate;

    border-spacing: 0;

    table-layout: fixed;

    width: max-content;

    min-width: 100%;
}

thead {

    position: relative;

    z-index: 50;
}

thead tr.header-row {

    height: 38px;
}

thead tr.search-row {

    height: 36px;
}

th,
td {

    border-right: 1px solid #d9dde2;

    border-bottom: 1px solid #d9dde2;

    padding: 6px 8px;

    font-size: 14px;

    vertical-align: middle;

    background: #fff;
}

th {

    background: #f1f3f5;

    font-weight: 700;

    position: relative;

    white-space: nowrap;
}


/* =========================================================
   HEADER
========================================================= */

.header-cell {

    height: 38px;

    min-height: 38px;

    max-height: 38px;

    padding: 0 8px;

    position: sticky;

    top: 0;

    z-index: 80;
}

.header-content {

    display: flex;

    align-items: center;

    width: 100%;

    height: 38px;

    gap: 5px;
}

.header-name {

    overflow: hidden;

    text-overflow: ellipsis;

    flex: 1;

    cursor: pointer;
}

.header-actions {

    display: flex;

    align-items: center;

    gap: 2px;
}

.header-sort {

    font-size: 12px;

    color: #555;
}

.header-filter-btn {

    border: none;

    background: transparent;

    padding: 2px 4px;

    font-size: 13px;

    cursor: pointer;
}

.header-filter-btn:hover {

    background: #ddd;
}

th.filtered {

    background: #c8f7c5 !important;
}

th.sorted {

    background: #d8ebff !important;
}

th.filtered.sorted {

    background: #bdecc4 !important;
}


/* =========================================================
   SEARCH
========================================================= */

.search-cell {

    padding: 4px;

    background: #fafafa;

    height: 36px;

    min-height: 36px;

    max-height: 36px;

    position: sticky;

    top: 38px;

    z-index: 79;
}

.search-input {

    width: 100%;

    height: 28px;

    display: block;

    border: 1px solid #cfd4da;

    border-radius: 4px;

    padding: 4px 7px;

    font-size: 12px;

    outline: none;

    margin: 0;
}

.search-input:focus {

    border-color: #1976d2;

    box-shadow:
        0 0 0 2px rgba(25,118,210,.12);
}


/* =========================================================
   BODY
========================================================= */

td {

    /*
       QUAN TRỌNG:
       Cho phép giữ xuống dòng từ Google Sheet.
    */

    white-space: pre-line;

    overflow: hidden;

    text-overflow: ellipsis;
}


/*
   Khi Wrap text được bật
*/
td.wrap-text {

    white-space: pre-wrap !important;

    overflow-wrap: anywhere;

    word-break: break-word;

    text-overflow: clip;
}


/* =========================================================
   RESIZE
========================================================= */

.resize-handle {

    position: absolute;

    top: 0;

    right: -3px;

    width: 7px;

    height: 100%;

    cursor: col-resize;

    z-index: 100;
}

.resize-handle:hover {

    background: rgba(25,118,210,.3);
}


/* =========================================================
   FREEZE
========================================================= */

tbody .frozen-column {

    position: sticky !important;

    z-index: 90 !important;

    background: #fff;
}

thead .frozen-column.header-cell {

    position: sticky !important;

    z-index: 110 !important;

    background: #f1f3f5;
}

thead .frozen-column.search-cell {

    position: sticky !important;

    z-index: 109 !important;

    background: #fafafa;
}

thead th.filtered.frozen-column.header-cell {

    background: #c8f7c5 !important;

    z-index: 110 !important;
}

thead th.sorted.frozen-column.header-cell {

    background: #d8ebff !important;

    z-index: 110 !important;
}

thead th.filtered.sorted.frozen-column.header-cell {

    background: #bdecc4 !important;

    z-index: 110 !important;
}

thead .header-cell {

    z-index: 80;
}

thead .search-cell {

    z-index: 79;
}

thead tr.header-row th.frozen-column {

    z-index: 120 !important;
}

thead tr.search-row th.frozen-column {

    z-index: 119 !important;
}

tbody td.frozen-column {

    z-index: 90 !important;
}


/* =========================================================
   FILTER MENU
========================================================= */

.filter-menu {

    position: fixed;

    z-index: 10000;

    width: 350px;

    max-height: 700px;

    background: #fff;

    border: 1px solid #cfd4da;

    border-radius: 7px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.18);

    display: none;

    overflow: hidden;
}

.filter-menu.open {

    display: block;
}

.filter-title {

    font-weight: 700;

    padding: 10px 12px;

    border-bottom: 1px solid #e2e5e9;

    background: #f8f9fa;
}

.filter-search {

    padding: 8px;

    border-bottom: 1px solid #e2e5e9;
}

.filter-search input {

    width: 100%;

    height: 30px;

    border: 1px solid #cfd4da;

    border-radius: 4px;

    padding: 5px 8px;
}

.filter-buttons {

    display: flex;

    gap: 5px;

    padding: 8px;

    border-bottom: 1px solid #e2e5e9;
}

.filter-buttons button {

    flex: 1;

    padding: 6px 5px;

    font-size: 12px;
}

.filter-values {

    max-height: 240px;

    overflow-y: auto;

    padding: 5px 8px;
}

.filter-value {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 4px 3px;

    font-size: 13px;
}

.filter-value:hover {

    background: #f1f3f5;
}

.filter-value span {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   FILTER SORT
========================================================= */

.filter-sort-section {

    border-top: 1px solid #e2e5e9;

    padding: 8px;

    background: #fafafa;
}

.filter-sort-title {

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 6px;
}

.sort-buttons {

    display: flex;

    gap: 5px;
}

.sort-buttons button {

    flex: 1;

    font-size: 12px;

    padding: 6px;
}

.priority-row {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 8px;
}

.priority-row label {

    font-size: 12px;
}

.priority-input {

    width: 70px;

    height: 28px;

    border: 1px solid #cfd4da;

    border-radius: 4px;

    padding: 3px 6px;
}


/* =========================================================
   FILTER FORMAT
========================================================= */

.filter-format-section {

    border-top: 1px solid #e2e5e9;

    padding: 10px 8px;

    background: #fff;
}

.filter-format-title {

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 8px;
}

.format-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;
}

.format-item {

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.format-item label {

    font-size: 11px;

    color: #666;
}

.format-item select,
.format-item input[type="number"] {

    width: 100%;

    height: 29px;

    border: 1px solid #cfd4da;

    border-radius: 4px;

    padding: 3px 6px;

    font-size: 12px;
}

.format-checkboxes {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 8px;
}

.format-checkboxes label {

    font-size: 12px;

    display: flex;

    align-items: center;

    gap: 4px;
}

.filter-format-colors {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;

    margin-top: 8px;
}

.filter-format-colors label {

    font-size: 11px;

    color: #666;

    display: flex;

    align-items: center;

    gap: 5px;
}

.filter-format-colors input[type="color"] {

    width: 40px;

    height: 26px;

    padding: 0;

    border: none;
}


/* =========================================================
   FILTER FOOTER
========================================================= */

.filter-footer {

    display: flex;

    gap: 6px;

    padding: 8px;

    border-top: 1px solid #e2e5e9;
}

.filter-footer button {

    flex: 1;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.25);

    z-index: 9000;

    display: none;
}

.settings-overlay.open {

    display: block;
}

.settings-panel {

    position: fixed;

    top: 60px;

    right: 15px;

    width: 440px;

    max-height: calc(100vh - 80px);

    overflow-y: auto;

    background: #fff;

    border: 1px solid #d0d4d8;

    border-radius: 8px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.2);

    z-index: 9100;

    display: none;
}

.settings-panel.open {

    display: block;
}

.settings-header {

    padding: 12px 15px;

    font-size: 17px;

    font-weight: 700;

    border-bottom: 1px solid #e2e5e9;

    display: flex;

    align-items: center;
}

.settings-header button {

    margin-left: auto;
}

.settings-section {

    padding: 13px 15px;

    border-bottom: 1px solid #e2e5e9;
}

.settings-section h3 {

    margin: 0 0 10px 0;

    font-size: 14px;
}

.settings-help {

    font-size: 11px;

    color: #777;

    margin-bottom: 8px;
}

.column-selector {

    border: 1px solid #cfd4da;

    border-radius: 5px;

    max-height: 180px;

    overflow-y: auto;
}

.column-option {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 6px 8px;

    font-size: 13px;
}

.column-option:hover {

    background: #f1f3f5;
}

.setting-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 9px;
}

.setting-row label {

    min-width: 105px;

    font-size: 13px;
}

.setting-row input[type="number"],
.setting-row input[type="text"],
.setting-row select {

    flex: 1;

    height: 30px;

    border: 1px solid #cfd4da;

    border-radius: 4px;

    padding: 4px 7px;
}

.checkbox-line {

    display: flex;

    gap: 7px;

    align-items: center;

    font-size: 13px;

    margin-bottom: 8px;
}

.color-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 8px;
}

.color-row input[type="color"] {

    width: 45px;

    height: 30px;

    border: none;

    padding: 0;
}

.settings-buttons {

    display: flex;

    gap: 7px;
}

.settings-buttons button {

    flex: 1;
}


/* =========================================================
   CONTEXT MENU
========================================================= */

.context-menu {

    position: fixed;

    z-index: 12000;

    background: #fff;

    border: 1px solid #cfd4da;

    border-radius: 5px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.18);

    display: none;

    min-width: 180px;
}

.context-menu button {

    width: 100%;

    border: none;

    border-radius: 0;

    text-align: left;
}

.context-menu.open {

    display: block;
}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position: fixed;

    inset: 54px 0 0 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(255,255,255,.85);

    z-index: 5000;

    font-size: 16px;
}

.error-box {

    margin: 20px;

    padding: 15px;

    border: 1px solid #ef9a9a;

    background: #ffebee;

    color: #b71c1c;

    border-radius: 6px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .topbar-title {

        font-size: 14px;
    }

    .refresh-info {

        display: none;
    }

    .settings-panel {

        left: 5px;

        right: 5px;

        width: auto;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     TOP BAR
======================================================= -->

<div class="topbar">

    <div class="topbar-title">
        📊 Danh sách gói cước
    </div>

    <button onclick="resetUserFilters()">
        ↻ Tổng / Reset
    </button>

    <button onclick="refreshData()">
        🔄 Cập nhật
    </button>

    <button onclick="openSettings()">
        ⚙ Cài đặt
    </button>

    <span
        class="refresh-info"
        id="refreshInfo"
    >
        Chưa tải dữ liệu
    </span>

</div>


<!-- =======================================================
     MAIN
======================================================= -->

<div class="main">

    <div
        class="table-wrapper"
        id="tableWrapper"
    >

        <table id="dataTable">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>


<!-- =======================================================
     LOADING
======================================================= -->

<div
    class="loading"
    id="loading"
>
    Đang tải dữ liệu Google Sheet...
</div>


<!-- =======================================================
     FILTER MENU
======================================================= -->

<div
    class="filter-menu"
    id="filterMenu"
>

    <div
        class="filter-title"
        id="filterTitle"
    >
        Bộ lọc
    </div>


    <div class="filter-search">

        <input
            type="text"
            id="filterValueSearch"
            placeholder="Tìm giá trị..."
            oninput="renderFilterValues()"
        >

    </div>


    <div class="filter-buttons">

        <button onclick="selectAllFilterValues()">
            Chọn tất cả
        </button>

        <button onclick="clearFilterValues()">
            Bỏ chọn
        </button>

    </div>


    <div
        class="filter-values"
        id="filterValues"
    ></div>


    <!-- ===================================================
         SORT
    ==================================================== -->

    <div class="filter-sort-section">

        <div class="filter-sort-title">
            Sắp xếp
        </div>

        <div class="sort-buttons">

            <button onclick="setCurrentSort('asc')">
                ▲ Tăng dần
            </button>

            <button onclick="setCurrentSort('desc')">
                ▼ Giảm dần
            </button>

            <button onclick="removeCurrentSort()">
                ✕ Bỏ sort
            </button>

        </div>


        <div class="priority-row">

            <label>
                Ưu tiên sort:
            </label>

            <input
                class="priority-input"
                type="number"
                id="sortPriorityInput"
                min="1"
                step="1"
                placeholder="VD: 1"
            >

            <button onclick="applyCurrentPriority()">
                Áp dụng
            </button>

        </div>

    </div>


    <!-- ===================================================
         FORMAT TRỰC TIẾP
    ==================================================== -->

    <div class="filter-format-section">

        <div class="filter-format-title">
            Định dạng cột hiện tại
        </div>


        <div class="format-grid">

            <div class="format-item">

                <label>
                    Canh lề
                </label>

                <select id="filterFormatAlign">

                    <option value="left">
                        Trái
                    </option>

                    <option value="center">
                        Giữa
                    </option>

                    <option value="right">
                        Phải
                    </option>

                </select>

            </div>


            <div class="format-item">

                <label>
                    Font
                </label>

                <select id="filterFormatFont">

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Tahoma">
                        Tahoma
                    </option>

                    <option value="Verdana">
                        Verdana
                    </option>

                    <option value="Calibri">
                        Calibri
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                </select>

            </div>


            <div class="format-item">

                <label>
                    Font size
                </label>

                <input
                    type="number"
                    id="filterFormatSize"
                    min="8"
                    max="40"
                    value="14"
                >

            </div>

        </div>


        <div class="format-checkboxes">

            <label>

                <input
                    type="checkbox"
                    id="filterFormatBold"
                >

                In đậm

            </label>


            <label>

                <input
                    type="checkbox"
                    id="filterFormatItalic"
                >

                In nghiêng

            </label>


            <label>

                <input
                    type="checkbox"
                    id="filterFormatWrap"
                >

                Wrap text

            </label>

        </div>


        <div class="filter-format-colors">

            <label>

                Màu chữ

                <input
                    type="color"
                    id="filterFormatTextColor"
                    value="#222222"
                >

            </label>


            <label>

                Màu nền

                <input
                    type="color"
                    id="filterFormatBgColor"
                    value="#ffffff"
                >

            </label>

        </div>


        <button
            class="primary"
            style="
                width:100%;
                margin-top:8px;
            "
            onclick="applyCurrentColumnFormat()"
        >
            Áp dụng định dạng
        </button>

    </div>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <div class="filter-footer">

        <button onclick="cancelFilter()">
            Hủy
        </button>

        <button
            class="primary"
            onclick="applyFilter()"
        >
            Áp dụng lọc
        </button>

    </div>

</div>


<!-- =======================================================
     SETTINGS OVERLAY
======================================================= -->

<div
    class="settings-overlay"
    id="settingsOverlay"
    onclick="closeSettings(event)"
></div>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div
    class="settings-panel"
    id="settingsPanel"
>

    <div class="settings-header">

        ⚙ Cài đặt bảng

        <button onclick="closeSettings()">
            ✕
        </button>

    </div>


    <div class="settings-section">

        <h3>
            1. Chọn cột
        </h3>

        <div class="settings-help">
            Có thể chọn nhiều cột để áp dụng cùng một định dạng.
        </div>

        <div
            class="column-selector"
            id="columnSelector"
        ></div>

    </div>


    <div class="settings-section">

        <h3>
            2. Định dạng
        </h3>

        <div class="setting-row">

            <label>
                Font
            </label>

            <select id="formatFont">

                <option value="Arial">
                    Arial
                </option>

                <option value="Tahoma">
                    Tahoma
                </option>

                <option value="Verdana">
                    Verdana
                </option>

                <option value="Calibri">
                    Calibri
                </option>

                <option value="Times New Roman">
                    Times New Roman
                </option>

            </select>

        </div>


        <div class="setting-row">

            <label>
                Font size
            </label>

            <input
                type="number"
                id="formatFontSize"
                min="8"
                max="40"
                value="14"
            >

        </div>


        <div class="setting-row">

            <label>
                Căn lề
            </label>

            <select id="formatAlign">

                <option value="left">
                    Trái
                </option>

                <option value="center">
                    Giữa
                </option>

                <option value="right">
                    Phải
                </option>

            </select>

        </div>


        <div class="checkbox-line">

            <input
                type="checkbox"
                id="formatBold"
            >

            <label for="formatBold">
                In đậm
            </label>

        </div>


        <div class="checkbox-line">

            <input
                type="checkbox"
                id="formatItalic"
            >

            <label for="formatItalic">
                In nghiêng
            </label>

        </div>


        <div class="checkbox-line">

            <input
                type="checkbox"
                id="formatWrap"
            >

            <label for="formatWrap">
                Xuống dòng / Wrap text
            </label>

        </div>


        <div class="color-row">

            <input
                type="checkbox"
                id="enableTextColor"
            >

            <label for="enableTextColor">
                Màu chữ
            </label>

            <input
                type="color"
                id="formatTextColor"
                value="#222222"
            >

        </div>


        <div class="color-row">

            <input
                type="checkbox"
                id="enableBgColor"
            >

            <label for="enableBgColor">
                Màu nền
            </label>

            <input
                type="color"
                id="formatBgColor"
                value="#ffffff"
            >

        </div>


        <div class="settings-buttons">

            <button
                class="primary"
                onclick="applyFormatting()"
            >
                Áp dụng định dạng
            </button>

        </div>

    </div>


    <div class="settings-section">

        <h3>
            3. Đổi tên cột
        </h3>

        <div class="settings-help">
            Tên mới được lưu trên trình duyệt này.
        </div>

        <div class="setting-row">

            <label>
                Cột
            </label>

            <select
                id="renameColumnSelect"
            ></select>

<script>


/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v10";


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([

    "Sort_DATA",

    "Sort_NM",

    "Sort_NgM"

]);


/* =========================================================
   SORT MAP
========================================================= */

const SORT_BY_MAP = {

    "DATA": "Sort_DATA",

    "Thoại nội mạng": "Sort_NM",

    "Thoại ngoại mạng": "Sort_NgM"

};


/* =========================================================
   DATE

const DATE_COLUMNS = new Set([

    "Ngày update"

]);


/* =========================================================
   STATE
========================================================= */

let headers = [];

let rows = [];

let selectedFilters = {};

let defaultFilters = {};

let searchValues = {};

let sortOrders = {};

let columnWidths = {};

let columnFormats = {};

let freezeCount = 0;

let currentFilterColumn = null;

let temporaryFilterValues = [];

let contextColumn = null;


/* =========================================================
   DEFAULT FORMAT
========================================================= */

const DEFAULT_FORMAT = {

    fontFamily: "Arial",

    fontSize: 14,

    align: "left",

    bold: false,

    italic: false,

    wrap: false,

/* =========================================================

document.addEventListener(

    async function() {

/* =========================================================
   STORAGE
========================================================= */

function loadStorage() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) return;


        const data =
            JSON.parse(raw);


        columnNames =
            data.columnNames || {};


        selectedFilters =
            data.selectedFilters || {};


        searchValues =
            data.searchValues || {};


        sortOrders =
            data.sortOrders || {};


        columnWidths =
            data.columnWidths || {};


        columnFormats =
            data.columnFormats || {};


        freezeCount =
            Number(
                data.freezeCount || 0
            );

    }
    catch(error) {

        console.error(error);

    }

}


function saveStorage() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                columnNames,

                selectedFilters,

                searchValues,

                sortOrders,

                columnWidths,

                columnFormats,

                freezeCount

            })

        );

    }
    catch(error) {

        console.error(error);

    }

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const result = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (
            char === '"'
        ) {

            if (
                insideQuotes &&
                next === '"'
            ) {

                value += '"';

                i++;

            }
            else {

                insideQuotes =
                    !insideQuotes;

            }

            continue;

        }


        /*
           QUAN TRỌNG:
           Nếu newline nằm trong "..."
           thì giữ nguyên newline.
        */

        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            result.push(row);

            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);

        result.push(row);

    }


    return result;

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshData() {

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "flex";


    try {

        const url =
            SHEET_CSV_URL +
            "&_=" +
            Date.now();


        const response =
            await fetch(

                url,

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const csv =
            parseCSV(text);


        if (
            !csv ||
            csv.length === 0
        ) {

            throw new Error(
                "Google Sheet không có dữ liệu."
            );

        }


        headers =
            csv[0].map(
                h =>
                    cleanHeader(h)
            );


        rows =
            csv
                .slice(1)

                .filter(
                    row =>
                        row.some(
                            value =>
                                String(
                                    value || ""
                                ).trim() !== ""
                        )
                )

                .map(
                    row => {

                        const obj = {};


                        headers.forEach(
                            (
                                header,
                                index
                            ) => {

                                obj[header] =
                                    row[index] ??
                                    "";

                            }
                        );


                        return obj;

                    }
                );


        initializeColumnNames();

        initializeDefaults();

        cleanStateAfterDataChange();

        renderTable();

        updateRefreshInfo();

        saveStorage();

    }
    catch(error) {

        console.error(error);

        showError(
            "Không thể tải dữ liệu Google Sheet.<br><br>" +
            error.message
        );

    }
    finally {

        loading.style.display =
            "none";

    }

}


/* =========================================================
   CLEAN HEADER
========================================================= */

function cleanHeader(value) {

    return String(
        value || ""
    )
        .replace(
            /^\uFEFF/,
            ""
        )
        .replace(
            /\u00A0/g,
            " "
        )
        .trim();

}


/* =========================================================
   COLUMN NAMES
========================================================= */

function initializeColumnNames() {

    headers.forEach(
        (
            header,
            index
        ) => {

            if (
                columnNames[index] ===
                undefined
            ) {

                columnNames[index] =
                    header;

            }

        }
    );

}


/* =========================================================
   DEFAULT FILTER
========================================================= */

function initializeDefaults() {

    defaultFilters = {};


    const dateIndex =
        getColumnIndexByName(
            "Ngày update"
        );


    if (
        dateIndex !== -1
    ) {

        const values =
            getUniqueRawValues(
                dateIndex
            );


        defaultFilters[
            dateIndex
        ] =
            values.filter(
                value =>
                    String(
                        value
                    ).trim() !== ""
            );

    }


    const stopIndex =
        getColumnIndexByName(
            "Dừng gói"
        );


    if (
        stopIndex !== -1
    ) {

        const values =
            getUniqueRawValues(
                stopIndex
            );


        const blank =
            values.find(
                value =>
                    String(
                        value
                    ).trim() === ""
            );


        defaultFilters[
            stopIndex
        ] =
            blank !== undefined
                ? [blank]
                : [];

    }


    Object.keys(
        defaultFilters
    )
        .forEach(
            index => {

                if (
                    !Object.prototype.hasOwnProperty.call(
                        selectedFilters,
                        index
                    )
                ) {

                    selectedFilters[index] =
                        [
                            ...defaultFilters[index]
                        ];

                }

            }
        );

}


/* =========================================================
   CLEAN STATE
========================================================= */

function cleanStateAfterDataChange() {

    Object.keys(
        columnNames
    )
        .forEach(
            key => {

                if (
                    !headers[
                        Number(key)
                    ]
                ) {

                    delete columnNames[key];

                }

            }
        );


    Object.keys(
        selectedFilters
    )
        .forEach(
            key => {

                if (
                    !headers[
                        Number(key)
                    ]
                ) {

                    delete selectedFilters[key];

                }

            }
        );


    Object.keys(
        searchValues
    )
        .forEach(
            key => {

                if (
                    !headers[
                        Number(key)
                    ]
                ) {

                    delete searchValues[key];

                }

            }
        );


    Object.keys(
        sortOrders
    )
        .forEach(
            key => {

                if (
                    !headers[
                        Number(key)
                    ]
                ) {

                    delete sortOrders[key];

                }

            }
        );

}


/* =========================================================
   COLUMN INDEX
========================================================= */

function getColumnIndexByName(
    name
) {

    return headers.indexOf(
        name
    );

}


/* =========================================================
   DISPLAY NAME
========================================================= */

function getDisplayColumnName(
    index
) {

    return (

        columnNames[index] ??

        headers[index] ??

        ""

    );

}


/* =========================================================
   UNIQUE VALUES
========================================================= */

/*
   QUAN TRỌNG:

   Hàm này LUÔN lấy từ rows gốc.

   KHÔNG lấy từ filterRows(rows).

   Vì vậy:
   Filter Package sẽ KHÔNG làm mất
   các giá trị DATA trong menu filter.
*/

function getUniqueRawValues(
    index
) {

    const set =
        new Set();


    const header =
        headers[index];


    if (!header) {

        return [];

    }


    rows.forEach(
        row => {

            set.add(
                row[header] ??
                ""
            );

        }
    );


    return Array.from(
        set
    );

}


/* =========================================================
   DATE
========================================================= */

function parseVietnameseDate(
    value
) {

    const text =
        String(
            value || ""
        ).trim();


    if (!text) return null;


    let match =
        text.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if (match) {

        const day =
            Number(
                match[1]
            );

        const month =
            Number(
                match[2]
            );

        const year =
            Number(
                match[3]
            );


        const date =
            new Date(
                year,
                month - 1,
                day
            );


        if (
            date.getFullYear() === year &&
            date.getMonth() === month - 1 &&
            date.getDate() === day
        ) {

            return date;

        }

    }


    match =
        text.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})/
        );


    if (match) {

        return new Date(

            Number(match[1]),

            Number(match[2]) - 1,

            Number(match[3])

        );

    }


    return null;

}


/* =========================================================
   DATE DISPLAY
========================================================= */

function formatDateValue(
    value
) {

    const date =
        parseVietnameseDate(
            value
        );


    if (!date) {

        return String(
            value || ""
        );

    }


    const now =
        new Date();


    const months =
        (
            now.getFullYear() -
            date.getFullYear()
        ) * 12 +

        (
            now.getMonth() -
            date.getMonth()
        );


    if (
        months >= 0
    ) {

        return String(
            months
        ).padStart(
            2,
            "0"
        ) +
        " tháng";

    }


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    return (

        day +
        "/" +
        month +
        "/" +
        date.getFullYear()

    );

}


/* =========================================================
   NUMBER
========================================================= */

function parseVietnameseNumber(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    let text =
        String(
            value
        ).trim();


    if (!text) return null;


    text =
        text
            .replace(
                /\s/g,
                ""
            )
            .replace(
                /[₫đĐ]/g,
                ""
            );


    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(
                    /\./g,
                    ""
                )
                .replace(
                    ",",
                    "."
                );

    }
    else if (
        text.includes(",")
    ) {

        text =
            text.replace(
                ",",
                "."
            );

    }
    else {

        const parts =
            text.split(".");


        if (
            parts.length > 2
        ) {

            text =
                parts.join("");

        }
        else if (
            parts.length === 2 &&
            parts[1].length === 3
        ) {

            text =
                parts.join("");

        }

    }


    text =
        text.replace(
            /[^0-9eE+\-\.]/g,
            ""
        );


    const number =
        Number(text);


    return Number.isFinite(
        number
    )
        ? number
        : null;

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function displayValue(
    value,
    columnIndex
) {

    const header =
        headers[columnIndex];


    if (
        DATE_COLUMNS.has(
            header
        )
    ) {

        return formatDateValue(
            value
        );

    }


    /*
       Không replace newline.
       Giữ nguyên \n từ Google Sheet.
    */

    return String(
        value ?? ""
    );

}


/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(
    row,
    columnIndex
) {

    const originalHeader =
        headers[columnIndex];


    const sortHeader =
        SORT_BY_MAP[
            originalHeader
        ] ||
        originalHeader;


    const raw =
        row[sortHeader] ??
        row[originalHeader] ??
        "";


    const numeric =
        parseVietnameseNumber(
            raw
        );


    if (
        numeric !== null &&
        !DATE_COLUMNS.has(
            originalHeader
        )
    ) {

        return {

            type: "number",

            value: numeric

        };

    }


    const date =
        parseVietnameseDate(
            raw
        );


    if (date) {

        return {

            type: "date",

            value:
                date.getTime()

        };

    }


    return {

        type: "text",

        value:
            String(
                raw
            ).toLowerCase()

    };

}


/* =========================================================
   SORT ROWS
========================================================= */

function sortRows(
    data
) {

    const orders =
        Object.entries(
            sortOrders
        )

        .map(
            (
                [
                    index,
                    config
                ]
            ) => ({

                index:
                    Number(index),

                direction:
                    config.direction ||
                    "asc",

                priority:
                    Number(
                        config.priority
                    )

            })
        )

        .filter(
            item =>
                Number.isFinite(
                    item.priority
                )
        )

        .sort(
            (
                a,
                b
            ) => {

                if (
                    a.priority !==
                    b.priority
                ) {

                    return (

                        a.priority -
                        b.priority

                    );

                }


                return (

                    a.index -
                    b.index

                );

            }
        );


    if (
        orders.length === 0
    ) {

        return data;

    }


    return [
        ...data
    ].sort(
        (
            a,
            b
        ) => {

            for (
                const order
                of orders
            ) {

                const av =
                    getSortValue(
                        a,
                        order.index
                    );


                const bv =
                    getSortValue(
                        b,
                        order.index
                    );


                let result = 0;


                if (
                    av.type === "number" &&
                    bv.type === "number"
                ) {

                    result =
                        av.value -
                        bv.value;

                }
                else if (
                    av.type === "date" &&
                    bv.type === "date"
                ) {

                    result =
                        av.value -
                        bv.value;

                }
                else {

                    result =
                        String(
                            av.value
                        ).localeCompare(
                            String(
                                bv.value
                            ),
                            "vi",
                            {
                                numeric: true,
                                sensitivity:
                                    "base"
                            }
                        );

                }


                if (
                    result !== 0
                ) {

                    return (

                        order.direction ===
                        "asc"

                    )
                        ? result
                        : -result;

                }

            }


            return 0;

        }
    );

}


/* =========================================================
   FILTER ROWS
========================================================= */

function filterRows(
    data
) {

    return data.filter(
        row => {


            /*
               FILTER
            */

            for (
                const [
                    indexString,
                    selected
                ]
                of Object.entries(
                    selectedFilters
                )
            ) {

                const index =
                    Number(
                        indexString
                    );


                if (
                    !headers[index]
                ) continue;


                const raw =
                    row[
                        headers[index]
                    ] ??
                    "";


                const selectedStrings =
                    selected.map(
                        value =>
                            String(
                                value
                            )
                    );


                if (
                    !selectedStrings.includes(
                        String(raw)
                    )
                ) {

                    return false;

                }

            }


            /*
               SEARCH
            */

            for (
                const [
                    indexString,
                    search
                ]
                of Object.entries(
                    searchValues
                )
            ) {

                const text =
                    String(
                        search || ""
                    )
                        .trim()
                        .toLowerCase();


                if (!text) continue;


                const index =
                    Number(
                        indexString
                    );


                if (
                    !headers[index]
                ) continue;


                const raw =
                    displayValue(
                        row[
                            headers[index]
                        ] ?? "",
                        index
                    )
                        .toLowerCase();


                if (
                    !raw.includes(
                        text
                    )
                ) {

                    return false;

                }

            }


            return true;

        }
    );

}


/* =========================================================
   FILTER ACTIVE
========================================================= */

function isColumnFiltered(
    index
) {

    const allValues =
        getUniqueRawValues(
            index
        );


    const selected =
        selectedFilters[index];


    if (!selected) {

        return false;

    }


    const a =
        selected
            .map(String)
            .sort()
            .join("|");


    const b =
        allValues
            .map(String)
            .sort()
            .join("|");


    if (
        a === b
    ) {

        return false;

    }


    if (
        defaultFilters[index]
    ) {

        const d =
            defaultFilters[index]
                .map(String)
                .sort()
                .join("|");


        if (
            a === d
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   SEARCH ACTIVE
========================================================= */

function isColumnSearchActive(
    index
) {

    return Boolean(
        String(
            searchValues[index] ||
            ""
        ).trim()
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderTable() {

    renderHead();

    renderBody();

    applyColumnWidths();

    applyFreezeColumns();

}


/* =========================================================
   RENDER HEAD
========================================================= */

function renderHead() {

    const thead =
        document.getElementById(
            "tableHead"
        );


    thead.innerHTML = "";


    const headerRow =
        document.createElement(
            "tr"
        );


    headerRow.className =
        "header-row";


    const searchRow =
        document.createElement(
            "tr"
        );


    searchRow.className =
        "search-row";


    headers.forEach(
        (
            header,
            index
        ) => {

            if (
                HIDDEN_COLUMNS.has(
                    header
                )
            ) return;


            const th =
                document.createElement(
                    "th"
                );


            th.dataset.column =
                index;


            th.className =
                "header-cell";


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "header-content";


            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "header-name";


            name.textContent =
                getDisplayColumnName(
                    index
                );


            name.title =
                "Double click để đổi tên";


            name.ondblclick =
                function() {

                    renameColumnDirect(
                        index
                    );

                };


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "header-actions";


            const sortInfo =
                document.createElement(
                    "span"
                );


            sortInfo.className =
                "header-sort";


            if (
                sortOrders[index]
            ) {

                sortInfo.textContent =

                    "S" +

                    sortOrders[index]
                        .priority +

                    (

                        sortOrders[index]
                            .direction ===
                        "asc"

                            ? " ▲"

                            : " ▼"

                    );

            }


            const filterButton =
                document.createElement(
                    "button"
                );


            filterButton.className =
                "header-filter-btn";


            filterButton.innerHTML =
                "▼";


            filterButton.onclick =
                function(event) {

                    event.stopPropagation();


                    openFilterMenu(
                        index,
                        filterButton
                    );

                };


            actions.appendChild(
                sortInfo
            );


            actions.appendChild(
                filterButton
            );


            content.appendChild(
                name
            );


            content.appendChild(
                actions
            );


            th.appendChild(
                content
            );


            const resize =
                document.createElement(
                    "div"
                );


            resize.className =
                "resize-handle";


            resize.addEventListener(
                "mousedown",
                function(event) {

                    startResize(
                        event,
                        index,
                        th
                    );

                }
            );


            th.appendChild(
                resize
            );


            if (
                isColumnFiltered(index) ||
                isColumnSearchActive(index)
            ) {

                th.classList.add(
                    "filtered"
                );

            }


            if (
                sortOrders[index]
            ) {

                th.classList.add(
                    "sorted"
                );

            }


            headerRow.appendChild(
                th
            );


            /*
               SEARCH CELL
            */

            const searchTh =
                document.createElement(
                    "th"
                );


            searchTh.dataset.column =
                index;


            searchTh.className =
                "search-cell";


            const input =
                document.createElement(
                    "input"
                );


            input.className =
                "search-input";


            input.placeholder =
                "Tìm kiếm...";


            input.value =
                searchValues[index] ||
                "";


            let searchTimer = null;


            input.addEventListener(
                "input",
                function() {

                    clearTimeout(
                        searchTimer
                    );


                    searchTimer =
                        setTimeout(
                            function() {

                                searchValues[
                                    index
                                ] =
                                    input.value;


                                saveStorage();


                                renderBody();


                                updateHeaderClasses();

                            },
                            180
                        );

                }
            );


            searchTh.appendChild(
                input
            );


            searchRow.appendChild(
                searchTh
            );

        }
    );


    thead.appendChild(
        headerRow
    );


    thead.appendChild(
        searchRow
    );

}


/* =========================================================
   RENDER BODY
========================================================= */

function renderBody() {

    const tbody =
        document.getElementById(
            "tableBody"
        );


    tbody.innerHTML = "";


    let data =
        filterRows(
            rows
        );


    data =
        sortRows(
            data
        );


    const fragment =
        document.createDocumentFragment();


    data.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            headers.forEach(
                (
                    header,
                    index
                ) => {

                    if (
                        HIDDEN_COLUMNS.has(
                            header
                        )
                    ) return;


                    const td =
                        document.createElement(
                            "td"
                        );


                    td.dataset.column =
                        index;


                    /*
                       textContent giữ nguyên \n.
                    */

                    td.textContent =
                        displayValue(
                            row[header] ??
                            "",
                            index
                        );


                    applyCellFormat(
                        td,
                        index
                    );


                    tr.appendChild(
                        td
                    );

                }
            );


            fragment.appendChild(
                tr
            );

        }
    );


    tbody.appendChild(
        fragment
    );


    applyFreezeColumns();

}


/* =========================================================
   FORMAT
========================================================= */

function getColumnFormat(
    index
) {

    return {

        ...DEFAULT_FORMAT,

        ...(columnFormats[index] || {})

    };

}


function applyCellFormat(
    cell,
    index
) {

    const format =
        getColumnFormat(
            index
        );


    cell.style.fontFamily =
        format.fontFamily ||
        "Arial";


    cell.style.fontSize =
        format.fontSize +
        "px";


    cell.style.textAlign =
        format.align;


    cell.style.fontWeight =
        format.bold
            ? "700"
            : "400";


    cell.style.fontStyle =
        format.italic
            ? "italic"
            : "normal";


    if (
        format.wrap
    ) {

        cell.classList.add(
            "wrap-text"
        );

    }
    else {

        cell.classList.remove(
            "wrap-text"
        );

    }


    if (
        format.textColor
    ) {

        cell.style.color =
            format.textColor;

    }
    else {

        cell.style.color = "";

    }


    if (
        format.bgColor
    ) {

        cell.style.backgroundColor =
            format.bgColor;

    }
    else {

        cell.style.backgroundColor =
            "";

    }

}


/* =========================================================
   HEADER CLASSES
========================================================= */

function updateHeaderClasses() {

    headers.forEach(
        (
            header,
            index
        ) => {

            const th =
                document.querySelector(
                    `th.header-cell[data-column="${index}"]`
                );


            if (!th) return;


            th.classList.remove(
                "filtered",
                "sorted"
            );


            if (
                isColumnFiltered(index) ||
                isColumnSearchActive(index)
            ) {

                th.classList.add(
                    "filtered"
                );

            }


            if (
                sortOrders[index]
            ) {

                th.classList.add(
                    "sorted"
                );

            }

        }
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilterMenu(
    index,
    button
) {

    currentFilterColumn =
        index;


    /*
       LUÔN LẤY FILTER TỪ DỮ LIỆU GỐC.
       Không lấy từ dữ liệu đã filter.
    */

    const values =
        getUniqueRawValues(
            index
        );


    temporaryFilterValues =
        selectedFilters[index]
            ? [
                ...selectedFilters[index]
            ]
            : [
                ...values
            ];


    document.getElementById(
        "filterTitle"
    ).textContent =
        getDisplayColumnName(
            index
        );


    document.getElementById(
        "filterValueSearch"
    ).value =
        "";


    document.getElementById(
        "sortPriorityInput"
    ).value =
        sortOrders[index]?.priority ??
        "";


    /*
       Load định dạng hiện tại
       của cột vào Filter menu.
    */

    loadCurrentColumnFormat(
        index
    );


    renderFilterValues();


    const menu =
        document.getElementById(
            "filterMenu"
        );


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if (
        left + 350 >
        window.innerWidth
    ) {

        left =
            window.innerWidth -
            360;

    }


    if (
        top + 700 >
        window.innerHeight
    ) {

        top =
            window.innerHeight -
            710;

    }


    menu.style.left =
        Math.max(
            5,
            left
        ) +
        "px";


    menu.style.top =
        Math.max(
            5,
            top
        ) +
        "px";


    menu.classList.add(
        "open"
    );

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues() {

    const container =
        document.getElementById(
            "filterValues"
        );


    container.innerHTML = "";


    if (
        currentFilterColumn === null
    ) return;


    const index =
        currentFilterColumn;


    /*
       QUAN TRỌNG:

       Không dùng filterRows(rows).

       Dùng rows gốc.
    */

    const allValues =
        getUniqueRawValues(
            index
        );


    const search =
        document.getElementById(
            "filterValueSearch"
        ).value
            .toLowerCase()
            .trim();


    allValues

        .filter(
            value => {

                const text =
                    displayValue(
                        value,
                        index
                    );


                return (

                    !search ||

                    text
                        .toLowerCase()
                        .includes(
                            search
                        )

                );

            }
        )

        .forEach(
            value => {

                const label =
                    document.createElement(
                        "label"
                    );


                label.className =
                    "filter-value";


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.checked =
                    temporaryFilterValues.some(

                        selected =>

                            String(
                                selected
                            ) ===
                            String(
                                value
                            )

                    );


                checkbox.addEventListener(
                    "change",
                    function() {

                        if (
                            checkbox.checked
                        ) {

                            if (
                                !temporaryFilterValues.some(

                                    selected =>

                                        String(
                                            selected
                                        ) ===
                                        String(
                                            value
                                        )

                                )
                            ) {

                                temporaryFilterValues.push(
                                    value
                                );

                            }

                        }
                        else {

                            temporaryFilterValues =
                                temporaryFilterValues.filter(

                                    selected =>

                                        String(
                                            selected
                                        ) !==
                                        String(
                                            value
                                        )

                                );

                        }

                    }
                );


                const span =
                    document.createElement(
                        "span"
                    );


                let display =
                    displayValue(
                        value,
                        index
                    );


                if (
                    display === ""
                ) {

                    display =
                        "(trống)";

                }


                /*
                   Filter value cũng giữ newline.
                */

                span.style.whiteSpace =
                    "pre-line";


                span.textContent =
                    display;


                label.appendChild(
                    checkbox
                );


                label.appendChild(
                    span
                );


                container.appendChild(
                    label
                );

            }
        );

}

/* =========================================================
   SORT
========================================================= */

function setCurrentSort(
    direction
) {

    if (
        currentFilterColumn === null
    ) return;


    let priority =
        Number(
            document.getElementById(
                "sortPriorityInput"
            ).value
        );


    if (
        !Number.isFinite(
            priority
        ) ||
        priority < 1
    ) {

        const priorities =
            Object.values(
                sortOrders
            )

            .map(
                item =>
                    Number(
                        item.priority
                    )
            )

            .filter(
                value =>
                    Number.isFinite(
                        value
                    )
            );


        priority =
            priorities.length

                ? Math.max(
                    ...priorities
                ) + 1

                : 1;

    }


    sortOrders[
        currentFilterColumn
    ] = {

        direction,

        priority

    };


    document.getElementById(
        "sortPriorityInput"
    ).value =
        priority;


    saveStorage();

    renderBody();

    renderHead();

}


function removeCurrentSort() {

    if (
        currentFilterColumn === null
    ) return;


    delete sortOrders[
        currentFilterColumn
    ];


    document.getElementById(
        "sortPriorityInput"
    ).value =
        "";


    saveStorage();

    renderBody();

    renderHead();

}


function applyCurrentPriority() {

    if (
        currentFilterColumn === null
    ) return;


    const priority =
        Number(
            document.getElementById(
                "sortPriorityInput"
            ).value
        );


    if (
        !Number.isInteger(
            priority
        ) ||
        priority < 1
    ) {

        alert(
            "Ưu tiên sort phải là số nguyên từ 1 trở lên."
        );


        return;

    }


    if (
        !sortOrders[
            currentFilterColumn
        ]
    ) {

        sortOrders[
            currentFilterColumn
        ] = {

            direction:
                "asc",

            priority

        };

    }
    else {

        sortOrders[
            currentFilterColumn
        ].priority =
            priority;

    }


    saveStorage();

    renderBody();

    renderHead();

}

/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    index,
    th
) {

    event.preventDefault();

    event.stopPropagation();


    const startX =
        event.clientX;


    const startWidth =
        th.getBoundingClientRect()
            .width;


    function move(e) {

        let newWidth =
            startWidth +
            (
                e.clientX -
                startX
            );


        newWidth =
            Math.max(
                70,
                Math.min(
                    700,
                    newWidth
                )
            );


        columnWidths[index] =
            Math.round(
                newWidth
            );


        applyColumnWidths();

        applyFreezeColumns();

    }


    function stop() {

        document.removeEventListener(
            "mousemove",
            move
        );


        document.removeEventListener(
            "mouseup",
            stop
        );


        saveStorage();

    }


    document.addEventListener(
        "mousemove",
        move
    );


    document.addEventListener(
        "mouseup",
        stop
    );

}

        .map(

                Number(
                    checkbox.value
                )
        );

    let index =

    ) {

        index =
            headers.findIndex(
                header =>
                    !HIDDEN_COLUMNS.has(
                        header
                    )
            );

    ) return;

        getColumnFormat(

    document.getElementById(
        "formatWrap"

        );

    ).value =
        format.textColor ||

    document.getElementById(

        "formatBgColor"

/* =========================================================

function changeFreezeCount() {

    let count =
        Number(
            document.getElementById(
                "freezeCount"
            ).value
        );


    if (
        !Number.isInteger(count) ||
        count < 0
    ) {

        count = 0;

    }


    const visibleHeaders =
        headers.filter(
            header =>
                !HIDDEN_COLUMNS.has(
                    header
                )
        );


    count =
        Math.min(
            count,
            visibleHeaders.length
        );


    freezeCount =
        count;


    document.getElementById(
        "freezeCount"
    ).value =
        count;


    saveStorage();

    applyFreezeColumns();

}


/* =========================================================
   APPLY FREEZE
========================================================= */

function applyFreezeColumns() {

    const visibleHeaders =
        headers.filter(
            header =>
                !HIDDEN_COLUMNS.has(
                    header
                )
        );


    const frozenIndices =
        visibleHeaders
            .slice(
                0,
                freezeCount
            )
            .map(
                header =>
                    headers.indexOf(
                        header
                    )
            );


    document.querySelectorAll(
        ".frozen-column"
    )
        .forEach(
            cell => {

                cell.classList.remove(
                    "frozen-column"
                );


                cell.style.left =
                    "";

            }
        );


    let left = 0;


    frozenIndices.forEach(
        index => {

            const width =
                columnWidths[index] ||
                150;


            const cells =
                document.querySelectorAll(
                    `[data-column="${index}"]`
                );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );


                    cell.style.left =
                        left + "px";

                }
            );


            left += width;

        }
    );

}


/* =========================================================
   RESET SETTINGS
========================================================= */

function resetAllSettings() {

    if (
        !confirm(
            "Khôi phục toàn bộ cài đặt trên trình duyệt này?"
        )
    ) return;


    columnNames = {};

    searchValues = {};

    sortOrders = {};

    columnWidths = {};

    columnFormats = {};

    freezeCount = 0;

    selectedFilters = {};


    Object.keys(
        defaultFilters
    )
        .forEach(
            index => {

                selectedFilters[index] =
                    [
                        ...defaultFilters[index]
                    ];

            }
        );


    saveStorage();

    initializeColumnNames();

    renderTable();

    renderColumnSettings();


    document.getElementById(
        "freezeCount"
    ).value =
        0;

}


/* =========================================================
   REFRESH INFO
========================================================= */

function updateRefreshInfo() {

    const element =
        document.getElementById(
            "refreshInfo"
        );


    const now =
        new Date();


    element.textContent =

        "Cập nhật: " +

        now.toLocaleTimeString(
            "vi-VN"
        ) +

        " • " +

        rows.length +

        " dòng";

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    const tbody =
        document.getElementById(
            "tableBody"
        );


    const thead =
        document.getElementById(
            "tableHead"
        );


    thead.innerHTML = "";


    tbody.innerHTML =

        `
        <tr>
            <td>
                <div class="error-box">
                    ${message}
                </div>
            </td>
        </tr>
        `;

}


/* =========================================================
   RENAME SELECT
========================================================= */

document.addEventListener(
    "change",
    function(event) {

        if (
            event.target.id ===
            "renameColumnSelect"
        ) {

            const index =
                Number(
                    event.target.value
                );


            document.getElementById(
                "renameColumnInput"
            ).value =
                getDisplayColumnName(
                    index
                );

        }

    }
);


/* =========================================================
   FORMAT SELECT
========================================================= */

document.addEventListener(
    "change",
    function(event) {

        if (
            event.target.closest(
                "#columnSelector"
            )
        ) {

            loadFormatFromFirstSelected();

        }

    }
);

</script>
