<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report - Google Sheet</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#222;
}

body{
    overflow:hidden;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:52px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:#fff;
    border-bottom:1px solid #ddd;
    position:relative;
    z-index:3000;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-right:10px;
}

.topbar button{
    border:1px solid #ccc;
    background:#fff;
    border-radius:5px;
    padding:7px 12px;
    cursor:pointer;
    font-size:13px;
}

.topbar button:hover{
    background:#f0f2f4;
}

.topbar button.primary{
    background:#1677ff;
    border-color:#1677ff;
    color:#fff;
}

.status{
    margin-left:auto;
    font-size:12px;
    color:#666;
}

/* =========================================================
   TABLE
========================================================= */

.table-container{
    position:absolute;
    top:52px;
    left:0;
    right:0;
    bottom:0;
    overflow:auto;
    background:#fff;
}

table{
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
    width:max-content;
    min-width:100%;
}

thead{
    position:sticky;
    top:0;
    z-index:1000;
}

thead th{
    position:relative;
    padding:0;
    vertical-align:top;
    background:#f8f9fa;
    border-right:1px solid #d5d5d5;
    border-bottom:1px solid #aaa;
}

.header-main{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    padding:0 7px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
}

.header-title{
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
}

.header-right{
    display:flex;
    align-items:center;
    gap:3px;
    flex-shrink:0;
}

.header-arrow{
    font-size:10px;
    color:#777;
}

.sort-badge{
    font-size:11px;
    font-weight:bold;
}

.sort-badge.asc{
    color:#1677ff;
}

.sort-badge.desc{
    color:#e67e22;
}

.filter-badge{
    font-size:9px;
    font-weight:bold;
    background:#19a34a;
    color:#fff;
    border-radius:8px;
    padding:1px 4px;
}

th.active-filter .header-main{
    background:#dff5df;
    color:#087f23;
}

th.active-sort .header-main{
    background:#e7f0ff;
}

th.active-filter.active-sort .header-main{
    background:#d8f2df;
    color:#087f23;
}

/* =========================================================
   SEARCH
========================================================= */

.search-cell{
    height:36px;
    padding:4px;
    border-right:1px solid #ddd;
    border-bottom:1px solid #ddd;
    background:#fff;
}

.search-input{
    width:100%;
    height:27px;
    border:1px solid #ccc;
    border-radius:4px;
    padding:3px 6px;
    outline:none;
    font-size:12px;
}

.search-input:focus{
    border-color:#1677ff;
}

/* =========================================================
   BODY
========================================================= */

tbody td{
    padding:6px 8px;
    border-right:1px solid #e0e0e0;
    border-bottom:1px solid #e5e5e5;
    font-size:13px;
    background:#fff;
    vertical-align:middle;
    overflow:hidden;
    text-overflow:ellipsis;
}

tbody tr:hover td{
    background:#f6faff;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* =========================================================
   RESIZE
========================================================= */

.resize-handle{
    position:absolute;
    top:0;
    right:-3px;
    width:7px;
    height:100%;
    cursor:col-resize;
    z-index:50;
}

.resize-handle:hover{
    background:#1677ff;
}

/* =========================================================
   DROPDOWN FILTER
========================================================= */

.filter-menu{
    position:fixed;
    width:310px;
    max-height:520px;
    background:#fff;
    border:1px solid #bbb;
    box-shadow:0 5px 20px rgba(0,0,0,.18);
    border-radius:6px;
    z-index:99999;
    display:none;
    overflow:hidden;
}

.filter-menu.show{
    display:block;
}

.filter-title{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-weight:bold;
    font-size:13px;
    background:#f7f7f7;
}

.filter-tools{
    display:flex;
    gap:5px;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.filter-tools button{
    flex:1;
    padding:6px 4px;
    font-size:11px;
    border:1px solid #ccc;
    background:#fff;
    border-radius:4px;
    cursor:pointer;
}

.filter-tools button:hover{
    background:#f0f2f4;
}

.filter-search{
    padding:7px;
    border-bottom:1px solid #ddd;
}

.filter-search input{
    width:100%;
    height:28px;
    border:1px solid #ccc;
    border-radius:4px;
    padding:4px 7px;
}

.filter-values{
    max-height:260px;
    overflow:auto;
    padding:5px 8px;
}

.filter-value{
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px 3px;
    font-size:12px;
    cursor:pointer;
    border-radius:3px;
}

.filter-value:hover{
    background:#f2f5f8;
}

.filter-value input{
    cursor:pointer;
}

.filter-value-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.filter-sort-section{
    border-top:1px solid #ddd;
    padding:8px;
    background:#fafafa;
}

.filter-sort-title{
    font-size:11px;
    color:#666;
    margin-bottom:6px;
    font-weight:bold;
}

.sort-row{
    display:flex;
    gap:5px;
    margin-bottom:6px;
}

.sort-row button{
    flex:1;
    padding:6px;
    font-size:11px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#fff;
    cursor:pointer;
}

.sort-row button:hover{
    background:#edf4ff;
}

.sort-priority-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
}

.sort-priority-row label{
    font-size:11px;
    color:#555;
}

.sort-priority-row input{
    width:60px;
    height:27px;
    border:1px solid #bbb;
    border-radius:4px;
    padding:3px 6px;
}

.filter-footer{
    display:flex;
    gap:6px;
    padding:8px;
    border-top:1px solid #ddd;
    background:#fff;
}

.filter-footer button{
    flex:1;
    padding:7px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#fff;
    cursor:pointer;
    font-size:11px;
}

.filter-footer .apply{
    background:#1677ff;
    color:#fff;
    border-color:#1677ff;
}

/* =========================================================
   SETTINGS PANEL
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.28);
    z-index:9000;
    display:none;
}

.overlay.show{
    display:block;
}

.settings-panel{
    position:fixed;
    top:55px;
    right:15px;
    width:430px;
    max-height:calc(100vh - 70px);
    overflow:auto;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
    z-index:10000;
    display:none;
}

.settings-panel.show{
    display:block;
}

.settings-header{
    position:sticky;
    top:0;
    z-index:2;
    background:#fff;
    padding:14px;
    border-bottom:1px solid #ddd;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.settings-header strong{
    font-size:16px;
}

.settings-body{
    padding:12px;
}

.setting-section{
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:12px;
    padding:10px;
}

.setting-section-title{
    font-weight:bold;
    font-size:13px;
    margin-bottom:9px;
}

.column-select-list{
    max-height:180px;
    overflow:auto;
    border:1px solid #ccc;
    border-radius:4px;
}

.column-select-item{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px;
    font-size:12px;
    cursor:pointer;
}

.column-select-item:hover{
    background:#f3f5f7;
}

.setting-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.setting-row label{
    width:110px;
    font-size:12px;
    color:#444;
}

.setting-row select,
.setting-row input[type="number"],
.setting-row input[type="text"]{
    flex:1;
    height:30px;
    border:1px solid #ccc;
    border-radius:4px;
    padding:4px 7px;
    font-size:12px;
}

.setting-row input[type="color"]{
    width:50px;
    height:30px;
    border:1px solid #ccc;
    padding:1px;
}

.setting-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    margin:6px 0;
}

.settings-actions{
    display:flex;
    gap:7px;
}

.settings-actions button{
    flex:1;
    padding:8px;
    border:1px solid #ccc;
    background:#fff;
    border-radius:4px;
    cursor:pointer;
}

.settings-actions .primary{
    background:#1677ff;
    color:#fff;
    border-color:#1677ff;
}

/* =========================================================
   RENAME DIALOG
========================================================= */

.dialog{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:360px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    z-index:20000;
    display:none;
}

.dialog.show{
    display:block;
}

.dialog-header{
    padding:13px;
    border-bottom:1px solid #ddd;
    font-weight:bold;
}

.dialog-body{
    padding:15px;
}

.dialog-body input{
    width:100%;
    height:35px;
    border:1px solid #bbb;
    border-radius:5px;
    padding:5px 8px;
}

.dialog-footer{
    display:flex;
    gap:7px;
    padding:10px 15px;
    border-top:1px solid #ddd;
}

.dialog-footer button{
    flex:1;
}

/* =========================================================
   CONTEXT MENU
========================================================= */

.context-menu{
    position:fixed;
    background:#fff;
    border:1px solid #ccc;
    border-radius:5px;
    box-shadow:0 5px 18px rgba(0,0,0,.2);
    z-index:20000;
    display:none;
    min-width:180px;
    overflow:hidden;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    width:100%;
    display:block;
    border:0;
    border-radius:0;
    text-align:left;
    background:#fff;
    padding:9px 12px;
    cursor:pointer;
    font-size:12px;
}

.context-menu button:hover{
    background:#edf4ff;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:30000;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    padding:18px 25px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    display:none;
}

.loading.show{
    display:block;
}

/* =========================================================
   FREEZE
========================================================= */

.freeze-cell{
    position:sticky !important;
    z-index:600 !important;
    background:#fff !important;
}

thead .freeze-cell{
    z-index:1200 !important;
}

thead .freeze-cell .header-main{
    background:#f8f9fa;
}

th.active-filter.freeze-cell .header-main{
    background:#dff5df;
}

th.active-sort.freeze-cell .header-main{
    background:#e7f0ff;
}

th.active-filter.active-sort.freeze-cell .header-main{
    background:#d8f2df;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){
    .settings-panel{
        width:calc(100vw - 20px);
        right:10px;
    }

    .filter-menu{
        width:calc(100vw - 20px);
        max-width:310px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<div class="topbar">

    <div class="title">
        📊 Report
    </div>

    <button onclick="resetAll()">
        ↺ Reset
    </button>

    <button onclick="refreshData()" class="primary">
        ⟳ Refresh
    </button>

    <button onclick="openSettings()">
        ⚙ Cài đặt
    </button>

    <div class="status" id="status">
        Đang tải dữ liệu...
    </div>

</div>

<!-- =======================================================
     TABLE
======================================================= -->

<div class="table-container" id="tableContainer">
    <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- =======================================================
     FILTER MENU
======================================================= -->

<div class="filter-menu" id="filterMenu">

    <div class="filter-title" id="filterTitle">
        Bộ lọc
    </div>

    <div class="filter-tools">

        <button onclick="selectAllFilterValues()">
            Chọn tất cả
        </button>

        <button onclick="clearAllFilterValues()">
            Bỏ chọn
        </button>

    </div>

    <div class="filter-search">

        <input
            id="filterSearch"
            type="text"
            placeholder="Tìm trong danh sách..."
            oninput="renderFilterValues()"
        >

    </div>

    <div class="filter-values" id="filterValues"></div>

    <!-- SORT -->

    <div class="filter-sort-section">

        <div class="filter-sort-title">
            SẮP XẾP CỘT NÀY
        </div>

        <div class="sort-row">

            <button onclick="sortCurrentColumn('asc')">
                ▲ Tăng dần
            </button>

            <button onclick="sortCurrentColumn('desc')">
                ▼ Giảm dần
            </button>

            <button onclick="removeCurrentSort()">
                ✕ Bỏ sort
            </button>

        </div>

        <div class="sort-priority-row">

            <label>
                Ưu tiên sort:
            </label>

            <input
                id="sortPriorityInput"
                type="number"
                min="1"
                step="1"
                placeholder="VD: 1"
            >

            <button onclick="applySortPriority()">
                Áp dụng
            </button>

        </div>

    </div>

    <div class="filter-footer">

        <button onclick="cancelFilter()">
            Hủy
        </button>

        <button class="apply" onclick="applyFilter()">
            Áp dụng
        </button>

    </div>

</div>

<!-- =======================================================
     SETTINGS OVERLAY
======================================================= -->

<div class="overlay" id="settingsOverlay" onclick="closeSettings()"></div>

<!-- =======================================================
     SETTINGS PANEL
======================================================= -->

<div class="settings-panel" id="settingsPanel">

    <div class="settings-header">

        <strong>
            ⚙ Cài đặt
        </strong>

        <button onclick="closeSettings()">
            ✕
        </button>

    </div>

    <div class="settings-body">

        <!-- CHỌN CỘT -->

        <div class="setting-section">

            <div class="setting-section-title">
                1. Chọn cột cần chỉnh
            </div>

            <div
                class="column-select-list"
                id="columnSelectList">
            </div>

            <div style="font-size:11px;color:#777;margin-top:7px;">
                Có thể chọn nhiều cột cùng lúc.
            </div>

        </div>

        <!-- ĐỊNH DẠNG -->

        <div class="setting-section">

            <div class="setting-section-title">
                2. Định dạng cột
            </div>

            <div class="setting-row">

                <label>
                    Căn lề
                </label>

                <select id="formatAlign">

                    <option value="unchanged">
                        Không thay đổi
                    </option>

                    <option value="left">
                        Trái
                    </option>

                    <option value="center">
                        Giữa
                    </option>

                    <option value="right">
                        Phải
                    </option>

                </select>

            </div>

            <div class="setting-row">

                <label>
                    Cỡ chữ
                </label>

                <input
                    id="formatFontSize"
                    type="number"
                    min="8"
                    max="40"
                    placeholder="Không thay đổi"
                >

            </div>

            <label class="setting-check">

                <input
                    id="formatBold"
                    type="checkbox"
                >

                Chữ đậm

            </label>

            <label class="setting-check">

                <input
                    id="formatItalic"
                    type="checkbox"
                >

                Chữ nghiêng

            </label>

            <label class="setting-check">

                <input
                    id="formatWrap"
                    type="checkbox"
                >

                Xuống dòng / Wrap text

            </label>

            <label class="setting-check">

                <input
                    id="changeTextColor"
                    type="checkbox"
                >

                Đổi màu chữ

            </label>

            <div class="setting-row">

                <label>
                    Màu chữ
                </label>

                <input
                    id="formatTextColor"
                    type="color"
                    value="#222222"
                >

            </div>

            <label class="setting-check">

                <input
                    id="changeBgColor"
                    type="checkbox"
                >

                Đổi màu nền

            </label>

            <div class="setting-row">

                <label>
                    Màu nền
                </label>

                <input
                    id="formatBgColor"
                    type="color"
                    value="#ffffff"
                >

            </div>

            <div class="settings-actions">

                <button
                    class="primary"
                    onclick="applyFormatting()">
                    Áp dụng cho cột đã chọn
                </button>

                <button
                    onclick="resetSelectedFormatting()">
                    Reset định dạng
                </button>

            </div>

        </div>

        <!-- ĐỔI TÊN -->

        <div class="setting-section">

            <div class="setting-section-title">
                3. Đổi tên cột
            </div>

            <div class="setting-row">

                <label>
                    Cột
                </label>

                <select id="renameColumnSelect"></select>

            </div>

            <div class="setting-row">

                <label>
                    Tên mới
                </label>

                <input
                    id="renameColumnInput"
                    type="text"
                    placeholder="Nhập tên muốn hiển thị"
                >

            </div>

            <div class="settings-actions">

                <button
                    class="primary"
                    onclick="renameColumn()">
                    Lưu tên cột
                </button>

                <button
                    onclick="resetColumnName()">
                    Tên gốc
                </button>

            </div>

        </div>

        <!-- FREEZE -->

        <div class="setting-section">

            <div class="setting-section-title">
                4. Cố định cột
            </div>

            <div class="setting-row">

                <label>
                    Số cột cố định
                </label>

                <select id="freezeCount">

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

            </div>

            <button
                class="primary"
                style="width:100%;"
                onclick="applyFreeze()">
                Áp dụng cố định cột
            </button>

        </div>

    </div>

</div>

<!-- =======================================================
     CONTEXT MENU
======================================================= -->

<div class="context-menu" id="contextMenu">

    <button onclick="contextRename()">
        ✏ Đổi tên cột
    </button>

    <button onclick="contextSort('asc')">
        ▲ Sort tăng dần
    </button>

    <button onclick="contextSort('desc')">
        ▼ Sort giảm dần
    </button>

    <button onclick="contextRemoveSort()">
        ✕ Bỏ sort
    </button>

</div>

<!-- =======================================================
     RENAME DIALOG
======================================================= -->

<div class="dialog" id="renameDialog">

    <div class="dialog-header">
        Đổi tên cột
    </div>

    <div class="dialog-body">

        <input
            id="renameDialogInput"
            type="text"
            placeholder="Tên cột mới"
        >

    </div>

    <div class="dialog-footer">

        <button onclick="closeRenameDialog()">
            Hủy
        </button>

        <button
            class="primary"
            onclick="saveRenameDialog()">
            Lưu
        </button>

    </div>

</div>

<!-- =======================================================
     LOADING
======================================================= -->

<div class="loading" id="loading">
    Đang tải dữ liệu...
</div>

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_ID =
    "19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS";

const SHEET_GID =
    "616860962";

const CSV_URL =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?tqx=out%3Acsv&gid=" +
    SHEET_GID;


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v6";


/* =========================================================
   HIDDEN HELPER COLUMNS
========================================================= */

const HIDDEN_COLUMNS = [
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
];


/* =========================================================
   SORT BY MAPPING
========================================================= */

const SORT_BY_MAP = {

    "DATA":"Sort_DATA",

    "Thoại nội mạng":"Sort_NM",

    "Thoại ngoại mạng":"Sort_NgM"

};


/* =========================================================
   STATE
========================================================= */

let headers = [];

let originalData = [];

let displayedData = [];

let columnNames = {};

let columnWidths = {};

let columnFormats = {};

let selectedFilters = {};

let defaultFilters = {};

let searchTexts = {};

let sortOrders = [];

let filterOrders = [];

let freezeCount = 0;

let currentFilterColumn = null;

let temporaryFilterValues = new Set();

let temporaryFilterSearch = "";

let currentContextColumn = null;


/* =========================================================
   DEFAULT FILTER COLUMNS
========================================================= */

const DEFAULT_UPDATE_COLUMN =
    "Ngày update";

const DEFAULT_STOP_COLUMN =
    "Dừng gói";


/* =========================================================
   LOAD STORAGE
========================================================= */

function loadStorage(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            );

        if(!saved) return;

        columnNames =
            saved.columnNames || {};

        columnWidths =
            saved.columnWidths || {};

        columnFormats =
            saved.columnFormats || {};

        selectedFilters =
            saved.selectedFilters || {};

        searchTexts =
            saved.searchTexts || {};

        sortOrders =
            saved.sortOrders || [];

        filterOrders =
            saved.filterOrders || [];

        freezeCount =
            saved.freezeCount || 0;

    }catch(e){

        console.warn(
            "Không đọc được localStorage",
            e
        );

    }

}


/* =========================================================
   SAVE STORAGE
========================================================= */

function saveStorage(){

    const data = {

        columnNames,

        columnWidths,

        columnFormats,

        selectedFilters,

        searchTexts,

        sortOrders,

        filterOrders,

        freezeCount

    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;

    for(let i=0;i<text.length;i++){

        const char = text[i];

        const next = text[i+1];

        if(char === '"' && insideQuotes && next === '"'){

            value += '"';

            i++;

            continue;

        }

        if(char === '"'){

            insideQuotes =
                !insideQuotes;

            continue;

        }

        if(char === ',' && !insideQuotes){

            row.push(value);

            value = "";

            continue;

        }

        if(
            (char === '\n' || char === '\r') &&
            !insideQuotes
        ){

            if(
                char === '\r' &&
                next === '\n'
            ){

                i++;

            }

            row.push(value);

            value = "";

            if(row.length > 1 || row[0] !== ""){

                rows.push(row);

            }

            row = [];

            continue;

        }

        value += char;

    }

    if(value !== "" || row.length){

        row.push(value);

        if(row.length > 1 || row[0] !== ""){

            rows.push(row);

        }

    }

    return rows;

}


/* =========================================================
   LOAD DATA
========================================================= */

async function refreshData(){

    showLoading(true);

    setStatus("Đang tải dữ liệu...");

    try{

        const response =
            await fetch(
                CSV_URL +
                "&_=" +
                Date.now()
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const text =
            await response.text();

        const rows =
            parseCSV(text);

        if(!rows.length){

            throw new Error(
                "Google Sheet không có dữ liệu"
            );

        }

        headers =
            rows[0].map(
                x => String(x || "").trim()
            );

        originalData =
            rows
                .slice(1)
                .map(row => {

                    const obj = {};

                    headers.forEach(
                        (header,index) => {

                            obj[index] =
                                row[index] !== undefined
                                    ? row[index]
                                    : "";

                        }
                    );

                    return obj;

                });

        initializeColumnNames();

        initializeDefaults();

        cleanupState();

        renderColumnSettings();

        applyAll();

        setStatus(
            "Đã cập nhật " +
            originalData.length.toLocaleString("vi-VN") +
            " dòng"
        );

    }catch(error){

        console.error(error);

        setStatus(
            "Lỗi tải dữ liệu"
        );

        alert(
            "Không tải được Google Sheet.\n\n" +
            error.message
        );

    }finally{

        showLoading(false);

    }

}


/* =========================================================
   INITIAL COLUMN NAMES
========================================================= */

function initializeColumnNames(){

    headers.forEach(
        (header,index) => {

            if(
                columnNames[index] === undefined
            ){

                columnNames[index] =
                    header;

            }

        }
    );

}


/* =========================================================
   HIDDEN COLUMN
========================================================= */

function isHiddenColumn(index){

    return HIDDEN_COLUMNS.includes(
        headers[index]
    );

}


/* =========================================================
   VISIBLE COLUMNS
========================================================= */

function getVisibleIndexes(){

    const result = [];

    headers.forEach(
        (header,index) => {

            if(!isHiddenColumn(index)){

                result.push(index);

            }

        }
    );

    return result;

}


/* =========================================================
   COLUMN INDEX
========================================================= */

function getColumnIndex(name){

    return headers.indexOf(name);

}


/* =========================================================
   GET DISPLAY NAME
========================================================= */

function getDisplayName(index){

    return (
        columnNames[index] ||
        headers[index]
    );

}


/* =========================================================
   UNIQUE VALUES
========================================================= */

function getUniqueValues(index){

    const set = new Set();

    originalData.forEach(row => {

        set.add(
            String(row[index] ?? "")
        );

    });

    return Array.from(set);

}


/* =========================================================
   DEFAULT FILTER
========================================================= */

function buildDefaultFilter(index){

    const header =
        headers[index];

    const values =
        getUniqueValues(index);

    if(header === DEFAULT_UPDATE_COLUMN){

        return new Set(
            values.filter(
                value =>
                    String(value).trim() !== ""
            )
        );

    }

    if(header === DEFAULT_STOP_COLUMN){

        if(values.includes("")){

            return new Set([""]);

        }

        return new Set();

    }

    return null;

}


/* =========================================================
   INITIALIZE DEFAULT FILTERS
========================================================= */

function initializeDefaults(){

    defaultFilters = {};

    headers.forEach(
        (header,index) => {

            if(isHiddenColumn(index))
                return;

            const defaults =
                buildDefaultFilter(index);

            if(defaults !== null){

                defaultFilters[index] =
                    defaults;

                if(
                    !Object.prototype.hasOwnProperty.call(
                        selectedFilters,
                        index
                    )
                ){

                    selectedFilters[index] =
                        Array.from(defaults);

                }

            }

        }
    );

}


/* =========================================================
   CLEANUP STATE
========================================================= */

function cleanupState(){

    const validIndexes =
        new Set(
            headers.map(
                (_,i) => String(i)
            )
        );

    Object.keys(columnNames)
        .forEach(key => {

            if(!validIndexes.has(String(key))){

                delete columnNames[key];

            }

        });

    Object.keys(selectedFilters)
        .forEach(key => {

            if(!validIndexes.has(String(key))){

                delete selectedFilters[key];

            }

        });

    Object.keys(searchTexts)
        .forEach(key => {

            if(!validIndexes.has(String(key))){

                delete searchTexts[key];

            }

        });

    sortOrders =
        sortOrders.filter(
            item =>
                validIndexes.has(
                    String(item.column)
                )
        );

    filterOrders =
        filterOrders.filter(
            index =>
                validIndexes.has(
                    String(index)
                )
        );

}


/* =========================================================
   APPLY ALL
========================================================= */

function applyAll(){

    let rows =
        [...originalData];

    /* FILTER */

    rows =
        rows.filter(row => {

            for(const key of Object.keys(selectedFilters)){

                const index =
                    Number(key);

                const selected =
                    selectedFilters[key];

                if(!Array.isArray(selected))
                    continue;

                const value =
                    String(
                        row[index] ?? ""
                    );

                if(
                    !selected.includes(value)
                ){

                    return false;

                }

            }

            return true;

        });

    /* SEARCH */

    rows =
        rows.filter(row => {

            for(const key of Object.keys(searchTexts)){

                const index =
                    Number(key);

                const search =
                    String(
                        searchTexts[key] || ""
                    )
                    .trim()
                    .toLowerCase();

                if(!search)
                    continue;

                const value =
                    String(
                        row[index] ?? ""
                    )
                    .toLowerCase();

                if(!value.includes(search)){

                    return false;

                }

            }

            return true;

        });

    /* SORT */

    rows =
        sortRows(rows);

    displayedData =
        rows;

    renderTable();

    saveStorage();

}


/* =========================================================
   GET SORT COLUMN
========================================================= */

function getSortColumn(index){

    const sourceName =
        headers[index];

    const helperName =
        SORT_BY_MAP[sourceName];

    if(helperName){

        const helperIndex =
            headers.indexOf(helperName);

        if(helperIndex >= 0){

            return helperIndex;

        }

    }

    return index;

}


/* =========================================================
   SORT VALUE
========================================================= */

function compareValues(a,b){

    if(a === "" && b === "")
        return 0;

    if(a === "")
        return 1;

    if(b === "")
        return -1;

    const na =
        Number(
            String(a)
                .replace(/,/g,"")
                .replace(/\s/g,"")
        );

    const nb =
        Number(
            String(b)
                .replace(/,/g,"")
                .replace(/\s/g,"")
        );

    if(
        !Number.isNaN(na) &&
        !Number.isNaN(nb)
    ){

        return na - nb;

    }

    return String(a)
        .localeCompare(
            String(b),
            "vi",
            {
                numeric:true,
                sensitivity:"base"
            }
        );

}


/* =========================================================
   SORT ROWS
========================================================= */

function sortRows(rows){

    if(!sortOrders.length)
        return rows;

    const orders =
        [...sortOrders]
            .sort(
                (a,b) =>
                    Number(a.priority) -
                    Number(b.priority)
            );

    return rows.sort(
        (a,b) => {

            for(const order of orders){

                const sourceColumn =
                    Number(order.column);

                const sortColumn =
                    getSortColumn(
                        sourceColumn
                    );

                const result =
                    compareValues(
                        a[sortColumn],
                        b[sortColumn]
                    );

                if(result !== 0){

                    return order.direction === "desc"
                        ? -result
                        : result;

                }

            }

            return 0;

        }
    );

}


/* =========================================================
   FORMAT UPDATE DATE
========================================================= */

function formatUpdateDate(value){

    const text =
        String(value ?? "").trim();

    if(!text)
        return "";

    let date =
        new Date(text);

    if(Number.isNaN(date.getTime())){

        const match =
            text.match(
                /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
            );

        if(match){

            date =
                new Date(
                    Number(match[3]),
                    Number(match[2]) - 1,
                    Number(match[1])
                );

        }

    }

    if(Number.isNaN(date.getTime())){

        return text;

    }

    const now =
        new Date();

    let months =
        (now.getFullYear() -
            date.getFullYear()) * 12 +
        (now.getMonth() -
            date.getMonth());

    if(months < 0)
        months = 0;

    if(months === 0){

        return "0 tháng";

    }

    return String(months).padStart(
        2,
        "0"
    ) + " tháng";

}


/* =========================================================
   GET CELL DISPLAY VALUE
========================================================= */

function getCellDisplayValue(
    index,
    value
){

    const header =
        headers[index];

    if(header === DEFAULT_UPDATE_COLUMN){

        return formatUpdateDate(value);

    }

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value);

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

    const thead =
        document.getElementById(
            "tableHead"
        );

    const tbody =
        document.getElementById(
            "tableBody"
        );

    thead.innerHTML = "";

    tbody.innerHTML = "";

    const visibleIndexes =
        getVisibleIndexes();

    /* HEADER */

    const headerRow =
        document.createElement("tr");

    visibleIndexes.forEach(
        index => {

            const th =
                document.createElement("th");

            th.dataset.index =
                index;

            const activeFilter =
                isColumnFiltered(index);

            const sort =
                sortOrders.find(
                    item =>
                        Number(item.column) === index
                );

            const activeSort =
                !!sort;

            if(activeFilter){

                th.classList.add(
                    "active-filter"
                );

            }

            if(activeSort){

                th.classList.add(
                    "active-sort"
                );

            }

            const main =
                document.createElement("div");

            main.className =
                "header-main";

            const title =
                document.createElement("div");

            title.className =
                "header-title";

            title.textContent =
                getDisplayName(index);

            title.title =
                getDisplayName(index);

            title.onclick =
                event => {

                    event.stopPropagation();

                    openFilter(
                        index,
                        th
                    );

                };

            title.ondblclick =
                event => {

                    event.stopPropagation();

                    openRenameDialog(
                        index
                    );

                };

            const right =
                document.createElement("div");

            right.className =
                "header-right";

            const arrow =
                document.createElement("span");

            arrow.className =
                "header-arrow";

            arrow.textContent =
                "▼";

            right.appendChild(
                arrow
            );

            if(activeFilter){

                const filterBadge =
                    document.createElement("span");

                filterBadge.className =
                    "filter-badge";

                const fPriority =
                    getFilterPriority(index);

                filterBadge.textContent =
                    fPriority
                        ? "F" + fPriority
                        : "✓";

                right.appendChild(
                    filterBadge
                );

            }

            if(activeSort){

                const badge =
                    document.createElement("span");

                badge.className =
                    "sort-badge " +
                    (
                        sort.direction === "asc"
                            ? "asc"
                            : "desc"
                    );

                badge.textContent =
                    String(sort.priority) +
                    (
                        sort.direction === "asc"
                            ? " ▲"
                            : " ▼"
                    );

                right.appendChild(
                    badge
                );

            }

            main.appendChild(
                title
            );

            main.appendChild(
                right
            );

            th.appendChild(
                main
            );

            /* SEARCH */

            const search =
                document.createElement("div");

            search.className =
                "search-cell";

            const input =
                document.createElement("input");

            input.className =
                "search-input";

            input.placeholder =
                "Tìm kiếm...";

            input.value =
                searchTexts[index] || "";

            input.oninput =
                debounce(
                    event => {

                        const value =
                            event.target.value;

                        if(value){

                            searchTexts[index] =
                                value;

                        }else{

                            delete searchTexts[index];

                        }

                        applyAll();

                    },
                    120
                );

            input.onclick =
                event => {

                    event.stopPropagation();

                };

            search.appendChild(
                input
            );

            th.appendChild(
                search
            );

            /* RESIZE */

            const resize =
                document.createElement("div");

            resize.className =
                "resize-handle";

            resize.onmousedown =
                event => {

                    startResize(
                        event,
                        index,
                        th
                    );

                };

            th.appendChild(
                resize
            );

            th.oncontextmenu =
                event => {

                    event.preventDefault();

                    currentContextColumn =
                        index;

                    openContextMenu(
                        event.clientX,
                        event.clientY
                    );

                };

            headerRow.appendChild(
                th
            );

        }
    );

    thead.appendChild(
        headerRow
    );


    /* BODY */

    if(!displayedData.length){

        const row =
            document.createElement("tr");

        const cell =
            document.createElement("td");

        cell.colSpan =
            visibleIndexes.length || 1;

        cell.className =
            "empty";

        cell.textContent =
            "Không có dữ liệu phù hợp";

        row.appendChild(
            cell
        );

        tbody.appendChild(
            row
        );

        applyWidthsAndFreeze();

        return;

    }


    displayedData.forEach(
        rowData => {

            const tr =
                document.createElement("tr");

            visibleIndexes.forEach(
                index => {

                    const td =
                        document.createElement("td");

                    td.dataset.index =
                        index;

                    const value =
                        getCellDisplayValue(
                            index,
                            rowData[index]
                        );

                    td.textContent =
                        value;

                    applyCellFormat(
                        td,
                        index
                    );

                    tr.appendChild(
                        td
                    );

                }
            );

            tbody.appendChild(
                tr
            );

        }
    );

    applyWidthsAndFreeze();

}


/* =========================================================
   COLUMN FILTER STATE
========================================================= */

function isColumnFiltered(index){

    if(
        Object.prototype.hasOwnProperty.call(
            selectedFilters,
            index
        )
    ){

        const selected =
            selectedFilters[index];

        const all =
            getUniqueValues(index);

        return !sameArray(
            selected,
            all
        );

    }

    return false;

}


/* =========================================================
   FILTER PRIORITY
========================================================= */

function getFilterPriority(index){

    const position =
        filterOrders.indexOf(index);

    if(position < 0)
        return null;

    return position + 1;

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(index, element){

    currentFilterColumn =
        index;

    const allValues =
        getUniqueValues(index);

    if(
        Object.prototype.hasOwnProperty.call(
            selectedFilters,
            index
        )
    ){

        temporaryFilterValues =
            new Set(
                selectedFilters[index]
            );

    }else{

        temporaryFilterValues =
            new Set(
                allValues
            );

    }

    temporaryFilterSearch =
        "";

    document.getElementById(
        "filterSearch"
    ).value = "";

    document.getElementById(
        "filterTitle"
    ).textContent =
        "Lọc: " +
        getDisplayName(index);

    const sort =
        sortOrders.find(
            item =>
                Number(item.column) === index
        );

    document.getElementById(
        "sortPriorityInput"
    ).value =
        sort
            ? sort.priority
            : "";

    renderFilterValues();

    const menu =
        document.getElementById(
            "filterMenu"
        );

    menu.classList.add(
        "show"
    );

    const rect =
        element.getBoundingClientRect();

    let left =
        rect.left;

    let top =
        rect.bottom + 3;

    const menuWidth =
        310;

    const menuHeight =
        520;

    if(
        left + menuWidth >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            menuWidth -
            10;

    }

    if(
        top + menuHeight >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            menuHeight -
            3;

    }

    if(top < 10)
        top = 10;

    menu.style.left =
        left + "px";

    menu.style.top =
        top + "px";

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues(){

    const container =
        document.getElementById(
            "filterValues"
        );

    container.innerHTML = "";

    if(currentFilterColumn === null)
        return;

    const search =
        String(
            document.getElementById(
                "filterSearch"
            ).value || ""
        )
        .toLowerCase()
        .trim();

    const values =
        getUniqueValues(
            currentFilterColumn
        );

    values.forEach(
        value => {

            const display =
                value === ""
                    ? "(Trống)"
                    : getCellDisplayValue(
                        currentFilterColumn,
                        value
                    );

            if(
                search &&
                !display
                    .toLowerCase()
                    .includes(search)
            ){

                return;

            }

            const label =
                document.createElement(
                    "label"
                );

            label.className =
                "filter-value";

            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.checked =
                temporaryFilterValues.has(
                    value
                );

            checkbox.onchange =
                () => {

                    if(checkbox.checked){

                        temporaryFilterValues.add(
                            value
                        );

                    }else{

                        temporaryFilterValues.delete(
                            value
                        );

                    }

                };

            const text =
                document.createElement(
                    "span"
                );

            text.className =
                "filter-value-text";

            text.textContent =
                display;

            label.appendChild(
                checkbox
            );

            label.appendChild(
                text
            );

            container.appendChild(
                label
            );

        }
    );

}


/* =========================================================
   SELECT ALL FILTER VALUES
========================================================= */

function selectAllFilterValues(){

    if(currentFilterColumn === null)
        return;

    temporaryFilterValues =
        new Set(
            getUniqueValues(
                currentFilterColumn
            )
        );

    renderFilterValues();

}


/* =========================================================
   CLEAR ALL FILTER VALUES
========================================================= */

function clearAllFilterValues(){

    temporaryFilterValues =
        new Set();

    renderFilterValues();

}


/* =========================================================
   APPLY FILTER
========================================================= */

function applyFilter(){

    if(currentFilterColumn === null)
        return;

    const index =
        currentFilterColumn;

    const allValues =
        getUniqueValues(index);

    const selected =
        Array.from(
            temporaryFilterValues
        );

    if(
        selected.length ===
        allValues.length
    ){

        /*
         * Chọn tất cả:
         * lưu toàn bộ giá trị để filter
         * thực sự hiển thị full dữ liệu.
         */

        selectedFilters[index] =
            selected;

    }else{

        selectedFilters[index] =
            selected;

    }

    /*
     * Ghi nhận thứ tự filter.
     */

    const defaultValues =
        defaultFilters[index];

    const selectedSet =
        new Set(selected);

    let differsFromDefault =
        true;

    if(defaultValues){

        differsFromDefault =
            !sameArray(
                Array.from(defaultValues),
                selected
            );

    }

    if(
        selected.length ===
        allValues.length &&
        !defaultValues
    ){

        const pos =
            filterOrders.indexOf(index);

        if(pos >= 0){

            filterOrders.splice(
                pos,
                1
            );

        }

    }else{

        if(
            !filterOrders.includes(index)
        ){

            filterOrders.push(index);

        }

    }

    closeFilter();

    applyAll();

}


/* =========================================================
   CANCEL FILTER
========================================================= */

function cancelFilter(){

    closeFilter();

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    document.getElementById(
        "filterMenu"
    ).classList.remove(
        "show"
    );

    currentFilterColumn =
        null;

}


/* =========================================================
   SORT CURRENT COLUMN
========================================================= */

function sortCurrentColumn(direction){

    if(currentFilterColumn === null)
        return;

    const index =
        currentFilterColumn;

    let existing =
        sortOrders.find(
            item =>
                Number(item.column) === index
        );

    if(existing){

        existing.direction =
            direction;

    }else{

        /*
         * Nếu chưa nhập priority,
         * tự lấy số lớn nhất + 1.
         */

        const max =
            sortOrders.length
                ? Math.max(
                    ...sortOrders.map(
                        x =>
                            Number(
                                x.priority
                            ) || 0
                    )
                )
                : 0;

        sortOrders.push({

            column:index,

            direction,

            priority:max + 1

        });

    }

    normalizeSortPriorities();

    closeFilter();

    applyAll();

}


/* =========================================================
   REMOVE CURRENT SORT
========================================================= */

function removeCurrentSort(){

    if(currentFilterColumn === null)
        return;

    const index =
        currentFilterColumn;

    sortOrders =
        sortOrders.filter(
            item =>
                Number(item.column) !== index
        );

    normalizeSortPriorities();

    closeFilter();

    applyAll();

}


/* =========================================================
   APPLY SORT PRIORITY
========================================================= */

function applySortPriority(){

    if(currentFilterColumn === null)
        return;

    const index =
        currentFilterColumn;

    const input =
        document.getElementById(
            "sortPriorityInput"
        );

    const priority =
        Number(
            input.value
        );

    if(
        !Number.isInteger(priority) ||
        priority < 1
    ){

        alert(
            "Vui lòng nhập số ưu tiên từ 1 trở lên."
        );

        return;

    }

    let existing =
        sortOrders.find(
            item =>
                Number(item.column) === index
        );

    if(!existing){

        existing = {

            column:index,

            direction:"asc",

            priority

        };

        sortOrders.push(
            existing
        );

    }else{

        existing.priority =
            priority;

    }

    normalizeSortPriorities();

    closeFilter();

    applyAll();

}


/* =========================================================
   NORMALIZE SORT PRIORITIES
========================================================= */

function normalizeSortPriorities(){

    /*
     * Cho phép người dùng nhập số tùy ý.
     *
     * Nếu:
     *
     * Giá = 1
     * DATA = 3
     * Chu kỳ = 2
     *
     * thứ tự sẽ là:
     *
     * Giá → Chu kỳ → DATA
     *
     * Sau đó chuẩn hóa thành:
     *
     * Giá = 1
     * Chu kỳ = 2
     * DATA = 3
     */

    sortOrders.sort(
        (a,b) =>
            Number(a.priority) -
            Number(b.priority)
    );

    sortOrders.forEach(
        (item,index) => {

            item.priority =
                index + 1;

        }
    );

}


/* =========================================================
   SAME ARRAY
========================================================= */

function sameArray(a,b){

    if(!Array.isArray(a) ||
       !Array.isArray(b)){

        return false;

    }

    if(a.length !== b.length)
        return false;

    const x =
        [...a].map(String).sort();

    const y =
        [...b].map(String).sort();

    return x.every(
        (value,index) =>
            value === y[index]
    );

}

/* =========================================================
   APPLY FORMATTING
========================================================= */

function applyFormatting(){

    const checked =
        Array.from(
            document.querySelectorAll(
                ".format-column-checkbox:checked"
            )
        );

    if(!checked.length){

        alert(
            "Vui lòng chọn ít nhất một cột."
        );

        return;

    }

    const align =
        document.getElementById(
            "formatAlign"
        ).value;

    const fontSize =
        document.getElementById(
            "formatFontSize"
        ).value;

    const bold =
        document.getElementById(
            "formatBold"
        ).checked;

    const italic =
        document.getElementById(
            "formatItalic"
        ).checked;

    const wrap =
        document.getElementById(
            "formatWrap"
        ).checked;

    const changeTextColor =
        document.getElementById(
            "changeTextColor"
        ).checked;

    const textColor =
        document.getElementById(
            "formatTextColor"
        ).value;

    const changeBgColor =
        document.getElementById(
            "changeBgColor"
        ).checked;

    const bgColor =
        document.getElementById(
            "formatBgColor"
        ).value;


    checked.forEach(
        checkbox => {

            const index =
                Number(
                    checkbox.dataset.index
                );

            if(!columnFormats[index]){

                columnFormats[index] = {};

            }

            const format =
                columnFormats[index];

            if(align !== "unchanged"){

                format.align =
                    align;

            }

            if(fontSize){

                format.fontSize =
                    Number(fontSize);

            }

            /*
             * Checkbox được hiểu là:
             * tick = áp dụng.
             */

            format.bold =
                bold;

            format.italic =
                italic;

            format.wrap =
                wrap;

            if(changeTextColor){

                format.textColor =
                    textColor;

            }

            if(changeBgColor){

                format.bgColor =
                    bgColor;

            }

        }
    );

    saveStorage();

    renderTable();

}

/* =========================================================
   APPLY CELL FORMAT
========================================================= */

function applyCellFormat(td,index){

    const format =
        columnFormats[index] || {};

    td.style.textAlign =
        format.align || "left";

    if(format.fontSize){

        td.style.fontSize =
            format.fontSize + "px";

    }

    td.style.fontWeight =
        format.bold
            ? "bold"
            : "normal";

    td.style.fontStyle =
        format.italic
            ? "italic"
            : "normal";

    td.style.whiteSpace =
        format.wrap
            ? "normal"
            : "nowrap";

    td.style.overflow =
        "hidden";

    td.style.textOverflow =
        format.wrap
            ? "clip"
            : "ellipsis";

    if(format.textColor){

        td.style.color =
            format.textColor;

    }

    if(format.bgColor){

        td.style.backgroundColor =
            format.bgColor;

    }

}

    );

    const width =
        190;

    const height =
        180;

        x =

            10;

    }

        y + height >
        window.innerHeight
    ){

        y =

            height -
            10;

    }

}

    document.getElementById(
        "contextMenu"

    );

function contextRename(){

    if(currentContextColumn === null)
        return;

    closeContextMenu();

    openRenameDialog(
        currentContextColumn
    );

function contextSort(direction){

    if(currentContextColumn === null)
        return;

    const index =
        currentContextColumn;

    let existing =
        sortOrders.find(
            item =>
                Number(item.column) === index
        );

    if(existing){

        existing.direction =
            direction;

    }else{

        const max =
            sortOrders.length
                ? Math.max(
                    ...sortOrders.map(
                        x =>
                            Number(
                                x.priority
                            ) || 0
                    )
                )
                : 0;

        sortOrders.push({

            column:index,

            direction,

            priority:max + 1

        });

    }

    normalizeSortPriorities();

    closeContextMenu();

    applyAll();

}


function contextRemoveSort(){

    if(currentContextColumn === null)
        return;

    sortOrders =
        sortOrders.filter(
            item =>
                Number(item.column) !==
                currentContextColumn
        );

    normalizeSortPriorities();

    closeContextMenu();

    applyAll();

}


/* =========================================================
   RESIZE COLUMNS
========================================================= */

function startResize(
    event,
    index,
    th
){

    event.preventDefault();

    const startX =
        event.clientX;

    const startWidth =
        th.getBoundingClientRect().width;

    function onMove(e){

        const newWidth =
            Math.max(
                50,
                startWidth +
                (
                    e.clientX -
                    startX
                )
            );

        columnWidths[index] =
            newWidth;

        applyWidthsAndFreeze();

    }

    function onUp(){

        document.removeEventListener(
            "mousemove",
            onMove
        );

        document.removeEventListener(
            "mouseup",
            onUp
        );

        saveStorage();

    }

    document.addEventListener(
        "mousemove",
        onMove
    );

    document.addEventListener(
        "mouseup",
        onUp
    );

}


/* =========================================================
   APPLY WIDTHS
========================================================= */

function applyWidthsAndFreeze(){

    const table =
        document.getElementById(
            "dataTable"
        );

    const visibleIndexes =
        getVisibleIndexes();

    visibleIndexes.forEach(
        index => {

            const width =
                columnWidths[index] ||
                150;

            const cells =
                table.querySelectorAll(
                    '[data-index="' +
                    index +
                    '"]'
                );

            cells.forEach(
                cell => {

                    cell.style.width =
                        width + "px";

                    cell.style.minWidth =
                        width + "px";

                    cell.style.maxWidth =
                        width + "px";

                }
            );

        }
    );

    applyFreezePositions();

}


/* =========================================================
   FREEZE
========================================================= */

function applyFreeze(){

    freezeCount =
        Number(
            document.getElementById(
                "freezeCount"
            ).value
        ) || 0;

    saveStorage();

    applyFreezePositions();

}


function applyFreezePositions(){

    const table =
        document.getElementById(
            "dataTable"
        );

    const visibleIndexes =
        getVisibleIndexes();

    const freezeIndexes =
        visibleIndexes.slice(
            0,
            freezeCount
        );

    let left =
        0;

    freezeIndexes.forEach(
        index => {

            const cells =
                table.querySelectorAll(
                    '[data-index="' +
                    index +
                    '"]'
                );

            cells.forEach(
                cell => {

                    cell.classList.add(
                        "freeze-cell"
                    );

                    cell.style.left =
                        left + "px";

                }
            );

            const width =
                columnWidths[index] ||
                150;

            left +=
                width;

        }
    );

    visibleIndexes
        .slice(freezeCount)
        .forEach(
            index => {

                const cells =
                    table.querySelectorAll(
                        '[data-index="' +
                        index +
                        '"]'
                    );

                cells.forEach(
                    cell => {

                        cell.classList.remove(
                            "freeze-cell"
                        );

                        cell.style.left =
                            "";

                    }
                );

            }
        );

}


/* =========================================================
   RESET ALL

function resetAll(){

    /*
     * Reset:
     * - Search
     * - Sort
     * - Filter về DEFAULT
     *
     * Không xóa:
     * - đổi tên cột
     * - độ rộng
     * - định dạng

    );

}


/* =========================================================
   DEBOUNCE
========================================================= */

function debounce(
    fn,
    delay
){

    let timer;

    return function(...args){

        clearTimeout(
            timer
        );

        timer =
            setTimeout(
                () => fn.apply(
                    this,
                    args
                ),
                delay
            );

    };

}

========================================================= */

document.addEventListener(
    "click",
    event => {

        const filterMenu =
            document.getElementById(
                "filterMenu"
            );

        if(
            filterMenu.classList.contains(
                "show"
            ) &&
            !filterMenu.contains(
                event.target
            ) &&
            !event.target.closest(
                "th"
            )
        ){

            closeFilter();

        }

        const contextMenu =
            document.getElementById(
                "contextMenu"
            );

        if(
            contextMenu.classList.contains(
                "show"
            ) &&
            !contextMenu.contains(
                event.target
            )
        ){

            closeContextMenu();

        }

    }
);
