<head>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    font-size:14px;
}

body{
    background:#fff;
}

#app{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:44px;

    display:flex;
    align-items:center;
    gap:7px;

    padding:5px 8px;

    background:#f5f5f5;
    border-bottom:1px solid #ccc;

    z-index:5000;
}

.toolbar button{
    height:32px;
    padding:0 12px;

    border:1px solid #bbb;
    border-radius:4px;

    background:#fff;

    cursor:pointer;
}

.toolbar button:hover{
    background:#eef5ff;
}

.toolbar-status{
    margin-left:auto;
    color:#666;
    white-space:nowrap;
}

/* =========================================================
   GLOBAL SEARCH
========================================================= */

.global-search-wrap{
    position:relative;

    width:260px;
    height:32px;

    display:flex;
    align-items:center;
}

.global-search-icon{
    position:absolute;

    left:8px;

    font-size:14px;

    pointer-events:none;

    z-index:2;
}

.global-search-ai-badge{
    position:absolute;
    left:26px;
    top:8px;
    height:16px;
    min-width:20px;
    padding:0 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #7b61ff;
    border-radius:3px;
    background:#f4f0ff;
    color:#6848d8;
    font-size:10px;
    font-weight:bold;
    line-height:16px;
    pointer-events:none;
    z-index:2;
}

.global-search{
    width:100%;
    height:32px;

    border:1px solid #bbb;
    border-radius:4px;

    padding:0 30px 0 52px;

    outline:none;

    font-family:Arial,sans-serif;
    font-size:14px;

    background:#fff;
}

.global-search:focus{
    border-color:#4285f4;

    box-shadow:
        0 0 0 1px #4285f4;
}

.global-search.ai-active{
    border-color:#7b61ff;

    box-shadow:
        0 0 0 1px #7b61ff;
}

.global-search-clear{
    position:absolute;

    right:5px;
    top:4px;

    width:24px;
    height:24px;

    padding:0;

    border:0;

    background:transparent;

    color:#777;

    font-size:20px;

    line-height:22px;

    cursor:pointer;

    display:none;
}

.global-search-clear:hover{
    background:#eee;

    border-radius:3px;
}

/* =========================================================
   FREEZE TOOLBAR
========================================================= */

.freeze-toolbar{
    height:32px;

    display:flex;

    align-items:center;

    gap:4px;

    white-space:nowrap;

    color:#444;

    font-size:13px;
}

.freeze-toolbar input{
    width:52px;
    height:30px;

    border:1px solid #bbb;
    border-radius:4px;

    padding:3px 5px;

    text-align:center;

    font-family:Arial,sans-serif;
    font-size:14px;

    outline:none;
}

.freeze-toolbar input:focus{
    border-color:#4285f4;

    box-shadow:
        0 0 0 1px #4285f4;
}

/* =========================================================
   TABLE SCROLL CONTAINER
========================================================= */

.table-wrapper{
    position:absolute;

    left:0;
    right:0;
    top:44px;
    bottom:0;

    overflow:auto;

    background:#fff;

}

/* =========================================================
   TABLE
========================================================= */

table{
    border-collapse:separate;
    border-spacing:0;

    table-layout:fixed;

    width:max-content;
    min-width:100%;
}

th,td{
    box-sizing:border-box;
}

/* =========================================================
   HEADER
========================================================= */

thead th{

    padding:0;

    border-right:1px solid #ccc;
    border-bottom:1px solid #aaa;

    background:#f1f3f5;
}

.header-cell{
    position:sticky !important;

    top:0 !important;

    height:38px;

    z-index:300 !important;

    background:#f1f3f5 !important;
}

.search-cell{
    position:sticky !important;

    top:38px !important;

    height:36px;

    z-index:299 !important;

    background:#fafafa !important;
}

.header-cell.frozen-column{
    position:sticky !important;

    top:0 !important;

    z-index:1000 !important;
}

.search-cell.frozen-column{
    position:sticky !important;

    top:38px !important;

    z-index:999 !important;
}

/* =========================================================
   HEADER CONTENT
========================================================= */

.header-content{

    align-items:center;

}

.header-title{

}

}

.header-button{

}

.header-button:hover{

/* =========================================================
   SEARCH
========================================================= */

.search-inner{

}

.column-search{

}

.column-search:focus{

}

/* =========================================================
   BODY
========================================================= */

tbody td{

    border-right:1px solid #ddd;
    border-bottom:1px solid #ddd;

    background:#fff;

}

.body-cell{
    white-space:pre-wrap;

    overflow-wrap:anywhere;

    word-break:break-word;
}

tbody td.frozen-column{
    position:sticky !important;

    z-index:100 !important;

    background:#fff;
}

.frozen-last{
    box-shadow:

}

/* =========================================================
   HEADER STATES
========================================================= */

.header-cell.filtered{
    background:#c8f7c5 !important;
}

.header-cell.sorted{
    background:#d8ebff !important;
}

.header-cell.filtered.sorted{
    background:#bdecc4 !important;
}

.header-cell.frozen-column.filtered{
    background:#c8f7c5 !important;
}

.header-cell.frozen-column.sorted{
    background:#d8ebff !important;
}

.header-cell.frozen-column.filtered.sorted{

/* =========================================================
   RESIZE
========================================================= */

.resize-handle{

    right:-3px;
    top:0;

    height:100%;

}

.resize-handle:hover{

========================================================= */

.filter-menu-inner{

.menu-title{

.filter-actions{

}

.menu-button{

}

.menu-button:hover{

.filter-values{

.filter-value-row{

}

.filter-value-row:hover{

}

.filter-value-row label{

}

/* =========================================================
   SORT
========================================================= */

.menu-section{
    margin-top:10px;

    padding-top:9px;

    border-top:1px solid #ddd;
}

.menu-section-title{
    font-weight:bold;

    margin-bottom:7px;
}

.form-row{

    margin-bottom:7px;
}

.form-row > label{

.form-row select,

}

.sort-direction{

    align-items:center;

    flex-wrap:wrap;
}

.sort-direction label{
    display:flex;

    align-items:center;

    gap:4px;
}

/* =========================================================
   FORMAT
========================================================= */

.format-checks{
    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-bottom:7px;
}

.format-checks label{
    display:flex;

    align-items:center;

}

.color-row{

.color-row label{

}

.color-input{

}

/* =========================================================

========================================================= */

.menu-footer{

/* =========================================================
   SETTINGS
========================================================= */

.settings-overlay{

    inset:0;

    display:none;

    background:rgba(0,0,0,.25);

}

.settings-panel{

    max-height:calc(100vh - 70px);

    background:#fff;

    border-radius:6px;

    padding:12px;
}

.settings-title{
    font-size:17px;

    font-weight:bold;

    margin-bottom:12px;
}

.settings-row{
    margin-bottom:10px;
}

.settings-row > label{
    display:block;

    margin-bottom:4px;

    font-weight:bold;
}

.settings-row input,
.settings-row select{
    width:100%;

    height:30px;

    border:1px solid #bbb;

    border-radius:3px;

    padding:3px 6px;
}

/* =========================================================
   RENAME PANEL
========================================================= */

.rename-list{
    border:1px solid #ddd;

    max-height:350px;

    overflow-y:auto;
}

.rename-item{
    display:flex;

    align-items:center;

    padding:5px;

    border-bottom:1px solid #eee;
}

.rename-item:last-child{
    border-bottom:0;
}

.rename-original{
    width:135px;

    flex-shrink:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.rename-item input{
    flex:1;

    height:29px;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;

    left:0;
    right:0;
    top:44px;
    bottom:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(255,255,255,.85);

    z-index:11000;

    font-size:16px;
}

.hidden{
    display:none !important;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    padding:30px;

    text-align:center;

    color:#777;
}

<script>
"use strict";

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   CLOUDFLARE AI SEARCH
========================================================= */

const AI_SEARCH_URL =
"https://dinhviethung-ai-search.hung-dinhviet1997.workers.dev";

/*
   AI được tích hợp trực tiếp vào ô tìm kiếm tổng.
   Câu hỏi tự nhiên sẽ được gửi tới Cloudflare Worker
   cùng metadata cột và dữ liệu hiện tại của Google Sheet.
*/


/*
   Các từ/cụm từ thường cho thấy người dùng đang hỏi AI
   thay vì chỉ tìm một từ khóa trong bảng.
*/
const AI_TRIGGER_WORDS = [
    "tìm",
    "tim",
    "có gói",
    "co goi",
    "gói nào",
    "goi nao",
    "giá dưới",
    "gia duoi",
    "giá trên",
    "gia tren",
    "rẻ hơn",
    "re hon",
    "đắt hơn",
    "dat hon",
    "thấp hơn",
    "thap hon",
    "cao hơn",
    "cao hon",
    "ít nhất",
    "it nhat",
    "nhiều nhất",
    "nhieu nhat",
    "từ thấp đến cao",
    "tu thap den cao",
    "từ cao đến thấp",
    "tu cao den thap",
    "sắp xếp",
    "sap xep",
    "tương đương",
    "tuong duong",
    "lớn hơn",
    "lon hon",
    "nhỏ hơn",
    "nho hon",
    "bằng",
    "bang",
    "dưới",
    "duoi",
    "trên",
    "tren",
    ">= ",
    "<= ",
    "bao nhiêu",
    "bao nhieu"
];


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
"report_google_sheet_table_v11";

const OLD_KEYS = [
    "report_google_sheet_table_v10",
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SPECIAL SORT MAPPING
========================================================= */

const SORT_BY_MAP = {

    "DATA":
        "Sort_DATA",

    "Thoại nội mạng":
        "Sort_NM",

    "Thoại ngoại mạng":
        "Sort_NgM"

};


/* =========================================================
   DATA
========================================================= */

let headers = [];

let rows = [];


/* =========================================================
   STATE
========================================================= */

let filters = {};

let searches = {};

let sorts = {};

let globalSearch = "";

let columnWidths = {};

let columnFormats = {};

let renamedHeaders = {

    "Package": "Gói cước",

    "TOTAL PRICE": "Giá gói",

    "REVENUE": "Chu kỳ",

    "Cách tính chu kỳ": "1 chu kỳ",

    "Packageprice": "Giá/kỳ"

};

let freezeCount = 6;


/* =========================================================
   AI STATE
========================================================= */

let aiQuery = "";

let aiConditions = [];

let aiSort = [];

let aiSearching = false;

let aiSearchTimer = null;

let aiRequestId = 0;


/* =========================================================
   DEFAULT FILTER
========================================================= */

let defaultFiltersInitialized =
false;


/* =========================================================
   FILTER MENU
========================================================= */

let openFilterIndex =
null;

let filterMenuElement =
null;

let filterValueSearch =
"";


/* =========================================================
   RESIZE
========================================================= */

let resizeState =
null;


/* =========================================================
   AUTO REFRESH
========================================================= */

let autoRefreshTimer =
null;


/* =========================================================
   DOM
========================================================= */

const table =
document.getElementById(
    "dataTable"
);

const thead =
table.querySelector(
    "thead"
);

const tbody =
table.querySelector(
    "tbody"
);

const tableWrapper =
document.getElementById(
    "tableWrapper"
);

const loading =
document.getElementById(
    "loading"
);

const statusEl =
document.getElementById(
    "status"
);

const settingsOverlay =
document.getElementById(
    "settingsOverlay"
);

const freezeCountInput =
document.getElementById(
    "freezeCountInput"
);

const autoRefreshSelect =
document.getElementById(
    "autoRefreshSelect"
);

const renameList =
document.getElementById(
    "renameList"
);

const toolbarFreezeCount =
document.getElementById(
    "toolbarFreezeCount"
);

const globalSearchInput =
document.getElementById(
    "globalSearchInput"
);

const clearGlobalSearchBtn =
document.getElementById(
    "clearGlobalSearchBtn"
);


/* =========================================================
   LOAD STATE
========================================================= */

function loadState(){

    let saved = null;

    try{

        const current =
        localStorage.getItem(
            STORAGE_KEY
        );

        if(current){

            saved =
            JSON.parse(
                current
            );

        }


        if(!saved){

            for(
                const key of OLD_KEYS
            ){

                const old =
                localStorage.getItem(
                    key
                );

                if(old){

                    saved =
                    JSON.parse(
                        old
                    );

                    break;
                }
            }
        }

    }
    catch(error){

        console.warn(
            "Không đọc được LocalStorage",
            error
        );

    }


    if(!saved){

        return;
    }


    filters =
    saved.filters || {};

    searches =
    saved.searches || {};

    globalSearch =
    String(
        saved.globalSearch || ""
    );

    columnWidths =
    saved.columnWidths || {};

    columnFormats =
    saved.columnFormats || {};

    renamedHeaders = {

        ...(saved.renamedHeaders || {}),

        "Package":
            "Gói cước",

        "TOTAL PRICE":
            "Giá gói",

        "REVENUE":
            "Chu kỳ",

        "Cách tính chu kỳ":
            "1 chu kỳ",

        "Packageprice":
            "Giá/kỳ"

    };


    freezeCount =
    saved.freezeCount !== undefined
        ? Number(saved.freezeCount)
        : 6;

}


/* =========================================================
   SAVE STATE
========================================================= */

function saveState(){

    try{

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                filters,

            })

        );

    }
    catch(error){

        );

    }

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const result = [];

    let row = [];

    let cell = "";

    let inQuotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const c =
        text[i];

        const next =
        text[i + 1];


        if(c === '"'){

            if(
                inQuotes &&
                next === '"'
            ){

                cell += '"';

                i++;

            }
            else{

                inQuotes =
                !inQuotes;

            }

        }

        else if(
            c === "," &&
            !inQuotes
        ){

            row.push(cell);

            cell = "";

        }

        else if(
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !inQuotes
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(cell);

            cell = "";


            if(
                row.length > 1 ||
                row[0] !== ""
            ){

                result.push(row);

            }


            row = [];

        }

        else{

            cell += c;

        }

    }


    if(
        cell.length > 0 ||
        row.length > 0
    ){

        row.push(cell);

        result.push(row);

    }


    return result;

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    loading.classList.remove(
        "hidden"
    );

    statusEl.textContent =
    "Đang tải dữ liệu...";


    try{

        const response =
        await fetch(

            CSV_URL +
            "&cachebust=" +
            Date.now(),

            {
                cache:"no-store"
            }

        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
        await response.text();


        if(!text.trim()){

            throw new Error(
                "Google Sheet trả về rỗng."
            );

        }


        const parsed =
        parseCSV(text);


        if(
            !parsed.length ||
            !parsed[0].length
        ){

            throw new Error(
                "Không tìm thấy header."
            );

        }


        headers =
        parsed[0].map(
            value =>
            String(value).trim()
        );


        rows =
        parsed
        .slice(1)
        .map(sourceRow => {

            const row =
            new Array(
                headers.length
            ).fill("");


            for(
                let i = 0;
                i < headers.length;
                i++
            ){

                row[i] =
                sourceRow[i] == null
                    ? ""
                    : String(
                        sourceRow[i]
                    );

            }


            return row;

        });


        /* Chuẩn bị cache cho Hỏi AI một lần duy nhất. */
        rebuildAIRowCache();


        initializeDefaults();

        renderTable();

        updateToolbarFreezeCount();

        updateGlobalSearchUI();


        statusEl.textContent =
        `${rows.length.toLocaleString("vi-VN")} dòng • cập nhật ${new Date().toLocaleTimeString("vi-VN")}`;


    }
    catch(error){

        console.error(error);


        statusEl.textContent =
        "Lỗi tải dữ liệu";


        thead.innerHTML = "";

        tbody.innerHTML = "";


        const tr =
        document.createElement("tr");


        const td =
        document.createElement("td");


        td.colSpan =
        Math.max(
            headers.length,
            1
        );


        td.className =
        "message";


        td.textContent =
        "Không tải được Google Sheet: " +
        error.message;


        tr.appendChild(td);

        tbody.appendChild(tr);

    }
    finally{

        loading.classList.add(
            "hidden"
        );

    }

}

/* =========================================================
   NUMBER
========================================================= */

function parseVNNumber(value){

    const s =
    String(
        value ?? ""
    ).trim();


    if(!s){

        return null;

    }


    if(
        /^-?\d{1,3}(\.\d{3})+(,\d+)?$/
        .test(s)
    ){

        return Number(

            s
            .replace(/\./g,"")
            .replace(",",".")
        );

    }


    if(
        /^-?\d+(,\d+)?$/
        .test(s)
    ){

        return Number(
            s.replace(",",".")
        );

    }


    if(
        /^-?\d+(\.\d+)?$/
        .test(s)
    ){

        return Number(s);

    }


    /*
       Hỗ trợ các giá trị như:
       100k
       1.5k
       1M
    */

    const compact =
    s
    .toLowerCase()
    .replace(/\s+/g,"");


    const compactMatch =
    compact.match(
        /^(-?\d+(?:[.,]\d+)?)\s*(k|m|tr|triệu|gb|mb)?$/i
    );


    if(compactMatch){

        let number =
        Number(
            compactMatch[1]
            .replace(",",".")
        );


        if(
            compactMatch[2] === "k"
        ){

            number *= 1000;

        }

        else if(
            compactMatch[2] === "m" ||
            compactMatch[2] === "tr" ||
            compactMatch[2] === "triệu"
        ){

            number *= 1000000;

        }


        return number;

    }


    return null;

}


/* =========================================================
   DATE
========================================================= */

function parseVietnameseDate(value){

    const s =
    String(
        value ?? ""
    ).trim();


    const match =
    s.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


    if(!match){

        return null;

    }


    const day =
    Number(match[1]);


    const month =
    Number(match[2]) - 1;


    const year =
    Number(match[3]);


    const date =
    new Date(
        year,
        month,
        day
    );


    if(
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
    ){

        return null;

    }


    return date;

}


/* =========================================================
   DATE DISPLAY
========================================================= */

function displayDateRelative(value){

    const date =
    parseVietnameseDate(value);


    if(!date){

        return value;

    }


    const now =
    new Date();


    const months =
    (
        now.getFullYear() -
        date.getFullYear()
    ) * 12
    +
    (
        now.getMonth() -
        date.getMonth()
    );


    const n =
    Math.max(
        0,
        months
    );


    if(n === 0){

        return "0 tháng";

    }


    return (
        String(n).padStart(2,"0") +
        " tháng"
    );

}

/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(
    row,
    index
){

    const originalHeader =
    headers[index];


    const helperHeader =
    SORT_BY_MAP[
        originalHeader
    ];


    let value =
    row[index];


    if(helperHeader){

        const helperIndex =
        headers.indexOf(
            helperHeader
        );


        if(
            helperIndex >= 0 &&
            String(
                row[helperIndex] ?? ""
            ).trim() !== ""
        ){

            value =
            row[helperIndex];

        }

    }


    const number =
    parseVNNumber(value);


    if(number !== null){

        return {

            type:"number",

            value:number

        };

    }


    const date =
    parseVietnameseDate(value);


    if(date){

        return {

            type:"date",

            value:
            date.getTime()

        };

    }


    return {

        type:"text",

        value:
        String(
            value ?? ""
        )
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

    };

}


/* =========================================================
   NORMALIZE SEARCH TEXT
========================================================= */

function normalizeSearchText(value){

    return String(
        value ?? ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim();

}


/* =========================================================
   AI TRIGGER
========================================================= */

function shouldUseAI(query){

    const normalized =
    normalizeSearchText(
        query
    );


    if(!normalized){

        return false;

    }


    /*
       Câu hỏi có từ khóa tự nhiên.
    */

    if(
        AI_TRIGGER_WORDS.some(
            word =>
            normalized.includes(
                normalizeSearchText(word)
            )
        )
    ){

        return true;

    }


    /*
       Các biểu thức so sánh.
    */

    if(
        /(?:<=|>=|<|>|\b\d+\s*k\b|\b\d+\s*tr\b|\b\d+\s*gb\b|\b\d+\s*mb\b)/i
        .test(normalized)
    ){

        return true;

    }


    /*
       Câu dài nhiều từ thường là câu hỏi.
    */

    const words =
    normalized.split(/\s+/)
    .filter(Boolean);


    return words.length >= 5;

}

/* =========================================================
   AI APPLY RESULT
========================================================= */

function applyAIResult(data, question){

    /*
       Worker có thể trả:

       {
          response: {
             success,
             message,
             filters,
             sort
          }
       }

       hoặc trực tiếp:

       {
          success,
          message,
          filters,
          sort
       }
    */

    let result =
    data?.result ||
    data?.response ||
    data;


    if(
        result &&
        result.response &&
        typeof result.response === "object"
    ){

        result =
        result.response;

    }

    if(
        result &&
        result.result &&
        typeof result.result === "object"
    ){

        result =
        result.result;

    }


    if(
        !result ||
        result.success === false
    ){

        throw new Error(
            result?.message ||
            result?.error ||
            "AI không trả về kết quả hợp lệ."
        );

    }


    const conditions =
    Array.isArray(
        result.filters
    )
        ? result.filters
        : [];


    const sortsFromAI =
    Array.isArray(
        result.sort
    )
        ? result.sort
        : [];


    aiQuery =
    question;


    aiConditions =
    conditions;


    aiSort =
    sortsFromAI;


    /*
       Áp dụng filter AI.
       Không xóa filter thủ công của
       các cột khác nếu AI không đụng tới.
    */

    conditions.forEach(
        condition => {

            applyAICondition(
                condition
            );

        }
    );


    /*
       Áp dụng sort AI.
    */

    if(
        sortsFromAI.length > 0
    ){

        /*
           Chỉ thay sort ở các cột
           mà AI yêu cầu.
        */

        sortsFromAI.forEach(
            (sortItem, index) => {

                const columnIndex =
                resolveAIColumnIndex(
                    sortItem.column
                );


                if(
                    columnIndex < 0
                ){

                    return;

                }


                sorts[columnIndex] = {

                    direction:
                    sortItem.direction === "desc"
                        ? "desc"
                        : "asc",

                    priority:
                    index + 1

                };

            }
        );

    }


    /*
       Xóa global search thường,
       vì AI đã tiếp quản câu hỏi.
    */

    globalSearch = "";


    if(globalSearchInput){

        globalSearchInput.value =
        question;

    }


    saveState();

    renderBody();

    updateHeaderStates();

    updateGlobalSearchUI();


    const matched =
    getVisibleRows().length;


    statusEl.textContent =
    `🤖 AI: ${result.message || "Đã áp dụng"} • ${matched.toLocaleString("vi-VN")} dòng`;

}


/* =========================================================
   RESOLVE AI COLUMN
========================================================= */

function resolveAIColumnIndex(
    column
){

    if(
        typeof column === "number"
    ){

        return (
            column >= 0 &&
            column < headers.length
        )
            ? column
            : -1;

    }


    const text =
    String(
        column ?? ""
    ).trim();


    if(!text){

        return -1;

    }


    /*
       Tên gốc.
    */

    let index =
    headers.findIndex(
        header =>
        normalizeSearchText(header) ===
        normalizeSearchText(text)
    );


    if(index >= 0){

        return index;

    }


    /*
       Tên hiển thị.
    */

    index =
    headers.findIndex(
        header =>
        normalizeSearchText(
            getDisplayHeader(header)
        ) ===
        normalizeSearchText(text)
    );


    if(index >= 0){

        return index;

    }


    /*
       Cho phép AI trả tên gần đúng.
    */

    index =
    headers.findIndex(
        header => {

            const a =
            normalizeSearchText(
                header
            );

            const b =
            normalizeSearchText(
                text
            );

            return (
                a.includes(b) ||
                b.includes(a)
            );

        }
    );


    return index;

}


/* =========================================================
   AI APPLY CONDITION
========================================================= */

function applyAICondition(
    condition
){

    if(!condition){

        return;

    }


    const index =
    resolveAIColumnIndex(
        condition.column
    );


    if(index < 0){

        return;

    }


    const operator =
    String(
        condition.operator || "equals"
    );


    const target =
    String(
        condition.value ?? ""
    );


    const matchingValues =
    getAllColumnValues(
        index
    )
    .filter(
        value =>
        aiValueMatches(
            value,
            operator,
            target,
            index
        )
    );


    /*
       AI filter tác động lên column.
    */

    filters[index] =
    matchingValues;

}


/* =========================================================
   AI VALUE MATCH
========================================================= */

function aiValueMatches(
    actual,
    operator,
    expected,
    index
){

    const actualText =
    normalizeSearchText(
        actual
    );


    const expectedText =
    normalizeSearchText(
        expected
    );


    /*
       equals
    */

    if(
        operator === "equals"
    ){

        /*
           Với số:
           100000 = 100.000
        */

        const actualNumber =
        parseVNNumber(actual);


        const expectedNumber =
        parseVNNumber(expected);


        if(
            actualNumber !== null &&
            expectedNumber !== null
        ){

            return (
                actualNumber ===
                expectedNumber
            );

        }


        return (
            actualText ===
            expectedText
        );

    }


    if(
        operator === "not_equals"
    ){

        return !aiValueMatches(
            actual,
            "equals",
            expected,
            index
        );

    }


    if(
        operator === "contains"
    ){

        return actualText.includes(
            expectedText
        );

    }


    if(
        operator === "not_contains"
    ){

        return !actualText.includes(
            expectedText
        );

    }


    const actualNumber =
    parseVNNumber(actual);


    const expectedNumber =
    parseVNNumber(expected);


    if(
        actualNumber === null ||
        expectedNumber === null
    ){

        return false;

    }


    if(
        operator === "greater_than"
    ){

        return (
            actualNumber >
            expectedNumber
        );

    }


    if(
        operator === "greater_or_equal"
    ){

        return (
            actualNumber >=
            expectedNumber
        );

    }


    if(
        operator === "less_than"
    ){

        return (
            actualNumber <
            expectedNumber
        );

    }


    if(
        operator === "less_or_equal"
    ){

        return (
            actualNumber <=
            expectedNumber
        );

    }


    return false;

}


/* =========================================================
   AI CONTEXT SELECTION
========================================================= */

/*
   KHÔNG gửi toàn bộ Google Sheet cho AI.
   Chỉ lấy những dòng phù hợp nhất với câu hỏi và dừng khi
   tổng dữ liệu gửi đi đạt giới hạn ký tự an toàn.
*/
const AI_MAX_CONTEXT_CHARS = 30000;
const AI_MAX_CONTEXT_ROWS = 40;
const AI_MAX_CELL_CHARS = 200;

/*
   Cache dữ liệu AI một lần sau khi Google Sheet tải xong.
   Nhờ vậy mỗi lần hỏi AI không phải normalize toàn bộ Sheet lại.
*/
let aiRowCache = [];

function rebuildAIRowCache(){
    aiRowCache = rows.map((row, originalIndex) => {
        const normalizedCells = row.map(value =>
            normalizeSearchText(value)
        );

        return {
            row,
            originalIndex,
            fullText: normalizedCells.join(" "),
            packageValue: normalizedCells[headers.findIndex(h =>
                normalizeSearchText(h) === "package"
            )] || ""
        };
    });
}

function getAIQuestionTokens(question){
    const stopWords = new Set([
        "cho","toi","tôi","biet","biết","tim","tìm",
        "giup","giúp","voi","với","la","là","co","có",
        "bao","nhiêu","nhieu","nao","nào","the","thế",
        "gi","gì","cua","của","ve","về","goi","gói",
        "cuoc","cước","hay","va","và","trong","tren","trên",
        "xin","hãy","hay","mot","một","nhung","những"
    ]);

    return normalizeSearchText(question)
        .replace(/[^\p{L}\p{N}%.,<>!=+\-]+/gu, " ")
        .split(/\s+/)
        .filter(x => x.length >= 2 && !stopWords.has(x));
}

function buildAIContextRows(question){
    if(!rows.length){
        return [];
    }

    if(aiRowCache.length !== rows.length){
        rebuildAIRowCache();
    }

    const q = normalizeSearchText(question);
    const tokens = getAIQuestionTokens(question);
    const scored = [];

    /*
       Tìm nhanh trên cache đã normalize sẵn.
       Nếu có mã/gói xuất hiện nguyên câu thì ưu tiên rất cao.
    */
    for(const item of aiRowCache){
        let score = 0;

        if(q.length >= 3 && item.fullText.includes(q)){
            score += 1000;
        }

        for(const token of tokens){
            if(item.fullText.includes(token)){
                score += token.length >= 5 ? 12 : 5;
            }
        }

        if(item.packageValue && q.includes(item.packageValue)){
            score += 300;
        }

        if(score > 0){
            scored.push({item, score});
        }
    }

    scored.sort((a,b) =>
        b.score - a.score ||
        a.item.originalIndex - b.item.originalIndex
    );

    /*
       Chỉ gửi tối đa 40 dòng.
       Nếu câu hỏi không chứa từ khóa trùng trực tiếp với dữ liệu,
       vẫn gửi một mẫu nhỏ để Worker/AI không bị nhận context rỗng.
    */
    let selected = scored.slice(0, AI_MAX_CONTEXT_ROWS);

    if(!selected.length){
        selected = aiRowCache
            .slice(0, Math.min(10, AI_MAX_CONTEXT_ROWS))
            .map(item => ({ item, score: 0 }));
    }

    const result = [];
    let totalChars = 0;

    for(const entry of selected){
        const obj = {};
        let rowChars = 0;

        headers.forEach((header,index) => {
            let value = String(entry.item.row[index] ?? "");

            if(value.length > AI_MAX_CELL_CHARS){
                value = value.slice(0, AI_MAX_CELL_CHARS) + "…";
            }

            obj[header] = value;
            rowChars += header.length + value.length + 6;
        });

        if(result.length > 0 && totalChars + rowChars > AI_MAX_CONTEXT_CHARS){
            break;
        }

        result.push(obj);
        totalChars += rowChars;
    }

    return result;
}

                    /*
                       QUAN TRỌNG:
                       Chỉ gửi context đã được lọc/chấm điểm.
                       Không còn gửi toàn bộ rows của Google Sheet.
                    */
                    rows:
                        buildAIContextRows(
                            question
                        )

                })

            }

        );


        if(
            requestId !== aiRequestId
        ){

            return;

        }


        let data = null;


        try{

            data =
            await response.json();

        }
        catch(error){

            throw new Error(
                "Worker AI trả về dữ liệu không hợp lệ."
            );

        }


        if(!response.ok){

            throw new Error(
                data?.message ||
                data?.error ||
                `HTTP ${response.status}`
            );

        }


        applyAIResult(
            data,
            question
        );


    }
    catch(error){

        console.error(
            "AI SEARCH ERROR:",
            error
        );


        /*
           Nếu AI lỗi thì quay lại
           tìm kiếm thông thường.
        */

        aiQuery = "";

        aiConditions = [];

        aiSort = [];


        globalSearch =
        question;


        updateGlobalSearchUI();

        renderBody();

        updateHeaderStates();


        statusEl.textContent =
        "⚠ AI lỗi: " +
        (error?.message || "không xác định") +
        " • đang tìm kiếm thông thường";

    }
    finally{

        if(
            requestId === aiRequestId
        ){

            aiSearching = false;

            globalSearchInput.classList.remove(
                "ai-active"
            );

        }

    }

}


/* =========================================================
   ROW MATCH
========================================================= */

function rowMatchesFilters(
    row,
    ignoreColumn = -1
){

    /*
       FILTER
    */

    for(
        const key of Object.keys(filters)
    ){

        const index =
        Number(key);


        if(
            index === ignoreColumn
        ){

            continue;

        }


        const selected =
        filters[key];


        if(
            selected === undefined
        ){

            continue;

        }


        /*
           Bỏ chọn hết
           = không có dòng.
        */

        if(
            Array.isArray(selected) &&
            selected.length === 0
        ){

            return false;

        }


        const value =
        String(
            row[index] ?? ""
        );


        if(
            Array.isArray(selected) &&
            selected.length > 0 &&
            !selected.includes(value)
        ){

            return false;

        }

    }


    /*
       GLOBAL SEARCH
    */

    const globalQuery =
    String(
        globalSearch || ""
    )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );


    if(globalQuery){

        const rowText =
        row
        .map(
            value =>
            String(
                value ?? ""
            )
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
        )
        .join(" ");


        if(
            !rowText.includes(
                globalQuery
            )
        ){

            return false;

        }

    }


    /*
       SEARCH CỘT
    */

    for(
        const key of Object.keys(searches)
    ){

        const index =
        Number(key);


        if(
            index === ignoreColumn
        ){

            continue;

        }


        const query =
        String(
            searches[key] ?? ""
        )
        .trim()
        .toLowerCase();


        if(!query){

            continue;

        }


        const value =
        String(
            row[index] ?? ""
        )
        .toLowerCase();


        if(
            !value.includes(query)
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   FILTER VALUES FOR CURRENT COLUMN
========================================================= */

function getFilterValuesForColumn(
    index
){

    const source =
    rows.filter(
        row =>
        rowMatchesFilters(
            row,
            index
        )
    );


    const set =
    new Set();


    source.forEach(row => {

        set.add(
            String(
                row[index] ?? ""
            )
        );

    });


    return Array.from(set);

}


/* =========================================================
   VISIBLE ROWS
========================================================= */

function getVisibleRows(){

    const result =
    rows
    .map(
        (row,originalIndex) => ({

            row,

            originalIndex

        })
    )
    .filter(
        item =>
        rowMatchesFilters(
            item.row
        )
    );


    const activeSorts =
    Object.keys(sorts)
    .map(key => {

        const priority =
        Number(
            sorts[key].priority
        );


        return {

            index:
            Number(key),

            priority,

            direction:
            sorts[key].direction ||
            "asc"

        };

    })
    .filter(
        item =>
        Number.isFinite(
            item.priority
        )
    )
    .sort(
        (a,b) =>
        a.priority -
        b.priority
    );


    if(
        activeSorts.length === 0
    ){

        return result;

    }


    result.sort(
        (a,b) => {

            for(
                const sort of activeSorts
            ){

                const av =
                getSortValue(
                    a.row,
                    sort.index
                );


                const bv =
                getSortValue(
                    b.row,
                    sort.index
                );


                let compare = 0;


                if(
                    av.type === "number" &&
                    bv.type === "number"
                ){

                    compare =
                    av.value -
                    bv.value;

                }

                else if(
                    av.type === "date" &&
                    bv.type === "date"
                ){

                    compare =
                    av.value -
                    bv.value;

                }

                else{

                    compare =
                    String(av.value)
                    .localeCompare(
                        String(bv.value),
                        "vi",
                        {
                            numeric:true,
                            sensitivity:"base"
                        }
                    );

                }


                if(compare !== 0){

                    return (
                        sort.direction === "desc"
                            ? -compare
                            : compare
                    );

                }

            }


            return (
                a.originalIndex -
                b.originalIndex
            );

        }
    );


    return result;

}

/* =========================================================
   HEADER WIDTH
========================================================= */

function measureHeaderText(
    text,
    font = "bold 14px Arial"
){

    const canvas =
    document.createElement(
        "canvas"
    );


    const context =
    canvas.getContext("2d");


    context.font =
    font;


    return context.measureText(
        String(text ?? "")
    ).width;

}


/* =========================================================
   CALCULATE HEADER WIDTH
========================================================= */

function calculateHeaderWidth(index){

    const originalHeader =
    headers[index];


    const displayHeader =
    getDisplayHeader(
        originalHeader
    );


    const titleWidth =
    measureHeaderText(
        displayHeader,
        "bold 14px Arial"
    );


    const sortIcon =
    getSortIcon(index);


    const sortWidth =
    Math.max(
        24,
        measureHeaderText(
            sortIcon,
            "14px Arial"
        ) + 8
    );


    const filterWidth =
    Math.max(
        24,
        measureHeaderText(
            "▼",
            "14px Arial"
        ) + 8
    );


    const paddingWidth =
    20;


    const totalWidth =
    titleWidth +
    sortWidth +
    filterWidth +
    paddingWidth;


    return Math.max(
        70,
        Math.ceil(totalWidth)
    );

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(index){

    const originalHeader =
    headers[index];


    if(
        originalHeader ===
        "Phạm vi cung cấp"
    ){

        return 150 * 2;

    }


    if(
        originalHeader ===
        "Free truy cập"
    ){

        return 150 * 2;

    }


    if(
        originalHeader ===
        "Đối tượng áp dụng"
    ){

        return 150 * 4;

    }


    if(
        originalHeader === "Package" ||
        originalHeader === "TOTAL PRICE" ||
        originalHeader === "REVENUE" ||
        originalHeader === "Kỳ" ||
        originalHeader === "Cách tính chu kỳ" ||
        originalHeader === "Packageprice" ||
        originalHeader === "Thoại nội mạng" ||
        originalHeader === "Thoại ngoại mạng" ||
        originalHeader === "Hạ băng thông" ||
        originalHeader === "Loại gói cước" ||
        originalHeader === "Tự động gia hạn"
    ){

        return calculateHeaderWidth(
            index
        );

    }


    return (
        Number(
            columnWidths[index]
        ) || 150
    );

}


/* =========================================================
   FORMAT
========================================================= */

function getColumnFormat(index){

    const originalHeader =
    headers[index];


    const format = {

        align:"left",

        fontFamily:"Arial",

        fontSize:14,

        bold:false,

        italic:false,

        wrap:true,

        color:"#111111",

        background:"#ffffff",

        ...(columnFormats[index] || {})

    };


    if(
        originalHeader === "TOTAL PRICE" ||
        originalHeader === "Packageprice"
    ){

        format.align =
        "right";

    }


    if(
        originalHeader === "REVENUE" ||
        originalHeader === "Kỳ" ||
        originalHeader === "Cách tính chu kỳ" ||
        originalHeader === "Pre/Post" ||
        originalHeader === "KHDN/KHCN"
    ){

        format.align =
        "center";

    }


    return format;

}


/* =========================================================
   APPLY FORMAT
========================================================= */

function applyFormatToCell(
    cell,
    index
){

    const f =
    getColumnFormat(index);


    cell.style.textAlign =
    f.align;


    cell.style.fontFamily =
    f.fontFamily;


    cell.style.fontSize =
    `${Number(f.fontSize) || 14}px`;


    cell.style.fontWeight =
    f.bold
        ? "700"
        : "400";


    cell.style.fontStyle =
    f.italic
        ? "italic"
        : "normal";


    cell.style.color =
    f.color || "#111111";


    cell.style.backgroundColor =
    f.background || "#ffffff";


    if(f.wrap){

        cell.style.whiteSpace =
        "pre-wrap";

        cell.style.overflowWrap =
        "anywhere";

        cell.style.wordBreak =
        "break-word";

    }
    else{

        cell.style.whiteSpace =
        "nowrap";

        cell.style.overflowWrap =
        "normal";

        cell.style.wordBreak =
        "normal";

    }

}

        const tr =

        td.colSpan =
        Math.max(
            visibleIndexes.length,

        );

        td.textContent =
        "Không có dữ liệu phù hợp.";


        tr.appendChild(td);


        tbody.appendChild(tr);


        requestAnimationFrame(
            applyFreezeColumns
        );


        return;

    }


    visibleRows.forEach(
        item => {

            const tr =
            document.createElement("tr");


            visibleIndexes.forEach(
                index => {

                    document.createElement("td");


                    td.className =
                    "body-cell";

/* =========================================================
   HEADER STATES
========================================================= */

function updateHeaderStates(){

    thead
    .querySelectorAll(
        ".header-cell"
    )
    .forEach(
        th => {

            const index =
            Number(
                th.dataset.column
            );


            const searchActive =
            String(
                searches[index] || ""
            ).trim() !== "";


            const filterActive =
            isEffectiveFilter(
                index
            );


            const sorted =
            sorts[index] !== undefined;


            th.classList.toggle(
                "filtered",
                searchActive ||
                filterActive
            );


            th.classList.toggle(
                "sorted",
                sorted
            );


            const sortButton =
            th.querySelector(
                ".header-button"
            );


            if(sortButton){

                sortButton.textContent =
                getSortIcon(index);

            }

        }
    );

}


/* =========================================================
   EFFECTIVE FILTER
========================================================= */

function isEffectiveFilter(index){

    if(
        filters[index] === undefined
    ){

        return false;

    }


    const selected =
    filters[index];


    if(
        !Array.isArray(selected)
    ){

        return false;

    }


    if(
        selected.length === 0
    ){

        return true;

    }


    const allValues =
    getAllColumnValues(index);


    if(
        selected.length ===
        allValues.length
    ){

        return false;

    }


    return true;

}


/* =========================================================
   SORT ICON
========================================================= */

function getSortIcon(index){

    if(
        sorts[index] === undefined
    ){

        return "↕";

    }


    const direction =
    sorts[index].direction ||
    "asc";


    const priority =
    sorts[index].priority;


    return (
        direction === "asc"
            ? "▲"
            : "▼"
    ) +
    (
        priority !== undefined &&
        priority !== ""
            ? String(priority)
            : ""
    );

}

/* =========================================================
   POSITION MENU
========================================================= */

function positionMenu(anchor){

    if(
        !filterMenuElement ||
        !anchor
    ){

        return;

    }


    const rect =
    anchor.getBoundingClientRect();


    let left =
    rect.left;


    let top =
    rect.bottom + 4;


    requestAnimationFrame(
        () => {

            const width =
            filterMenuElement.offsetWidth;


            const height =
            filterMenuElement.offsetHeight;


            if(
                left + width >
                window.innerWidth - 10
            ){

                left =
                window.innerWidth -
                width -
                10;

            }


            if(
                top + height >
                window.innerHeight - 10
            ){

                top =
                rect.top -
                height -
                4;

            }


            left =
            Math.max(
                10,
                left
            );


            top =
            Math.max(
                10,
                top
            );


            filterMenuElement.style.left =
            `${left}px`;


            filterMenuElement.style.top =
            `${top}px`;

        }
    );

}

/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValuesOnly(
    index
){

    if(
        !filterMenuElement
    ){

        return;

    }


    const container =
    filterMenuElement.querySelector(
        "#filterValuesContainer"
    );


    if(!container){

        return;

    }


    container.innerHTML =
    "";


    const allValues =
    getFilterValuesForColumn(
        index
    );


    const query =
    String(
        filterValueSearch || ""
    )
    .trim()
    .toLowerCase();


    const values =
    allValues.filter(
        value => {

            if(!query){

                return true;

            }


            return String(value)
            .toLowerCase()
            .includes(query);

        }
    );


    const selected =
    filters[index] === undefined
        ? allValues.slice()
        : filters[index];


    values.forEach(
        value => {

            const row =
            document.createElement(
                "div"
            );


            row.className =
            "filter-value-row";


            const checkbox =
            document.createElement(
                "input"
            );


            checkbox.type =
            "checkbox";


            checkbox.checked =
            selected.includes(
                value
            );


            checkbox.addEventListener(
                "change",
                event => {

                    event.stopPropagation();


                    let current;


                    if(
                        filters[index] === undefined
                    ){

                        current =
                        allValues.slice();

                    }
                    else{

                        current =
                        filters[index].slice();

                    }


                    if(
                        checkbox.checked
                    ){

                        if(
                            !current.includes(
                                value
                            )
                        ){

                            current.push(
                                value
                            );

                        }

                    }
                    else{

                        current =
                        current.filter(
                            item =>
                            item !== value
                        );

                    }


                    filters[index] =
                    current;


                    saveState();

                    renderBody();

                    updateHeaderStates();


                    const savedSearch =
                    filterValueSearch;


                    renderFilterMenu(
                        index
                    );


                    filterValueSearch =
                    savedSearch;


                    const searchInput =
                    filterMenuElement.querySelector(
                        ".filter-search"
                    );


                    if(searchInput){

                        searchInput.value =
                        savedSearch;

                    }


                    renderFilterValuesOnly(
                        index
                    );

                }
            );


            const label =
            document.createElement(
                "label"
            );


            label.textContent =
            value === ""
                ? "(Trống)"
                : value;


            label.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                }
            );


            row.appendChild(
                checkbox
            );


            row.appendChild(
                label
            );


            container.appendChild(
                row
            );

        }
    );

}

/* =========================================================
   COLOR VALID
========================================================= */

function validColor(value){

    return (
        typeof value === "string" &&
        /^#[0-9a-fA-F]{6}$/.test(value)
    );

}


/* =========================================================
   REFRESH OPEN MENU
========================================================= */

function refreshOpenFilterMenu(
    preserveSearch = true
){

    if(
        openFilterIndex === null ||
        !filterMenuElement
    ){

        return;

    }


    const index =
    openFilterIndex;


    const oldSearch =
    filterValueSearch;


    renderFilterMenu(
        index
    );


    if(preserveSearch){

        filterValueSearch =
        oldSearch;


        const input =
        filterMenuElement.querySelector(
            ".filter-search"
        );


        if(input){

            input.value =
            oldSearch;

        }


        renderFilterValuesOnly(
            index
        );

    }

}

/* =========================================================
   RENAME PROMPT
========================================================= */

function openRenamePrompt(index){

    const original =
    headers[index];


    const current =
    getDisplayHeader(
        original
    );


    const newName =
    prompt(
        "Tên mới của cột:",
        current
    );


    if(newName === null){

        return;

    }


    const trimmed =
    newName.trim();


    if(trimmed === ""){

        delete renamedHeaders[
            original
        ];

    }
    else{

        renamedHeaders[
            original
        ] =
        trimmed;

    }


    if(
        original === "REVENUE" ||
        original === "Kỳ"
    ){

        delete columnWidths[index];

    }


    saveState();

    renderTable();

}


/* =========================================================
   SETTINGS RENAME LIST
========================================================= */

function renderRenameList(){

    renameList.innerHTML =
    "";


    headers.forEach(
        (header,index) => {

            if(
                HIDDEN_COLUMNS.has(
                    header
                )
            ){

                return;

            }


            const item =
            document.createElement(
                "div"
            );


            item.className =
            "rename-item";


            const original =
            document.createElement(
                "div"
            );


            original.className =
            "rename-original";


            original.title =
            header;


            original.textContent =
            header;


            const input =
            document.createElement(
                "input"
            );


            input.type =
            "text";


            input.value =
            getDisplayHeader(
                header
            );


            input.dataset.index =
            String(index);


            input.addEventListener(
                "change",
                () => {

                    const value =
                    input.value.trim();


                    if(
                        value === "" ||
                        value === header
                    ){

                        delete renamedHeaders[
                            header
                        ];

                    }
                    else{

                        renamedHeaders[
                            header
                        ] =
                        value;

                    }

                }
            );


            item.appendChild(
                original
            );


            item.appendChild(
                input
            );


            renameList.appendChild(
                item
            );

        }
    );

}

/* =========================================================
   FREEZE COLUMNS
========================================================= */

function updateToolbarFreezeCount(){

    if(!toolbarFreezeCount){

        return;

    }


    toolbarFreezeCount.value =
    Number(freezeCount) || 0;

}


toolbarFreezeCount.addEventListener(
    "change",
    () => {

        let value =
        Number(
            toolbarFreezeCount.value
        );


        if(
            !Number.isFinite(value)
        ){

            value = 6;

        }


        value =
        Math.max(
            0,
            Math.min(
                Math.floor(value),
                getVisibleHeaderIndexes().length
            )
        );


        freezeCount =
        value;


        toolbarFreezeCount.value =
        value;


        saveState();

        applyFreezeColumns();

    }
);


toolbarFreezeCount.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            toolbarFreezeCount.blur();

        }

    }
);


/* =========================================================
   APPLY FREEZE
========================================================= */

function applyFreezeColumns(){

    document
    .querySelectorAll(
        ".frozen-column"
    )
    .forEach(
        cell => {

            cell.classList.remove(
                "frozen-column"
            );


            cell.classList.remove(
                "frozen-last"
            );


            cell.style.left =
            "";

        }
    );


    const visibleIndexes =
    getVisibleHeaderIndexes();


    const count =
    Math.max(
        0,
        Math.min(
            Number(freezeCount) || 0,
            visibleIndexes.length
        )
    );


    if(
        count === 0
    ){

        return;

    }


    const frozenIndexes =
    visibleIndexes.slice(
        0,
        count
    );


    let left = 0;


    frozenIndexes.forEach(
        (index,position) => {

            const width =
            getColumnWidth(
                index
            );


            const cells =
            document.querySelectorAll(
                `[data-column="${index}"]`
            );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );


                    if(
                        position ===
                        frozenIndexes.length - 1
                    ){

                        cell.classList.add(
                            "frozen-last"
                        );

                    }


                    cell.style.left =
                    `${left}px`;


                    if(
                        cell.classList.contains(
                            "header-cell"
                        )
                    ){

                        cell.style.top =
                        "0px";

                        cell.style.zIndex =
                        "1000";

                    }

                    else if(
                        cell.classList.contains(
                            "search-cell"
                        )
                    ){

                        cell.style.top =
                        "38px";

                        cell.style.zIndex =
                        "999";

                    }

                    else{

                        cell.style.zIndex =
                        "100";

                    }

                }
            );


            left += width;

        }
    );

}


/* =========================================================
   RESIZE START
========================================================= */

function startResize(
    event,
    index
){

    resizeState = {

        index,

        startX:
        event.clientX,

        startWidth:
        getColumnWidth(index)

    };


    document.body.style.cursor =
    "col-resize";


    document.body.style.userSelect =
    "none";

}


/* =========================================================
   RESIZE MOVE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !resizeState
        ){

            return;

        }


        const delta =
        event.clientX -
        resizeState.startX;


        const width =
        Math.max(
            30,
            resizeState.startWidth +
            delta
        );


        columnWidths[
            resizeState.index
        ] =
        width;


        document
        .querySelectorAll(
            `[data-column="${resizeState.index}"]`
        )
        .forEach(
            cell => {

                cell.style.width =
                `${width}px`;

                cell.style.minWidth =
                `${width}px`;

                cell.style.maxWidth =
                `${width}px`;

            }
        );


        applyFreezeColumns();

    }
);


/* =========================================================
   RESIZE END
========================================================= */

document.addEventListener(
    "mouseup",
    () => {

        if(
            !resizeState
        ){

            return;

        }


        saveState();


        resizeState =
        null;


        document.body.style.cursor =
        "";


        document.body.style.userSelect =
        "";

    }
);

/* =========================================================
   AUTO REFRESH
========================================================= */

function setupAutoRefresh(){

    if(
        autoRefreshTimer
    ){

        clearInterval(
            autoRefreshTimer
        );


        autoRefreshTimer =
        null;

    }


    const minutes =
    Number(
        autoRefreshSelect.value
    );


    if(
        !minutes
    ){

        return;

    }


    autoRefreshTimer =
    setInterval(
        async () => {

            await loadData();

        },
        minutes *
        60 *
        1000
    );

}


/* =========================================================
   AUTO REFRESH CHANGE
========================================================= */

autoRefreshSelect.addEventListener(
    "change",
    () => {

        setupAutoRefresh();

    }
);


/* =========================================================
   CLICK OUTSIDE MENU
========================================================= */

document.addEventListener(
    "mousedown",
    event => {

        if(
            !filterMenuElement
        ){

            return;

        }


        if(
            filterMenuElement.contains(
                event.target
            )
        ){

            return;

        }


        if(
            event.target.closest(
                ".header-button"
            )
        ){

            return;

        }


        closeFilterMenu();

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeFilterMenu();


            settingsOverlay.style.display =
            "none";

        }

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        applyFreezeColumns();


        if(
            openFilterIndex !== null &&
            filterMenuElement
        ){

            const header =
            thead.querySelector(
                `.header-cell[data-column="${openFilterIndex}"]`
            );


            if(header){

                positionMenu(
                    header
                );

            }

        }

    }
);


/* =========================================================
   GLOBAL SEARCH UI
========================================================= */

function updateGlobalSearchUI(){

    if(!globalSearchInput){

        return;

    }


    /*
       Nếu AI đang xử lý thì giữ nguyên
       nội dung người dùng nhập.
    */

    if(
        !aiSearching
    ){

        globalSearchInput.value =
        globalSearch || "";

    }


    if(
        String(
            globalSearch || ""
        ).trim() !== ""
    ){

        clearGlobalSearchBtn.style.display =
        "block";

    }
    else{

        clearGlobalSearchBtn.style.display =
        "none";

    }

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

/* =========================================================
   GLOBAL SEARCH - AI ENTER
========================================================= */

globalSearchInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key !== "Enter"
        ){

            return;

        }


        const value =
        globalSearchInput.value.trim();


        if(
            !value ||
            !shouldUseAI(value)
        ){

            return;

        }


        event.preventDefault();


        clearTimeout(
            aiSearchTimer
        );


        aiRequestId++;

        aiConditions = [];
        aiSort = [];
        aiQuery = "";


        runAISearch(
            value
        );

    }
);


globalSearchInput.addEventListener(
    "input",
    () => {

        const value =
        globalSearchInput.value;


        globalSearch =
        value;


        clearTimeout(
            aiSearchTimer
        );


        /*
           Nếu người dùng xóa hết.
        */

        if(
            !value.trim()
        ){

            aiRequestId++;

            aiQuery = "";

            aiConditions = [];

            aiSort = [];


            saveState();

            renderBody();

            updateHeaderStates();

            updateGlobalSearchUI();


            if(
                openFilterIndex !== null
            ){

                refreshOpenFilterMenu(
                    true
                );

            }


            statusEl.textContent =
            `${rows.length.toLocaleString("vi-VN")} dòng`;

            return;

        }


        /*
           Câu hỏi AI KHÔNG tự động gửi khi đang gõ.
           Người dùng nhấn Enter để gọi AI.

           Trong lúc đang gõ, vẫn hiển thị kết quả tìm kiếm
           thông thường để giao diện không bị đứng/chờ AI.
        */

        if(
            shouldUseAI(value)
        ){

            statusEl.textContent =
            "🤖 Câu hỏi AI • nhấn Enter để tìm";

        }


        /*
           Từ khóa bình thường:
           tìm trực tiếp.
        */

        aiRequestId++;

        aiQuery = "";

        aiConditions = [];

        aiSort = [];


        aiSearchTimer =
        setTimeout(
            () => {

                saveState();

                renderBody();

                updateHeaderStates();


                if(
                    openFilterIndex !== null
                ){

                    refreshOpenFilterMenu(
                        true
                    );

                }

            },
            250
        );

    }
);


/* =========================================================
   CLEAR GLOBAL SEARCH
========================================================= */

clearGlobalSearchBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();

        event.stopPropagation();


        clearTimeout(
            aiSearchTimer
        );


        aiRequestId++;


        globalSearch =
        "";


        aiQuery = "";

        aiConditions = [];

        aiSort = [];


        globalSearchInput.value =
        "";


        saveState();

        renderBody();

        updateHeaderStates();

        updateGlobalSearchUI();


        statusEl.textContent =
        `${rows.length.toLocaleString("vi-VN")} dòng`;


        globalSearchInput.focus();

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadState();

loadData();

</script>

</html>
