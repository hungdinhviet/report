<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Report</title>

<style>
/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;

/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    background: #ffffff;

    display: flex;
    align-items: center;

.title {

    font-weight: 700;

    white-space: nowrap;
}

.top-button {
    height: 32px;

    padding: 0 12px;

    border: 1px solid #cfd4da;

    background: #fff;

}

.top-button:hover {

}

.status {
    font-size: 12px;
    color: #666;

}

/* =========================================================
   TABLE AREA
========================================================= */

.table-wrapper {
    position: absolute;

    left: 0;
    right: 0;

    top: 48px;
    bottom: 0;

    overflow: auto;

    background: #fff;

    isolation: isolate;
}

/* =========================================================
   TABLE
========================================================= */

table {
    border-collapse: separate;
    border-spacing: 0;

    table-layout: fixed;

    width: max-content;

    min-width: 100%;
}

th,
td {
    border-right: 1px solid #dfe3e8;
    border-bottom: 1px solid #dfe3e8;

    padding: 0 8px;

    vertical-align: middle;
}

/* =========================================================
   HEADER
========================================================= */

thead {
    position: relative;
    z-index: 500;
}

/*
    Header row
*/

.header-row {
    height: 40px;
}

.header-cell {
    height: 40px;

    min-height: 40px;
    max-height: 40px;

    position: sticky;

    top: 0;

    z-index: 800;

    background: #f1f3f5;

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;
}

.header-inner {
    height: 100%;

    display: flex;

    align-items: center;

    gap: 4px;

    position: relative;
}

.header-title {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    flex: 1;

    cursor: pointer;
}

.filter-button {
    width: 24px;
    height: 24px;

    background: transparent;

    cursor: pointer;

    border-radius: 4px;

}

.filter-button:hover {
    background: #dfe4ea;
}

/* =========================================================
   SEARCH ROW
========================================================= */

.search-row {
    height: 38px;
}

.search-cell {
    height: 38px;

    min-height: 38px;
    max-height: 38px;

    position: sticky;

    top: 40px;

    z-index: 790;

    background: #fafafa;

    padding: 4px;
}

.search-input {
    width: 100%;

    height: 29px;

    border: 1px solid #cfd4da;

    border-radius: 4px;

    padding: 0 7px;

    font-size: 12px;

}

.search-input:focus {

    box-shadow:

}

/* =========================================================
   BODY
========================================================= */

.body-cell {

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    word-break: break-word;

}

tbody tr:hover td {
    background-color: #f8fafc;
}

/* =========================================================
   ACTIVE HEADER COLORS
========================================================= */

.header-cell.filtered {
    background: #c8f7c5;
}

.header-cell.sorted {
    background: #d8ebff;
}

.header-cell.filtered.sorted {
    background: #bdecc4;
}

/* =========================================================
   FREEZE COLUMNS
========================================================= */

/*
   BODY FROZEN COLUMN
*/

tbody .frozen-column {
    position: sticky !important;

    z-index: 700 !important;

    background: #fff;
}

/*
   FROZEN HEADER

   Quan trọng:
   Header có z-index cao hơn frozen body.
*/

thead .frozen-column.header-cell {
    position: sticky !important;

    top: 0 !important;

    z-index: 1000 !important;

    background: #f1f3f5;
}

/*
   FROZEN SEARCH
*/

thead .frozen-column.search-cell {
    position: sticky !important;

}

/*
   Active frozen header
*/

thead th.filtered.frozen-column.header-cell {

}

*/

========================================================= */

.setting-input {

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v10";

const OLD_STORAGE_KEYS = [
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SORT MAPPING
========================================================= */

const SORT_BY_MAP = {

    "DATA":
        "Sort_DATA",

    "Thoại nội mạng":
        "Sort_NM",

    "Thoại ngoại mạng":
        "Sort_NgM"

};


/* =========================================================
   STATE
========================================================= */

let headers = [];

let rows = [];

let filters = {};

let searches = {};

let sortPriorities = {};

let columnWidths = {};

let columnFormats = {};

let renamedHeaders = {};

let freezeCount = 0;


/*
   Current filter menu
*/

let openFilterIndex = null;

let filterMenuElement = null;


/*
   Resize
*/

let resizing = null;


/*
   Search debounce
*/

const searchTimers = {};


/* =========================================================
   DEFAULT FORMAT
========================================================= */

const DEFAULT_FORMAT = {

    align: "left",

    fontFamily: "Arial",

    fontSize: 14,

    bold: false,

    italic: false,

    wrap: true,

    color: "#222222",

    background: "#ffffff"

};


/* =========================================================
   DOM
========================================================= */

const tableHead =
    document.getElementById(
        "tableHead"
    );

const tableBody =
    document.getElementById(
        "tableBody"
    );

const tableWrapper =
    document.getElementById(
        "tableWrapper"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const loadingEl =
    document.getElementById(
        "loading"
    );

const settingsOverlay =
    document.getElementById(
        "settingsOverlay"
    );


/* =========================================================
   STORAGE LOAD
========================================================= */

function loadState() {

    let raw =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (!raw) {

        for (
            const oldKey
            of OLD_STORAGE_KEYS
        ) {

            raw =
                localStorage.getItem(
                    oldKey
                );

            if (raw) break;
        }
    }

    if (!raw) return;

    try {

        const state =
            JSON.parse(raw);

        filters =
            state.filters || {};

        searches =
            state.searches || {};

        sortPriorities =
            state.sortPriorities || {};

        columnWidths =
            state.columnWidths || {};

        columnFormats =
            state.columnFormats || {};

        renamedHeaders =
            state.renamedHeaders || {};

        freezeCount =
            Number(
                state.freezeCount || 0
            );

    } catch (error) {

        console.error(
            "Không thể đọc localStorage:",
            error
        );

    }

}


/* =========================================================
   STORAGE SAVE
========================================================= */

function saveState() {

    const state = {

        filters,

        searches,

        sortPriorities,

        columnWidths,

        columnFormats,

        renamedHeaders,

        freezeCount

    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* =========================================================
   CSV PARSER
   Giữ line break bên trong ô
========================================================= */

function parseCSV(text) {

    const result = [];

    let row = [];

    let cell = "";

    let inQuotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const c = text[i];

        const next =
            text[i + 1];

        if (c === '"') {

            if (
                inQuotes &&
                next === '"'
            ) {

                cell += '"';

                i++;

            } else {

                inQuotes =
                    !inQuotes;

            }

        }

        else if (
            c === "," &&
            !inQuotes
        ) {

            row.push(cell);

            cell = "";

        }

        else if (
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !inQuotes
        ) {

            if (
                c === "\r" &&
                next === "\n"
            ) {

                i++;

            }

            row.push(cell);

            cell = "";

            if (
                row.length > 1 ||
                row[0] !== ""
            ) {

                result.push(row);

            }

            row = [];

        }

        else {

            cell += c;

        }

    }


    if (
        cell.length > 0 ||
        row.length > 0
    ) {

        row.push(cell);

        result.push(row);

    }


    return result;

}


/* =========================================================
   NORMALIZE CSV VALUE
========================================================= */

function normalizeValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value);

}


/* =========================================================
   PARSE VIETNAMESE DATE
========================================================= */

function parseVietnameseDate(value) {

    const s =
        normalizeValue(value)
            .trim();

    if (!s) return null;

    const match =
        s.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (!match) return null;

    const day =
        Number(match[1]);

    const month =
        Number(match[2]) - 1;

    const year =
        Number(match[3]);

    const d =
        new Date(
            year,
            month,
            day
        );

    if (
        d.getFullYear() !== year ||
        d.getMonth() !== month ||
        d.getDate() !== day
    ) {

        return null;

    }

    return d;

}


/* =========================================================
   DISPLAY RELATIVE DATE
========================================================= */

function displayRelativeMonth(value) {

    const d =
        parseVietnameseDate(
            value
        );

    if (!d) {

        return normalizeValue(
            value
        );

    }

    const now =
        new Date();

    const months =
        (
            now.getFullYear() -
            d.getFullYear()
        ) * 12
        +
        (
            now.getMonth() -
            d.getMonth()
        );

    const n =
        Math.max(
            0,
            months
        );

    if (n === 0) {

        return "0 tháng";

    }

    return (
        String(n)
            .padStart(2, "0")
        +
        " tháng"
    );

}


/* =========================================================
   VIETNAMESE NUMBER
========================================================= */

function parseVNNumber(value) {

    const s =
        normalizeValue(value)
            .trim();

    if (!s) return null;

    if (
        /^-?\d{1,3}(\.\d{3})+(,\d+)?$/
            .test(s)
    ) {

        return Number(
            s
                .replace(/\./g, "")
                .replace(",", ".")
        );

    }

    if (
        /^-?\d+(,\d+)?$/
            .test(s)
    ) {

        return Number(
            s.replace(",", ".")
        );

    }

    if (
        /^-?\d+(\.\d+)?$/
            .test(s)
    ) {

        return Number(s);

    }

    return null;

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function getDisplayValue(
    value,
    header
) {

    if (
        header === "Ngày update"
    ) {

        return displayRelativeMonth(
            value
        );

    }

    return normalizeValue(
        value
    );

}


/* =========================================================
   GET VISIBLE HEADERS
========================================================= */

function getVisibleHeaderIndices() {

    const result = [];

    headers.forEach(
        (header, index) => {

            if (
                !HIDDEN_COLUMNS.has(
                    header
                )
            ) {

                result.push(index);

            }

        }
    );

    return result;

}


/* =========================================================
   GET HEADER DISPLAY NAME
========================================================= */

function getHeaderName(index) {

    return (
        renamedHeaders[index] ||
        headers[index] ||
        ""
    );

}


/* =========================================================
   GET FORMAT
========================================================= */

function getColumnFormat(index) {

    return {

        ...DEFAULT_FORMAT,

        ...(columnFormats[index] || {})

    };

}


/* =========================================================
   APPLY FORMAT
========================================================= */

function applyFormatToCell(
    cell,
    index
) {

    const f =
        getColumnFormat(
            index
        );

    cell.style.textAlign =
        f.align;

    cell.style.fontFamily =
        f.fontFamily;

    cell.style.fontSize =
        `${f.fontSize}px`;

    cell.style.fontWeight =
        f.bold
            ? "700"
            : "400";

    cell.style.fontStyle =
        f.italic
            ? "italic"
            : "normal";

    cell.style.color =
        f.color;

    cell.style.backgroundColor =
        f.background;

    if (f.wrap) {

        cell.style.whiteSpace =
            "pre-wrap";

        cell.style.overflowWrap =
            "anywhere";

        cell.style.wordBreak =
            "break-word";

    } else {

        cell.style.whiteSpace =
            "nowrap";

        cell.style.overflowWrap =
            "normal";

        cell.style.wordBreak =
            "normal";

    }

}


/* =========================================================
   FIND SORT INDEX
========================================================= */

function getSortIndex(
    visibleIndex
) {

    const header =
        headers[visibleIndex];

    const mapped =
        SORT_BY_MAP[header];

    if (
        mapped &&
        headers.includes(mapped)
    ) {

        return headers.indexOf(
            mapped
        );

    }

    return visibleIndex;

}


/* =========================================================
   GET SEARCHED ROWS
========================================================= */

/*
   Important:

   Searches are treated like active filters.

   When building the value list of column X,
   the search/filter of X itself is ignored.
*/

function rowMatchesConditions(
    row,
    ignoreIndex = null
) {

    /*
       FILTERS
    */

    for (
        const key of Object.keys(
            filters
        )
    ) {

        const index =
            Number(key);

        if (
            index === ignoreIndex
        ) {

            continue;

        }

        const selected =
            filters[index];

        if (
            !Array.isArray(
                selected
            )
        ) {

            continue;

        }

        /*
           Empty selection = no restriction
        */

        if (
            selected.length === 0
        ) {

            continue;

        }

        const value =
            normalizeValue(
                row[index]
            );

        if (
            !selected.includes(
                value
            )
        ) {

            return false;

        }

    }


    /*
       SEARCHES
    */

    for (
        const key of Object.keys(
            searches
        )
    ) {

        const index =
            Number(key);

        if (
            index === ignoreIndex
        ) {

            continue;

        }

        const search =
            normalizeValue(
                searches[index]
            )
            .trim()
            .toLowerCase();

        if (!search) {

            continue;

        }

        const value =
            normalizeValue(
                row[index]
            )
            .toLowerCase();

        if (
            !value.includes(
                search
            )
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   GET FILTERED ROWS
========================================================= */

function getFilteredRows() {

    return rows.filter(
        row =>
            rowMatchesConditions(
                row,
                null
            )
    );

}


/* =========================================================
   UNIQUE VALUES FOR FILTER
========================================================= */

/*
   Đây là phần quan trọng nhất.

   Khi mở filter cột X:

   - dùng toàn bộ rows
   - áp dụng filter/search của các cột khác
   - KHÔNG áp dụng filter/search của X
*/

function getAvailableValues(
    index
) {

    const set =
        new Set();

    for (
        const row of rows
    ) {

        if (
            !rowMatchesConditions(
                row,
                index
            )
        ) {

            continue;

        }

        set.add(
            normalizeValue(
                row[index]
            )
        );

    }

    return Array.from(
        set
    );

}


/* =========================================================
   SORT FILTER VALUES
========================================================= */

function sortFilterValues(
    values
) {

    return values.sort(
        (a, b) => {

            const aa =
                normalizeValue(a)
                    .trim();

            const bb =
                normalizeValue(b)
                    .trim();

            /*
               Blank first
            */

            if (
                aa === "" &&
                bb !== ""
            ) {

                return -1;

            }

            if (
                aa !== "" &&
                bb === ""
            ) {

                return 1;

            }

            /*
               Numeric
            */

            const na =
                parseVNNumber(aa);

            const nb =
                parseVNNumber(bb);

            if (
                na !== null &&
                nb !== null
            ) {

                return na - nb;

            }

            return aa.localeCompare(
                bb,
                "vi",
                {
                    numeric: true,
                    sensitivity: "base"
                }
            );

        }
    );

}


/* =========================================================
   HEADER ACTIVE STATE
========================================================= */

function hasActiveFilter(
    index
) {

    const selected =
        filters[index];

    if (
        !Array.isArray(
            selected
        )
    ) {

        return false;

    }

    const available =
        getAvailableValues(
            index
        );

    /*
       If selected is not equal to all
       available values, consider active.
    */

    if (
        selected.length === 0
    ) {

        return false;

    }

    if (
        selected.length !==
        available.length
    ) {

        return true;

    }

    const selectedSet =
        new Set(
            selected
        );

    return available.some(
        value =>
            !selectedSet.has(
                value
            )
    );

}


/* =========================================================
   HAS SEARCH
========================================================= */

function hasActiveSearch(
    index
) {

    return Boolean(
        normalizeValue(
            searches[index]
        ).trim()
    );

}


/* =========================================================
   HAS SORT
========================================================= */

function hasActiveSort(
    index
) {

    return (
        sortPriorities[index] !==
        undefined &&
        sortPriorities[index] !==
        null &&
        String(
            sortPriorities[index]
        ).trim() !== ""
    );

}


/* =========================================================
   INIT DEFAULT FILTERS
========================================================= */

function initializeDefaultFilters() {

    /*
       Ngày update:
       mặc định bỏ blank
    */

    const dateIndex =
        headers.indexOf(
            "Ngày update"
        );

    if (
        dateIndex >= 0 &&
        filters[dateIndex] ===
            undefined
    ) {

        const values =
            Array.from(
                new Set(
                    rows
                        .map(
                            row =>
                                normalizeValue(
                                    row[
                                        dateIndex
                                    ]
                                )
                        )
                        .filter(
                            value =>
                                value !== ""
                        )
                )
            );

        filters[dateIndex] =
            values;

    }


    /*
       Dừng gói:
       mặc định chỉ chọn blank
    */

    const stopIndex =
        headers.indexOf(
            "Dừng gói"
        );

    if (
        stopIndex >= 0 &&
        filters[stopIndex] ===
            undefined
    ) {

        filters[stopIndex] = [
            ""
        ];

    }

}


/* =========================================================
   APPLY SORT
========================================================= */

function applySort(
    sourceRows
) {

    const priorities =
        Object.entries(
            sortPriorities
        )
        .map(
            ([index, priority]) => ({

                index:
                    Number(index),

                priority:
                    Number(priority)

            })
        )
        .filter(
            item =>
                Number.isFinite(
                    item.priority
                )
        );

    if (
        priorities.length === 0
    ) {

        return sourceRows;

    }

    /*
       Không normalize priority.

       Người dùng nhập:
       1
       3
       8

       thì giữ đúng thứ tự đó.
    */

    priorities.sort(
        (a, b) => {

            if (
                a.priority !==
                b.priority
            ) {

                return (
                    a.priority -
                    b.priority
                );

            }

            return (
                a.index -
                b.index
            );

        }
    );


    return [
        ...sourceRows
    ].sort(
        (a, b) => {

            for (
                const item
                of priorities
            ) {

                const displayIndex =
                    item.index;

                const actualIndex =
                    getSortIndex(
                        displayIndex
                    );

                const va =
                    normalizeValue(
                        a[
                            actualIndex
                        ]
                    );

                const vb =
                    normalizeValue(
                        b[
                            actualIndex
                        ]
                    );

                const na =
                    parseVNNumber(
                        va
                    );

                const nb =
                    parseVNNumber(
                        vb
                    );

                let compare = 0;

                if (
                    na !== null &&
                    nb !== null
                ) {

                    compare =
                        na - nb;

                } else {

                    compare =
                        va.localeCompare(
                            vb,
                            "vi",
                            {
                                numeric: true,
                                sensitivity:
                                    "base"
                            }
                        );

                }

                if (
                    compare !== 0
                ) {

                    return compare;

                }

            }

            return 0;

        }
    );

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader() {

    */

        );

    visible.forEach(
        index => {

            const th =

                );

            th.dataset.column =

                    columnWidths[index] ||
                    150

            th.style.maxWidth =

            }

            const inner =

                );

            title.className =
                "header-title";

            title.textContent =
                getHeaderName(
                    index
                );


            title.addEventListener(
                "dblclick",
                () => {

                    renameColumn(
                        index
                    );

                }
            );


            const filterButton =
                document.createElement(
                    "button"
                );

            filterButton.className =
                "filter-button";

            filterButton.type =
                "button";

            filterButton.textContent =
                "▼";

            filterButton.title =
                "Lọc / sắp xếp / định dạng";


            filterButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openFilterMenu(
                        index,
                        filterButton
                    );

                }
            );


            inner.appendChild(
                title
            );

            inner.appendChild(
                filterButton
            );


            /*
               Resize
            */

            const resize =
                document.createElement(
                    "div"
                );

            resize.className =

            resize.addEventListener(

                    startResize(

                        index

                }
            );


            inner.appendChild(

            );


            th.appendChild(
                inner
            );

            applyFormatToCell(
                th,
                index
            );

            headerRow.appendChild(
                th
            );

        }
    );


    /*
       SEARCH ROW
    */

    const searchRow =
        document.createElement(
            "tr"
        );

    searchRow.className =
        "search-row";


    visible.forEach(
        index => {

            const th =
                document.createElement(
                    "th"
                );

            th.className =
                "search-cell";

            th.dataset.column =
                index;


            const input =
                document.createElement(
                    "input"
                );

            input.className =
                "search-input";

            input.type =
                "text";

            input.placeholder =
                "Tìm kiếm...";

            input.value =
                searches[index] ||
                "";


            input.addEventListener(
                "input",
                event => {

                    const value =
                        event.target.value;

                    searches[index] =
                        value;

                    /*
                       debounce để không lag
                    */

                    clearTimeout(
                        searchTimers[index]
                    );

                    searchTimers[index] =
                        setTimeout(
                            () => {

                                saveState();

                                renderTable();

                                /*
                                   Nếu filter menu
                                   đang mở thì
                                   cập nhật lại
                                   menu.
                                */

                                if (
                                    openFilterIndex !==
                                    null
                                ) {

                                    const openIndex =
                                        openFilterIndex;

                                    closeFilterMenu();

                                    setTimeout(
                                        () => {

                                            const button =
                                                document.querySelector(
                                                    `[data-column="${openIndex}"] .filter-button`
                                                );

                                            if (
                                                button
                                            ) {

                                                openFilterMenu(
                                                    openIndex,
                                                    button
                                                );

                                            }

                                        },
                                        0
                                    );

                                }

                            },
                            180
                        );

                }
            );


            /*
               Search riêng cột,
               không trigger filter menu.
            */

            input.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                }
            );


            th.appendChild(
                input
            );

            applyFormatToCell(
                th,
                index
            );

            searchRow.appendChild(
                th
            );

        }
    );


    tableHead.appendChild(
        headerRow
    );

    tableHead.appendChild(
        searchRow
    );

}


/* =========================================================
   RENDER BODY
========================================================= */

function renderBody() {

    tableBody.innerHTML = "";

    const visible =
        getVisibleHeaderIndices();

    let filteredRows =
        getFilteredRows();

    filteredRows =
        applySort(
            filteredRows
        );


    if (
        filteredRows.length === 0
    ) {

        const tr =
            document.createElement(
                "tr"
            );

        const td =
            document.createElement(
                "td"
            );

        td.className =
            "empty-row";

        td.colSpan =
            visible.length;

        td.textContent =
            "Không có dữ liệu phù hợp";

        tr.appendChild(
            td
        );

        tableBody.appendChild(
            tr
        );

        return;

    }


    filteredRows.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            visible.forEach(
                index => {

                    const td =
                        document.createElement(
                            "td"
                        );

                    td.className =
                        "body-cell";

                    td.dataset.column =
                        index;


                    const value =
                        getDisplayValue(
                            row[index],
                            headers[index]
                        );


                    /*
                       textContent:
                       giữ line break
                    */

                    td.textContent =
                        value;


                    td.style.width =
                        `${
                            columnWidths[index] ||
                            150
                        }px`;

                    td.style.minWidth =
                        `${
                            columnWidths[index] ||
                            150
                        }px`;

                    td.style.maxWidth =
                        `${
                            columnWidths[index] ||
                            150
                        }px`;


                    applyFormatToCell(
                        td,
                        index
                    );


                    tr.appendChild(
                        td
                    );

                }
            );


            tableBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    renderHeader();

    renderBody();

    requestAnimationFrame(
        () => {

            applyFreezeColumns();

        }
    );

}


/* =========================================================
   FREEZE COLUMNS
========================================================= */

function applyFreezeColumns() {

    /*
       Xóa trạng thái cũ
    */

    document
        .querySelectorAll(
            ".frozen-column"
        )
        .forEach(
            cell => {

                cell.classList.remove(
                    "frozen-column"
                );

                cell.classList.remove(
                    "frozen-last"
                );

                cell.style.left = "";

            }
        );


    const visible =
        getVisibleHeaderIndices();


    const frozen =
        visible.slice(
            0,
            Math.max(
                0,
                Number(
                    freezeCount
                )
            )
        );


    let left = 0;


    frozen.forEach(
        (index, position) => {

            const width =
                Number(
                    columnWidths[index] ||
                    150
                );


            const cells =
                document.querySelectorAll(
                    `[data-column="${index}"]`
                );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );

                    cell.style.left =
                        `${left}px`;


                    /*
                       Frozen body background
                       must remain opaque.
                    */

                    const format =
                        getColumnFormat(
                            index
                        );

                    cell.style.backgroundColor =
                        format.background ||
                        "#ffffff";

                }
            );


            /*
               Last frozen column
            */

            if (
                position ===
                frozen.length - 1
            ) {

                cells.forEach(
                    cell => {

                        cell.classList.add(
                            "frozen-last"
                        );

                    }
                );

            }


            left += width;

        }
    );

}

function openFilterMenu(

    closeFilterMenu();

    openFilterIndex =

    const menu =
        document.createElement(
            "div"
        );

    menu.className =
        "filter-menu";


    filterMenuElement =
        menu;


    /*
       HEADER
    */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "filter-header";

    header.textContent =
        getHeaderName(
            index
        );


    menu.appendChild(
        header
    );


    /*
       SEARCH VALUES
    */

    const searchBox =
        document.createElement(
            "div"
        );

    searchBox.className =
        "filter-search";


    const valueSearch =
        document.createElement(
            "input"
        );

    valueSearch.type =
        "text";

    valueSearch.placeholder =
        "Tìm trong danh sách giá trị...";


    searchBox.appendChild(
        valueSearch
    );

    menu.appendChild(
        searchBox
    );


    /*
       ACTIONS
    */

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "filter-actions";


    const selectAll =
        document.createElement(
            "button"
        );

    selectAll.textContent =
        "Chọn tất cả";


    const clearAll =
        document.createElement(
            "button"
        );

    clearAll.textContent =
        "Bỏ chọn";


    actions.appendChild(
        selectAll
    );

    actions.appendChild(
        clearAll
    );

    menu.appendChild(
        actions
    );


    /*
       VALUE LIST
    */

    const valueList =
        document.createElement(
            "div"
        );

    valueList.className =
        "value-list";


    /*
       Initial selected state.

       Nếu chưa có filter:
       tất cả giá trị khả dụng được chọn.

       Đặc biệt với default:
       Ngày update và Dừng gói
       đã được initialize trước đó.
    */

    let selected =
        filters[index];

    const allAvailable =
        sortFilterValues(
            getAvailableValues(
                index
            )
        );


    if (
        !Array.isArray(
            selected
        )
    ) {

        selected =
            [
                ...allAvailable
            ];

    }


    /*
       Clone để thao tác ngay.
    */

    selected =
        new Set(
            selected
        );


    function renderValues(
        keyword = ""
    ) {

        valueList.innerHTML = "";

        const normalizedKeyword =
            normalizeValue(
                keyword
            )
            .toLowerCase();


        const values =
            allAvailable.filter(
                value => {

                    if (
                        !normalizedKeyword
                    ) {

                        return true;

                    }

                    return normalizeValue(
                        value
                    )
                    .toLowerCase()
                    .includes(
                        normalizedKeyword
                    );

                }
            );


        if (
            values.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.style.padding =
                "15px";

            empty.style.fontSize =
                "12px";

            empty.style.color =
                "#777";

            empty.textContent =
                "Không có giá trị";

            valueList.appendChild(
                empty
            );

            return;

        }


        values.forEach(
            value => {

                const label =
                    document.createElement(
                        "label"
                    );

                label.className =
                    "value-item";


                const checkbox =
                    document.createElement(
                        "input"
                    );

                checkbox.type =
                    "checkbox";

                checkbox.checked =
                    selected.has(
                        value
                    );


                const span =
                    document.createElement(
                        "span"
                    );

                span.className =
                    "value-text";


                span.textContent =
                    value === ""
                        ? "(Trống)"
                        : value;


                /*
                   IMPORTANT:
                   Tick = filter ngay.
                */

                checkbox.addEventListener(
                    "change",
                    event => {

                        event.stopPropagation();


                        if (
                            checkbox.checked
                        ) {

                            selected.add(
                                value
                            );

                        } else {

                            selected.delete(
                                value
                            );

                        }


                        filters[index] =
                            Array.from(
                                selected
                            );


                        saveState();

                        /*
                           Render bảng ngay
                        */

                        renderTable();


                        /*
                           Cập nhật lại các
                           filter khác.

                           Nếu menu hiện tại vẫn mở,
                           giá trị của nó được giữ.
                        */

                        refreshOtherFilterMenus(
                            index
                        );

                    }
                );


                label.appendChild(
                    checkbox
                );

                label.appendChild(
                    span
                );

                valueList.appendChild(
                    label
                );

            }
        );

    }


    renderValues();


    selectAll.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            selected =
                new Set(
                    allAvailable
                );

            filters[index] =
                Array.from(
                    selected
                );

            saveState();

            renderTable();

            renderValues(
                valueSearch.value
            );

            refreshOtherFilterMenus(
                index
            );

        }
    );


    clearAll.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            selected =
                new Set();

            filters[index] =
                [];

            saveState();

            renderTable();

            renderValues(
                valueSearch.value
            );

            refreshOtherFilterMenus(
                index
            );

        }
    );


    valueSearch.addEventListener(
        "input",
        event => {

            event.stopPropagation();

            renderValues(
                event.target.value
            );

        }
    );


    menu.appendChild(
        valueList
    );


    /*
       SORT SECTION
    */

    const sortSection =
        document.createElement(
            "div"
        );

    sortSection.className =
        "sort-section";


    const sortTitle =
        document.createElement(
            "div"
        );

    sortTitle.className =
        "sort-title";

    sortTitle.textContent =
        "Sắp xếp";


    const sortRow =
        document.createElement(
            "div"
        );

    sortRow.className =
        "sort-row";


    const sortAsc =
        document.createElement(
            "button"
        );

    sortAsc.textContent =
        "A → Z";


    const sortDesc =
        document.createElement(
            "button"
        );

    sortDesc.textContent =
        "Z → A";


    const priority =
        document.createElement(
            "input"
        );

    priority.className =
        "priority-input";

    priority.type =
        "number";

    priority.step =
        "1";

    priority.placeholder =
        "Ưu tiên";

    priority.value =
        sortPriorities[index] ??
        "";

/* =========================================================
   SORT DIRECTION
========================================================= */

const sortDirections = {};


/* =========================================================
   CREATE SELECT FIELD
========================================================= */

function createSelectField(
    labelText,
    options,
    value
) {

    const wrapper =
        document.createElement(
            "label"
        );

    wrapper.className =
        "format-field";


    const label =
        document.createElement(
            "span"
        );

    label.textContent =
        labelText;


    const select =
        document.createElement(
            "select"
        );


    options.forEach(
        option => {

            const opt =
                document.createElement(
                    "option"
                );

            opt.value =
                option[0];

            opt.textContent =
                option[1];

            if (
                String(
                    option[0]
                ) ===
                String(value)
            ) {

                opt.selected =
                    true;

            }

            select.appendChild(
                opt
            );

        }
    );


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        select
    );


    return {

        wrapper,

        select

    };

}


/* =========================================================
   CREATE NUMBER FIELD
========================================================= */

function createNumberField(
    labelText,
    value,
    min,
    max
) {

    const wrapper =
        document.createElement(
            "label"
        );

    wrapper.className =
        "format-field";


    const label =
        document.createElement(
            "span"
        );

    label.textContent =
        labelText;


    const input =
        document.createElement(
            "input"
        );

    input.type =
        "number";

    input.min =
        min;

    input.max =
        max;

    input.value =
        value;


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        input
    );


    return {

        wrapper,

        input

    };

}


/* =========================================================
   CREATE COLOR FIELD
========================================================= */

function createColorField(
    labelText,
    value
) {

    const wrapper =
        document.createElement(
            "label"
        );

    wrapper.className =
        "format-field";


    const label =
        document.createElement(
            "span"
        );

    label.textContent =
        labelText;


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "color-row";


    const input =
        document.createElement(
            "input"
        );

    input.type =
        "color";

    input.value =
        /^#[0-9a-fA-F]{6}$/
            .test(value)
            ? value
            : "#ffffff";


    row.appendChild(
        input
    );


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        row
    );


    return {

        wrapper,

        input

    };

}


/* =========================================================
   POSITION FILTER MENU
========================================================= */

function positionFilterMenu(
    menu,
    button
) {

    const rect =
        button.getBoundingClientRect();


    const menuWidth =
        330;

    const viewportWidth =
        window.innerWidth;

    let left =
        rect.left;

    let top =
        rect.bottom + 5;


    if (
        left + menuWidth >
        viewportWidth - 10
    ) {

        left =
            viewportWidth -
            menuWidth -
            10;

    }

    if (
        left < 10
    ) {

        left = 10;

    }


    const menuHeight =
        Math.min(
            menu.scrollHeight,
            720
        );


    if (
        top + menuHeight >
        window.innerHeight - 10
    ) {

        top =
            rect.top -
            menuHeight -
            5;

    }

    if (
        top < 55
    ) {

        top = 55;

    }


    menu.style.left =
        `${left}px`;

    menu.style.top =
        `${top}px`;

}


/* =========================================================
   CLOSE FILTER MENU
========================================================= */

function closeFilterMenu() {

    if (
        filterMenuElement
    ) {

        filterMenuElement.remove();

        filterMenuElement =
            null;

    }

    openFilterIndex =
        null;

    document.removeEventListener(
        "mousedown",
        outsideFilterHandler
    );

}


/* =========================================================
   OUTSIDE FILTER HANDLER
========================================================= */

function outsideFilterHandler(
    event
) {

    if (
        filterMenuElement &&
        !filterMenuElement.contains(
            event.target
        )
    ) {

        closeFilterMenu();

    }

}


/* =========================================================
   REFRESH OTHER FILTER MENUS
========================================================= */

function refreshOtherFilterMenus(
    changedIndex
) {

    /*
       Không đóng menu hiện tại.

       Nếu đang mở cột X và X thay đổi,
       danh sách của X phải vẫn dựa trên
       các cột khác.
    */

    if (
        openFilterIndex === null
    ) {

        return;

    }


    const currentIndex =
        openFilterIndex;


    /*
       Rebuild menu để các giá trị
       phản ánh filter liên động mới.
    */

    const button =
        document.querySelector(
            `[data-column="${currentIndex}"] .filter-button`
        );


    if (!button) {

        return;

    }


    closeFilterMenu();


    setTimeout(
        () => {

            openFilterMenu(
                currentIndex,
                button
            );

        },
        0
    );

}


/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    index
) {

    event.preventDefault();

    event.stopPropagation();


    resizing = {

        index,

        startX:
            event.clientX,

        startWidth:
            Number(
                columnWidths[index] ||
                150
            )

    };


    document.body.style.cursor =
        "col-resize";


    document.addEventListener(
        "mousemove",
        resizeMove
    );

    document.addEventListener(
        "mouseup",
        resizeEnd
    );

}


/* =========================================================
   RESIZE MOVE
========================================================= */

function resizeMove(
    event
) {

    if (!resizing) {

        return;

    }


    const delta =
        event.clientX -
        resizing.startX;


    let width =
        resizing.startWidth +
        delta;


    /*
       Không giới hạn min/max
       theo yêu cầu.
    */

    width =
        Math.max(
            30,
            width
        );


    columnWidths[
        resizing.index
    ] = Math.round(
        width
    );


    /*
       Update widths live
    */

    document
        .querySelectorAll(
            `[data-column="${resizing.index}"]`
        )
        .forEach(
            cell => {

                cell.style.width =
                    `${width}px`;

                cell.style.minWidth =
                    `${width}px`;

                cell.style.maxWidth =
                    `${width}px`;

            }
        );


    applyFreezeColumns();

}


/* =========================================================
   RESIZE END
========================================================= */

function resizeEnd() {

    if (!resizing) {

        return;

    }


    resizing = null;

    document.body.style.cursor =
        "";


    document.removeEventListener(
        "mousemove",
        resizeMove
    );

    document.removeEventListener(
        "mouseup",
        resizeEnd
    );


    saveState();

    applyFreezeColumns();

}


/* =========================================================
   RENAME COLUMN
========================================================= */

function renameColumn(
    index
) {

    const current =
        getHeaderName(
            index
        );


    const value =
        prompt(
            "Tên mới của cột:",
            current
        );


    if (
        value === null
    ) {

        return;

    }


    const trimmed =
        value.trim();


    if (
        !trimmed
    ) {

        delete renamedHeaders[
            index
        ];

    } else {

        renamedHeaders[index] =
            trimmed;

    }


    saveState();

    renderTable();

    buildRenameSettings();

}


/* =========================================================
   BUILD RENAME SETTINGS
========================================================= */

function buildRenameSettings() {

    const container =
        document.getElementById(
            "renameContainer"
        );

    container.innerHTML = "";


    getVisibleHeaderIndices()
        .forEach(
            index => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.style.display =
                    "flex";

                row.style.gap =
                    "5px";

                row.style.marginBottom =
                    "5px";


                const input =
                    document.createElement(
                        "input"
                    );

                input.className =
                    "setting-input";

                input.style.flex =
                    "1";

                input.value =
                    getHeaderName(
                        index
                    );


                input.addEventListener(
                    "change",
                    () => {

                        const value =
                            input.value.trim();


                        if (
                            !value ||
                            value ===
                                headers[index]
                        ) {

                            delete renamedHeaders[
                                index
                            ];

                        } else {

                            renamedHeaders[
                                index
                            ] = value;

                        }


                        saveState();

                        renderTable();

                    }
                );


                row.appendChild(
                    input
                );

                container.appendChild(
                    row
                );

            }
        );

}


/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadData() {

    loadingEl.style.display =
        "flex";

    statusEl.textContent =
        "Đang tải dữ liệu...";


    try {

        /*
           cache bust
        */

        const url =
            SHEET_URL +
            "&_=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const parsed =
            parseCSV(
                text
            );


        if (
            parsed.length === 0
        ) {

            throw new Error(
                "Google Sheet không có dữ liệu"
            );

        }


        /*
           Header
        */

        headers =
            parsed[0].map(
                value =>
                    normalizeValue(
                        value
                    ).trim()
            );


        /*
           Rows
        */

        rows =
            parsed
                .slice(1)
                .map(
                    row => {

                        const result =
                            new Array(
                                headers.length
                            ).fill("");

                        for (
                            let i = 0;
                            i < headers.length;
                            i++
                        ) {

                            result[i] =
                                normalizeValue(
                                    row[i]
                                );

                        }

                        return result;

                    }
                )
                .filter(
                    row =>
                        row.some(
                            value =>
                                value !== ""
                        )
                );


        initializeDefaultFilters();

        saveState();

        renderTable();

        buildRenameSettings();


        const now =
            new Date();

        statusEl.textContent =
            `${rows.length.toLocaleString("vi-VN")} dòng • cập nhật ${now.toLocaleTimeString("vi-VN")}`;


    } catch (error) {

        console.error(
            error
        );

        statusEl.textContent =
            "Lỗi tải dữ liệu";

        tableBody.innerHTML = "";

        const tr =
            document.createElement(
                "tr"
            );

        const td =
            document.createElement(
                "td"
            );

        td.className =
            "empty-row";

        td.colSpan =
            Math.max(
                1,
                getVisibleHeaderIndices()
                    .length
            );

        td.textContent =
            "Không thể tải dữ liệu Google Sheet: " +
            error.message;

        tr.appendChild(
            td
        );

        tableBody.appendChild(
            tr
        );

    } finally {

        loadingEl.style.display =
            "none";

    }

}

/* =========================================================
   FREEZE INPUT
========================================================= */

document
    .getElementById(
        "freezeInput"
    )
    .addEventListener(
        "change",
        event => {

            let value =
                Number(
                    event.target.value
                );


            if (
                !Number.isFinite(
                    value
                )
            ) {

                value = 0;

            }


            value =
                Math.max(
                    0,
                    Math.floor(
                        value
                    )
                );


            const visibleCount =
                getVisibleHeaderIndices()
                    .length;


            value =
                Math.min(
                    value,
                    visibleCount
                );


            freezeCount =
                value;


            event.target.value =
                value;


            saveState();

            renderTable();

        }
    );
