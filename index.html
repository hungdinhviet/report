<style>
* {

html,

/* =========================

========================= */

<script>

/* ============================================================
   GOOGLE SHEET
============================================================ */

const GOOGLE_SHEET_CSV =
    "https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* ============================================================
   LOCAL STORAGE
============================================================ */

const STORAGE_KEY =
    "report_google_sheet_table_v12";

const OLD_KEYS = [
    "report_google_sheet_table_v11",
    "report_google_sheet_table_v10",
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];

const DEFAULT_LAYOUT_VERSION = 2;


/* ============================================================
   HIDDEN COLUMNS
============================================================ */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* ============================================================
   SPECIAL SORT MAPPING
============================================================ */

const SORT_BY_MAP = {
    "DATA": "Sort_DATA",
    "Thoại nội mạng": "Sort_NM",
    "Thoại ngoại mạng": "Sort_NgM"
};


/* ============================================================
   DEFAULT COLUMN RENAME
============================================================ */

const DEFAULT_COLUMN_RENAMES = {

    "Package":
        "Gói cước",

    "TOTAL PRICE":
        "Giá gói",

    "REVENUE":
        "Chu kỳ",

    "Cách tính chu kỳ":
        "1 chu kỳ",

    "Packageprice":
        "Giá/kỳ",

    "Ngày update":
        "Update"
};


/* ============================================================
   DEFAULT ALIGNMENT
============================================================ */

const DEFAULT_COLUMN_ALIGNMENTS = {

    "Total Price":
        "right",

    "REVENUE":
        "center",

    "Cách tính chu kỳ":
        "center",

    "Packageprice":
        "right",

    "Pre/Post":
        "center",

    "KHDN/KHCN":
        "center",

    "Cam kết MNP":
        "center",

    "Ngày update":
        "center"
};


/* ============================================================
   DEFAULT WIDTH MULTIPLIERS
============================================================ */

const DEFAULT_COLUMN_WIDTH_MULTIPLIERS = {

    "Kỳ":
        0.5,
    "Chu kỳ":
        0.5,
    "1 chu kỳ":
        0.5,
    "Giá gói":
        0.8,

    "Đối tượng áp dụng":
        4,

    "Phạm vi cung cấp":
        2,

    "Facebook/Youtube/Tiktok":
        2,

    "Free truy cập":
        2,

    "Khác":
        2,

    "Thoại nội mạng":
        1.5,

    "Thoại ngoại mạng":
        1.5,

    "Loại gói cước":
        1.5,

    "Tự động gia hạn":
        1.5,

    "Dừng đăng kí mới":
        1.5
};


/* ============================================================
   STATE
============================================================ */

let headers = [];
let rows = [];

let filters = {};
let searches = {};
let sorts = {};

let columnWidths = {};
let columnFormats = {};
let renamedHeaders = {};

let freezeCount = 6;

let defaultFiltersInitialized = false;

let openFilterIndex = null;
let filterMenuElement = null;

let filterValueSearch = "";

let resizeState = null;

let autoRefreshTimer = null;


/* ============================================================
   DOM
============================================================ */

const tableWrapper =
    document.getElementById("tableWrapper");

const tableHead =
    document.getElementById("tableHead");

const tableBody =
    document.getElementById("tableBody");

const loading =
    document.getElementById("loading");

const statusText =
    document.getElementById("statusText");


/* ============================================================
   CSV PARSER
============================================================ */

function parseCSV(text) {

    const result = [];

    let row = [];
    let value = "";

    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        if (char === '"') {

            if (
                insideQuotes &&
                text[i + 1] === '"'
            ) {

                value += '"';
                i++;

            } else {

                insideQuotes =
                    !insideQuotes;
            }

        } else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);
            value = "";

        } else if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                text[i + 1] === "\n"
            ) {
                i++;
            }

            row.push(value);

            result.push(row);

            row = [];
            value = "";

        } else {

            value += char;
        }
    }

    if (
        value.length > 0 ||
        row.length > 0
    ) {

        row.push(value);
        result.push(row);
    }

    return result;
}


/* ============================================================
   LOAD DATA
============================================================ */

async function loadData() {

    showLoading(true);

    try {

        const url =
            GOOGLE_SHEET_CSV +
            "&_=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        const parsed =
            parseCSV(text);

        if (!parsed.length) {
            throw new Error(
                "Không có dữ liệu"
            );
        }

        headers =
            parsed[0]
                .map(v => String(v).trim());

        rows =
            parsed
                .slice(1)
                .filter(row =>
                    row.some(
                        v =>
                            String(v ?? "").trim() !== ""
                    )
                )
                .map(row => {

                    const obj = {};

                    headers.forEach(
                        (header, index) => {

                            obj[header] =
                                row[index] ?? "";
                        }
                    );

                    return obj;
                });

        initializeDefaults();

        render();

        statusText.textContent =
            `Đã tải ${rows.length.toLocaleString("vi-VN")} dòng`;

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Lỗi tải dữ liệu";

        alert(
            "Không thể tải Google Sheet.\n\n" +
            error.message
        );

    } finally {

        showLoading(false);
    }
}


/* ============================================================
   DEFAULT FILTERS
============================================================ */

function initializeDefaults() {

    if (defaultFiltersInitialized) {
        return;
    }

    defaultFiltersInitialized = true;

    const updateIndex =
        headers.indexOf("Ngày update");

    if (updateIndex >= 0) {

        const header =
            headers[updateIndex];

        const values =
            [...new Set(
                rows
                    .map(row =>
                        String(
                            row[header] ?? ""
                        )
                    )
            )];

        const nonBlank =
            values.filter(
                v => v.trim() !== ""
            );

        filters[updateIndex] =
            new Set(nonBlank);
    }


    const stopIndex =
        headers.indexOf("Dừng gói");

    if (stopIndex >= 0) {

        const header =
            headers[stopIndex];

        const values =
            [...new Set(
                rows
                    .map(row =>
                        String(
                            row[header] ?? ""
                        )
                    )
            )];

        if (values.includes("")) {

            filters[stopIndex] =
                new Set([""]);

        } else {

            filters[stopIndex] =
                new Set();
        }
    }
}


/* ============================================================
   DISPLAY HEADER
============================================================ */

function getDisplayHeader(index) {

    const original =
        headers[index];

    if (
        Object.prototype.hasOwnProperty.call(
            renamedHeaders,
            original
        )
    ) {

        return renamedHeaders[original];
    }

    if (
        Object.prototype.hasOwnProperty.call(
            DEFAULT_COLUMN_RENAMES,
            original
        )
    ) {

        return DEFAULT_COLUMN_RENAMES[original];
    }

    return original;
}


/* ============================================================
   COLUMN WIDTH
============================================================ */

function getColumnWidth(index) {

    if (
        Object.prototype.hasOwnProperty.call(
            columnWidths,
            index
        )
    ) {

        return Number(
            columnWidths[index]
        ) || 150;
    }

    const original =
        headers[index];

    const multiplier =
        DEFAULT_COLUMN_WIDTH_MULTIPLIERS[
            original
        ] || 1;

    return 150 * multiplier;
}


/* ============================================================
   COLUMN FORMAT
============================================================ */

function getColumnFormat(index) {

    const original =
        headers[index];

    const defaultFormat = {

        align:
            DEFAULT_COLUMN_ALIGNMENTS[
                original
            ] || "left",

        fontFamily:
            "Arial",

        fontSize:
            14,

        bold:
            false,

        italic:
            false,

        wrap:
            true,

        color:
            "#111111",

        background:
            "#ffffff"
    };

    return {
        ...defaultFormat,
        ...(columnFormats[index] || {})
    };
}


/* ============================================================
   APPLY FORMAT
============================================================ */

function applyFormatToCell(
    cell,
    index
) {

    const format =
        getColumnFormat(index);

    cell.style.textAlign =
        format.align;

    cell.style.fontFamily =
        format.fontFamily;

    cell.style.fontSize =
        format.fontSize + "px";

    cell.style.fontWeight =
        format.bold
            ? "bold"
            : "normal";

    cell.style.fontStyle =
        format.italic
            ? "italic"
            : "normal";

    cell.style.whiteSpace =
        format.wrap
            ? "pre-wrap"
            : "nowrap";

    cell.style.overflowWrap =
        format.wrap
            ? "anywhere"
            : "normal";

    cell.style.wordBreak =
        format.wrap
            ? "break-word"
            : "normal";

    cell.style.color =
        format.color;

    cell.style.background =
        format.background;
}


/* ============================================================
   FORMAT DATE / RELATIVE MONTH
============================================================ */

function displayDateRelative(value) {

    const text =
        String(value ?? "").trim();

    if (!text) {
        return "";
    }

    let date = null;

    let match =
        text.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (match) {

        date =
            new Date(
                Number(match[3]),
                Number(match[2]) - 1,
                Number(match[1])
            );
    }

    if (!date || isNaN(date.getTime())) {

        date =
            new Date(text);
    }

    if (!date || isNaN(date.getTime())) {

        return text;
    }

    const now =
        new Date();

    const monthDiff =
        (
            now.getFullYear() -
            date.getFullYear()
        ) * 12 +
        (
            now.getMonth() -
            date.getMonth()
        );

    const diff =
        Math.max(
            0,
            monthDiff
        );

    if (diff === 0) {
        return "0 tháng";
    }

    return String(diff).padStart(
        2,
        "0"
    ) + " tháng";
}


/* ============================================================
   VN NUMBER
============================================================ */

function parseVNNumber(value) {

    let text =
        String(value ?? "").trim();

    if (!text) {
        return NaN;
    }

    text =
        text.replace(/\s/g, "");

    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text.replace(/\./g, "")
                .replace(",", ".");

    } else if (
        text.includes(".")
    ) {

        const parts =
            text.split(".");

        if (
            parts.length > 1 &&
            parts.every(
                (part, index) =>
                    index === 0 ||
                    /^\d{3}$/.test(part)
            )
        ) {

            text =
                text.replace(/\./g, "");
        }
    } else if (
        text.includes(",")
    ) {

        const parts =
            text.split(",");

        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            text =
                text.replace(",", ".");

        } else {

            text =
                text.replace(/,/g, "");
        }
    }

    const number =
        Number(text);

    return isNaN(number)
        ? NaN
        : number;
}


/* ============================================================
   SORT VALUE
============================================================ */

function getSortValue(
    row,
    index
) {

    const original =
        headers[index];

    const mapped =
        SORT_BY_MAP[original];

    const sortColumn =
        mapped || original;

    const value =
        row[sortColumn];

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    const text =
        String(value).trim();

    const number =
        parseVNNumber(text);

    if (!isNaN(number)) {
        return number;
    }

    const date =
        new Date(text);

    if (
        !isNaN(date.getTime()) &&
        /^\d{1,2}[\/-]\d{1,2}[\/-]\d{4}$/.test(text)
    ) {

        return date.getTime();
    }

    return text.toLowerCase();
}


/* ============================================================
   FILTER MATCH
============================================================ */

function rowMatchesFilters(
    row,
    ignoreColumn = -1
) {

    for (
        let index = 0;
        index < headers.length;
        index++
    ) {

        if (
            index === ignoreColumn
        ) {
            continue;
        }

        const header =
            headers[index];

        const value =
            String(
                row[header] ?? ""
            );

        /* FILTER */

        if (
            filters[index] &&
            filters[index].size > 0
        ) {

            if (
                !filters[index].has(value)
            ) {

                return false;
            }
        }

        /* SEARCH */

        const search =
            String(
                searches[index] ?? ""
            )
            .trim()
            .toLowerCase();

        if (search) {

            if (
                !value
                    .toLowerCase()
                    .includes(search)
            ) {

                return false;
            }
        }
    }

    return true;
}


/* ============================================================
   FILTER VALUES
============================================================ */

function getFilterValuesForColumn(
    index
) {

    const values = new Set();

    rows.forEach(row => {

        if (
            rowMatchesFilters(
                row,
                index
            )
        ) {

            values.add(
                String(
                    row[
                        headers[index]
                    ] ?? ""
                )
            );
        }
    });

    return [...values].sort(
        (a, b) =>
            a.localeCompare(
                b,
                "vi",
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );
}


/* ============================================================
   VISIBLE ROWS
============================================================ */

function getVisibleRows() {

    let result =
        rows.filter(
            row =>
                rowMatchesFilters(row)
        );

    const sortEntries =
        Object.entries(sorts)
            .map(
                ([index, config]) => ({
                    index: Number(index),
                    priority:
                        Number(
                            config.priority
                        ),
                    direction:
                        config.direction === "desc"
                            ? -1
                            : 1
                })
            )
            .filter(
                item =>
                    !isNaN(
                        item.priority
                    )
            )
            .sort(
                (a, b) =>
                    a.priority -
                    b.priority
            );

    if (sortEntries.length) {

        result.sort(
            (a, b) => {

                for (
                    const item of sortEntries
                ) {

                    const av =
                        getSortValue(
                            a,
                            item.index
                        );

                    const bv =
                        getSortValue(
                            b,
                            item.index
                        );

                    if (av === bv) {
                        continue;
                    }

                    if (
                        typeof av === "number" &&
                        typeof bv === "number"
                    ) {

                        return (
                            av - bv
                        ) *
                        item.direction;
                    }

                    return (
                        String(av)
                            .localeCompare(
                                String(bv),
                                "vi",
                                {
                                    numeric: true,
                                    sensitivity: "base"
                                }
                            )
                    ) *
                    item.direction;
                }

                return 0;
            }
        );
    }

    return result;
}


/* ============================================================
   RENDER
============================================================ */

function render() {

    renderHeader();

    renderBody();

    applyFreezeColumns();

    updateHeaderStates();
}


/* ============================================================
   RENDER HEADER
============================================================ */

function renderHeader() {

    tableHead.innerHTML = "";

    const headerRow =
        document.createElement("tr");

    const searchRow =
        document.createElement("tr");

    headers.forEach(
        (header, index) => {

            if (
                HIDDEN_COLUMNS.has(header)
            ) {
                return;
            }

            /* HEADER */

            const th =
                document.createElement("th");

            th.className =
                "header-cell";

            th.dataset.index =
                index;

            th.style.width =
                getColumnWidth(index) + "px";

            const inner =
                document.createElement("div");

            inner.className =
                "header-inner";

            const title =
                document.createElement("span");

            title.className =
                "header-title";

            title.textContent =
                getDisplayHeader(index);

            const arrow =
                document.createElement("span");

            arrow.className =
                "header-arrow";

            arrow.textContent =
                "▼";

            arrow.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openFilterMenu(
                        index,
                        th
                    );
                }
            );

            inner.appendChild(title);
            inner.appendChild(arrow);

            th.appendChild(inner);

            /* RESIZE */

            const resize =
                document.createElement("div");

            resize.className =
                "resize-handle";

            resize.addEventListener(
                "mousedown",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    startResize(
                        event,
                        index
                    );
                }
            );

            th.appendChild(resize);

            headerRow.appendChild(th);


            /* SEARCH */

            const searchTh =
                document.createElement("th");

            searchTh.className =
                "search-cell";

            searchTh.dataset.index =
                index;

            searchTh.style.width =
                getColumnWidth(index) + "px";

            const input =
                document.createElement("input");

            input.className =
                "search-input";

            input.type =
                "text";

            input.placeholder =
                "Tìm kiếm...";

            input.value =
                searches[index] || "";

            input.addEventListener(
                "input",
                event => {

                    searches[index] =
                        event.target.value;

                    renderBody();

                    updateHeaderStates();
                }
            );

            searchTh.appendChild(input);

            searchRow.appendChild(searchTh);
        }
    );

    tableHead.appendChild(
        headerRow
    );

    tableHead.appendChild(
        searchRow
    );

    applyFreezeColumns();
}


/* ============================================================
   RENDER BODY
============================================================ */

function renderBody() {

    tableBody.innerHTML = "";

    const visibleRows =
        getVisibleRows();

    visibleRows.forEach(row => {

        const tr =
            document.createElement("tr");

        headers.forEach(
            (header, index) => {

                if (
                    HIDDEN_COLUMNS.has(header)
                ) {
                    return;
                }

                const td =
                    document.createElement("td");

                td.style.width =
                    getColumnWidth(index) +
                    "px";

                let value =
                    row[header] ?? "";

                if (
                    header === "Ngày update"
                ) {

                    value =
                        displayDateRelative(
                            value
                        );
                }

                td.textContent =
                    value;

                applyFormatToCell(
                    td,
                    index
                );

                td.dataset.index =
                    index;

                tr.appendChild(td);
            }
        );

        tableBody.appendChild(tr);
    });

    applyFreezeColumns();
}


/* ============================================================
   UPDATE HEADER STATES
============================================================ */

function updateHeaderStates() {

    document
        .querySelectorAll(
            ".header-cell"
        )
        .forEach(th => {

            const index =
                Number(
                    th.dataset.index
                );

            const hasFilter =
                (
                    filters[index] &&
                    filters[index].size > 0
                ) ||
                Boolean(
                    String(
                        searches[index] || ""
                    ).trim()
                );

            const hasSort =
                Boolean(
                    sorts[index]
                );

            th.classList.remove(
                "active-filter",
                "active-sort",
                "active-both"
            );

            if (
                hasFilter &&
                hasSort
            ) {

                th.classList.add(
                    "active-both"
                );

            } else if (hasFilter) {

                th.classList.add(
                    "active-filter"
                );

            } else if (hasSort) {

                th.classList.add(
                    "active-sort"
                );
            }
        });
}


/* ============================================================
   FILTER MENU
============================================================ */

function openFilterMenu(
    index,
    anchor
) {

    closeFilterMenu();

    filterValueSearch = "";

    const menu =
        document.createElement("div");

    menu.className =
        "filter-menu";

    filterMenuElement =
        menu;

    openFilterIndex =
        index;

    const header =
        document.createElement("div");

    header.className =
        "filter-header";

    header.textContent =
        getDisplayHeader(index);

    menu.appendChild(header);


    /* FILTER BODY */

    const body =
        document.createElement("div");

    body.className =
        "filter-body";

    const valueSearch =
        document.createElement("input");

    valueSearch.className =
        "filter-value-search";

    valueSearch.placeholder =
        "Tìm trong danh sách...";

    body.appendChild(
        valueSearch
    );


    const actions =
        document.createElement("div");

    actions.className =
        "filter-actions";

    const selectAll =
        document.createElement("button");

    selectAll.textContent =
        "Chọn tất cả";

    const deselectAll =
        document.createElement("button");

    deselectAll.textContent =
        "Bỏ chọn";

    const clearFilter =
        document.createElement("button");

    clearFilter.textContent =
        "Xóa lọc";

    actions.appendChild(
        selectAll
    );

    actions.appendChild(
        deselectAll
    );

    actions.appendChild(
        clearFilter
    );

    body.appendChild(actions);


    const valuesContainer =
        document.createElement("div");

    body.appendChild(
        valuesContainer
    );

    menu.appendChild(body);


    /* CURRENT FILTER */

    const currentFilter =
        filters[index]
            ? new Set(filters[index])
            : null;


    function renderValues() {

        valuesContainer.innerHTML = "";

        const values =
            getFilterValuesForColumn(
                index
            );

        const allValues =
            [...new Set(
                rows.map(
                    row =>
                        String(
                            row[
                                headers[index]
                            ] ?? ""
                        )
                )
            )];

        let filteredValues =
            allValues;

        const searchText =
            filterValueSearch
                .trim()
                .toLowerCase();

        if (searchText) {

            filteredValues =
                allValues.filter(
                    value =>
                        value
                            .toLowerCase()
                            .includes(
                                searchText
                            )
                );
        }

        /* Các giá trị phù hợp với filter hiện tại
           được đưa lên đầu, nhưng vẫn giữ toàn bộ
           giá trị để người dùng có thể chọn lại. */

        const ordered =
            [
                ...filteredValues.filter(
                    value =>
                        values.includes(value)
                ),
                ...filteredValues.filter(
                    value =>
                        !values.includes(value)
                )
            ];

        const unique =
            [...new Set(ordered)];

        unique.forEach(value => {

            const item =
                document.createElement("label");

            item.className =
                "filter-value";

            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.checked =
                currentFilter === null
                    ? true
                    : currentFilter.has(
                        value
                    );

            checkbox.addEventListener(
                "change",
                () => {

                    if (!filters[index]) {

                        filters[index] =
                            new Set(
                                allValues
                            );
                    }

                    if (
                        checkbox.checked
                    ) {

                        filters[index].add(
                            value
                        );

                    } else {

                        filters[index].delete(
                            value
                        );
                    }

                    renderBody();

                    updateHeaderStates();

                    saveState();

                    renderValues();
                }
            );

            const text =
                document.createElement("span");

            text.className =
                "filter-value-text";

            text.textContent =
                value === ""
                    ? "(Trống)"
                    : value;

            item.appendChild(
                checkbox
            );

            item.appendChild(
                text
            );

            valuesContainer.appendChild(
                item
            );
        });
    }


    selectAll.addEventListener(
        "click",
        () => {

            const allValues =
                new Set(
                    rows.map(
                        row =>
                            String(
                                row[
                                    headers[index]
                                ] ?? ""
                            )
                    )
                );

            filters[index] =
                allValues;

            renderBody();

            updateHeaderStates();

            saveState();

            renderValues();
        }
    );


    deselectAll.addEventListener(
        "click",
        () => {

            filters[index] =
                new Set();

            renderBody();

            updateHeaderStates();

            saveState();

            renderValues();
        }
    );


    clearFilter.addEventListener(
        "click",
        () => {

            delete filters[index];

            renderBody();

            updateHeaderStates();

            saveState();

            renderValues();
        }
    );


    valueSearch.addEventListener(
        "input",
        event => {

            filterValueSearch =
                event.target.value;

            renderValues();
        }
    );


    renderValues();


    /* SORT */

    const sortSection =
        createSortSection(index);

    menu.appendChild(
        sortSection
    );


    /* FORMAT */

    const formatSection =
        createFormatSection(index);

    menu.appendChild(
        formatSection
    );


    /* RENAME */

    const renameSection =
        document.createElement("div");

    renameSection.className =
        "menu-section";

    const renameTitle =
        document.createElement("div");

    renameTitle.className =
        "menu-section-title";

    renameTitle.textContent =
        "Đổi tên cột";

    const renameButton =
        document.createElement("button");

    renameButton.textContent =
        "Đổi tên...";

    renameButton.style.width =
        "100%";

    renameButton.style.height =
        "31px";

    renameButton.style.border =
        "1px solid #ccc";

    renameButton.style.borderRadius =
        "4px";

    renameButton.style.background =
        "#fff";

    renameButton.style.cursor =
        "pointer";

    renameButton.addEventListener(
        "click",
        () => {

            openRenamePrompt(index);

            closeFilterMenu();
        }
    );

    renameSection.appendChild(
        renameTitle
    );

    renameSection.appendChild(
        renameButton
    );

    menu.appendChild(
        renameSection
    );


    /* FOOTER */

    const footer =
        document.createElement("div");

    footer.className =
        "filter-footer";

    const closeBtn =
        document.createElement("button");

    closeBtn.textContent =
        "Đóng";

    closeBtn.addEventListener(
        "click",
        closeFilterMenu
    );

    footer.appendChild(
        closeBtn
    );

    menu.appendChild(
        footer
    );


    document
        .getElementById(
            "filterMenuContainer"
        )
        .appendChild(menu);


    /* POSITION */

    const rect =
        anchor.getBoundingClientRect();

    let left =
        rect.left;

    let top =
        rect.bottom + 4;

    if (
        left + 330 >
        window.innerWidth
    ) {

        left =
            window.innerWidth -
            340;
    }

    if (
        top + 600 >
        window.innerHeight
    ) {

        top =
            rect.top -
            604;
    }

    menu.style.left =
        Math.max(
            5,
            left
        ) + "px";

    menu.style.top =
        Math.max(
            5,
            top
        ) + "px";
}

function createSortSection(index) {

    const section =

    section.className =

    priority.type =

    priority.step =
        "any";

    priority.className =
        "sort-priority";

    priority.placeholder =
        "vd: 10";

    priority.value =
        sorts[index]
            ? sorts[index].priority
            : "";

    row.appendChild(
        priority
    );


    const direction =
        document.createElement("select");

    direction.className =
        "sort-direction";

    const asc =
        document.createElement("option");

    asc.value =
        "asc";

    asc.textContent =
        "Tăng dần";

    const desc =
        document.createElement("option");

    desc.value =
        "desc";

    desc.textContent =
        "Giảm dần";

    direction.appendChild(asc);
    direction.appendChild(desc);

    if (
        sorts[index] &&
        sorts[index].direction
    ) {

        direction.value =
            sorts[index].direction;
    }

    row.appendChild(
        direction
    );

    section.appendChild(row);


    const remove =
        document.createElement("button");

    remove.textContent =
        "Xóa sort";

    remove.style.width =
        "100%";

    remove.style.height =
        "29px";

    remove.style.border =
        "1px solid #ccc";

    remove.style.borderRadius =
        "4px";

    remove.style.background =
        "#fff";

    remove.style.cursor =
        "pointer";


    function saveSort() {

        const value =
            priority.value.trim();

        if (!value) {

            delete sorts[index];

        } else {

            sorts[index] = {

                priority:
                    value,

                direction:
                    direction.value
            };
        }

        renderBody();

        updateHeaderStates();

        saveState();
    }


    priority.addEventListener(
        "change",
        saveSort
    );

    direction.addEventListener(
        "change",
        saveSort
    );


    remove.addEventListener(
        "click",
        () => {

            delete sorts[index];

            priority.value =
                "";

            renderBody();

            updateHeaderStates();

            saveState();
        }
    );

    section.appendChild(
        remove
    );

    return section;
}

        document.createElement("input");

    background.type =
        "color";

    background.value =
        current.background;

    backgroundRow.appendChild(
        backgroundLabel
    );

    backgroundRow.appendChild(
        background
    );

    section.appendChild(
        backgroundRow
    );


    function saveFormat() {

        columnFormats[index] = {

            align:
                align.value,

            fontFamily:
                font.value,

            fontSize:
                Number(
                    size.value
                ) || 14,

            bold:
                boldInput.checked,

            italic:
                italicInput.checked,

            wrap:
                wrapInput.checked,

            color:
                color.value,

            background:
                background.value
        };

        render();

        saveState();
    }


    [
        align,
        font,
        size,
        boldInput,
        italicInput,
        wrapInput,
        color,
        background
    ].forEach(
        element => {

            element.addEventListener(
                "change",
                saveFormat
            );
        }
    );


    return section;
}


/* ============================================================
   RENAME
============================================================ */

function openRenamePrompt(index) {

    const original =
        headers[index];

    const current =
        getDisplayHeader(index);

    const result =
        prompt(
            "Nhập tên mới cho cột:",
            current
        );

    if (
        result === null
    ) {
        return;
    }

    const newName =
        result.trim();

    if (!newName) {

        delete renamedHeaders[
            original
        ];

    } else if (
        newName ===
        DEFAULT_COLUMN_RENAMES[
            original
        ]
    ) {

        delete renamedHeaders[
            original
        ];

    } else {

        renamedHeaders[
            original
        ] = result;
    }

    render();

    saveState();
}


/* ============================================================
   FREEZE COLUMNS
============================================================ */

function applyFreezeColumns() {

    let left =
        0;

    const visibleIndexes =
        headers
            .map(
                (header, index) =>
                    HIDDEN_COLUMNS.has(header)
                        ? null
                        : index
            )
            .filter(
                index =>
                    index !== null
            );

    const frozenIndexes =
        new Set(
            visibleIndexes.slice(
                0,
                Math.max(
                    0,
                    Number(
                        freezeCount
                    ) || 0
                )
            )
        );


    /* HEADER */

    document
        .querySelectorAll(
            ".header-cell"
        )
        .forEach(th => {

            const index =
                Number(
                    th.dataset.index
                );

            th.classList.remove(
                "frozen-column"
            );

            th.style.left =
                "";

            if (
                frozenIndexes.has(index)
            ) {

                th.classList.add(
                    "frozen-column"
                );

                th.style.left =
                    left + "px";

                left +=
                    getColumnWidth(
                        index
                    );
            }
        });


    /* SEARCH */

    left = 0;

    document
        .querySelectorAll(
            ".search-cell"
        )
        .forEach(th => {

            const index =
                Number(
                    th.dataset.index
                );

            th.classList.remove(
                "frozen-column"
            );

            th.style.left =
                "";

            if (
                frozenIndexes.has(index)
            ) {

                th.classList.add(
                    "frozen-column"
                );

                th.style.left =
                    left + "px";

                left +=
                    getColumnWidth(
                        index
                    );
            }
        });


    /* BODY */

    document
        .querySelectorAll(
            "tbody tr"
        )
        .forEach(tr => {

            let bodyLeft = 0;

            const cells =
                [
                    ...tr.children
                ];

            let visiblePosition = 0;

            headers.forEach(
                (header, index) => {

                    if (
                        HIDDEN_COLUMNS.has(
                            header
                        )
                    ) {
                        return;
                    }

                    const td =
                        cells[
                            visiblePosition
                        ];

                    visiblePosition++;

                    if (!td) {
                        return;
                    }

                    td.classList.remove(
                        "frozen-column"
                    );

                    td.style.left =
                        "";

                    if (
                        frozenIndexes.has(index)
                    ) {

                        td.classList.add(
                            "frozen-column"
                        );

                        td.style.left =
                            bodyLeft + "px";

                        bodyLeft +=
                            getColumnWidth(
                                index
                            );
                    }
                }
            );
        });
}


/* ============================================================
   RESIZE
============================================================ */

function startResize(
    event,
    index
) {

    resizeState = {

        index,

        startX:
            event.clientX,

        startWidth:
            getColumnWidth(index)
    };

    document.addEventListener(
        "mousemove",
        resizeMove
    );

    document.addEventListener(
        "mouseup",
        resizeEnd
    );
}


function resizeMove(event) {

    if (!resizeState) {
        return;
    }

    const delta =
        event.clientX -
        resizeState.startX;

    const newWidth =
        Math.max(
            60,
            resizeState.startWidth +
            delta
        );

    columnWidths[
        resizeState.index
    ] =
        newWidth;

    updateColumnWidthsDOM();

    applyFreezeColumns();
}


function resizeEnd() {

    if (!resizeState) {
        return;
    }

    resizeState = null;

    document.removeEventListener(
        "mousemove",
        resizeMove
    );

    document.removeEventListener(
        "mouseup",
        resizeEnd
    );

    saveState();
}


function updateColumnWidthsDOM() {

    document
        .querySelectorAll(
            ".header-cell"
        )
        .forEach(th => {

            const index =
                Number(
                    th.dataset.index
                );

            th.style.width =
                getColumnWidth(index) +
                "px";
        });


    document
        .querySelectorAll(
            ".search-cell"
        )
        .forEach(th => {

            const index =
                Number(
                    th.dataset.index
                );

            th.style.width =
                getColumnWidth(index) +
                "px";
        });


    document
        .querySelectorAll(
            "tbody tr"
        )
        .forEach(tr => {

            let cellIndex = 0;

            headers.forEach(
                (header, index) => {

                    if (
                        HIDDEN_COLUMNS.has(
                            header
                        )
                    ) {
                        return;
                    }

                    const cell =
                        tr.children[
                            cellIndex++
                        ];

                    if (cell) {

                        cell.style.width =
                            getColumnWidth(
                                index
                            ) + "px";
                    }
                }
            );
        });
}


/* ============================================================
   CLOSE FILTER
============================================================ */

function closeFilterMenu() {

    if (
        filterMenuElement
    ) {

        filterMenuElement.remove();

        filterMenuElement =
            null;
    }

    openFilterIndex =
        null;
}


/* ============================================================
   RESET
============================================================ */

function resetUserState() {

    searches = {};
    sorts = {};

    /* giữ default filters */

    filters = {};

    defaultFiltersInitialized =
        false;

    initializeDefaults();

    render();

    saveState();
}


/* ============================================================
   SAVE STATE
============================================================ */

function saveState() {

    const state = {

        filters:
            Object.fromEntries(
                Object.entries(filters)
                    .map(
                        ([key, value]) =>
                            [
                                key,
                                [...value]
                            ]
                    )
            ),

        searches,

        sorts,

        columnWidths,

        columnFormats,

        renamedHeaders,

        freezeCount,

        defaultFiltersInitialized,

        defaultLayoutVersion:
            DEFAULT_LAYOUT_VERSION,

        autoRefreshMinutes:
            Number(
                document.getElementById(
                    "autoRefreshSelect"
                )?.value || 0
            )
    };

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    } catch (error) {

        console.error(
            "Không thể lưu LocalStorage:",
            error
        );
    }
}


/* ============================================================
   LOAD STATE
============================================================ */

function loadState() {

    let saved = null;

    try {

        const current =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (current) {

            saved =
                JSON.parse(current);

        } else {

            for (
                const key of OLD_KEYS
            ) {

                const old =
                    localStorage.getItem(
                        key
                    );

                if (old) {

                    saved =
                        JSON.parse(old);

                    break;
                }
            }
        }

    } catch (error) {

        console.error(
            "Lỗi đọc LocalStorage:",
            error
        );

        saved = null;
    }


    if (!saved) {

        freezeCount =
            6;

        return;
    }


    /* FILTER */

    if (saved.filters) {

        filters =
            Object.fromEntries(
                Object.entries(
                    saved.filters
                ).map(
                    ([key, value]) =>
                        [
                            key,
                            new Set(value)
                        ]
                )
            );
    }


    /* SEARCH */

    searches =
        saved.searches ||
        {};


    /* SORT */

    sorts =
        saved.sorts ||
        {};


    /* WIDTH */

    columnWidths =
        saved.columnWidths ||
        {};


    /* FORMAT */

    columnFormats =
        saved.columnFormats ||
        {};


    /* RENAME */

    renamedHeaders =
        saved.renamedHeaders ||
        {};


    /* FREEZE */

    if (
        Object.prototype.hasOwnProperty.call(
            saved,
            "freezeCount"
        )
    ) {

        freezeCount =
            Number(
                saved.freezeCount
            );

    } else {

        freezeCount =
            6;
    }


    defaultFiltersInitialized =
        Boolean(
            saved.defaultFiltersInitialized
        );


    /*
       Nếu đây là layout cũ,
       chỉ nâng version.

       Không xóa width/format của người dùng.
    */

    if (
        Number(
            saved.defaultLayoutVersion || 0
        ) <
        DEFAULT_LAYOUT_VERSION
    ) {

        /*
           Nếu state cũ chưa từng lưu
           freezeCount thì dùng 6.
        */

        if (
            !Object.prototype.hasOwnProperty.call(
                saved,
                "freezeCount"
            )
        ) {

            freezeCount =
                6;
        }
    }


    saveState();
}


/* ============================================================
   AUTO REFRESH
============================================================ */

function setupAutoRefresh() {

    if (autoRefreshTimer) {

        clearInterval(
            autoRefreshTimer
        );

        autoRefreshTimer =
            null;
    }

    const select =
        document.getElementById(
            "autoRefreshSelect"
        );

    if (!select) {
        return;
    }

    const minutes =
        Number(
            select.value
        );

    if (
        !minutes ||
        minutes <= 0
    ) {
        return;
    }

    autoRefreshTimer =
        setInterval(
            () => {

                loadData();

            },
            minutes *
            60 *
            1000
        );
}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings() {

    const overlay =
        document.getElementById(
            "settingsOverlay"
        );

    const freezeInput =
        document.getElementById(
            "freezeCountInput"
        );

    freezeInput.value =
        freezeCount;

    const autoSelect =
        document.getElementById(
            "autoRefreshSelect"
        );

    const saved =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "{}"
        );

    autoSelect.value =
        String(
            saved.autoRefreshMinutes ||
            0
        );

    renderRenameList();

    overlay.style.display =
        "block";
}


function closeSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .style.display =
        "none";
}


/* ============================================================
   RENAME LIST
============================================================ */

function renderRenameList() {

    const container =
        document.getElementById(
            "renameList"
        );

    container.innerHTML = "";

    const title =
        document.createElement("div");

    title.style.fontWeight =
        "bold";

    title.style.marginBottom =
        "8px";

    title.textContent =
        "Đổi tên cột";

    container.appendChild(title);


    headers.forEach(
        (header, index) => {

            if (
                HIDDEN_COLUMNS.has(header)
            ) {
                return;
            }

            const item =
                document.createElement("div");

            item.className =
                "rename-item";


            const original =
                document.createElement(
                    "input"
                );

            original.value =
                header;

            original.readOnly =
                true;

            original.title =
                "Tên gốc";

            const newName =
                document.createElement(
                    "input"
                );

            newName.value =
                getDisplayHeader(index);

            newName.dataset.index =
                index;

            newName.placeholder =
                "Tên hiển thị";


            newName.addEventListener(
                "change",
                () => {

                    const value =
                        newName.value;

                    if (
                        value.trim() === ""
                    ) {

                        delete renamedHeaders[
                            header
                        ];

                    } else if (
                        value ===
                        DEFAULT_COLUMN_RENAMES[
                            header
                        ]
                    ) {

                        delete renamedHeaders[
                            header
                        ];

                    } else {

                        renamedHeaders[
                            header
                        ] = value;
                    }
                }
            );


            item.appendChild(
                original
            );

            item.appendChild(
                newName
            );

            container.appendChild(
                item
            );
        }
    );
}


/* ============================================================
   SAVE SETTINGS
============================================================ */

function saveSettings() {

    const freezeInput =
        document.getElementById(
            "freezeCountInput"
        );

    freezeCount =
        Math.max(
            0,
            Number(
                freezeInput.value
            ) || 0
        );


    const autoSelect =
        document.getElementById(
            "autoRefreshSelect"
        );


    render();

    saveState();

    setupAutoRefresh();

    closeSettings();
}


/* ============================================================
   SHOW LOADING
============================================================ */

function showLoading(show) {

    loading.style.display =
        show
            ? "flex"
            : "none";
}


/* ============================================================
   BUTTON EVENTS
============================================================ */

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        () => {

            loadData();
        }
    );


document
    .getElementById(
        "resetBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (
                confirm(
                    "Bạn có muốn reset filter, search và sort không?"
                )
            ) {

                resetUserState();
            }
        }
    );


document
    .getElementById(
        "settingsBtn"
    )
    .addEventListener(
        "click",
        openSettings
    );


document
    .getElementById(
        "closeSettingsBtn"
    )
    .addEventListener(
        "click",
        closeSettings
    );


document
    .getElementById(
        "saveSettingsBtn"
    )
    .addEventListener(
        "click",
        saveSettings
    );


document
    .getElementById(
        "settingsOverlay"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "settingsOverlay"
            ) {

                closeSettings();
            }
        }
    );


/* ============================================================
   CLICK OUTSIDE FILTER MENU
============================================================ */

document.addEventListener(
    "mousedown",
    event => {

        if (
            !filterMenuElement
        ) {
            return;
        }

        if (
            filterMenuElement.contains(
                event.target
            )
        ) {
            return;
        }

        if (
            event.target.closest(
                ".header-arrow"
            )
        ) {
            return;
        }

        closeFilterMenu();
    }
);


/* ============================================================
   WINDOW RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        if (
            filterMenuElement &&
            openFilterIndex !== null
        ) {

            closeFilterMenu();
        }

        applyFreezeColumns();
    }
);


/* ============================================================
   INITIALIZE
============================================================ */

loadState();

loadData();

</script>

</body>
</html>
