<script>
"use strict";

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   AI SEARCH
========================================================= */

const AI_SEARCH_URL =
"https://dinhviethung-ai-search.hung-dinhviet1997.workers.dev";


/*
   Trạng thái tìm kiếm AI.

   AI KHÔNG thay thế globalSearch.
   Nó là một lớp filter bổ sung.
*/

let aiQuery = "";

let aiConditions = [];

let aiSort = null;

let aiSearchLoading = false;


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
"report_google_sheet_table_v11";

const OLD_KEYS = [
    "report_google_sheet_table_v10",
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SPECIAL SORT MAPPING
========================================================= */

const SORT_BY_MAP = {

    "DATA":
        "Sort_DATA",

    "Thoại nội mạng":
        "Sort_NM",

    "Thoại ngoại mạng":
        "Sort_NgM"

};


/* =========================================================
   DATA
========================================================= */

let headers = [];

let rows = [];


/* =========================================================
   STATE
========================================================= */

let filters = {};

let searches = {};

let sorts = {};

let globalSearch = "";

let columnWidths = {};

let columnFormats = {};

let renamedHeaders = {
    "Package": "Gói cước",
    "TOTAL PRICE": "Giá gói",
    "REVENUE": "Chu kỳ",
    "Cách tính chu kỳ": "1 chu kỳ",
    "Packageprice": "Giá/kỳ"
};

let freezeCount = 9;


/* =========================================================
   DEFAULT FILTER
========================================================= */

let defaultFiltersInitialized =
false;


/* =========================================================
   FILTER MENU
========================================================= */

let openFilterIndex =
null;

let filterMenuElement =
null;

let filterValueSearch =
"";


/* =========================================================
   RESIZE
========================================================= */

let resizeState =
null;


/* =========================================================
   AUTO REFRESH
========================================================= */

let autoRefreshTimer =
null;


/* =========================================================
   DOM
========================================================= */

const table =
document.getElementById(
    "dataTable"
);

const thead =
table.querySelector(
    "thead"
);

const tbody =
table.querySelector(
    "tbody"
);

const tableWrapper =
document.getElementById(
    "tableWrapper"
);

const loading =
document.getElementById(
    "loading"
);

const statusEl =
document.getElementById(
    "status"
);

const settingsOverlay =
document.getElementById(
    "settingsOverlay"
);

const freezeCountInput =
document.getElementById(
    "freezeCountInput"
);

const autoRefreshSelect =
document.getElementById(
    "autoRefreshSelect"
);

const renameList =
document.getElementById(
    "renameList"
);

const toolbarFreezeCount =
document.getElementById(
    "toolbarFreezeCount"
);

const globalSearchInput =
document.getElementById(
    "globalSearchInput"
);

const clearGlobalSearchBtn =
document.getElementById(
    "clearGlobalSearchBtn"
);

const aiSearchBtn =
document.getElementById(
    "aiSearchBtn"
);

const aiSearchStatus =
document.getElementById(
    "aiSearchStatus"
);


/* =========================================================
   LOAD STATE
========================================================= */

function loadState(){

    let saved = null;

    try{

        const current =
        localStorage.getItem(
            STORAGE_KEY
        );

        if(current){
            saved =
            JSON.parse(current);
        }


        if(!saved){

            for(
                const key of OLD_KEYS
            ){

                const old =
                localStorage.getItem(
                    key
                );

                if(old){

                    saved =
                    JSON.parse(old);

                    break;
                }
            }
        }

    }
    catch(error){

        console.warn(
            "Không đọc được LocalStorage",
            error
        );
    }


    if(!saved){
        return;
    }


    filters =
    saved.filters || {};

    searches =
    saved.searches || {};

    /*
       Tìm kiếm toàn bảng.
    */

    globalSearch =
    String(
        saved.globalSearch || ""
    );


    columnWidths =
    saved.columnWidths || {};

    columnFormats =
    saved.columnFormats || {};

    renamedHeaders = {
        ...(saved.renamedHeaders || {}),
        "Package": "Gói cước",
        "TOTAL PRICE": "Giá gói",
        "REVENUE": "Chu kỳ",
        "Cách tính chu kỳ": "1 chu kỳ",
        "Packageprice": "Giá/kỳ"
    };


    freezeCount =
    saved.freezeCount !== undefined
        ? Number(saved.freezeCount)
        : 9;


    /*
       SORT mặc định mỗi lần tải website:

       1. Packageprice       → Tăng dần
       2. DATA               → Giảm dần
       3. Thoại nội mạng     → Giảm dần
       4. Thoại ngoại mạng   → Tăng dần
    */

    sorts = {};

    const packagePriceIndex =
    headers.indexOf(
        "Packageprice"
    );

    const dataIndex =
    headers.indexOf(
        "DATA"
    );

    const noiMangIndex =
    headers.indexOf(
        "Thoại nội mạng"
    );

    const ngoaiMangIndex =
    headers.indexOf(
        "Thoại ngoại mạng"
    );


    if(
        packagePriceIndex >= 0
    ){

        sorts[packagePriceIndex] = {
            direction: "asc",
            priority: 1
        };

    }


    if(
        dataIndex >= 0
    ){

        sorts[dataIndex] = {
            direction: "desc",
            priority: 2
        };

    }


    if(
        noiMangIndex >= 0
    ){

        sorts[noiMangIndex] = {
            direction: "desc",
            priority: 3
        };

    }


    if(
        ngoaiMangIndex >= 0
    ){

        sorts[ngoaiMangIndex] = {
            direction: "asc",
            priority: 4
        };

    }


    /*
       AI không lưu trong LocalStorage.

       Lý do:
       mỗi lần tải trang, AI query cũ
       không nên tự động lọc lại dữ liệu.
    */

    aiQuery = "";

    aiConditions = [];

    aiSort = null;

}

/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const result = [];

    let row = [];

    let cell = "";

    let inQuotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const c =
        text[i];

        const next =
        text[i + 1];


        if(c === '"'){

            if(
                inQuotes &&
                next === '"'
            ){

                cell += '"';

                i++;

            }
            else{

                inQuotes =
                !inQuotes;
            }

        }


        else if(
            c === "," &&
            !inQuotes
        ){

            row.push(cell);

            cell = "";
        }


        else if(
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !inQuotes
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;
            }


            row.push(cell);

            cell = "";


            if(
                row.length > 1 ||
                row[0] !== ""
            ){

                result.push(row);
            }


            row = [];
        }


        else{

            cell += c;
        }
    }


    if(
        cell.length > 0 ||
        row.length > 0
    ){

        row.push(cell);

        result.push(row);
    }


    return result;
}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    loading.classList.remove(
        "hidden"
    );

    statusEl.textContent =
    "Đang tải dữ liệu...";


    try{

        const response =
        await fetch(
            CSV_URL +
            "&cachebust=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const text =
        await response.text();


        if(!text.trim()){

            throw new Error(
                "Google Sheet trả về rỗng."
            );
        }


        const parsed =
        parseCSV(text);


        if(
            !parsed.length ||
            !parsed[0].length
        ){

            throw new Error(
                "Không tìm thấy header."
            );
        }


        headers =
        parsed[0].map(
            value =>
            String(value).trim()
        );


        rows =
        parsed
        .slice(1)
        .map(sourceRow => {

            const row =
            new Array(
                headers.length
            ).fill("");


            for(
                let i = 0;
                i < headers.length;
                i++
            ){

                row[i] =
                sourceRow[i] == null
                    ? ""
                    : String(
                        sourceRow[i]
                    );
            }


            return row;
        });


        /*
           Nếu Google Sheet có thêm cột mới,
           vẫn không phá state cũ.
        */

        initializeDefaults();


        renderTable();


        updateGlobalSearchUI();


        updateToolbarFreezeCount();


        setupAutoRefresh();


        updateStatus();


    }
    catch(error){

        console.error(error);


        statusEl.textContent =
        "Lỗi tải dữ liệu";


        thead.innerHTML = "";

        tbody.innerHTML = "";


        const tr =
        document.createElement("tr");

        const td =
        document.createElement("td");


        td.colSpan =
        Math.max(
            headers.length,
            1
        );


        td.className =
        "message";


        td.textContent =
        "Không tải được Google Sheet: " +
        error.message;


        tr.appendChild(td);

        tbody.appendChild(tr);

    }
    finally{

        loading.classList.add(
            "hidden"
        );
    }
}

    if(aiQuery){

/* =========================================================
   DEFAULT FILTER
========================================================= */

function initializeDefaults(){

    if(
        defaultFiltersInitialized
    ){

        return;
    }


    defaultFiltersInitialized =
    true;


    /*
       SORT mặc định:

       1. Packageprice      → Tăng dần
       2. DATA              → Giảm dần
       3. Thoại nội mạng    → Giảm dần
       4. Thoại ngoại mạng  → Giảm dần
    */

    const packagePriceIndex =
    headers.indexOf(
        "Packageprice"
    );

    const dataIndex =
    headers.indexOf(
        "DATA"
    );

    const noiMangIndex =
    headers.indexOf(
        "Thoại nội mạng"
    );

    const ngoaiMangIndex =
    headers.indexOf(
        "Thoại ngoại mạng"
    );


    sorts = {};


    if(
        packagePriceIndex >= 0
    ){

        sorts[packagePriceIndex] = {
            direction: "asc",
            priority: 1
        };

    }


    if(
        dataIndex >= 0
    ){

        sorts[dataIndex] = {
            direction: "desc",
            priority: 2
        };

    }


    if(
        noiMangIndex >= 0
    ){

        sorts[noiMangIndex] = {
            direction: "desc",
            priority: 3
        };

    }


    if(
        ngoaiMangIndex >= 0
    ){

        sorts[ngoaiMangIndex] = {
            direction: "desc",
            priority: 4
        };

    }


    const dateIndex =
    headers.indexOf(
        "Ngày update"
    );


    const stopIndex =
    headers.indexOf(
        "Dừng gói"
    );


    /*
       Ngày update:
       chọn non-blank.
    */

    if(
        dateIndex >= 0 &&
        filters[dateIndex] === undefined
    ){

        filters[dateIndex] =
        getAllColumnValues(
            dateIndex
        )
        .filter(
            value =>
            String(value).trim() !== ""
        );
    }


    /*
       Dừng gói:
       chỉ chọn blank.
    */

    if(
        stopIndex >= 0 &&
        filters[stopIndex] === undefined
    ){

        filters[stopIndex] = [""];
    }


    saveState();
}

/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value){

    return String(
        value ?? ""
    )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );
}


/* =========================================================
   NUMBER
========================================================= */

function parseVNNumber(value){

    let s =
    String(
        value ?? ""
    ).trim();


    if(!s){
        return null;
    }


    /*
       Hỗ trợ AI:

       150k
       150K
       1.5 GB
       1,5 GB
       120.000đ
       120.000 đồng
       2GB/ngày
    */

    s =
    s
    .toLowerCase()
    .replace(
        /đ|₫|vnd|đồng/g,
        ""
    )
    .trim();


    let multiplier = 1;


    if(
        /k$/.test(s)
    ){

        multiplier = 1000;

        s =
        s.replace(
            /k$/,
            ""
        ).trim();
    }


    s =
    s.replace(
        /[a-zA-ZÀ-ỹ]+\/.*$/u,
        ""
    )
    .trim();


    s =
    s.replace(
        /[^0-9,.\-]/g,
        ""
    );


    if(!s){
        return null;
    }


    if(
        /^-?\d{1,3}(\.\d{3})+(,\d+)?$/
        .test(s)
    ){

        return Number(
            s
            .replace(/\./g,"")
            .replace(",",".")
        ) * multiplier;
    }


    if(
        /^-?\d+(,\d+)?$/
        .test(s)
    ){

        return Number(
            s.replace(",",".")
        ) * multiplier;
    }


    if(
        /^-?\d+(\.\d+)?$/
        .test(s)
    ){

        return Number(s) * multiplier;
    }


    return null;
}


/* =========================================================
   DATE
========================================================= */

function parseVietnameseDate(value){

    const s =
    String(
        value ?? ""
    ).trim();


    const match =
    s.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


    if(!match){
        return null;
    }


    const day =
    Number(match[1]);

    const month =
    Number(match[2]) - 1;

    const year =
    Number(match[3]);


    const date =
    new Date(
        year,
        month,
        day
    );


    if(
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
    ){

        return null;
    }


    return date;
}


/* =========================================================
   DATE DISPLAY
========================================================= */

function displayDateRelative(value){

    const date =
    parseVietnameseDate(value);


    if(!date){
        return value;
    }


    const now =
    new Date();


    const months =
    (
        now.getFullYear() -
        date.getFullYear()
    ) * 12
    +
    (
        now.getMonth() -
        date.getMonth()
    );


    const n =
    Math.max(
        0,
        months
    );


    if(n === 0){

        return "0 tháng";
    }


    return (
        String(n).padStart(2,"0") +
        " tháng"
    );
}

   DISPLAY VALUE
========================================================= */

function getDisplayValue(
    value,
    header
){

    if(
        header === "Ngày update"
    ){

        return displayDateRelative(

    return String(

/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(
    row,
    index
){

    const originalHeader =
    headers[index];


    /*
       DATA → Sort_DATA
       Nội mạng → Sort_NM
       Ngoại mạng → Sort_NgM
    */

    const helperHeader =
    SORT_BY_MAP[
        originalHeader
    ];


    let value =
    row[index];


    if(helperHeader){

        const helperIndex =
        headers.indexOf(
            helperHeader
        );


        if(
            helperIndex >= 0 &&
            String(
                row[helperIndex] ?? ""
            ).trim() !== ""
        ){

            value =
            row[helperIndex];
        }
    }


    const number =
    parseVNNumber(value);


    if(number !== null){

        return {

            type:"number",

            value:number

        };
    }


    const date =
    parseVietnameseDate(value);


    if(date){

        return {

            type:"date",

            value:date.getTime()

        };
    }


    return {

        type:"text",

        value:
        normalizeText(value)

    };
}


/* =========================================================
   AI CONDITION HELPERS
========================================================= */

function resolveAIConditionIndex(condition){

    if(!condition){
        return -1;
    }


    /*
       Ưu tiên index nếu Worker trả về index.
    */

    if(
        condition.columnIndex !== undefined &&
        Number.isFinite(
            Number(condition.columnIndex)
        )
    ){

        const index =
        Number(
            condition.columnIndex
        );


        if(
            index >= 0 &&
            index < headers.length
        ){

            return index;
        }
    }


    if(
        condition.index !== undefined &&
        Number.isFinite(
            Number(condition.index)
        )
    ){

        const index =
        Number(
            condition.index
        );


        if(
            index >= 0 &&
            index < headers.length
        ){

            return index;
        }
    }


    /*
       Nếu AI trả tên cột gốc.
    */

    const candidates = [

        condition.column,

        condition.columnName,

        condition.name,

        condition.header,

        condition.displayName

    ];


    for(
        const candidate of candidates
    ){

        if(
            candidate === undefined ||
            candidate === null
        ){

            continue;
        }


        const text =
        String(candidate).trim();


        let index =
        headers.indexOf(text);


        if(index >= 0){
            return index;
        }


        /*
           Thử theo tên hiển thị.
        */

        index =
        headers.findIndex(
            header =>
            getDisplayHeader(header) === text
        );


        if(index >= 0){
            return index;
        }


        /*
           So sánh không dấu,
           không phân biệt hoa thường.
        */

        const normalized =
        normalizeText(text);


        index =
        headers.findIndex(
            header =>
            normalizeText(header) ===
            normalized
        );


        if(index >= 0){
            return index;
        }


        index =
        headers.findIndex(
            header =>
            normalizeText(
                getDisplayHeader(header)
            ) === normalized
        );


        if(index >= 0){
            return index;
        }
    }


    return -1;
}


/* =========================================================
   AI VALUE NUMBER
========================================================= */

function getAINumericValue(value){

    const number =
    parseVNNumber(value);


    if(number !== null){
        return number;
    }


    const text =
    normalizeText(value);


    /*
       Hỗ trợ:

       2gb
       2 gb
       2gb/ngay
       1.5gb/ngay
    */

    const match =
    text.match(
        /-?\d+(?:[.,]\d+)/
    );


    if(match){

        return parseVNNumber(
            match[0]
        );
    }


    return null;
}


/* =========================================================
   AI CONDITION MATCH
========================================================= */

function aiConditionMatches(
    row,
    condition
){

    const index =
    resolveAIConditionIndex(
        condition
    );


    /*
       Nếu AI trả điều kiện cho cột
       không tồn tại thì bỏ qua điều kiện
       thay vì làm chết toàn bộ bảng.
    */

    if(index < 0){
        return true;
    }


    const operator =
    String(
        condition.operator || "contains"
    )
    .trim()
    .toLowerCase();


    const rawTarget =
    condition.value !== undefined
        ? condition.value
        : condition.target;


    const cellValue =
    String(
        row[index] ?? ""
    );


    /*
       Có thể AI trả value dạng number.
    */

    const targetValue =
    String(
        rawTarget ?? ""
    );


    const cellNumber =
    getAINumericValue(
        cellValue
    );


    const targetNumber =
    getAINumericValue(
        targetValue
    );


    /*
       So sánh số cho các toán tử
       > >= < <= =
       !=
    */

    if(
        [
            "=",
            "==",
            "!=",
            ">",
            ">=",
            "<",
            "<="
        ].includes(operator)
    ){

        if(
            cellNumber !== null &&
            targetNumber !== null
        ){

            switch(operator){

                case "=":
                case "==":
                    return (
                        cellNumber ===
                        targetNumber
                    );

                case "!=":
                    return (
                        cellNumber !==
                        targetNumber
                    );

                case ">":
                    return (
                        cellNumber >
                        targetNumber
                    );

                case ">=":
                    return (
                        cellNumber >=
                        targetNumber
                    );

                case "<":
                    return (
                        cellNumber <
                        targetNumber
                    );

                case "<=":
                    return (
                        cellNumber <=
                        targetNumber
                    );

            }
        }
    }


    const cellText =
    normalizeText(
        cellValue
    );


    const targetText =
    normalizeText(
        targetValue
    );


    switch(operator){

        case "=":
        case "==":
            return cellText === targetText;

        case "!=":
            return cellText !== targetText;

        case "contains":
            return cellText.includes(
                targetText
            );

        case "not_contains":
        case "not contains":
            return !cellText.includes(
                targetText
            );

        case ">":
        case ">=":
        case "<":
        case "<=":

            /*
               Nếu không chuyển được thành số,
               thử so sánh text.
            */

            return (
                operator === ">"
                    ? cellText > targetText
                    : operator === ">="
                        ? cellText >= targetText
                        : operator === "<"
                            ? cellText < targetText
                            : cellText <= targetText
            );

        default:
            return cellText.includes(
                targetText
            );
    }
}


/* =========================================================
   AI FILTER
========================================================= */

function rowMatchesAIConditions(row){

    if(
        !Array.isArray(aiConditions) ||
        aiConditions.length === 0
    ){

        return true;
    }


    return aiConditions.every(
        condition =>
        aiConditionMatches(
            row,
            condition
        )
    );
}


/* =========================================================
   AI SORT
========================================================= */

function applyAISort(result){

    if(
        !aiSort
    ){

        return result;
    }


    const sortIndex =
    resolveAIConditionIndex(
        aiSort
    );


    if(sortIndex < 0){

        return result;
    }


    const direction =
    String(
        aiSort.direction ||
        aiSort.order ||
        "asc"
    ).toLowerCase();


    result.sort(
        (a,b) => {

            const av =
            getSortValue(
                a.row,
                sortIndex
            );


            const bv =
            getSortValue(
                b.row,
                sortIndex
            );


            let compare = 0;


            if(
                av.type === "number" &&
                bv.type === "number"
            ){

                compare =
                av.value -
                bv.value;
            }


            else if(
                av.type === "date" &&
                bv.type === "date"
            ){

                compare =
                av.value -
                bv.value;
            }


            else{

                compare =
                String(av.value)
                .localeCompare(
                    String(bv.value),
                    "vi",
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                );
            }


            if(
                direction === "desc" ||
                direction === "descending" ||
                direction === "giảm dần"
            ){

                compare =
                -compare;
            }


            if(compare !== 0){

                return compare;
            }


            return (
                a.originalIndex -
                b.originalIndex
            );
        }
    );


    return result;
}


/* =========================================================
   ROW MATCH
========================================================= */

function rowMatchesFilters(
    row,
    ignoreColumn = -1
){

    /*
       FILTER
    */

    for(
        const key of Object.keys(filters)
    ){

        const index =
        Number(key);


        if(
            index === ignoreColumn
        ){

            continue;
        }


        const selected =
        filters[key];


        if(
            selected === undefined
        ){

            continue;
        }


        /*
           Bỏ chọn hết
           = không có dòng.
        */

        if(
            Array.isArray(selected) &&
            selected.length === 0
        ){

            return false;
        }


        const value =
        String(
            row[index] ?? ""
        );


        if(
            Array.isArray(selected) &&
            selected.length > 0 &&
            !selected.includes(value)
        ){

            return false;
        }
    }


    /*
       =====================================================
       AI SEARCH
       =====================================================

       AI filter được áp dụng sau filter cột.

       Khi đang mở danh sách filter của một cột,
       AI vẫn được giữ lại.
    */

    if(
        !rowMatchesAIConditions(row)
    ){

        return false;
    }


    /*
       =====================================================
       GLOBAL SEARCH
       =====================================================

       Tìm trên TOÀN BỘ thông tin của dòng.

       Không phân biệt:
       - Hoa / thường
       - Có / không dấu tiếng Việt
    */

    const globalQuery =
    normalizeText(
        globalSearch
    );


    if(globalQuery){

        const rowText =
        row
        .map(
            value =>
            normalizeText(value)
        )
        .join(" ");


        if(
            !rowText.includes(
                globalQuery
            )
        ){

            return false;
        }
    }


    /*
       SEARCH
    */

    for(
        const key of Object.keys(searches)
    ){

        const index =
        Number(key);


        if(
            index === ignoreColumn
        ){

            continue;
        }


        const query =
        normalizeText(
            searches[key]
        );


        if(!query){
            continue;
        }


        const value =
        normalizeText(
            row[index]
        );


        if(
            !value.includes(query)
        ){

            return false;
        }
    }


    return true;
}


/* =========================================================
   FILTER VALUES FOR CURRENT COLUMN
========================================================= */

function getFilterValuesForColumn(
    index
){

    /*
       Bỏ qua filter/search của chính
       cột đang mở.

       AI vẫn được áp dụng.
    */

    const source =
    rows.filter(
        row =>
        rowMatchesFilters(
            row,
            index
        )
    );


    const set =
    new Set();


    source.forEach(row => {

        set.add(
            String(
                row[index] ?? ""
            )
        );

    });


    return Array.from(set);
}


/* =========================================================
   VISIBLE ROWS
========================================================= */

function getVisibleRows(){

    const result =
    rows
    .map(
        (row,originalIndex) => ({
            row,
            originalIndex
        })
    )
    .filter(
        item =>
        rowMatchesFilters(
            item.row
        )
    );


    /*
       SORTS
       Priority hoàn toàn linh hoạt.
    */

    const activeSorts =
    Object.keys(sorts)
    .map(key => {

        const priority =
        Number(
            sorts[key].priority
        );


        return {

            index:
            Number(key),

            priority,

            direction:
            sorts[key].direction ||
            "asc"

        };

    })
    .filter(
        item =>
        Number.isFinite(
            item.priority
        )
    )
    .sort(
        (a,b) =>
        a.priority -
        b.priority
    );


    if(
        activeSorts.length > 0
    ){

        result.sort(
            (a,b) => {

                for(
                    const sort of activeSorts
                ){

                    const av =
                    getSortValue(
                        a.row,
                        sort.index
                    );


                    const bv =
                    getSortValue(
                        b.row,
                        sort.index
                    );


                    let compare = 0;


                    if(
                        av.type === "number" &&
                        bv.type === "number"
                    ){

                        compare =
                        av.value -
                        bv.value;
                    }


                    else if(
                        av.type === "date" &&
                        bv.type === "date"
                    ){

                        compare =
                        av.value -
                        bv.value;
                    }


                    else{

                        compare =
                        String(av.value)
                        .localeCompare(
                            String(bv.value),
                            "vi",
                            {
                                numeric:true,
                                sensitivity:"base"
                            }
                        );
                    }


                    if(compare !== 0){

                        return (
                            sort.direction === "desc"
                                ? -compare
                                : compare
                        );
                    }
                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );
            }
        );
    }


    /*
       Nếu AI có sort thì áp dụng sau sort
       của người dùng.

       Như vậy AI vẫn có thể yêu cầu:
       "tìm gói dưới 150k, sắp xếp giá tăng dần".
    */

    applyAISort(result);


    return result;
}

/* =========================================================
   WIDTH
========================================================= */

function measureHeaderText(
    text,
    font = "bold 14px Arial"
){

    const canvas =
    document.createElement("canvas");

    const context =
    canvas.getContext("2d");

    context.font =
    font;

    return context.measureText(
        String(text ?? "")
    ).width;
}


function calculateHeaderWidth(index){

    const originalHeader =
    headers[index];


    const displayHeader =
    getDisplayHeader(
        originalHeader
    );


    const titleWidth =
    measureHeaderText(
        displayHeader,
        "bold 14px Arial"
    );


    const sortIcon =
    getSortIcon(index);


    const sortWidth =
    Math.max(
        24,
        measureHeaderText(
            sortIcon,
            "14px Arial"
        ) + 8
    );


    const filterWidth =
    Math.max(
        24,
        measureHeaderText(
            "▼",
            "14px Arial"
        ) + 8
    );


    const paddingWidth =
    20;


    const totalWidth =
    titleWidth +
    sortWidth +
    filterWidth +
    paddingWidth;


    return Math.max(
        70,
        Math.ceil(totalWidth)
    );
}


function getColumnWidth(index){

    const originalHeader =
    headers[index];


    if(originalHeader === "Phạm vi cung cấp"){
        return 150 * 2;
    }


    if(originalHeader === "Free truy cập"){
        return 150 * 2;
    }


    if(originalHeader === "Đối tượng áp dụng"){
        return 150 * 4;
    }


    if(
        originalHeader === "Package" ||
        originalHeader === "TOTAL PRICE" ||
        originalHeader === "REVENUE" ||
        originalHeader === "Kỳ" ||
        originalHeader === "Cách tính chu kỳ" ||
        originalHeader === "Packageprice" ||
        originalHeader === "Thoại ngoại mạng" ||
        originalHeader === "Hạ băng thông" ||
        originalHeader === "Loại gói cước" ||
        originalHeader === "Tự động gia hạn"
    ){

        return calculateHeaderWidth(index);
    }


    return (
        Number(
            columnWidths[index]
        ) || 150
    );
}


/* =========================================================
   FORMAT
========================================================= */

function getColumnFormat(index){

    const originalHeader =
    headers[index];


    const format = {

        align:"left",

        fontFamily:"Arial",

        fontSize:14,

        bold:false,

        italic:false,

        wrap:true,

        color:"#111111",

        background:"#ffffff",

        ...(columnFormats[index] || {})

    };


    if(
        originalHeader === "TOTAL PRICE" ||
        originalHeader === "Packageprice"
    ){

        format.align =
        "right";

    }


    if(
        originalHeader === "REVENUE" ||
        originalHeader === "Kỳ" ||
        originalHeader === "Cách tính chu kỳ" ||
        originalHeader === "Pre/Post" ||
        originalHeader === "KHDN/KHCN"
    ){

        format.align =
        "center";

    }


    return format;
}


function applyFormatToCell(
    cell,
    index
){

    const f =
    getColumnFormat(index);


    cell.style.textAlign =
    f.align;


    cell.style.fontFamily =
    f.fontFamily;


    cell.style.fontSize =
    `${Number(f.fontSize) || 14}px`;


    cell.style.fontWeight =
    f.bold
        ? "700"
        : "400";


    cell.style.fontStyle =
    f.italic
        ? "italic"
        : "normal";


    cell.style.color =
    f.color || "#111111";


    cell.style.backgroundColor =
    f.background || "#ffffff";


    if(f.wrap){

        cell.style.whiteSpace =
        "pre-wrap";

        cell.style.overflowWrap =
        "anywhere";

        cell.style.wordBreak =
        "break-word";

    }
    else{

        cell.style.whiteSpace =
        "nowrap";

        cell.style.overflowWrap =
        "normal";

        cell.style.wordBreak =
        "normal";
    }
}

/* =========================================================
   HEADER STATES
========================================================= */

function updateHeaderStates(){

    thead
    .querySelectorAll(
        ".header-cell"
    )
    .forEach(
        th => {

            const index =
            Number(
                th.dataset.column
            );


            const searchActive =
            String(
                searches[index] || ""
            ).trim() !== "";


            const filterActive =
            isEffectiveFilter(
                index
            );


            const sorted =
            sorts[index] !== undefined;


            th.classList.toggle(
                "filtered",
                searchActive ||
                filterActive
            );


            th.classList.toggle(
                "sorted",
                sorted
            );


            const sortButton =
            th.querySelector(
                ".header-button"
            );


            if(sortButton){

                sortButton.textContent =
                getSortIcon(index);
            }

        }
    );
}


/* =========================================================
   EFFECTIVE FILTER
========================================================= */

function isEffectiveFilter(index){

    if(
        filters[index] === undefined
    ){

        return false;
    }


    const selected =
    filters[index];


    if(
        !Array.isArray(selected)
    ){

        return false;
    }


    if(
        selected.length === 0
    ){

        return true;
    }


    const allValues =
    getAllColumnValues(index);


    if(
        selected.length ===
        allValues.length
    ){

        return false;
    }


    return true;
}


/* =========================================================
   SORT ICON
========================================================= */

function getSortIcon(index){

    if(
        sorts[index] === undefined
    ){

        return "↕";
    }


    const direction =
    sorts[index].direction ||
    "asc";


    const priority =
    sorts[index].priority;


    return (
        direction === "asc"
            ? "▲"
            : "▼"
    ) +
    (
        priority !== undefined &&
        priority !== ""
            ? String(priority)
            : ""
    );
}

/* =========================================================
   POSITION MENU
========================================================= */

function positionMenu(anchor){

    if(
        !filterMenuElement ||
        !anchor
    ){

        return;
    }


    const rect =
    anchor.getBoundingClientRect();


    let left =
    rect.left;


    let top =
    rect.bottom + 4;


    requestAnimationFrame(
        () => {

            const width =
            filterMenuElement.offsetWidth;


            const height =
            filterMenuElement.offsetHeight;


            if(
                left + width >
                window.innerWidth - 10
            ){

                left =
                window.innerWidth -
                width -
                10;
            }


            if(
                top + height >
                window.innerHeight - 10
            ){

                top =
                rect.top -
                height -
                4;
            }


            left =
            Math.max(
                10,
                left
            );


            top =
            Math.max(
                10,
                top
            );


            filterMenuElement.style.left =
            `${left}px`;


            filterMenuElement.style.top =
            `${top}px`;

        }
    );
}

/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValuesOnly(
    index
){

    if(
        !filterMenuElement
    ){

        return;
    }


    const container =
    filterMenuElement.querySelector(
        "#filterValuesContainer"
    );


    if(!container){
        return;
    }


    container.innerHTML =
    "";


    const allValues =
    getFilterValuesForColumn(
        index
    );


    const query =
    normalizeText(
        filterValueSearch
    );


    const values =
    allValues.filter(
        value => {

            if(!query){
                return true;
            }


            return normalizeText(
                value
            )
            .includes(query);

        }
    );


    const selected =
    filters[index] === undefined
        ? allValues.slice()
        : filters[index];


    values.forEach(
        value => {

            const row =
            document.createElement(
                "div"
            );


            row.className =
            "filter-value-row";


            const checkbox =
            document.createElement(
                "input"
            );


            checkbox.type =
            "checkbox";


            checkbox.checked =
            selected.includes(
                value
            );


            checkbox.addEventListener(
                "change",
                event => {

                    event.stopPropagation();


                    let current;


                    if(
                        filters[index] === undefined
                    ){

                        current =
                        allValues.slice();

                    }
                    else{

                        current =
                        filters[index].slice();
                    }


                    if(
                        checkbox.checked
                    ){

                        if(
                            !current.includes(
                                value
                            )
                        ){

                            current.push(
                                value
                            );
                        }

                    }
                    else{

                        current =
                        current.filter(
                            item =>
                            item !== value
                        );
                    }


                    filters[index] =
                    current;


                    saveState();


                    renderBody();


                    updateHeaderStates();


                    const savedSearch =
                    filterValueSearch;


                    renderFilterMenu(
                        index
                    );


                    filterValueSearch =
                    savedSearch;


                    const searchInput =
                    filterMenuElement.querySelector(
                        ".filter-search"
                    );


                    if(searchInput){

                        searchInput.value =
                        savedSearch;
                    }


                    renderFilterValuesOnly(
                        index
                    );

                }
            );


            const label =
            document.createElement(
                "label"
            );


            label.textContent =
            value === ""
                ? "(Trống)"
                : value;


            label.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                }
            );


            row.appendChild(
                checkbox
            );


            row.appendChild(
                label
            );


            container.appendChild(
                row
            );

        }
    );
}

/* =========================================================
   COLOR VALID
========================================================= */

function validColor(value){

    return (
        typeof value === "string" &&
        /^#[0-9a-fA-F]{6}$/.test(value)
    );
}

function refreshOpenFilterMenu(
    preserveSearch = true
){

    if(
        openFilterIndex === null ||

        return;
    }


    const index =
    openFilterIndex;


    const oldSearch =
    filterValueSearch;


    renderFilterMenu(

function openRenamePrompt(index){

    const original =
    headers[index];


    const current =
    getDisplayHeader(
        original
    );


    const newName =
    prompt(
        "Tên mới của cột:",
        current
    );


    if(newName === null){
        return;
    }


    const trimmed =
    newName.trim();


    if(trimmed === ""){

        delete renamedHeaders[
            original
        ];

    }
    else{

        renamedHeaders[
            original
        ] =
        trimmed;
    }


    if(
        original === "REVENUE" ||
        original === "Kỳ"
    ){

        delete columnWidths[index];
    }


    saveState();

    renderTable();
}

   SETTINGS RENAME LIST
========================================================= */

function renderRenameList(){

    renameList.innerHTML =
    "";


    headers.forEach(
        (header,index) => {

            if(
                HIDDEN_COLUMNS.has(
                    header
                )
            ){

                return;
            }


            const item =
            document.createElement(
                "div"
            );


            item.className =
            "rename-item";

            document.createElement(
                "div"
            );


            original.className =
            "rename-original";


            original.title =
            header;


            original.textContent =
            header;


            const input =
            document.createElement(
                "input"
            );


            input.type =
            "text";


            input.value =
            getDisplayHeader(
                header
            );


            input.dataset.index =
            String(index);


            input.addEventListener(
                "change",
                () => {

                    const value =
                    input.value.trim();


                    if(
                        value === "" ||
                        value === header
                    ){

                        delete renamedHeaders[
                            header
                        ];

                    }
                    else{

                        renamedHeaders[
                            header
                        ] =
                        value;
                    }

                }
            );


            item.appendChild(
                original
            );


            item.appendChild(
                input
            );


            renameList.appendChild(
                item
            );

        }
    );
}

/* =========================================================
   FREEZE COLUMNS
========================================================= */

function applyFreezeColumns(){

    document
    .querySelectorAll(
        ".frozen-column"
    )
    .forEach(
        cell => {

            cell.classList.remove(
                "frozen-column"
            );


            cell.classList.remove(
                "frozen-last"
            );


            cell.style.left =
            "";

        }
    );


    const visibleIndexes =
    getVisibleHeaderIndexes();


    const count =
    Math.max(
        0,
        Math.min(
            Number(freezeCount) || 0,
            visibleIndexes.length
        )
    );


    if(
        count === 0
    ){

        return;
    }


    const frozenIndexes =
    visibleIndexes.slice(
        0,
        count
    );


    let left = 0;


    frozenIndexes.forEach(
        (index,position) => {

            const width =
            getColumnWidth(
                index
            );


            const cells =
            document.querySelectorAll(
                `[data-column="${index}"]`
            );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );


                    if(
                        position ===
                        frozenIndexes.length - 1
                    ){

                        cell.classList.add(
                            "frozen-last"
                        );
                    }


                    cell.style.left =
                    `${left}px`;


                    if(
                        cell.classList.contains(
                            "header-cell"
                        )
                    ){

                        cell.style.top =
                        "0px";

                        cell.style.zIndex =
                        "1000";

                    }


                    else if(
                        cell.classList.contains(
                            "search-cell"
                        )
                    ){

                        cell.style.top =
                        "38px";

                        cell.style.zIndex =
                        "999";

                    }


                    else{

                        cell.style.zIndex =
                        "100";
                    }

                }
            );


            left += width;
        }
    );
}


/* =========================================================
   TOOLBAR FREEZE COUNT
========================================================= */

function updateToolbarFreezeCount(){

    if(!toolbarFreezeCount){
        return;
    }


    toolbarFreezeCount.value =
    Number(freezeCount) || 0;
}


toolbarFreezeCount.addEventListener(
    "change",
    () => {

        let value =
        Number(
            toolbarFreezeCount.value
        );


        if(
            !Number.isFinite(value)
        ){

            value = 9;
        }


        value =
        Math.max(
            0,
            Math.min(
                Math.floor(value),
                getVisibleHeaderIndexes().length
            )
        );


        freezeCount =
        value;


        toolbarFreezeCount.value =
        value;


        saveState();


        applyFreezeColumns();
    }
);


toolbarFreezeCount.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            toolbarFreezeCount.blur();
        }
    }
);

========================================================= */

function startResize(
    event,
    index
){

    resizeState = {

        index,

        startX:
        event.clientX,

        startWidth:
        getColumnWidth(index)

    };


    document.body.style.cursor =
    "col-resize";


    document.body.style.userSelect =
    "none";
}


/* =========================================================
   RESIZE MOVE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !resizeState
        ){

            return;
        }


        const delta =
        event.clientX -
        resizeState.startX;


        const width =
        Math.max(
            30,
            resizeState.startWidth +
            delta
        );


        columnWidths[
            resizeState.index
        ] =
        width;


        document
        .querySelectorAll(
            `[data-column="${resizeState.index}"]`
        )
        .forEach(
            cell => {

                cell.style.width =
                `${width}px`;

                cell.style.minWidth =
                `${width}px`;

                cell.style.maxWidth =
                `${width}px`;
            }
        );


        applyFreezeColumns();

    }
);


/* =========================================================
   RESIZE END
========================================================= */

document.addEventListener(
    "mouseup",
    () => {

        if(
            !resizeState
        ){

            return;
        }


        saveState();


        resizeState =
        null;


        document.body.style.cursor =
        "";


        document.body.style.userSelect =
        "";

    }
);

/* =========================================================

========================================================= */

function getAIColumnMetadata(){

    return getVisibleHeaderIndexes()
    .map(
        index => ({

            index,

            name:
            headers[index],

            displayName:
            getDisplayHeader(
                headers[index]
            )

/* =========================================================
   AI REQUEST
========================================================= */

async function runAISearch(){

    const question =
    String(
        globalSearchInput.value || ""
    ).trim();


    if(!question){

        showAIStatus(
            "Hãy nhập câu hỏi tìm kiếm trước."
        );

        globalSearchInput.focus();

        return;
    }


    if(aiSearchLoading){
        return;
    }


    aiSearchLoading =
    true;


    updateGlobalSearchUI();


    showAIStatus(
        "✨ AI đang phân tích yêu cầu..."
    );


    /*
       Khi dùng AI:
       globalSearch được xóa.

       AI sẽ trở thành lớp filter riêng,
       tránh việc câu "dưới 150k"
       bị áp dụng thêm như text search.
    */

    globalSearch =
    "";


    try{

        const response =
        await fetch(
            AI_SEARCH_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    question,

                    columns:
                    getAIColumnMetadata()

                })
            }
        );


        const data =
        await response.json()
        .catch(
            () => ({})
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                `HTTP ${response.status}`
            );
        }


        if(
            !data ||
            data.ok === false
        ){

            throw new Error(
                data?.message ||
                data?.error ||
                "AI không trả về kết quả hợp lệ."
            );
        }


        /*
           Lưu kết quả AI.
        */

        aiQuery =
        question;


        aiConditions =
        Array.isArray(
            data.conditions
        )
            ? data.conditions
            : [];


        aiSort =
        data.sort || null;


        /*
           Nếu AI không tạo được điều kiện
           thì vẫn cho phép message hiển thị.
        */

        const conditionCount =
        aiConditions.length;


        const resultCount =
        rows.filter(
            row =>
            rowMatchesFilters(
                row
            )
        ).length;


        renderBody();


        updateHeaderStates();


        updateGlobalSearchUI();


        showAIStatus(
            data.message ||
            (
                conditionCount
                    ? `✨ AI đã áp dụng ${conditionCount} điều kiện • ${resultCount.toLocaleString("vi-VN")} dòng`
                    : "✨ AI đã xử lý yêu cầu."
            )
        );


    }
    catch(error){

        console.error(
            "AI Search Error:",
            error
        );


        /*
           Không làm mất các filter
           người dùng đang có.
        */

        aiQuery =
        "";

        aiConditions =
        [];

        aiSort =
        null;


        updateGlobalSearchUI();


        showAIStatus(
            "❌ AI lỗi: " +
            error.message
        );


        renderBody();

    }
    finally{

        aiSearchLoading =
        false;


        updateGlobalSearchUI();

    }
}


/* =========================================================
   GLOBAL SEARCH INPUT
========================================================= */

globalSearchInput.addEventListener(
    "input",
    () => {

        /*
           Nếu người dùng sửa nội dung sau
           khi đã chạy AI:

           -> hủy kết quả AI cũ
           -> nội dung hiện tại trở thành
              global search bình thường.
        */

        if(aiQuery){

            clearAISearch();
        }


        globalSearch =
        globalSearchInput.value;


        updateGlobalSearchUI();


        saveState();


        renderBody();


        updateHeaderStates();


        if(
            openFilterIndex !== null
        ){

            refreshOpenFilterMenu(
                true
            );

        }

    }
);


/* =========================================================
   GLOBAL SEARCH ENTER
========================================================= */

globalSearchInput.addEventListener(
    "keydown",
    event => {

        /*
           Ctrl + Enter = AI Search
        */

        if(
            event.key === "Enter" &&
            event.ctrlKey
        ){

            event.preventDefault();

            runAISearch();

            return;
        }


        /*
           Enter bình thường:
           giữ nguyên tìm kiếm text hiện tại.
        */

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

        }
    }
);


/* =========================================================
   AI BUTTON
========================================================= */

aiSearchBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();

        runAISearch();
    }
);


/* =========================================================
   CLEAR GLOBAL SEARCH
========================================================= */

clearGlobalSearchBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();


        globalSearch =
        "";


        globalSearchInput.value =
        "";


        clearAISearch();


        saveState();


        renderBody();


        updateHeaderStates();


        updateGlobalSearchUI();


        globalSearchInput.focus();
    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadState();

updateToolbarFreezeCount();

updateGlobalSearchUI();

loadData();

</script>

</body>
</html>
