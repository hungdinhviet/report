<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

body {
    background: #fff;
}

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    background: #f5f5f5;
    border-bottom: 1px solid #ccc;
    z-index: 1000;
}

.toolbar button {
    height: 32px;
    padding: 0 12px;
    border: 1px solid #bbb;
    background: white;
    border-radius: 4px;
    cursor: pointer;
}

.toolbar button:hover {
    background: #eaf2ff;
}

.toolbar .status {
    margin-left: auto;
    color: #666;
    white-space: nowrap;
}

/* =========================
   TABLE AREA
========================= */

.table-wrapper {
    position: absolute;
    left: 0;
    right: 0;
    top: 44px;
    bottom: 0;

    overflow: auto;

    background: white;
    border-top: 1px solid #ddd;
}

/*
IMPORTANT:
sticky hoạt động ổn định nhất khi table dùng
border-collapse: separate.
*/
table {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    width: max-content;
    min-width: 100%;
}

/* =========================
   HEADER
========================= */

thead th {
    position: relative;
    padding: 0;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #aaa;
    background: #f1f3f5;
}

/*
HEADER ROW
*/
.header-cell {
    position: sticky !important;
    top: 0 !important;
    height: 38px;
    z-index: 300 !important;
    background: #f1f3f5 !important;
}

/*
SEARCH ROW
*/
.search-cell {
    position: sticky !important;
    top: 38px !important;
    height: 36px;
    z-index: 299 !important;
    background: #fafafa !important;
}

/*
Frozen header = cao nhất
*/
.header-cell.frozen-column {
    position: sticky !important;
    top: 0 !important;
    z-index: 600 !important;
}

.search-cell.frozen-column {
    position: sticky !important;
    top: 38px !important;
    z-index: 599 !important;
}

/* =========================
   HEADER CONTENT
========================= */

.header-content {
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    gap: 4px;
    cursor: default;
    user-select: none;
}

.header-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: bold;
}

.sort-button {
    width: 22px;
    height: 24px;
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 0;
    font-size: 13px;
}

.filter-button {
    width: 24px;
    height: 24px;
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 0;
    font-size: 13px;
}

/* =========================
   SEARCH
========================= */

.search-cell-inner {
    padding: 4px;
    height: 36px;
}

.column-search {
    width: 100%;
    height: 27px;
    border: 1px solid #bbb;
    border-radius: 3px;
    padding: 3px 6px;
    outline: none;
    font-size: 13px;
    background: white;
}

.column-search:focus {
    border-color: #4285f4;
    box-shadow: 0 0 0 1px #4285f4;
}

/* =========================
   BODY
========================= */

tbody td {
    height: 34px;
    padding: 6px 8px;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    background: white;
    vertical-align: middle;
}

.body-cell {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
}

/*
Frozen body cells.
*/
tbody td.frozen-column {
    position: sticky !important;
    z-index: 100 !important;
    background: white;
}

/*
Frozen column cuối cùng có bóng nhẹ để
nhìn rõ ranh giới.
*/
.frozen-last {
    box-shadow: 4px 0 7px rgba(0,0,0,.12);
}

/* =========================
   FILTERED / SORTED HEADER
========================= */

.header-cell.filtered {
    background: #c8f7c5 !important;
}

.header-cell.sorted {
    background: #d8ebff !important;
}

.header-cell.filtered.sorted {
    background: #bdecc4 !important;
}

/*
Giữ màu khi header vừa frozen vừa filtered/sorted
*/
.header-cell.frozen-column.filtered {
    background: #c8f7c5 !important;
}

.header-cell.frozen-column.sorted {
    background: #d8ebff !important;
}

.header-cell.frozen-column.filtered.sorted {
    background: #bdecc4 !important;
}

/* =========================
   RESIZE HANDLE
========================= */

.resize-handle {
    position: absolute;
    right: -3px;
    top: 0;
    width: 7px;
    height: 100%;
    cursor: col-resize;
    z-index: 700;
}

.resize-handle:hover {
    background: rgba(0, 120, 255, .25);
}

/* =========================
   FILTER MENU
========================= */

.filter-menu {
    position: fixed;
    width: 330px;
    max-height: 600px;
    overflow: hidden;

    background: white;
    border: 1px solid #aaa;
    border-radius: 5px;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);

    z-index: 5000;
}

.filter-menu-inner {
    max-height: 600px;
    overflow-y: auto;
    padding: 8px;
}

.filter-menu-title {
    font-weight: bold;
    margin-bottom: 7px;
}

.filter-values-search {
    width: 100%;
    height: 30px;
    border: 1px solid #bbb;
    border-radius: 3px;
    padding: 4px 7px;
    margin-bottom: 7px;
}

.filter-actions {
    display: flex;
    gap: 5px;
    margin-bottom: 7px;
}

.filter-actions button,
.filter-footer button {
    border: 1px solid #bbb;
    background: white;
    border-radius: 3px;
    padding: 5px 8px;
    cursor: pointer;
}

.filter-actions button:hover,
.filter-footer button:hover {
    background: #eef5ff;
}

.filter-values {
    border-top: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    max-height: 230px;
    overflow-y: auto;
    padding: 5px 0;
}

.filter-value-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 28px;
    padding: 3px 4px;
}

.filter-value-row:hover {
    background: #f3f3f3;
}

.filter-value-row label {
    flex: 1;
    overflow-wrap: anywhere;
    cursor: pointer;
}

.filter-footer {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    padding-top: 8px;
}

/* =========================
   FORMAT AREA
========================= */

.format-section {
    margin-top: 10px;
    border-top: 1px solid #ddd;
    padding-top: 8px;
}

.format-title {
    font-weight: bold;
    margin-bottom: 7px;
}

.format-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 6px;
}

.format-row label {
    width: 85px;
    flex-shrink: 0;
}

.format-row select,
.format-row input[type="number"] {
    flex: 1;
    height: 28px;
}

.format-checks {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.color-input {
    width: 50px;
    height: 28px;
    padding: 0;
}

/* =========================
   SETTINGS
========================= */

.settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.25);
    z-index: 7000;
    display: none;
}

.settings-panel {
    position: absolute;
    top: 55px;
    right: 15px;
    width: 380px;
    max-height: calc(100vh - 70px);
    overflow-y: auto;

    background: white;
    border: 1px solid #aaa;
    border-radius: 6px;
    box-shadow: 0 6px 25px rgba(0,0,0,.25);
    padding: 12px;
}

.settings-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
}

.settings-row {
    margin-bottom: 10px;
}

.settings-row label {
    display: block;
    margin-bottom: 4px;
}

.settings-row input,
.settings-row select {
    width: 100%;
    height: 30px;
}

/* =========================
   LOADING
========================= */

.loading {
    position: absolute;
    inset: 44px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.85);
    z-index: 9000;
    font-size: 16px;
}

.hidden {
    display: none !important;
}

/* =========================
   EMPTY / ERROR
========================= */

.message {
    padding: 30px;
    text-align: center;
    color: #777;
}
</style>
</head>

<body>

<div id="app">

    <div class="toolbar">
        <button id="refreshBtn">↻ Làm mới</button>
        <button id="resetBtn">⟳ Tổng / Reset</button>
        <button id="settingsBtn">⚙ Cài đặt</button>

        <span id="status" class="status">Đang tải...</span>
    </div>

    <div id="loading" class="loading">
        Đang tải dữ liệu...
    </div>

    <div id="tableWrapper" class="table-wrapper">
        <table id="dataTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<div id="settingsOverlay" class="settings-overlay">
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">Cài đặt bảng</div>

        <div class="settings-row">
            <label>Số cột cố định</label>
            <input
                id="freezeCountInput"
                type="number"
                min="0"
                value="0"
            >
        </div>

        <div class="settings-row">
            <label>Tự động làm mới</label>
            <select id="autoRefreshSelect">
                <option value="0">Tắt</option>
                <option value="1">5 phút</option>
                <option value="2">10 phút</option>
                <option value="3">30 phút</option>
            </select>
        </div>

        <div style="text-align:right">
            <button id="closeSettingsBtn">Đóng</button>
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
    "https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "report_google_sheet_table_v10";

const OLD_KEYS = [
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SORT MAP
========================================================= */

const SORT_BY_MAP = {
    "DATA": "Sort_DATA",
    "Thoại nội mạng": "Sort_NM",
    "Thoại ngoại mạng": "Sort_NgM"
};


/* =========================================================
   GLOBAL DATA
========================================================= */

let headers = [];
let rows = [];

let filters = {};
let searches = {};
let sorts = {};

let columnWidths = {};
let columnFormats = {};
let renamedHeaders = {};

let freezeCount = 0;

let openFilterIndex = null;
let filterMenuElement = null;

let filterValueSearch = "";

let resizeState = null;

let autoRefreshTimer = null;


/* =========================================================
   DEFAULT FILTER INITIALIZATION
========================================================= */

let defaultFiltersInitialized = false;


/* =========================================================
   DOM
========================================================= */

const table =
    document.getElementById("dataTable");

const thead =
    table.querySelector("thead");

const tbody =
    table.querySelector("tbody");

const tableWrapper =
    document.getElementById("tableWrapper");

const loading =
    document.getElementById("loading");

const statusEl =
    document.getElementById("status");


/* =========================================================
   LOAD STATE
========================================================= */

function loadState() {

    let saved = null;

    try {
        const current =
            localStorage.getItem(STORAGE_KEY);

        if (current) {
            saved = JSON.parse(current);
        }

        if (!saved) {
            for (const key of OLD_KEYS) {

                const old =
                    localStorage.getItem(key);

                if (old) {
                    saved = JSON.parse(old);
                    break;
                }
            }
        }

    } catch (e) {
        console.warn("Không đọc được localStorage", e);
    }

    if (!saved) return;

    filters =
        saved.filters || {};

    searches =
        saved.searches || {};

    sorts =
        saved.sorts || {};

    columnWidths =
        saved.columnWidths || {};

    columnFormats =
        saved.columnFormats || {};

    renamedHeaders =
        saved.renamedHeaders || {};

    freezeCount =
        Number(saved.freezeCount || 0);
}


/* =========================================================
   SAVE STATE
========================================================= */

function saveState() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
                filters,
                searches,
                sorts,
                columnWidths,
                columnFormats,
                renamedHeaders,
                freezeCount
            })
        );

    } catch (e) {
        console.warn("Không lưu được trạng thái", e);
    }
}


/* =========================================================
   CSV PARSER
   IMPORTANT: giữ xuống dòng trong ô
========================================================= */

function parseCSV(text) {

    const result = [];

    let row = [];
    let cell = "";

    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const c =
            text[i];

        const next =
            text[i + 1];

        if (c === '"') {

            if (
                inQuotes &&
                next === '"'
            ) {
                cell += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }

        } else if (
            c === "," &&
            !inQuotes
        ) {

            row.push(cell);
            cell = "";

        } else if (
            (c === "\n" || c === "\r") &&
            !inQuotes
        ) {

            if (
                c === "\r" &&
                next === "\n"
            ) {
                i++;
            }

            row.push(cell);
            cell = "";

            if (
                row.length > 1 ||
                row[0] !== ""
            ) {
                result.push(row);
            }

            row = [];

        } else {

            cell += c;
        }
    }

    if (
        cell.length > 0 ||
        row.length > 0
    ) {

        row.push(cell);
        result.push(row);
    }

    return result;
}


/* =========================================================
   FETCH DATA
========================================================= */

async function loadData() {

    loading.classList.remove("hidden");

    statusEl.textContent =
        "Đang tải dữ liệu...";

    try {

        const url =
            CSV_URL +
            "&cachebust=" +
            Date.now();

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        if (!text.trim()) {
            throw new Error(
                "Google Sheet trả về dữ liệu rỗng."
            );
        }

        const parsed =
            parseCSV(text);

        if (
            !parsed.length ||
            !parsed[0].length
        ) {
            throw new Error(
                "Không tìm thấy header."
            );
        }

        headers =
            parsed[0]
                .map(x => String(x).trim());

        rows =
            parsed
                .slice(1)
                .map(row => {

                    const result =
                        new Array(headers.length)
                            .fill("");

                    for (
                        let i = 0;
                        i < headers.length;
                        i++
                    ) {
                        result[i] =
                            row[i] == null
                                ? ""
                                : String(row[i]);
                    }

                    return result;
                });

        initializeDefaults();

        renderTable();

        statusEl.textContent =
            `${rows.length.toLocaleString("vi-VN")} dòng • ${new Date().toLocaleTimeString("vi-VN")}`;

    } catch (error) {

        console.error(error);

        statusEl.textContent =
            "Lỗi tải dữ liệu";

        tbody.innerHTML = "";

        const tr =
            document.createElement("tr");

        const td =
            document.createElement("td");

        td.colSpan =
            Math.max(headers.length, 1);

        td.className =
            "message";

        td.textContent =
            "Không tải được dữ liệu Google Sheet: " +
            error.message;

        tr.appendChild(td);
        tbody.appendChild(tr);

    } finally {

        loading.classList.add("hidden");
    }
}


/* =========================================================
   DEFAULT FILTERS
========================================================= */

function initializeDefaults() {

    if (defaultFiltersInitialized) {
        return;
    }

    defaultFiltersInitialized = true;

    const dateIndex =
        headers.indexOf("Ngày update");

    const stopIndex =
        headers.indexOf("Dừng gói");

    /*
       Ngày update:
       chọn tất cả non-blank,
       blank không chọn.
    */

    if (
        dateIndex >= 0 &&
        filters[dateIndex] === undefined
    ) {

        const values =
            getAllColumnValues(dateIndex);

        filters[dateIndex] =
            values.filter(v =>
                String(v).trim() !== ""
            );
    }

    /*
       Dừng gói:
       chỉ chọn blank.
    */

    if (
        stopIndex >= 0 &&
        filters[stopIndex] === undefined
    ) {

        filters[stopIndex] = [""];
    }

    saveState();
}


/* =========================================================
   GET ALL COLUMN VALUES
========================================================= */

function getAllColumnValues(index) {

    const set =
        new Set();

    rows.forEach(row => {

        set.add(
            String(row[index] ?? "")
        );

    });

    return Array.from(set);
}


/* =========================================================
   DISPLAY HEADER
========================================================= */

function getDisplayHeader(header) {

    return renamedHeaders[header] || header;
}


/* =========================================================
   VIETNAMESE NUMBER
========================================================= */

function parseVNNumber(value) {

    const s =
        String(value ?? "").trim();

    if (!s) return null;

    if (
        /^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)
    ) {
        return Number(
            s
                .replace(/\./g, "")
                .replace(",", ".")
        );
    }

    if (
        /^-?\d+(,\d+)?$/.test(s)
    ) {
        return Number(
            s.replace(",", ".")
        );
    }

    if (
        /^-?\d+(\.\d+)?$/.test(s)
    ) {
        return Number(s);
    }

    return null;
}


/* =========================================================
   DATE
========================================================= */

function parseVietnameseDate(value) {

    const s =
        String(value ?? "").trim();

    const match =
        s.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (!match) {
        return null;
    }

    const day =
        Number(match[1]);

    const month =
        Number(match[2]) - 1;

    const year =
        Number(match[3]);

    const date =
        new Date(
            year,
            month,
            day
        );

    if (
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
    ) {
        return null;
    }

    return date;
}


/* =========================================================
   RELATIVE MONTH
========================================================= */

function displayDateRelative(value) {

    const date =
        parseVietnameseDate(value);

    if (!date) {
        return value;
    }

    const now =
        new Date();

    const months =
        (
            now.getFullYear() -
            date.getFullYear()
        ) * 12
        +
        (
            now.getMonth() -
            date.getMonth()
        );

    const n =
        Math.max(0, months);

    if (n === 0) {
        return "0 tháng";
    }

    return (
        String(n).padStart(2, "0") +
        " tháng"
    );
}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function getDisplayValue(value, header) {

    if (
        header === "Ngày update"
    ) {
        return displayDateRelative(value);
    }

    return String(value ?? "");
}


/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(row, index) {

    const header =
        headers[index];

    const mapped =
        SORT_BY_MAP[header];

    let value =
        row[index];

    if (mapped) {

        const mappedIndex =
            headers.indexOf(mapped);

        if (
            mappedIndex >= 0 &&
            String(row[mappedIndex]).trim() !== ""
        ) {
            value =
                row[mappedIndex];
        }
    }

    const numeric =
        parseVNNumber(value);

    if (numeric !== null) {
        return {
            type: "number",
            value: numeric
        };
    }

    const date =
        parseVietnameseDate(value);

    if (date) {
        return {
            type: "date",
            value: date.getTime()
        };
    }

    return {
        type: "text",
        value:
            String(value ?? "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
    };
}


/* =========================================================
   MATCH FILTERS / SEARCHES
========================================================= */

function rowMatchesFilters(
    row,
    ignoreColumn = -1
) {

    /*
       Column filters
    */

    for (
        const key of Object.keys(filters)
    ) {

        const index =
            Number(key);

        if (
            index === ignoreColumn
        ) {
            continue;
        }

        const selected =
            filters[key];

        /*
           undefined = không filter
        */

        if (
            selected === undefined
        ) {
            continue;
        }

        /*
           [] = Bỏ chọn hết
           => không có dòng nào.
        */

        if (
            Array.isArray(selected) &&
            selected.length === 0
        ) {
            return false;
        }

        const value =
            String(row[index] ?? "");

        if (
            Array.isArray(selected) &&
            selected.length > 0 &&
            !selected.includes(value)
        ) {
            return false;
        }
    }


    /*
       Search boxes
    */

    for (
        const key of Object.keys(searches)
    ) {

        const index =
            Number(key);

        if (
            index === ignoreColumn
        ) {
            continue;
        }

        const search =
            String(searches[key] ?? "")
                .trim()
                .toLowerCase();

        if (!search) {
            continue;
        }

        const value =
            String(row[index] ?? "")
                .toLowerCase();

        if (
            !value.includes(search)
        ) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   FILTER VALUES FOR COLUMN
   IMPORTANT:
   bỏ qua filter/search của chính cột đó.
========================================================= */

function getFilterValuesForColumn(index) {

    const source =
        rows.filter(row =>
            rowMatchesFilters(
                row,
                index
            )
        );

    const set =
        new Set();

    source.forEach(row => {

        set.add(
            String(row[index] ?? "")
        );

    });

    return Array.from(set);
}


/* =========================================================
   GET VISIBLE ROWS
========================================================= */

function getVisibleRows() {

    const result =
        rows
            .map((row, originalIndex) => ({
                row,
                originalIndex
            }))
            .filter(item =>
                rowMatchesFilters(
                    item.row
                )
            );

    /*
       Sort theo priority mà user nhập.
       Không normalize số.
    */

    const activeSorts =
        Object.keys(sorts)
            .map(key => ({
                index: Number(key),
                priority: Number(sorts[key].priority),
                direction:
                    sorts[key].direction || "asc"
            }))
            .filter(x =>
                Number.isFinite(x.priority)
            )
            .sort((a, b) =>
                a.priority - b.priority
            );

    if (!activeSorts.length) {
        return result;
    }

    result.sort((a, b) => {

        for (const sort of activeSorts) {

            const av =
                getSortValue(
                    a.row,
                    sort.index
                );

            const bv =
                getSortValue(
                    b.row,
                    sort.index
                );

            let compare = 0;

            if (
                av.type === "number" &&
                bv.type === "number"
            ) {
                compare =
                    av.value - bv.value;

            } else if (
                av.type === "date" &&
                bv.type === "date"
            ) {
                compare =
                    av.value - bv.value;

            } else {

                compare =
                    String(av.value)
                        .localeCompare(
                            String(bv.value),
                            "vi",
                            {
                                numeric: true,
                                sensitivity: "base"
                            }
                        );
            }

            if (compare !== 0) {

                return (
                    sort.direction === "desc"
                        ? -compare
                        : compare
                );
            }
        }

        return (
            a.originalIndex -
            b.originalIndex
        );
    });

    return result;
}


/* =========================================================
   VISIBLE HEADERS
========================================================= */

function getVisibleHeaderIndexes() {

    const result = [];

    headers.forEach(
        (header, index) => {

            if (
                !HIDDEN_COLUMNS.has(header)
            ) {
                result.push(index);
            }

        }
    );

    return result;
}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(index) {

    return (
        Number(
            columnWidths[index]
        ) || 150
    );
}


/* =========================================================
   FORMAT
========================================================= */

function getColumnFormat(index) {

    return {
        align:
            "left",

        fontFamily:
            "Arial",

        fontSize:
            14,

        bold:
            false,

        italic:
            false,

        wrap:
            true,

        color:
            "#111111",

        background:
            "#ffffff",

        ...(columnFormats[index] || {})
    };
}


function applyFormatToCell(
    cell,
    index
) {

    const f =
        getColumnFormat(index);

    cell.style.textAlign =
        f.align;

    cell.style.fontFamily =
        f.fontFamily;

    cell.style.fontSize =
        `${Number(f.fontSize) || 14}px`;

    cell.style.fontWeight =
        f.bold ? "700" : "400";

    cell.style.fontStyle =
        f.italic
            ? "italic"
            : "normal";

    cell.style.color =
        f.color || "#111111";

    cell.style.backgroundColor =
        f.background || "#ffffff";

    if (f.wrap) {

        cell.style.whiteSpace =
            "pre-wrap";

        cell.style.overflowWrap =
            "anywhere";

        cell.style.wordBreak =
            "break-word";

    } else {

        cell.style.whiteSpace =
            "nowrap";

        cell.style.overflowWrap =
            "normal";

        cell.style.wordBreak =
            "normal";
    }
}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    closeFilterMenu();

    renderHeader();

    renderBody();

    requestAnimationFrame(() => {
        applyFreezeColumns();
    });
}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader() {

    */

        th.style.minWidth =

        th.style.maxWidth =
            `${getColumnWidth(index)}px`;


        const content =
            document.createElement("div");

        content.className =
            "header-content";


        const title =
            document.createElement("div");

        title.className =
            "header-title";

        title.textContent =
            getDisplayHeader(
                headers[index]
            );


        const sortButton =
            document.createElement("button");

        sortButton.className =
            "sort-button";

        sortButton.textContent =
            getSortIcon(index);

        sortButton.title =
            "Sắp xếp";


        sortButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openSortDialog(
                    index,
                    th
                );
            }
        );


        const filterButton =
            document.createElement("button");

        filterButton.className =
            "filter-button";

        filterButton.textContent =
            "▼";

        filterButton.title =
            "Lọc";


        filterButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openFilterMenu(

                    th
                );
            }
        );


        content.appendChild(title);
        content.appendChild(sortButton);
        content.appendChild(filterButton);

        /*
           Resize
        */

        const resize =
            document.createElement("div");

        resize.className =
            "resize-handle";

        resize.addEventListener(
            "mousedown",
            event => {

                event.preventDefault();
                event.stopPropagation();

                startResize(
                    event,
                    index
                );
            }
        );

        th.appendChild(resize);

        headerRow.appendChild(th);

    });

    thead.appendChild(headerRow);


    /*
       Search row
    */

    const searchRow =
        document.createElement("tr");

    searchRow.className =
        "search-row";


    visibleIndexes.forEach(index => {

        const th =
            document.createElement("th");

        th.className =
            "search-cell";

        th.dataset.column =
            String(index);

        th.style.width =
            `${getColumnWidth(index)}px`;

        th.style.minWidth =
            `${getColumnWidth(index)}px`;

        th.style.maxWidth =
            `${getColumnWidth(index)}px`;


        const inner =
            document.createElement("div");

        inner.className =
            "search-cell-inner";


        const input =
            document.createElement("input");

        input.className =
            "column-search";

        input.type =
            "text";

        input.placeholder =
            "Tìm kiếm...";

        input.value =
            searches[index] || "";


        /*
           QUAN TRỌNG:
           Không renderTable() khi input.
           Chỉ render BODY.
           Vì vậy focus không bị mất.
        */

        input.addEventListener(
            "input",
            () => {

                searches[index] =
                    input.value;

                saveState();

                renderBody();

                updateHeaderStates();

                /*
                   Nếu đang mở filter của cột khác,
                   refresh danh sách filter.
                */

                if (
                    openFilterIndex !== null
                ) {
                    refreshOpenFilterMenu();
                }
            }
        );


        inner.appendChild(input);

        th.appendChild(inner);

        searchRow.appendChild(th);

    });

    thead.appendChild(searchRow);


    updateHeaderStates();
}


/* =========================================================
   RENDER BODY ONLY
   Không render lại header
========================================================= */

function renderBody() {

    tbody.innerHTML = "";

    const visibleIndexes =
        getVisibleHeaderIndexes();

    const visibleRows =
        getVisibleRows();


    if (!visibleRows.length) {

        const tr =
            document.createElement("tr");

        const td =
            document.createElement("td");

        td.colSpan =
            Math.max(
                visibleIndexes.length,
                1
            );

        td.className =
            "message";

        td.textContent =
            "Không có dữ liệu phù hợp.";

        tr.appendChild(td);
        tbody.appendChild(tr);

        requestAnimationFrame(
            applyFreezeColumns
        );

        return;
    }


    visibleRows.forEach(item => {

        const tr =
            document.createElement("tr");

        visibleIndexes.forEach(index => {

            const td =
                document.createElement("td");

            td.className =
                "body-cell";

            td.dataset.column =
                String(index);

            td.style.width =
                `${getColumnWidth(index)}px`;

            td.style.minWidth =
                `${getColumnWidth(index)}px`;

            td.style.maxWidth =
                `${getColumnWidth(index)}px`;


            const value =
                getDisplayValue(
                    item.row[index],
                    headers[index]
                );

            td.textContent =
                value;


            applyFormatToCell(
                td,
                index
            );


            tr.appendChild(td);

        });

        tbody.appendChild(tr);

    });


    requestAnimationFrame(
        applyFreezeColumns
    );
}


/* =========================================================
   HEADER STATES
========================================================= */

function updateHeaderStates() {

    const headerCells =
        thead.querySelectorAll(
            ".header-cell"
        );

    headerCells.forEach(th => {

        const index =
            Number(
                th.dataset.column
            );

        const hasSearch =
            String(
                searches[index] || ""
            ).trim() !== "";

        const hasFilter =
            isEffectiveFilter(index);

        const sorted =
            sorts[index] != null;


        th.classList.toggle(
            "filtered",
            hasSearch || hasFilter
        );

        th.classList.toggle(
            "sorted",
            sorted
        );


        const sortButton =
            th.querySelector(
                ".sort-button"
            );

        if (sortButton) {

            sortButton.textContent =
                getSortIcon(index);
        }

    });
}


/* =========================================================
   EFFECTIVE FILTER
========================================================= */

function isEffectiveFilter(index) {

    if (
        filters[index] === undefined
    ) {
        return false;
    }

    const values =
        filters[index];

    if (!Array.isArray(values)) {
        return false;
    }

    const allValues =
        getAllColumnValues(index);

    if (
        values.length === 0
    ) {
        return true;
    }

    /*
       Chọn tất cả = không xem là active
    */

    if (
        values.length === allValues.length
    ) {
        return false;
    }

    return true;
}


/* =========================================================
   SORT ICON
========================================================= */

function getSortIcon(index) {

    if (
        sorts[index] == null
    ) {
        return "↕";
    }

    const direction =
        sorts[index].direction;

    const priority =
        sorts[index].priority;

    return (
        direction === "asc"
            ? "▲"
            : "▼"
    ) +
    (
        priority !== undefined
            ? String(priority)
            : ""
    );
}


/* =========================================================
   FILTER MENU
========================================================= */

function openFilterMenu(
    index,
    anchor
) {

    closeFilterMenu();

    openFilterIndex =
        index;

    filterValueSearch =
        "";

    filterMenuElement =
        document.createElement("div");

    filterMenuElement.className =
        "filter-menu";

    document.body.appendChild(
        filterMenuElement
    );

    renderFilterMenuContent(
        index
    );

    positionFilterMenu(
        anchor
    );
}


/* =========================================================
   POSITION FILTER
========================================================= */

function positionFilterMenu(anchor) {

    if (
        !filterMenuElement ||
        !anchor
    ) {
        return;
    }

    const rect =
        anchor.getBoundingClientRect();

    const menuWidth =
        filterMenuElement.offsetWidth;

    const menuHeight =
        filterMenuElement.offsetHeight;

    let left =
        rect.left;

    let top =
        rect.bottom + 4;


    if (
        left + menuWidth >
        window.innerWidth - 10
    ) {
        left =
            window.innerWidth -
            menuWidth -
            10;
    }

    if (
        top + menuHeight >
        window.innerHeight - 10
    ) {
        top =
            rect.top -
            menuHeight -
            4;
    }

    if (left < 10) {
        left = 10;
    }

    if (top < 10) {
        top = 10;
    }

    filterMenuElement.style.left =
        `${left}px`;

    filterMenuElement.style.top =
        `${top}px`;
}


/* =========================================================
   FILTER MENU CONTENT
========================================================= */

function renderFilterMenuContent(index) {

    if (!filterMenuElement) {
        return;
    }

    filterMenuElement.innerHTML = "";

    const inner =
        document.createElement("div");

    inner.className =
        "filter-menu-inner";


    const title =
        document.createElement("div");

    title.className =
        "filter-menu-title";

    title.textContent =
        `Lọc: ${getDisplayHeader(headers[index])}`;

    inner.appendChild(title);


    /*
       Search trong filter menu
    */

    const valueSearch =
        document.createElement("input");

    valueSearch.className =
        "filter-values-search";

    valueSearch.placeholder =
        "Tìm trong danh sách...";

    valueSearch.value =
        filterValueSearch;


    valueSearch.addEventListener(
        "input",
        () => {

            filterValueSearch =
                valueSearch.value;

            renderFilterValuesOnly(
                index
            );
        }
    );

    inner.appendChild(
        valueSearch
    );


    /*
       Buttons
    */

    const actions =
        document.createElement("div");

    actions.className =
        "filter-actions";


    const selectAll =
        document.createElement("button");

    selectAll.textContent =
        "Chọn tất cả";

    selectAll.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            const values =
                getFilterValuesForColumn(
                    index
                );

            filters[index] =
                values.slice();

            saveState();

            renderBody();

            updateHeaderStates();

            renderFilterValuesOnly(
                index
            );

            refreshOpenFilterMenu();
        }
    );


    const deselectAll =
        document.createElement("button");

    deselectAll.textContent =
        "Bỏ chọn";

    deselectAll.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            filters[index] =
                [];

            saveState();

            renderBody();

            updateHeaderStates();

            renderFilterValuesOnly(
                index
            );
        }
    );


    actions.appendChild(
        selectAll
    );

    actions.appendChild(
        deselectAll
    );

    inner.appendChild(actions);


    /*
       Values
    */

    const valuesContainer =
        document.createElement("div");

    valuesContainer.className =
        "filter-values";

    valuesContainer.id =
        "filterValuesContainer";

    inner.appendChild(
        valuesContainer
    );


    /*
       Footer
    */

    const footer =
        document.createElement("div");

    footer.className =
        "filter-footer";


    const clearBtn =
        document.createElement("button");

    clearBtn.textContent =
        "Xóa lọc";

    clearBtn.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            delete filters[index];

            saveState();

            renderBody();

            updateHeaderStates();

            renderFilterValuesOnly(
                index
            );
        }
    );


    const applyBtn =
        document.createElement("button");

    applyBtn.textContent =
        "Áp dụng";

    applyBtn.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            /*
               Filter đã áp dụng NGAY khi tick.
               Nút này chỉ đóng menu.
            */

            closeFilterMenu();
        }
    );


    footer.appendChild(
        clearBtn
    );

    footer.appendChild(
        applyBtn
    );

    inner.appendChild(
        footer
    );


    /*
       Format
    */

    const formatSection =
        createFormatSection(index);

    inner.appendChild(
        formatSection
    );


    filterMenuElement.appendChild(
        inner
    );


    renderFilterValuesOnly(
        index
    );
}


/* =========================================================
   FILTER VALUES ONLY
========================================================= */

function renderFilterValuesOnly(index) {

    if (!filterMenuElement) {
        return;
    }

    const container =
        filterMenuElement.querySelector(
            "#filterValuesContainer"
        );

    if (!container) {
        return;
    }

    container.innerHTML = "";


    const allValues =
        getFilterValuesForColumn(
            index
        );


    const query =
        String(
            filterValueSearch || ""
        )
            .trim()
            .toLowerCase();


    const values =
        allValues.filter(value => {

            if (!query) {
                return true;
            }

            return String(value)
                .toLowerCase()
                .includes(query);
        });


    const selected =
        filters[index] === undefined
            ? allValues.slice()
            : filters[index];


    values.forEach(value => {

        const row =
            document.createElement("div");

        row.className =
            "filter-value-row";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.checked =
            selected.includes(value);


        /*
           QUAN TRỌNG:
           Tick checkbox = lọc NGAY.
        */

        checkbox.addEventListener(
            "change",
            event => {

                event.stopPropagation();

                let current =
                    Array.isArray(
                        filters[index]
                    )
                        ? filters[index].slice()
                        : allValues.slice();


                if (
                    checkbox.checked
                ) {

                    if (
                        !current.includes(value)
                    ) {
                        current.push(value);
                    }

                } else {

                    current =
                        current.filter(
                            x => x !== value
                        );
                }


                filters[index] =
                    current;

                saveState();

                /*
                   Lọc ngay
                */

                renderBody();

                updateHeaderStates();

                /*
                   Các cột khác phải thay đổi
                   danh sách filter theo.
                */

                refreshOpenFilterMenu(
                    false
                );
            }
        );


        const label =
            document.createElement("label");

        label.textContent =
            value === ""
                ? "(Trống)"
                : value;

        label.addEventListener(
            "click",
            event => {

                event.stopPropagation();
            }
        );


        row.appendChild(
            checkbox
        );

        row.appendChild(
            label
        );

        container.appendChild(
            row
        );
    });
}


/* =========================================================
   REFRESH OPEN FILTER
========================================================= */

function refreshOpenFilterMenu(
    preserveSearch = true
) {

    if (
        openFilterIndex === null ||
        !filterMenuElement
    ) {
        return;
    }

    const index =
        openFilterIndex;

    const currentSearch =
        filterValueSearch;

    renderFilterMenuContent(
        index
    );

    if (preserveSearch) {
        filterValueSearch =
            currentSearch;

        const input =
            filterMenuElement.querySelector(
                ".filter-values-search"
            );

        if (input) {
            input.value =
                currentSearch;
        }

        renderFilterValuesOnly(
            index
        );
    }
}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterMenu() {

    if (filterMenuElement) {

        filterMenuElement.remove();

        filterMenuElement =
            null;
    }

    openFilterIndex =
        null;

    filterValueSearch =
        "";
}


/* =========================================================
   FORMAT SECTION
========================================================= */

        document.createTextNode(

        )

        !!format.wrap;

    wrapLabel.appendChild(
        wrap
    );

    checks.appendChild(
        italicLabel

    section.appendChild(
        checks

    /*
       Text color
    */

    const colorRow =
        document.createElement("div");

    colorRow.className =

        isValidColor(
            format.color
        )
            ? format.color
            : "#111111";

    colorRow.appendChild(
        colorLabel
    );

    colorRow.appendChild(
        color
    );

    section.appendChild(
        colorRow
    );


    /*
       Background
    */

    const backgroundRow =
        document.createElement("div");

    backgroundRow.className =
        "format-row";

    const backgroundLabel =
        document.createElement("label");

    backgroundLabel.textContent =
        "Nền";

    const background =
        document.createElement("input");

    background.type =
        "color";

    background.className =
        "color-input";

    background.value =
        isValidColor(
            format.background
        )
            ? format.background
            : "#ffffff";

    backgroundRow.appendChild(
        backgroundLabel
    );

    backgroundRow.appendChild(
        background
    );

    section.appendChild(
        backgroundRow
    );


    /*
       Apply
    */

    const apply =
        document.createElement("button");

    apply.textContent =
        "Áp dụng định dạng";

    apply.style.width =
        "100%";

    apply.style.marginTop =
        "8px";

    apply.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            columnFormats[index] = {

                align:
                    align.value,

                fontFamily:
                    font.value,

                fontSize:
                    Number(size.value) || 14,

                bold:
                    bold.checked,

                italic:
                    italic.checked,

                wrap:
                    wrap.checked,

                color:
                    color.value,

                background:
                    background.value
            };

            saveState();

            renderBody();

            updateHeaderStates();
        }
    );

    section.appendChild(
        apply
    );

    return section;
}


/* =========================================================
   COLOR VALIDATION
========================================================= */

function isValidColor(value) {

    return (
        typeof value === "string" &&
        /^#[0-9a-fA-F]{6}$/.test(value)
    );
}


/* =========================================================
   SORT DIALOG
========================================================= */

function openSortDialog(
    index,
    anchor
) {

    closeFilterMenu();

    const menu =
        document.createElement("div");

    menu.className =
        "filter-menu";

    document.body.appendChild(
        menu
    );


    const inner =
        document.createElement("div");

    inner.className =
        "filter-menu-inner";


    const title =
        document.createElement("div");

    title.className =
        "filter-menu-title";

    title.textContent =
        `Sắp xếp: ${getDisplayHeader(headers[index])}`;

    inner.appendChild(title);


    const current =
        sorts[index] || {
            priority: "",
            direction: "asc"
        };


    /*
       Priority
    */

    const priorityRow =
        document.createElement("div");

    priorityRow.className =
        "format-row";

    const priorityLabel =
        document.createElement("label");

    priorityLabel.textContent =
        "Thứ tự";

    const priority =
        document.createElement("input");

    priority.type =
        "number";

    priority.value =
        current.priority ?? "";

    priorityRow.appendChild(
        priorityLabel
    );

    priorityRow.appendChild(
        priority
    );

    inner.appendChild(
        priorityRow
    );


    /*
       Direction
    */

    const directionRow =
        document.createElement("div");

    directionRow.className =
        "format-row";

    const directionLabel =
        document.createElement("label");

    directionLabel.textContent =
        "Chiều";

    const direction =
        document.createElement("select");

    const asc =
        document.createElement("option");

    asc.value =
        "asc";

    asc.textContent =
        "Tăng dần";

    const desc =
        document.createElement("option");

    desc.value =
        "desc";

    desc.textContent =
        "Giảm dần";

    direction.appendChild(
        asc
    );

    direction.appendChild(
        desc
    );

    direction.value =
        current.direction || "asc";

    directionRow.appendChild(
        directionLabel
    );

    directionRow.appendChild(
        direction
    );

    inner.appendChild(
        directionRow
    );


    /*
       Buttons
    */

    const footer =
        document.createElement("div");

    footer.className =
        "filter-footer";


    const clear =
        document.createElement("button");

    clear.textContent =
        "Xóa sort";

    clear.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            delete sorts[index];

            saveState();

            renderBody();

            updateHeaderStates();

            menu.remove();
        }
    );


    const apply =
        document.createElement("button");

    apply.textContent =
        "Áp dụng";

    apply.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            const p =
                Number(priority.value);

            if (
                priority.value.trim() === ""
            ) {

                delete sorts[index];

            } else {

                sorts[index] = {

                    priority: p,

                    direction:
                        direction.value
                };
            }

            saveState();

            renderBody();

            updateHeaderStates();

            menu.remove();
        }
    );


    footer.appendChild(
        clear
    );

    footer.appendChild(
        apply
    );

    inner.appendChild(
        footer
    );


    menu.appendChild(
        inner
    );


    /*
       Position
    */

    const rect =
        anchor.getBoundingClientRect();

    let left =
        rect.left;

    let top =
        rect.bottom + 4;

    requestAnimationFrame(() => {

        const width =
            menu.offsetWidth;

        const height =
            menu.offsetHeight;

        if (
            left + width >
            window.innerWidth - 10
        ) {
            left =
                window.innerWidth -
                width -
                10;
        }

        if (
            top + height >
            window.innerHeight - 10
        ) {
            top =
                rect.top -
                height -
                4;
        }

        menu.style.left =
            `${Math.max(10, left)}px`;

        menu.style.top =
            `${Math.max(10, top)}px`;
    });
}


/* =========================================================
   APPLY FREEZE COLUMNS
   CRITICAL FIX
========================================================= */

function applyFreezeColumns() {

    /*
       Xóa trạng thái cũ
    */

    document
        .querySelectorAll(
            ".frozen-column"
        )
        .forEach(cell => {

            cell.classList.remove(
                "frozen-column"
            );

            cell.classList.remove(
                "frozen-last"
            );

            cell.style.left =
                "";

        });


    const visibleIndexes =
        getVisibleHeaderIndexes();


    const count =
        Math.max(
            0,
            Math.min(
                Number(freezeCount) || 0,
                visibleIndexes.length
            )
        );


    if (count === 0) {
        return;
    }


    /*
       Lấy đúng các cột đầu tiên đang hiển thị.
    */

    const frozenIndexes =
        visibleIndexes.slice(
            0,
            count
        );


    let left =
        0;


    frozenIndexes.forEach(
        (index, position) => {

            const width =
                getColumnWidth(index);


            const cells =
                document.querySelectorAll(
                    `[data-column="${index}"]`
                );


            cells.forEach(cell => {

                cell.classList.add(
                    "frozen-column"
                );

                /*
                   Cột frozen cuối cùng
                */

                if (
                    position ===
                    frozenIndexes.length - 1
                ) {

                    cell.classList.add(
                        "frozen-last"
                    );
                }


                cell.style.left =
                    `${left}px`;


                /*
                   QUAN TRỌNG:
                   Header phải giữ top riêng.
                */

                if (
                    cell.classList.contains(
                        "header-cell"
                    )
                ) {

                    cell.style.top =
                        "0px";

                    cell.style.zIndex =
                        "600";

                } else if (
                    cell.classList.contains(
                        "search-cell"
                    )
                ) {

                    cell.style.top =
                        "38px";

                    cell.style.zIndex =
                        "599";

                } else {

                    cell.style.zIndex =
                        "100";
                }

            });


            left += width;
        }
    );
}


/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    index
) {

    resizeState = {

        index,

        startX:
            event.clientX,

        startWidth:
            getColumnWidth(index)
    };


    document.body.style.cursor =
        "col-resize";

    document.body.style.userSelect =
        "none";
}


document.addEventListener(
    "mousemove",
    event => {

        if (!resizeState) {
            return;
        }

        const delta =
            event.clientX -
            resizeState.startX;

        const newWidth =
            Math.max(
                30,
                resizeState.startWidth +
                delta
            );

        columnWidths[
            resizeState.index
        ] =
            newWidth;


        /*
           Update toàn bộ cell của cột
           mà KHÔNG render lại header.
        */

        document
            .querySelectorAll(
                `[data-column="${resizeState.index}"]`
            )
            .forEach(cell => {

                cell.style.width =
                    `${newWidth}px`;

                cell.style.minWidth =
                    `${newWidth}px`;

                cell.style.maxWidth =
                    `${newWidth}px`;
            });


        /*
           Freeze cần tính lại left
        */

        applyFreezeColumns();
    }
);


document.addEventListener(
    "mouseup",
    () => {

        if (!resizeState) {
            return;
        }

        saveState();

        resizeState =
            null;

        document.body.style.cursor =
            "";

        document.body.style.userSelect =
            "";
    }
);


/* =========================================================
   RESET
========================================================= */

function resetUserState() {

    searches = {};
    sorts = {};

    /*
       Xóa filter người dùng nhưng
       giữ default filter.
    */

    filters = {};

    defaultFiltersInitialized =
        false;

    initializeDefaults();

    saveState();

    renderTable();
}


/* =========================================================
   SETTINGS
========================================================= */

const settingsOverlay =
    document.getElementById(
        "settingsOverlay"
    );

const freezeCountInput =
    document.getElementById(
        "freezeCountInput"
    );

const autoRefreshSelect =
    document.getElementById(
        "autoRefreshSelect"
    );


document
    .getElementById("settingsBtn")
    .addEventListener(
        "click",
        () => {

            freezeCountInput.value =
                freezeCount;

            settingsOverlay.style.display =
                "block";
        }
    );


document
    .getElementById("closeSettingsBtn")
    .addEventListener(
        "click",
        () => {

            const value =
                Number(
                    freezeCountInput.value
                );

            freezeCount =
                Math.max(
                    0,
                    Math.min(
                        value,
                        getVisibleHeaderIndexes().length
                    )
                );

            saveState();

            renderTable();

            settingsOverlay.style.display =
                "none";
        }
    );


settingsOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            settingsOverlay
        ) {

            settingsOverlay.style.display =
                "none";
        }
    }
);


/* =========================================================
   AUTO REFRESH
========================================================= */

function setupAutoRefresh() {

    if (autoRefreshTimer) {

        clearInterval(
            autoRefreshTimer
        );

        autoRefreshTimer =
            null;
    }

    const value =
        Number(
            autoRefreshSelect.value
        );

    if (!value) {
        return;
    }

    const minutes =
        value === 1
            ? 5
            : value === 2
                ? 10
                : 30;


    autoRefreshTimer =
        setInterval(
            async () => {

                await loadData();

            },
            minutes * 60 * 1000
        );
}


/* =========================================================
   REFRESH BUTTON
========================================================= */

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        async () => {

            await loadData();
        }
    );


/* =========================================================
   RESET BUTTON
========================================================= */

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        () => {

            resetUserState();
        }
    );


/* =========================================================
   AUTO REFRESH SELECT
========================================================= */

autoRefreshSelect.addEventListener(
    "change",
    () => {

        setupAutoRefresh();
    }
);


/* =========================================================
   CLICK OUTSIDE FILTER MENU
========================================================= */

document.addEventListener(
    "mousedown",
    event => {

        if (!filterMenuElement) {
            return;
        }

        if (
            filterMenuElement.contains(
                event.target
            )
        ) {
            return;
        }

        if (
            event.target.closest(
                ".filter-button"
            )
        ) {
            return;
        }

        if (
            event.target.closest(
                ".sort-button"
            )
        ) {
            return;
        }

        closeFilterMenu();
    }
);


/* =========================================================
   SCROLL
   Sticky header nằm trong chính table-wrapper.
   Không re-render header khi scroll.
========================================================= */

tableWrapper.addEventListener(
    "scroll",
    () => {

        /*
           Không làm gì cả.
           CSS sticky tự xử lý.
           Điều này rất quan trọng để header
           không bị render lại / mất sticky.
        */
    },
    {
        passive: true
    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        applyFreezeColumns();

        if (
            openFilterIndex !== null &&
            filterMenuElement
        ) {

            const header =
                thead.querySelector(
                    `.header-cell[data-column="${openFilterIndex}"]`
                );

            if (header) {
                positionFilterMenu(
                    header
                );
            }
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadState();

loadData();

</script>
