<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    font-size:14px;
}

body{
    background:#fff;
}

#app{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:44px;

    display:flex;
    align-items:center;
    gap:7px;

    padding:5px 8px;

    background:#f5f5f5;
    border-bottom:1px solid #ccc;

    z-index:5000;
}

.toolbar button{
    height:32px;
    padding:0 12px;

    border:1px solid #bbb;
    border-radius:4px;

    background:#fff;

    cursor:pointer;
}

.toolbar button:hover{
    background:#eef5ff;
}

.toolbar-status{
    margin-left:auto;
    color:#666;
    white-space:nowrap;
}

/* =========================================================
   TABLE SCROLL CONTAINER
========================================================= */

.table-wrapper{
    position:absolute;

    left:0;
    right:0;
    top:44px;
    bottom:0;

    overflow:auto;

    background:#fff;

    /*
       Đây phải là scroll container duy nhất
       của bảng.
    */
    isolation:isolate;
}

/* =========================================================
   TABLE
========================================================= */

table{
    border-collapse:separate;
    border-spacing:0;

    table-layout:fixed;

    width:max-content;
    min-width:100%;
}

th,td{
    box-sizing:border-box;
}

/* =========================================================
   HEADER
========================================================= */

thead th{
    position:relative;

    padding:0;

    border-right:1px solid #ccc;
    border-bottom:1px solid #aaa;

    background:#f1f3f5;
}

/*
   Header chính.
*/
.header-cell{
    position:sticky !important;

    top:0 !important;

    height:38px;

    z-index:300 !important;

    background:#f1f3f5 !important;
}

/*
   Dòng search.
*/
.search-cell{
    position:sticky !important;

    top:38px !important;

    height:36px;

    z-index:299 !important;

    background:#fafafa !important;
}

/*
   Header + frozen column.
   Cao nhất.
*/
.header-cell.frozen-column{
    position:sticky !important;

    top:0 !important;

    z-index:1000 !important;
}

.search-cell.frozen-column{
    position:sticky !important;

    top:38px !important;

    z-index:999 !important;
}

/* =========================================================
   HEADER CONTENT
========================================================= */

.header-content{
    width:100%;
    height:38px;

    display:flex;
    align-items:center;

    padding:0 5px;

    user-select:none;
}

.header-title{
    flex:1;

    min-width:0;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-weight:bold;

    cursor:pointer;
}

.header-actions{
    display:flex;
    align-items:center;

    flex-shrink:0;
}

.header-button{
    width:24px;
    height:25px;

    border:0;
    background:transparent;

    padding:0;

    cursor:pointer;
}

.header-button:hover{
    background:#ddd;
    border-radius:3px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-inner{
    height:36px;
    padding:4px;
}

.column-search{
    width:100%;
    height:27px;

    border:1px solid #bbb;
    border-radius:3px;

    padding:3px 6px;

    outline:none;

    font-size:13px;

    background:#fff;
}

.column-search:focus{
    border-color:#4285f4;

    box-shadow:
        0 0 0 1px #4285f4;
}

/* =========================================================
   BODY
========================================================= */

tbody td{
    height:34px;

    padding:6px 8px;

    border-right:1px solid #ddd;
    border-bottom:1px solid #ddd;

    background:#fff;

    vertical-align:middle;
}

.body-cell{
    white-space:pre-wrap;

    overflow-wrap:anywhere;

    word-break:break-word;
}

/*
   Frozen body.
*/
tbody td.frozen-column{
    position:sticky !important;

    z-index:100 !important;

    background:#fff;
}

/*
   Ranh giới cột frozen cuối.
*/
.frozen-last{
    box-shadow:
        4px 0 7px rgba(0,0,0,.12);
}

/* =========================================================
   HEADER STATES
========================================================= */

.header-cell.filtered{
    background:#c8f7c5 !important;
}

.header-cell.sorted{
    background:#d8ebff !important;
}

.header-cell.filtered.sorted{
    background:#bdecc4 !important;
}

.header-cell.frozen-column.filtered{
    background:#c8f7c5 !important;
}

.header-cell.frozen-column.sorted{
    background:#d8ebff !important;
}

.header-cell.frozen-column.filtered.sorted{
    background:#bdecc4 !important;
}

/* =========================================================
   RESIZE
========================================================= */

.resize-handle{
    position:absolute;

    right:-3px;
    top:0;

    width:7px;
    height:100%;

    cursor:col-resize;

    z-index:1500;
}

.resize-handle:hover{
    background:rgba(0,120,255,.25);
}

/* =========================================================
   FILTER MENU
========================================================= */

.filter-menu{
    position:fixed;

    width:350px;
    max-height:calc(100vh - 20px);

    background:#fff;

    border:1px solid #aaa;
    border-radius:5px;

    box-shadow:
        0 6px 25px rgba(0,0,0,.22);

    z-index:10000;

    overflow:hidden;
}

.filter-menu-inner{
    max-height:calc(100vh - 20px);

    overflow-y:auto;

    padding:9px;
}

.menu-title{
    font-weight:bold;

    margin-bottom:8px;

    font-size:14px;
}

/* =========================================================
   FILTER SEARCH
========================================================= */

.filter-search{
    width:100%;

    height:30px;

    border:1px solid #bbb;
    border-radius:3px;

    padding:4px 7px;

    margin-bottom:7px;

    outline:none;
}

.filter-search:focus{
    border-color:#4285f4;
}

/* =========================================================
   FILTER ACTIONS
========================================================= */

.filter-actions{
    display:flex;

    gap:5px;

    margin-bottom:7px;
}

.menu-button{
    border:1px solid #bbb;

    background:#fff;

    border-radius:3px;

    padding:5px 8px;

    cursor:pointer;
}

.menu-button:hover{
    background:#eef5ff;
}

/* =========================================================
   FILTER VALUES
========================================================= */

.filter-values{
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;

    max-height:230px;

    overflow-y:auto;

    padding:4px 0;
}

.filter-value-row{
    display:flex;

    align-items:center;

    gap:6px;

    min-height:28px;

    padding:3px 5px;
}

.filter-value-row:hover{
    background:#f4f4f4;
}

.filter-value-row label{
    flex:1;

    overflow-wrap:anywhere;

    cursor:pointer;
}

/* =========================================================
   SORT
========================================================= */

.menu-section{
    margin-top:10px;

    padding-top:9px;

    border-top:1px solid #ddd;
}

.menu-section-title{
    font-weight:bold;

    margin-bottom:7px;
}

.form-row{
    display:flex;

    align-items:center;

    gap:7px;

    margin-bottom:7px;
}

.form-row > label{
    width:90px;

    flex-shrink:0;
}

.form-row select,
.form-row input[type="number"],
.form-row input[type="text"]{
    flex:1;

    height:29px;

    border:1px solid #bbb;

    border-radius:3px;

    padding:3px 6px;
}

.sort-direction{
    display:flex;

    gap:15px;

    align-items:center;

    flex-wrap:wrap;
}

.sort-direction label{
    display:flex;

    align-items:center;

    gap:4px;
}

/* =========================================================
   FORMAT
========================================================= */

.format-checks{
    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-bottom:7px;
}

.format-checks label{
    display:flex;

    align-items:center;

    gap:4px;
}

.color-row{
    display:flex;

    align-items:center;

    gap:7px;

    margin-bottom:7px;
}

.color-row label{
    width:90px;
}

.color-input{
    width:55px;
    height:29px;

    padding:0;

    border:1px solid #bbb;
}

/* =========================================================
   MENU FOOTER
========================================================= */

.menu-footer{
    display:flex;

    justify-content:flex-end;

    gap:5px;

    margin-top:9px;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-overlay{
    position:fixed;

    inset:0;

    display:none;

    background:rgba(0,0,0,.25);

    z-index:12000;
}

.settings-panel{
    position:absolute;

    top:55px;
    right:15px;

    width:430px;

    max-height:calc(100vh - 70px);

    overflow-y:auto;

    background:#fff;

    border:1px solid #aaa;
    border-radius:6px;

    box-shadow:
        0 6px 25px rgba(0,0,0,.25);

    padding:12px;
}

.settings-title{
    font-size:17px;

    font-weight:bold;

    margin-bottom:12px;
}

.settings-row{
    margin-bottom:10px;
}

.settings-row > label{
    display:block;

    margin-bottom:4px;

    font-weight:bold;
}

.settings-row input,
.settings-row select{
    width:100%;

    height:30px;

    border:1px solid #bbb;

    border-radius:3px;

    padding:3px 6px;
}

/* =========================================================
   RENAME PANEL
========================================================= */

.rename-list{
    border:1px solid #ddd;

    max-height:350px;

    overflow-y:auto;
}

.rename-item{
    display:flex;

    align-items:center;

    gap:7px;

    padding:5px;

    border-bottom:1px solid #eee;
}

.rename-item:last-child{
    border-bottom:0;
}

.rename-original{
    width:135px;

    flex-shrink:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.rename-item input{
    flex:1;

    height:29px;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;

    left:0;
    right:0;
    top:44px;
    bottom:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(255,255,255,.85);

    z-index:11000;

    font-size:16px;
}

.hidden{
    display:none !important;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    padding:30px;

    text-align:center;

    color:#777;
}
</style>
</head>

<body>

<div id="app">

    <div class="toolbar">

        <button id="refreshBtn">

        </button>

        </button>

    </div>

        id="loading"

        Đang tải dữ liệu...
    </div>


    <div
        id="tableWrapper"
        class="table-wrapper"
    >

        <table id="dataTable">

            <thead></thead>

            <tbody></tbody>

        </table>

    </div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div
    id="settingsOverlay"
    class="settings-overlay"
>

    <div
        id="settingsPanel"
        class="settings-panel"
    >

        <div class="settings-title">
            ⚙ Cài đặt bảng
        </div>


        <div class="settings-row">

            "
        >

            </button>

            <button

                Đóng
            </button>

        </div>

    </div>

</div>


<script>
"use strict";

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/19-O0i9-K-_wnXCMdWJHRczsE8ckRZ7mS/gviz/tq?tqx=out%3Acsv&gid=616860962";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
"report_google_sheet_table_v11";

const OLD_KEYS = [
    "report_google_sheet_table_v10",
    "report_google_sheet_table_v9",
    "report_google_sheet_table_v8"
];


/* =========================================================
   HIDDEN COLUMNS
========================================================= */

const HIDDEN_COLUMNS = new Set([
    "Sort_DATA",
    "Sort_NM",
    "Sort_NgM"
]);


/* =========================================================
   SPECIAL SORT MAPPING
========================================================= */

const SORT_BY_MAP = {

    "DATA":
        "Sort_DATA",

    "Thoại nội mạng":
        "Sort_NM",

    "Thoại ngoại mạng":
        "Sort_NgM"

};


/* =========================================================
   DATA
========================================================= */

let headers = [];

let rows = [];


/* =========================================================
   STATE
========================================================= */

let filters = {};

let searches = {};

let sorts = {};

let columnWidths = {};

let columnFormats = {};

let renamedHeaders = {};

let freezeCount = 0;


/* =========================================================
   DEFAULT FILTER
========================================================= */

let defaultFiltersInitialized =
false;


/* =========================================================
   FILTER MENU
========================================================= */

let openFilterIndex =
null;

let filterMenuElement =
null;

let filterValueSearch =
"";


/* =========================================================
   RESIZE
========================================================= */

let resizeState =
null;


/* =========================================================
   AUTO REFRESH
========================================================= */

let autoRefreshTimer =
null;


/* =========================================================
   DOM
========================================================= */

const table =
document.getElementById(
    "dataTable"
);

const thead =
table.querySelector(
    "thead"
);

const tbody =
table.querySelector(
    "tbody"
);

const tableWrapper =
document.getElementById(
    "tableWrapper"
);

const loading =
document.getElementById(
    "loading"
);

const statusEl =
document.getElementById(
    "status"
);

const settingsOverlay =
document.getElementById(
    "settingsOverlay"
);

const freezeCountInput =
document.getElementById(
    "freezeCountInput"
);

const autoRefreshSelect =
document.getElementById(
    "autoRefreshSelect"
);

const renameList =
document.getElementById(
    "renameList"
);


/* =========================================================
   LOAD STATE
========================================================= */

function loadState(){

    let saved = null;

    try{

        const current =
        localStorage.getItem(
            STORAGE_KEY
        );

        if(current){
            saved =
            JSON.parse(current);
        }


        if(!saved){

            for(
                const key of OLD_KEYS
            ){

                const old =
                localStorage.getItem(
                    key
                );

                if(old){

                    saved =
                    JSON.parse(old);

                    break;
                }
            }
        }

    }
    catch(error){

        console.warn(
            "Không đọc được LocalStorage",
            error
        );
    }


    if(!saved){
        return;
    }


    filters =
    saved.filters || {};

    searches =
    saved.searches || {};

    sorts =
    saved.sorts || {};

    columnWidths =
    saved.columnWidths || {};

    columnFormats =
    saved.columnFormats || {};

    renamedHeaders =
    saved.renamedHeaders || {};

    freezeCount =
    Number(
        saved.freezeCount || 0
    );


    /*
       Không tự đánh lại priority.
    */
}


/* =========================================================
   SAVE STATE
========================================================= */

function saveState(){

    try{

        localStorage.setItem(
            STORAGE_KEY,

            JSON.stringify({

                filters,

                searches,

                sorts,

                columnWidths,

                columnFormats,

                renamedHeaders,

                freezeCount

            })
        );

    }
    catch(error){

        console.warn(
            "Không lưu được LocalStorage",
            error
        );
    }
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const result = [];

    let row = [];

    let cell = "";

    let inQuotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const c =
        text[i];

        const next =
        text[i + 1];


        if(c === '"'){

            if(
                inQuotes &&
                next === '"'
            ){

                cell += '"';

                i++;

            }
            else{

                inQuotes =
                !inQuotes;
            }

        }


        else if(
            c === "," &&
            !inQuotes
        ){

            row.push(cell);

            cell = "";
        }


        else if(
            (
                c === "\n" ||
                c === "\r"
            ) &&
            !inQuotes
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;
            }


            row.push(cell);

            cell = "";


            if(
                row.length > 1 ||
                row[0] !== ""
            ){

                result.push(row);
            }


            row = [];
        }


        else{

            cell += c;
        }
    }


    if(
        cell.length > 0 ||
        row.length > 0
    ){

        row.push(cell);

        result.push(row);
    }


    return result;
}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    loading.classList.remove(
        "hidden"
    );

    statusEl.textContent =
    "Đang tải dữ liệu...";


    try{

        const response =
        await fetch(
            CSV_URL +
            "&cachebust=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const text =
        await response.text();


        if(!text.trim()){

            throw new Error(
                "Google Sheet trả về rỗng."
            );
        }


        const parsed =
        parseCSV(text);


        if(
            !parsed.length ||
            !parsed[0].length
        ){

            throw new Error(
                "Không tìm thấy header."
            );
        }


        headers =
        parsed[0].map(
            value =>
            String(value).trim()
        );


        rows =
        parsed
        .slice(1)
        .map(sourceRow => {

            const row =
            new Array(
                headers.length
            ).fill("");


            for(
                let i = 0;
                i < headers.length;
                i++
            ){

                row[i] =
                sourceRow[i] == null
                    ? ""
                    : String(
                        sourceRow[i]
                    );
            }


            return row;
        });


        /*
           Nếu Google Sheet có thêm cột mới,
           vẫn không phá state cũ.
        */

        initializeDefaults();


        renderTable();


        statusEl.textContent =
        `${rows.length.toLocaleString("vi-VN")} dòng • cập nhật ${new Date().toLocaleTimeString("vi-VN")}`;


    }
    catch(error){

        console.error(error);


        statusEl.textContent =
        "Lỗi tải dữ liệu";


        thead.innerHTML = "";

        tbody.innerHTML = "";


        const tr =
        document.createElement("tr");

        const td =
        document.createElement("td");


        td.colSpan =
        Math.max(
            headers.length,
            1
        );


        td.className =
        "message";


        td.textContent =
        "Không tải được Google Sheet: " +
        error.message;


        tr.appendChild(td);

        tbody.appendChild(tr);

    }
    finally{

        loading.classList.add(
            "hidden"
        );
    }
}


/* =========================================================
   DEFAULT FILTER
========================================================= */

function initializeDefaults(){

    if(
        defaultFiltersInitialized
    ){

        return;
    }


    defaultFiltersInitialized =
    true;


    const dateIndex =
    headers.indexOf(
        "Ngày update"
    );


    const stopIndex =
    headers.indexOf(
        "Dừng gói"
    );


    /*
       Ngày update:
       chọn non-blank.
    */

    if(
        dateIndex >= 0 &&
        filters[dateIndex] === undefined
    ){

        filters[dateIndex] =
        getAllColumnValues(
            dateIndex
        )
        .filter(
            value =>
            String(value).trim() !== ""
        );
    }


    /*
       Dừng gói:
       chỉ chọn blank.
    */

    if(
        stopIndex >= 0 &&
        filters[stopIndex] === undefined
    ){

        filters[stopIndex] = [""];
    }


    saveState();
}


/* =========================================================
   COLUMN VALUES
========================================================= */

function getAllColumnValues(index){

    const set =
    new Set();


    rows.forEach(row => {

        set.add(
            String(
                row[index] ?? ""
            )
        );

    });


    return Array.from(set);
}


/* =========================================================
   DISPLAY HEADER
========================================================= */

function getDisplayHeader(
    originalHeader
){

    return (
        renamedHeaders[
            originalHeader
        ] ||
        originalHeader
    );
}


/* =========================================================
   NUMBER
========================================================= */

function parseVNNumber(value){

    const s =
    String(
        value ?? ""
    ).trim();


    if(!s){
        return null;
    }


    if(
        /^-?\d{1,3}(\.\d{3})+(,\d+)?$/
        .test(s)
    ){

        return Number(
            s
            .replace(/\./g,"")
            .replace(",",".")
        );
    }


    if(
        /^-?\d+(,\d+)?$/
        .test(s)
    ){

        return Number(
            s.replace(",",".")
        );
    }


    if(
        /^-?\d+(\.\d+)?$/
        .test(s)
    ){

        return Number(s);
    }


    return null;
}


/* =========================================================
   DATE
========================================================= */

function parseVietnameseDate(value){

    const s =
    String(
        value ?? ""
    ).trim();


    const match =
    s.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


    if(!match){
        return null;
    }


    const day =
    Number(match[1]);

    const month =
    Number(match[2]) - 1;

    const year =
    Number(match[3]);


    const date =
    new Date(
        year,
        month,
        day
    );


    if(
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
    ){

        return null;
    }


    return date;
}


/* =========================================================
   DATE DISPLAY
========================================================= */

function displayDateRelative(value){

    const date =
    parseVietnameseDate(value);


    if(!date){
        return value;
    }


    const now =
    new Date();


    const months =
    (
        now.getFullYear() -
        date.getFullYear()
    ) * 12
    +
    (
        now.getMonth() -
        date.getMonth()
    );


    const n =
    Math.max(
        0,
        months
    );


    if(n === 0){

        return "0 tháng";
    }


    return (
        String(n).padStart(2,"0") +
        " tháng"
    );
}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function getDisplayValue(
    value,
    header
){

    if(
        header === "Ngày update"
    ){

        return displayDateRelative(
            value
        );
    }


    return String(
        value ?? ""
    );
}


/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(
    row,
    index
){

    const originalHeader =
    headers[index];


    /*
       DATA → Sort_DATA
       Nội mạng → Sort_NM
       Ngoại mạng → Sort_NgM
    */

    const helperHeader =
    SORT_BY_MAP[
        originalHeader
    ];


    let value =
    row[index];


    if(helperHeader){

        const helperIndex =
        headers.indexOf(
            helperHeader
        );


        if(
            helperIndex >= 0 &&
            String(
                row[helperIndex] ?? ""
            ).trim() !== ""
        ){

            value =
            row[helperIndex];
        }
    }


    const number =
    parseVNNumber(value);


    if(number !== null){

        return {

            type:"number",

            value:number

        };
    }


    const date =
    parseVietnameseDate(value);


    if(date){

        return {

            type:"date",

            value:date.getTime()

        };
    }


    return {

        type:"text",

        value:
        String(
            value ?? ""
        )
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

    };
}


/* =========================================================
   ROW MATCH
========================================================= */

function rowMatchesFilters(
    row,
    ignoreColumn = -1
){

    /*
       FILTER
    */

    for(
        const key of Object.keys(filters)
    ){

        const index =
        Number(key);


        if(
            index === ignoreColumn
        ){

            continue;
        }


        const selected =
        filters[key];


        if(
            selected === undefined
        ){

            continue;
        }


        /*
           Bỏ chọn hết
           = không có dòng.
        */

        if(
            Array.isArray(selected) &&
            selected.length === 0
        ){

            return false;
        }


        const value =
        String(
            row[index] ?? ""
        );


        if(
            Array.isArray(selected) &&
            selected.length > 0 &&
            !selected.includes(value)
        ){

            return false;
        }
    }


    /*
       SEARCH
    */

    for(
        const key of Object.keys(searches)
    ){

        const index =
        Number(key);


        if(
            index === ignoreColumn
        ){

            continue;
        }


        const query =
        String(
            searches[key] ?? ""
        )
        .trim()
        .toLowerCase();


        if(!query){
            continue;
        }


        const value =
        String(
            row[index] ?? ""
        )
        .toLowerCase();


        if(
            !value.includes(query)
        ){

            return false;
        }
    }


    return true;
}


/* =========================================================
   FILTER VALUES FOR CURRENT COLUMN
========================================================= */

function getFilterValuesForColumn(
    index
){

    /*
       Rất quan trọng:
       bỏ qua filter/search của chính
       cột đang mở.

       Nhưng áp dụng toàn bộ filter/search
       của các cột khác.
    */

    const source =
    rows.filter(
        row =>
        rowMatchesFilters(
            row,
            index
        )
    );


    const set =
    new Set();


    source.forEach(row => {

        set.add(
            String(
                row[index] ?? ""
            )
        );

    });


    return Array.from(set);
}


/* =========================================================
   VISIBLE ROWS
========================================================= */

function getVisibleRows(){

    const result =
    rows
    .map(
        (row,originalIndex) => ({
            row,
            originalIndex
        })
    )
    .filter(
        item =>
        rowMatchesFilters(
            item.row
        )
    );


    /*
       SORTS
       Priority hoàn toàn linh hoạt.
    */

    const activeSorts =
    Object.keys(sorts)
    .map(key => {

        const priority =
        Number(
            sorts[key].priority
        );


        return {

            index:
            Number(key),

            priority,

            direction:
            sorts[key].direction ||
            "asc"

        };

    })
    .filter(
        item =>
        Number.isFinite(
            item.priority
        )
    )
    .sort(
        (a,b) =>
        a.priority -
        b.priority
    );


    if(
        activeSorts.length === 0
    ){

        return result;
    }


    result.sort(
        (a,b) => {

            for(
                const sort of activeSorts
            ){

                const av =
                getSortValue(
                    a.row,
                    sort.index
                );


                const bv =
                getSortValue(
                    b.row,
                    sort.index
                );


                let compare = 0;


                if(
                    av.type === "number" &&
                    bv.type === "number"
                ){

                    compare =
                    av.value -
                    bv.value;
                }


                else if(
                    av.type === "date" &&
                    bv.type === "date"
                ){

                    compare =
                    av.value -
                    bv.value;
                }


                else{

                    compare =
                    String(av.value)
                    .localeCompare(
                        String(bv.value),
                        "vi",
                        {
                            numeric:true,
                            sensitivity:"base"
                        }
                    );
                }


                if(compare !== 0){

                    return (
                        sort.direction === "desc"
                            ? -compare
                            : compare
                    );
                }
            }


            return (
                a.originalIndex -
                b.originalIndex
            );
        }
    );


    return result;
}


/* =========================================================
   VISIBLE COLUMNS
========================================================= */

function getVisibleHeaderIndexes(){

    headers.forEach(

/* =========================================================
   FORMAT
========================================================= */

function getColumnFormat(index){

    return {

        align:"left",

        fontFamily:"Arial",

        fontSize:14,

        bold:false,

        italic:false,

        wrap:true,

        color:"#111111",

        background:"#ffffff",

        ...(columnFormats[index] || {})

    };
}


function applyFormatToCell(
    cell,
    index
){

    const f =
    getColumnFormat(index);


    cell.style.textAlign =
    f.align;


    cell.style.fontFamily =
    f.fontFamily;


    cell.style.fontSize =
    `${Number(f.fontSize) || 14}px`;


    cell.style.fontWeight =
    f.bold
        ? "700"
        : "400";


    cell.style.fontStyle =
    f.italic
        ? "italic"
        : "normal";


    cell.style.color =
    f.color || "#111111";


    cell.style.backgroundColor =
    f.background || "#ffffff";


    if(f.wrap){

        cell.style.whiteSpace =
        "pre-wrap";

        cell.style.overflowWrap =
        "anywhere";

        cell.style.wordBreak =
        "break-word";

    }
    else{

        cell.style.whiteSpace =
        "nowrap";

        cell.style.overflowWrap =
        "normal";

        cell.style.wordBreak =
        "normal";
    }
}

/* =========================================================
   RENDER BODY
========================================================= */

function renderBody(){

    tbody.innerHTML = "";


    const visibleIndexes =
    getVisibleHeaderIndexes();


    const visibleRows =
    getVisibleRows();


    if(
        visibleRows.length === 0
    ){

        const tr =
        document.createElement("tr");


        const td =
        document.createElement("td");


        td.colSpan =
        Math.max(
            visibleIndexes.length,
            1
        );


        td.className =
        "message";


        td.textContent =
        "Không có dữ liệu phù hợp.";


        tr.appendChild(td);

        tbody.appendChild(tr);


        requestAnimationFrame(
            applyFreezeColumns
        );


        return;
    }


    visibleRows.forEach(
        item => {

            const tr =
            document.createElement("tr");


            visibleIndexes.forEach(
                index => {

                    const td =
                    document.createElement("td");


                    td.className =
                    "body-cell";


                    td.dataset.column =
                    String(index);


                    const width =
                    getColumnWidth(index);


                    td.style.width =
                    `${width}px`;

                    td.style.minWidth =
                    `${width}px`;

                    td.style.maxWidth =
                    `${width}px`;


                    td.textContent =
                    getDisplayValue(
                        item.row[index],
                        headers[index]
                    );


                    applyFormatToCell(
                        td,
                        index
                    );


                    tr.appendChild(td);

                }
            );


            tbody.appendChild(tr);

        }
    );


    requestAnimationFrame(
        applyFreezeColumns
    );
}


/* =========================================================
   HEADER STATES
========================================================= */

function updateHeaderStates(){

    thead
    .querySelectorAll(
        ".header-cell"
    )
    .forEach(
        th => {

            const index =
            Number(
                th.dataset.column
            );


            const searchActive =
            String(
                searches[index] || ""
            ).trim() !== "";


            const filterActive =
            isEffectiveFilter(
                index
            );


            const sorted =
            sorts[index] !== undefined;


            th.classList.toggle(
                "filtered",
                searchActive ||
                filterActive
            );


            th.classList.toggle(
                "sorted",
                sorted
            );


            const sortButton =
            th.querySelector(
                ".header-button"
            );


            if(sortButton){

                sortButton.textContent =
                getSortIcon(index);
            }

        }
    );
}


/* =========================================================
   EFFECTIVE FILTER
========================================================= */

function isEffectiveFilter(index){

    if(
        filters[index] === undefined
    ){

        return false;
    }


    const selected =
    filters[index];


    if(
        !Array.isArray(selected)
    ){

        return false;
    }


    if(
        selected.length === 0
    ){

        return true;
    }


    const allValues =
    getAllColumnValues(index);


    /*
       Chọn toàn bộ = không active.
    */

    if(
        selected.length ===
        allValues.length
    ){

        return false;
    }


    return true;
}


/* =========================================================
   SORT ICON
========================================================= */

function getSortIcon(index){

    if(
        sorts[index] === undefined
    ){

        return "↕";
    }


    const direction =
    sorts[index].direction ||
    "asc";


    const priority =
    sorts[index].priority;


    return (
        direction === "asc"
            ? "▲"
            : "▼"
    ) +
    (
        priority !== undefined &&
        priority !== ""
            ? String(priority)
            : ""
    );
}

/* =========================================================
   POSITION MENU
========================================================= */

function positionMenu(anchor){

    if(
        !filterMenuElement ||
        !anchor
    ){

        return;
    }


    const rect =
    anchor.getBoundingClientRect();


    let left =
    rect.left;


    let top =
    rect.bottom + 4;


    requestAnimationFrame(
        () => {

            const width =
            filterMenuElement.offsetWidth;


            const height =
            filterMenuElement.offsetHeight;


            if(
                left + width >
                window.innerWidth - 10
            ){

                left =
                window.innerWidth -
                width -
                10;
            }


            if(
                top + height >
                window.innerHeight - 10
            ){

                top =
                rect.top -
                height -
                4;
            }


            left =
            Math.max(
                10,
                left
            );


            top =
            Math.max(
                10,
                top
            );


            filterMenuElement.style.left =
            `${left}px`;


            filterMenuElement.style.top =
            `${top}px`;

        }
    );
}

/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValuesOnly(
    index
){

    if(
        !filterMenuElement
    ){

        return;
    }


    const container =
    filterMenuElement.querySelector(
        "#filterValuesContainer"
    );


    if(!container){
        return;
    }


    container.innerHTML =
    "";


    const allValues =
    getFilterValuesForColumn(
        index
    );


    const query =
    String(
        filterValueSearch || ""
    )
    .trim()
    .toLowerCase();


    const values =
    allValues.filter(
        value => {

            if(!query){
                return true;
            }


            return String(value)
            .toLowerCase()
            .includes(query);

        }
    );


    /*
       Nếu chưa có filter:
       coi như tất cả được chọn.
    */

    const selected =
    filters[index] === undefined
        ? allValues.slice()
        : filters[index];


    values.forEach(
        value => {

            const row =
            document.createElement(
                "div"
            );


            row.className =
            "filter-value-row";


            const checkbox =
            document.createElement(
                "input"
            );


            checkbox.type =
            "checkbox";


            checkbox.checked =
            selected.includes(
                value
            );


            checkbox.addEventListener(
                "change",
                event => {

                    event.stopPropagation();


                    let current;


                    if(
                        filters[index] === undefined
                    ){

                        current =
                        allValues.slice();

                    }
                    else{

                        current =
                        filters[index].slice();
                    }


                    if(
                        checkbox.checked
                    ){

                        if(
                            !current.includes(
                                value
                            )
                        ){

                            current.push(
                                value
                            );
                        }

                    }
                    else{

                        current =
                        current.filter(
                            item =>
                            item !== value
                        );
                    }


                    filters[index] =
                    current;


                    saveState();


                    /*
                       LỌC NGAY.
                    */

                    renderBody();


                    updateHeaderStates();


                    /*
                       Không đóng menu.
                       Cập nhật lại danh sách filter
                       theo trạng thái mới.
                    */

                    const savedSearch =
                    filterValueSearch;


                    renderFilterMenu(
                        index
                    );


                    filterValueSearch =
                    savedSearch;


                    const searchInput =
                    filterMenuElement.querySelector(
                        ".filter-search"
                    );


                    if(searchInput){

                        searchInput.value =
                        savedSearch;
                    }


                    renderFilterValuesOnly(
                        index
                    );

                }
            );


            const label =
            document.createElement(
                "label"
            );


            label.textContent =
            value === ""
                ? "(Trống)"
                : value;


            label.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                }
            );


            row.appendChild(
                checkbox
            );


            row.appendChild(
                label
            );


            container.appendChild(
                row
            );

        }
    );
}

/* =========================================================
   COLOR VALID
========================================================= */

function validColor(value){

    return (
        typeof value === "string" &&
        /^#[0-9a-fA-F]{6}$/.test(value)
    );
}


/* =========================================================
   REFRESH OPEN MENU
========================================================= */

function refreshOpenFilterMenu(
    preserveSearch = true
){

    if(
        openFilterIndex === null ||
        !filterMenuElement
    ){

        return;
    }


    const index =
    openFilterIndex;


    const oldSearch =
    filterValueSearch;


    renderFilterMenu(
        index
    );


    if(preserveSearch){

        filterValueSearch =
        oldSearch;


        const input =
        filterMenuElement.querySelector(
            ".filter-search"
        );


        if(input){

            input.value =
            oldSearch;
        }


        renderFilterValuesOnly(
            index
        );
    }
}

    if(

    ){

        filterMenuElement.remove();

        filterMenuElement =
        null;
    }


    openFilterIndex =
    null;


    filterValueSearch =

}

    const newName =
    prompt(
        "Tên mới của cột:",
        current
    );


    if(
        newName === null
    ){

        return;
    }


    const trimmed =
    newName.trim();


    if(
        trimmed === ""
    ){

        delete renamedHeaders[
            original
        ];

    }
    else{

        renamedHeaders[
            original
        ] =
        trimmed;
    }


    saveState();


    renderTable();
}

   SETTINGS RENAME LIST
========================================================= */

function renderRenameList(){

    renameList.innerHTML =
    "";


    headers.forEach(
        (header,index) => {

            if(
                HIDDEN_COLUMNS.has(
                    header
                )
            ){

                return;
            }


            const item =
            document.createElement(
                "div"
            );


            item.className =
            "rename-item";


            const original =
            document.createElement(
                "div"
            );


            original.className =
            "rename-original";


            original.title =
            header;


            original.textContent =
            header;


            const input =
            document.createElement(
                "input"
            );


            input.type =
            "text";


            input.value =
            getDisplayHeader(
                header
            );


            input.dataset.index =
            String(index);


            input.addEventListener(
                "change",
                () => {

                    const value =
                    input.value.trim();


                    if(
                        value === "" ||
                        value === header
                    ){

                        delete renamedHeaders[
                            header
                        ];

                    }
                    else{

                        renamedHeaders[
                            header
                        ] =
                        value;
                    }

                }
            );


            item.appendChild(
                original
            );


            item.appendChild(
                input
            );


            renameList.appendChild(
                item
            );

        }
    );
}

/* =========================================================
   FREEZE COLUMNS
========================================================= */

function applyFreezeColumns(){

    /*
       Xóa trạng thái cũ.
    */

    document
    .querySelectorAll(
        ".frozen-column"
    )
    .forEach(
        cell => {

            cell.classList.remove(
                "frozen-column"
            );


            cell.classList.remove(
                "frozen-last"
            );


            cell.style.left =
            "";

        }
    );


    const visibleIndexes =
    getVisibleHeaderIndexes();


    const count =
    Math.max(
        0,
        Math.min(
            Number(freezeCount) || 0,
            visibleIndexes.length
        )
    );


    if(
        count === 0
    ){

        return;
    }


    const frozenIndexes =
    visibleIndexes.slice(
        0,
        count
    );


    let left = 0;


    frozenIndexes.forEach(
        (index,position) => {

            const width =
            getColumnWidth(
                index
            );


            const cells =
            document.querySelectorAll(
                `[data-column="${index}"]`
            );


            cells.forEach(
                cell => {

                    cell.classList.add(
                        "frozen-column"
                    );


                    if(
                        position ===
                        frozenIndexes.length - 1
                    ){

                        cell.classList.add(
                            "frozen-last"
                        );
                    }


                    cell.style.left =
                    `${left}px`;


                    /*
                       Đảm bảo header có top
                       độc lập với left.
                    */

                    if(
                        cell.classList.contains(
                            "header-cell"
                        )
                    ){

                        cell.style.top =
                        "0px";

                        cell.style.zIndex =
                        "1000";

                    }


                    else if(
                        cell.classList.contains(
                            "search-cell"
                        )
                    ){

                        cell.style.top =
                        "38px";

                        cell.style.zIndex =
                        "999";

                    }


                    else{

                        cell.style.zIndex =
                        "100";
                    }

                }
            );


            left += width;
        }
    );
}


/* =========================================================
   RESIZE START
========================================================= */

function startResize(
    event,
    index
){

    resizeState = {

        index,

        startX:
        event.clientX,

        startWidth:
        getColumnWidth(index)

    };


    document.body.style.cursor =
    "col-resize";


    document.body.style.userSelect =
    "none";
}


/* =========================================================
   RESIZE MOVE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !resizeState
        ){

            return;
        }


        const delta =
        event.clientX -
        resizeState.startX;


        const width =
        Math.max(
            30,
            resizeState.startWidth +
            delta
        );


        columnWidths[
            resizeState.index
        ] =
        width;


        /*
           Không render table.
           Chỉ update width.
        */

        document
        .querySelectorAll(
            `[data-column="${resizeState.index}"]`
        )
        .forEach(
            cell => {

                cell.style.width =
                `${width}px`;

                cell.style.minWidth =
                `${width}px`;

                cell.style.maxWidth =
                `${width}px`;
            }
        );


        applyFreezeColumns();

    }
);


/* =========================================================
   RESIZE END
========================================================= */

document.addEventListener(
    "mouseup",
    () => {

        if(
            !resizeState
        ){

            return;
        }


        saveState();


        resizeState =
        null;


        document.body.style.cursor =
        "";


        document.body.style.userSelect =
        "";

    }
);

========================================================= */

function setupAutoRefresh(){

    if(
        autoRefreshTimer
    ){

        clearInterval(
            autoRefreshTimer
        );


        autoRefreshTimer =
        null;
    }


    const minutes =
    Number(
        autoRefreshSelect.value
    );


    if(
        !minutes
    ){

        return;
    }


    autoRefreshTimer =
    setInterval(
        async () => {

            await loadData();

        },
        minutes *
        60 *
        1000
    );
}

            filterMenuElement.contains(
                event.target
            )
        ){

            return;
        }


        if(
            event.target.closest(
                ".header-button"
            )
        ){

            return;
        }


        closeFilterMenu();

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeFilterMenu();


            settingsOverlay.style.display =
            "none";
        }
    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        applyFreezeColumns();


        if(
            openFilterIndex !== null &&
            filterMenuElement
        ){

            const header =
            thead.querySelector(
                `.header-cell[data-column="${openFilterIndex}"]`
            );


            if(header){

                positionMenu(
                    header
                );
            }
        }
    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadState();

loadData();

</script>

</body>
</html>
